<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>像素推箱子</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:70vh; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.88); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>关卡<b id="lv">1/5</b></span>
      <span>步数<b id="steps">0</b></span>
      <span>BEST<b id="best">—</b></span>
    </div>
    <canvas id="cv" width="440" height="440"></canvas>
  </div>
  <div id="overlay">
    <h1>📦 像素推箱子</h1>
    <p>方向键 / WASD / 滑动 移动<br/>把所有箱子推到 ✦ 目标点<br/>箱子只能推不能拉 · 共 5 关</p>
    <button id="ov-btn">开始游戏</button>
  </div>
  <script>
    (() => {
      // # 墙 . 地板 * 目标 $ 箱子 @ 人
      const LEVELS = [
        ['#######','#.....#','#..@..#','#..$..#','#..*..#','#.....#','#######'],
        ['#######','#..*..#','#..$..#','#..@..#','#.$...#','#.*...#','#######'],
        ['########','#.*..*.#','#.$..$.#','#...@..#','#......#','#......#','########'],
        ['########','#..*...#','#..$.@.#','#..$...#','#..*...#','#.$....#','#.*....#','########'],
        ['#########','#...*...#','#...$...#','#...@...#','#.$...$.#','#.*...*.#','#########'],
      ]
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const lvEl = document.getElementById('lv')
      const stepsEl = document.getElementById('steps')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let level, walls, goals, boxes, px, py, steps, totalSteps, running, over
      let best = Number(localStorage.getItem('sokoban-best') || 0)
      if (best) bestEl.textContent = best

      function load(n) {
        level = n
        const map = LEVELS[n]
        walls = []; goals = []; boxes = []
        map.forEach((row, r) => {
          walls[r] = []
          for (let c = 0; c < row.length; c++) {
            const ch = row[c]
            walls[r][c] = ch === '#'
            if (ch === '*') goals.push(r + ',' + c)
            if (ch === '$') boxes.push({ r, c })
            if (ch === '@') { px = c; py = r }
          }
        })
        lvEl.textContent = (n + 1) + '/5'
        draw()
      }

      function start() {
        steps = 0; totalSteps = 0
        running = true; over = false
        stepsEl.textContent = 0
        overlay.classList.add('hidden')
        load(0)
      }

      function won() {
        return boxes.every((b) => goals.includes(b.r + ',' + b.c))
      }

      function win() {
        if (level === LEVELS.length - 1) {
          running = false; over = true
          const score = Math.max(100, 2500 - totalSteps)
          if (!best || score > best) { best = score; bestEl.textContent = best; localStorage.setItem('sokoban-best', best) }
          overlay.querySelector('h1').textContent = '🏆 全部通关'
          overlay.querySelector('p').innerHTML = '总步数 ' + totalSteps + ' · 得分 <b style="color:#ffd23f">' + score + '</b>'
          ovBtn.textContent = '再来一局'
          overlay.classList.remove('hidden')
        } else {
          totalSteps += steps
          steps = 0
          stepsEl.textContent = 0
          load(level + 1)
        }
      }

      function move(dr, dc) {
        if (!running || over) return
        const nx = px + dc, ny = py + dr
        if (walls[ny][nx]) return
        const box = boxes.find((b) => b.r === ny && b.c === nx)
        if (box) {
          const bx = nx + dc, by = ny + dr
          if (walls[by][bx] || boxes.some((b) => b.r === by && b.c === bx)) return
          box.r = by; box.c = bx
        }
        px = nx; py = ny
        steps++; totalSteps++
        stepsEl.textContent = steps
        draw()
        if (won()) win()
      }

      function draw() {
        const map = LEVELS[level]
        const cell = Math.min(cv.width / map[0].length, cv.height / map.length)
        const ox = (cv.width - cell * map[0].length) / 2
        const oy = (cv.height - cell * map.length) / 2
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, cv.width, cv.height)
        for (let r = 0; r < map.length; r++) {
          for (let c = 0; c < map[r].length; c++) {
            const x = ox + c * cell, y = oy + r * cell
            if (walls[r][c]) {
              ctx.fillStyle = '#3a4152'
              ctx.beginPath(); ctx.roundRect(x + 1, y + 1, cell - 2, cell - 2, 4); ctx.fill()
            } else {
              ctx.fillStyle = '#1a1d29'
              ctx.fillRect(x, y, cell, cell)
              if (goals.includes(r + ',' + c)) {
                ctx.fillStyle = '#ffd23f'
                ctx.font = (cell * 0.5) + 'px sans-serif'
                ctx.fillText('✦', x + cell * 0.28, y + cell * 0.68)
              }
            }
          }
        }
        ctx.font = (cell * 0.55) + 'px sans-serif'
        for (const b of boxes) {
          const onGoal = goals.includes(b.r + ',' + b.c)
          ctx.fillText(onGoal ? '✅' : '📦', ox + b.c * cell + cell * 0.22, oy + b.r * cell + cell * 0.72)
        }
        if (running && !over) ctx.fillText('🏃', ox + px * cell + cell * 0.25, oy + py * cell + cell * 0.72)
      }

      const keys = { ArrowUp:[-1,0], KeyW:[-1,0], ArrowDown:[1,0], KeyS:[1,0], ArrowLeft:[0,-1], KeyA:[0,-1], ArrowRight:[0,1], KeyD:[0,1] }
      window.addEventListener('keydown', (e) => { if (keys[e.code]) { e.preventDefault(); move(...keys[e.code]) } })
      let tx = 0, ty = 0
      window.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY }, { passive: true })
      window.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty
        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return
        if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1)
        else move(dy > 0 ? 1 : -1, 0)
      }, { passive: true })
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return Math.max(100, 2500 - totalSteps) },
        get over() { return over },
        get started() { return running },
      }

      steps = 0; totalSteps = 0; running = false; over = false
      load(0)
    })()
  </script>
</body>
</html>
