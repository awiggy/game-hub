<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>数字记忆</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,420px); position:relative; display:flex; flex-direction:column; gap:14px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #stage {
      width:100%; height:130px; background:#1a1d29; border:3px solid #2a2e3d; border-radius:14px;
      display:grid; place-items:center; font-size:44px; font-weight:900; letter-spacing:8px; font-variant-numeric:tabular-nums;
    }
    #entry { display:flex; gap:8px; min-height:48px; }
    #entry span { width:40px; height:44px; border-bottom:3px solid #3a4152; display:grid; place-items:center; font-size:22px; font-weight:900; }
    #keys { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; width:100%; }
    #keys button {
      height:46px; font-family:inherit; font-size:18px; font-weight:900; color:#eef1f6;
      background:#1a1d29; border:2px solid #2a2e3d; border-radius:10px; cursor:pointer;
    }
    #keys button:disabled { opacity:.3; }
    #keys button:not(:disabled):active { background:var(--blue); }
    #msg { font-size:14px; font-weight:900; min-height:20px; text-align:center; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>轮数<b id="round">0</b></span>
      <span>位数<b id="len">3</b></span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="stage">?</div>
    <div id="entry"></div>
    <div id="keys"></div>
    <div id="msg">点击开始后记住闪现的数字</div>
  </div>
  <div id="overlay">
    <h1>🔢 数字记忆</h1>
    <p>数字逐个闪现（每轮多一位）<br/>闪完后按原顺序用键盘输入<br/>答对加长，答错扣 1 命共 3 命</p>
    <button id="ov-btn">开始测试</button>
  </div>
  <script>
    (() => {
      const stage = document.getElementById('stage')
      const entryEl = document.getElementById('entry')
      const keysEl = document.getElementById('keys')
      const msgEl = document.getElementById('msg')
      const roundEl = document.getElementById('round')
      const lenEl = document.getElementById('len')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let seq, input, round, lives, phase, running, over, timers
      let best = Number(localStorage.getItem('digitspan-best') || 0)
      bestEl.textContent = best

      function clearTimers() { (timers || []).forEach(clearTimeout); timers = [] }
      const later = (fn, ms) => timers.push(setTimeout(fn, ms))

      for (const k of ['1', '2', '3', '4', '5', '⌫', '6', '7', '8', '9', '0', '✓']) {
        const b = document.createElement('button')
        b.textContent = k
        if (k === '⌫' || k === '✓') b.style.fontSize = '13px'
        b.onclick = () => key(k)
        keysEl.appendChild(b)
      }

      function render() {
        entryEl.innerHTML = ''
        for (let i = 0; i < seq.length; i++) {
          const s = document.createElement('span')
          s.textContent = input[i] || ''
          entryEl.appendChild(s)
        }
      }

      function start() {
        round = 0; lives = 3
        running = true; over = false
        livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
        nextRound()
      }

      function end() {
        running = false; over = true
        clearTimers()
        const score = (round - 1) * 100
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('digitspan-best', best) }
        overlay.querySelector('h1').textContent = '🧠 记忆到顶了'
        overlay.querySelector('p').innerHTML = '通过 <b style="color:#ffd23f">' + (round - 1) + '</b> 轮 · 得分 ' + score + ' · 最佳 ' + best
        ovBtn.textContent = '再来一次'
        overlay.classList.remove('hidden')
      }

      function nextRound() {
        round++
        const len = 2 + round
        lenEl.textContent = len
        roundEl.textContent = round
        seq = Array.from({ length: len }, () => (Math.random() * 10) | 0)
        input = []
        phase = 'show'
        render()
        msgEl.textContent = '记住顺序…'
        keysEl.querySelectorAll('button').forEach((b) => (b.disabled = true))
        seq.forEach((d, i) => {
          later(() => { stage.textContent = d }, 500 + i * 650)
          later(() => { stage.textContent = '' }, 500 + i * 650 + 400)
        })
        later(() => {
          phase = 'input'
          stage.textContent = '?'
          msgEl.textContent = '按顺序输入 ' + len + ' 位数字'
          keysEl.querySelectorAll('button').forEach((b) => (b.disabled = false))
        }, 500 + len * 650 + 200)
      }

      function key(k) {
        if (!running || over || phase !== 'input') return
        if (k === '⌫') { input.pop(); render(); return }
        if (k === '✓') return check()
        if (input.length >= seq.length) return
        input.push(Number(k))
        render()
        if (input.length === seq.length) check()
      }

      function check() {
        if (input.join('') === seq.join('')) {
          msgEl.textContent = '✓ 正确！加长…'
          later(nextRound, 700)
        } else {
          lives--
          livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
          msgEl.textContent = '✗ 错了，正确是 ' + seq.join('')
          if (lives <= 0) return end()
          later(nextRound, 1100)
        }
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return (round - 1) * 100 },
        get over() { return over },
        get started() { return running },
      }

      seq = []; input = []; round = 0; lives = 3; phase = 'idle'
      running = false; over = false; timers = []
    })()
  </script>
</body>
</html>
