<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>拼词大师</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #hint { font-size:17px; font-weight:900; color:var(--yellow); }
    #slots { display:flex; gap:6px; min-height:52px; }
    #slots .slot {
      width:40px; height:48px; border-bottom:3px solid #3a4152; display:grid; place-items:center;
      font-size:22px; font-weight:900;
    }
    #slots .slot.bad { color:#ff4d5e; border-color:#ff4d5e; }
    #tiles { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; min-height:56px; }
    #tiles button {
      width:46px; height:52px; font-family:inherit; font-size:20px; font-weight:900;
      color:#eef1f6; background:#1a1d29; border:2px solid #2a3350; border-radius:10px; cursor:pointer;
    }
    #tiles button.used { visibility:hidden; }
    #timer { width:100%; height:10px; background:#14161f; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; }
    #tfill { height:100%; width:100%; background:var(--yellow); }
    #acts { display:flex; gap:10px; }
    .act { font-family:inherit; font-weight:700; font-size:13px; color:#eef1f6; background:#1a1d29;
      border:2px solid #2a2e3d; border-radius:10px; padding:8px 16px; cursor:pointer; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>得分<b id="score">0</b></span>
      <span>第<b id="round">1/8</b>题</span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="hint"></div>
    <div id="slots"></div>
    <div id="tiles"></div>
    <div id="timer"><div id="tfill"></div></div>
    <div id="acts">
      <button class="act" id="undo">⌫ 撤销</button>
      <button class="act" id="skip">跳过（-20）</button>
    </div>
  </div>
  <div id="overlay">
    <h1>🔠 拼词大师</h1>
    <p>按正确顺序点击字母块拼出提示单词<br/>每题 20 秒，越快分越高<br/>共 8 题，跳过扣 20 分</p>
    <button id="ov-btn">开始挑战</button>
  </div>
  <script>
    (() => {
      const WORDS = [
        ['planet', '行星'], ['castle', '城堡'], ['forest', '森林'], ['rocket', '火箭'],
        ['honey', '蜂蜜'], ['shadow', '影子'], ['pearl', '珍珠'], ['thunder', '雷'],
        ['whisper', '低语'], ['voyage', '航行'], ['garden', '花园'], ['marble', '大理石'],
      ]
      const hintEl = document.getElementById('hint')
      const slotsEl = document.getElementById('slots')
      const tilesEl = document.getElementById('tiles')
      const tfill = document.getElementById('tfill')
      const scoreEl = document.getElementById('score')
      const roundEl = document.getElementById('round')
      const bestEl = document.getElementById('best')
      const undoBtn = document.getElementById('undo')
      const skipBtn = document.getElementById('skip')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let word, letters, picked, score, round, timeLeft, limit, running, over, timer
      let best = Number(localStorage.getItem('anagram-best') || 0)
      bestEl.textContent = best

      function newRound() {
        round++
        roundEl.textContent = round + '/8'
        const [w, h] = WORDS[(Math.random() * WORDS.length) | 0]
        word = w
        hintEl.textContent = '提示：' + h
        letters = w.split('').map((ch, i) => ({ ch, i })).sort(() => Math.random() - 0.5)
        // 避免洗牌后恰好是原词
        if (letters.map((l) => l.ch).join('') === word) letters.reverse()
        picked = []
        limit = 20000; timeLeft = limit
        render()
      }

      function start() {
        score = 0; round = 0
        running = true; over = false
        scoreEl.textContent = 0
        overlay.classList.add('hidden')
        clearInterval(timer)
        timer = setInterval(() => {
          if (!running || over) return
          timeLeft -= 100
          tfill.style.width = Math.max(0, timeLeft / limit * 100) + '%'
          if (timeLeft <= 0) {
            score = Math.max(0, score - 20)
            scoreEl.textContent = score
            if (round >= 8) return end()
            newRound()
          }
        }, 100)
        newRound()
      }

      function end() {
        running = false; over = true
        clearInterval(timer)
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('anagram-best', best) }
        overlay.querySelector('h1').textContent = '🏁 拼词结束'
        overlay.querySelector('p').innerHTML = '得分 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function render() {
        slotsEl.innerHTML = ''
        for (let i = 0; i < word.length; i++) {
          const s = document.createElement('div')
          s.className = 'slot'
          s.textContent = picked[i] ? picked[i].ch : ''
          slotsEl.appendChild(s)
        }
        tilesEl.innerHTML = ''
        letters.forEach((l, i) => {
          const b = document.createElement('button')
          b.textContent = l.ch
          b.className = picked.some((p) => p.idx === i) ? 'used' : ''
          b.onclick = () => {
            if (!running || over || picked.some((p) => p.idx === i)) return
            picked.push({ ch: l.ch, idx: i })
            render()
            if (picked.length === word.length) check()
          }
          tilesEl.appendChild(b)
        })
      }

      function check() {
        const guess = picked.map((p) => p.ch).join('')
        if (guess === word) {
          const gain = 100 + Math.round(timeLeft / 200)
          score += gain
          scoreEl.textContent = score
          hintEl.textContent = '✓ ' + word + ' +' + gain
          if (round >= 8) return setTimeout(end, 700)
          setTimeout(() => { hintEl.textContent = ''; newRound() }, 800)
        } else {
          slotsEl.querySelectorAll('.slot').forEach((s) => s.classList.add('bad'))
          setTimeout(() => {
            picked = []
            render()
          }, 450)
        }
      }

      undoBtn.addEventListener('click', () => { picked.pop(); render() })
      skipBtn.addEventListener('click', () => {
        if (!running || over) return
        score = Math.max(0, score - 20)
        scoreEl.textContent = score
        if (round >= 8) return end()
        newRound()
      })
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      word = ''; letters = []; picked = []
      score = 0; round = 0; timeLeft = 20000; limit = 20000
      running = false; over = false
    })()
  </script>
</body>
</html>
