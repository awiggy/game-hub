<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>琴键快按</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { width:min(92vw,400px); position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board { position:relative; height:min(74vh,560px); background:#1a1d29; border:3px solid #2a2e3d; border-radius:10px; overflow:hidden;
      display:grid; grid-template-columns:repeat(4,1fr); gap:3px; padding:3px; }
    .lane { position:relative; background:#14161f; border-radius:4px; }
    .tile { position:absolute; left:0; right:0; background:#2f55e4; border-radius:5px; border:2px solid #5d84ff; }
    .lane:nth-child(2) .tile { background:#5d84ff; }
    .lane:nth-child(3) .tile { background:#8a5cf6; }
    .lane:nth-child(4) .tile { background:#00b8a9; }
    #keys { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; margin-top:6px; }
    #keys div { text-align:center; font-size:12px; font-weight:900; color:#5c6474; padding:4px 0; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.88); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>连击<b id="score">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="board">
      <div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div>
    </div>
    <div id="keys"><div>D</div><div>F</div><div>J</div><div>K</div></div>
  </div>
  <div id="overlay">
    <h1>🎹 琴键快按</h1>
    <p>点击黑块所在列，或按 D F J K<br/>每行一个黑块，越点越快<br/>点到白列或黑块触底即失败</p>
    <button id="ov-btn">开始游戏</button>
  </div>
  <script>
    (() => {
      const board = document.getElementById('board')
      const lanes = [...board.querySelectorAll('.lane')]
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let rows, score, speed, running, over, raf, lastT
      let best = Number(localStorage.getItem('pianotile-best') || 0)
      bestEl.textContent = best

      function start() {
        rows = []
        score = 0; speed = 170
        running = true; over = false
        scoreEl.textContent = 0
        overlay.classList.add('hidden')
        lastT = 0
        cancelAnimationFrame(raf)
        requestAnimationFrame(loop)
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('pianotile-best', best) }
        overlay.querySelector('h1').textContent = '💥 失败'
        overlay.querySelector('p').innerHTML = '连击 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function newRows() {
        // 铺满屏幕高度的行（每行一个黑块）
        const rowH = 70
        const n = Math.ceil(board.clientHeight / rowH) + 2
        for (let i = 0; i < n; i++) {
          rows.push({ lane: (Math.random() * 4) | 0, y: -i * rowH })
        }
      }

      function loop(t) {
        raf = requestAnimationFrame(loop)
        if (!running || over) return
        if (!lastT) lastT = t
        const dt = Math.min(50, t - lastT)
        lastT = t
        const rowH = 70
        for (const r of rows) r.y += speed * dt / 1000
        // 底部触底判定
        const H = board.clientHeight
        for (const r of rows) {
          if (r.y + rowH >= H && !r.done) { return end() }
        }
        // 顶部滚出的行移除
        rows = rows.filter((r) => r.y < H)
        // 保持行数
        while (rows.length && Math.min(...rows.map((r) => r.y)) > 0) {
          rows.push({ lane: (Math.random() * 4) | 0, y: Math.min(...rows.map((r) => r.y)) - rowH })
        }
        speed += dt / 1000 * 3
        draw()
      }

      function draw() {
        lanes.forEach((l) => { l.querySelectorAll('.tile').forEach((t) => t.remove()) })
        const rowH = 70
        for (const r of rows) {
          const t = document.createElement('div')
          t.className = 'tile'
          t.style.top = r.y + 'px'
          t.style.height = (rowH - 4) + 'px'
          lanes[r.lane].appendChild(t)
        }
      }

      function hit(lane) {
        if (!running || over) return
        // 找该列最接近底部的未完成黑块
        let target = null
        for (const r of rows) {
          if (r.lane !== lane || r.done) continue
          if (!target || r.y > target.y) target = r
        }
        const H = board.clientHeight
        if (target && target.y + 70 > H * 0.35) {
          target.done = true
          rows = rows.filter((r) => r !== target)
          score++
          scoreEl.textContent = score
          draw()
        } else {
          end()
        }
      }

      board.addEventListener('pointerdown', (e) => {
        const r = board.getBoundingClientRect()
        const x = (e.clientX - r.left) / r.width
        hit(Math.max(0, Math.min(3, (x * 4) | 0)))
      })
      const keys = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3 }
      window.addEventListener('keydown', (e) => {
        if (e.code in keys) { e.preventDefault(); hit(keys[e.code]) }
        if (e.code === 'Space' && !running && !overlay.classList.contains('hidden')) { e.preventDefault(); start() }
      })
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      rows = []; score = 0; speed = 170; running = false; over = false
      newRows(); draw()
    })()
  </script>
</body>
</html>
