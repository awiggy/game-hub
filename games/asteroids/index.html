<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>星际小行星</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
    #pads { position:absolute; bottom:10px; left:10px; right:10px; display:flex; justify-content:space-between; }
    #pads button {
      width:52px; height:44px; font-size:18px; font-weight:900; font-family:inherit;
      color:#eef1f6; background:rgba(26,29,41,.8); border:2px solid #2a2e3d; border-radius:10px;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>得分<b id="score">0</b></span>
      <span>波次<b id="wave">1</b></span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="540" height="540"></canvas>
    <div id="pads">
      <button data-k="ArrowLeft">⟲</button>
      <button data-k="ArrowUp">⤒</button>
      <button data-k="Space">🔥</button>
      <button data-k="ArrowRight">⟳</button>
    </div>
    <div id="overlay">
      <h1>🪨 星际小行星</h1>
      <p>← → 旋转 · ↑ 推进 · 空格射击<br/>屏幕四边环绕，大石劈三段<br/>3 命，清波进入下一波</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const waveEl = document.getElementById('wave')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let ship, rocks, bullets, score, wave, lives, inv, running, over, keys
      let best = Number(localStorage.getItem('asteroids-best') || 0)
      bestEl.textContent = best

      const wrap = (v, max) => (v < 0 ? v + max : v >= max ? v - max : v)

      function spawnWave() {
        rocks = []
        for (let i = 0; i < 2 + wave; i++) {
          const edge = Math.random() < 0.5
          rocks.push({
            x: Math.random() * W, y: edge ? (Math.random() < 0.5 ? 0 : H) : Math.random() * H,
            vx: (Math.random() - 0.5) * (1.2 + wave * 0.12),
            vy: (Math.random() - 0.5) * (1.2 + wave * 0.12),
            size: 3,
          })
        }
        waveEl.textContent = wave
      }

      function start() {
        ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2 }
        bullets = []
        score = 0; wave = 1; lives = 3; inv = 120
        keys = {}
        running = true; over = false
        scoreEl.textContent = 0; livesEl.textContent = '♥♥♥'
        spawnWave()
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('asteroids-best', best) }
        overlay.querySelector('h1').textContent = '💥 游戏结束'
        overlay.querySelector('p').innerHTML = '得分 <b style="color:#ffd23f">' + score + '</b> · 坚持到第 ' + wave + ' 波 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function split(r) {
        if (r.size <= 1) return
        for (let i = 0; i < 2; i++) {
          rocks.push({
            x: r.x, y: r.y,
            vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
            size: r.size - 1,
          })
        }
      }

      function step() {
        if (keys.ArrowLeft) ship.a -= 0.07
        if (keys.ArrowRight) ship.a += 0.07
        if (keys.ArrowUp) {
          ship.vx += Math.cos(ship.a) * 0.14
          ship.vy += Math.sin(ship.a) * 0.14
        }
        ship.vx *= 0.99; ship.vy *= 0.99
        ship.x = wrap(ship.x + ship.vx, W)
        ship.y = wrap(ship.y + ship.vy, H)
        if (keys.Space && !bullets.length) {
          bullets.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14,
            vx: Math.cos(ship.a) * 7 + ship.vx, vy: Math.sin(ship.a) * 7 + ship.vy, life: 60 })
        }
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i]
          b.x = wrap(b.x + b.vx, W); b.y = wrap(b.y + b.vy, H)
          if (--b.life <= 0) bullets.splice(i, 1)
        }
        if (inv > 0) inv--
        for (let i = rocks.length - 1; i >= 0; i--) {
          const r = rocks[i]
          r.x = wrap(r.x + r.vx, W); r.y = wrap(r.y + r.vy, H)
          // 子弹命中
          for (let j = bullets.length - 1; j >= 0; j--) {
            const rad = r.size * 12 + 4
            if (Math.hypot(bullets[j].x - r.x, bullets[j].y - r.y) < rad) {
              bullets.splice(j, 1)
              split(r)
              rocks.splice(i, 1)
              score += [0, 100, 50, 20][r.size]
              scoreEl.textContent = score
              break
            }
          }
          if (!rocks.includes(r)) continue
          // 撞船
          if (inv <= 0 && Math.hypot(r.x - ship.x, r.y - ship.y) < r.size * 12 + 8) {
            rocks.splice(i, 1)
            lives--
            livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
            if (lives <= 0) return end()
            ship.x = W / 2; ship.y = H / 2; ship.vx = ship.vy = 0
            inv = 130
          }
        }
        if (!rocks.length) { wave++; spawnWave() }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = 'rgba(255,255,255,0.35)'
        for (let i = 0; i < 30; i++) ctx.fillRect((i * 197) % W, (i * 89) % H, 2, 2)
        // 陨石
        for (const r of rocks) {
          ctx.strokeStyle = '#8b93a7'
          ctx.lineWidth = 2
          ctx.beginPath()
          for (let k = 0; k <= 8; k++) {
            const ang = k / 8 * Math.PI * 2
            const rad = r.size * 12 * (0.85 + 0.25 * Math.sin(k * 5 + r.size))
            const x = r.x + Math.cos(ang) * rad, y = r.y + Math.sin(ang) * rad
            k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
          }
          ctx.stroke()
        }
        // 子弹
        ctx.fillStyle = '#ffd23f'
        for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4)
        // 飞船
        if (running && !over && (inv <= 0 || (inv >> 2) % 2 === 0)) {
          ctx.save()
          ctx.translate(ship.x, ship.y)
          ctx.rotate(ship.a)
          ctx.fillStyle = '#5d84ff'
          ctx.beginPath()
          ctx.moveTo(15, 0); ctx.lineTo(-11, 9); ctx.lineTo(-6, 0); ctx.lineTo(-11, -9)
          ctx.closePath()
          ctx.fill()
          if (keys.ArrowUp) {
            ctx.fillStyle = '#ffd23f'
            ctx.fillRect(-13, -2, 6, 4)
          }
          ctx.restore()
        }
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) {
          e.preventDefault(); keys[e.code] = true
        }
      })
      window.addEventListener('keyup', (e) => { keys[e.code] = false })
      document.querySelectorAll('#pads button').forEach((b) => {
        const k = b.dataset.k
        const set = (v) => (e) => { e.preventDefault(); keys[k] = v }
        b.addEventListener('pointerdown', set(true))
        b.addEventListener('pointerup', set(false))
        b.addEventListener('pointerleave', set(false))
      })
      ovBtn.addEventListener('click', start)
      keys = {}

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2 }
      rocks = []; bullets = []
      score = 0; wave = 1; lives = 3; inv = 0; running = false; over = false
      loop()
    })()
  </script>
</body>
</html>
