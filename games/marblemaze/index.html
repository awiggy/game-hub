<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>迷宫滚珠</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>关卡<b id="lv">1/3</b></span>
      <span>重置<b id="falls">0</b>次</span>
      <span>BEST<b id="best">—</b></span>
    </div>
    <canvas id="cv" width="480" height="480"></canvas>
    <div id="overlay">
      <h1>🔮 迷宫滚珠</h1>
      <p>方向键 / WASD 施加倾斜力<br/>滚珠有惯性会滑行，撞墙会反弹<br/>到达绿色洞过关，黑色洞会重置</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>
  <script>
    (() => {
      const T = 40, COLS = 12, ROWS = 12
      const W = COLS * T, H = ROWS * T
      const cv = document.getElementById('cv')
      cv.width = W; cv.height = H
      const ctx = cv.getContext('2d')
      const lvEl = document.getElementById('lv')
      const fallsEl = document.getElementById('falls')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      // 地图：# 墙 S 起点 G 终点 O 陷阱 . 空地
      const LEVELS = [
        [
          '############',
          '#S.........#',
          '#.####.###.#',
          '#.#..O.#...#',
          '#.#.####.#.#',
          '#.#....#.#.#',
          '#.######.#.#',
          '#......#.#.#',
          '######.#.#.#',
          '#........#.#',
          '#.####...#G#',
          '############',
        ],
        [
          '############',
          '#S...#.....#',
          '#.##.#.###.#',
          '#.#..#.#O..#',
          '#.#.##.#.#.#',
          '#.#..#.#.#.#',
          '#.##.#.#.#.#',
          '#..O.#.#.#.#',
          '##.#.#.#.#.#',
          '#..#...#...#',
          '#.######..G#',
          '############',
        ],
        [
          '############',
          '#S..#....O.#',
          '#.#.#.###..#',
          '#.#.#.#.#.##',
          '#.#...#.#..#',
          '#.#####.##.#',
          '#.....#...#',
          '###.#.###.#',
          '#...#.#O..#',
          '#.#.#.#.#.#',
          '#.#...#..G#',
          '############',
        ],
      ]

      let level, walls, traps, goal, spawnPt, ball, falls, totalFalls, keys, running, over
      let best = Number(localStorage.getItem('marblemaze-best') || 0)
      if (best) bestEl.textContent = best

      function load(nv) {
        level = nv
        const map = LEVELS[nv]
        walls = []; traps = []; goal = null
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++) {
            const ch = map[r][c]
            if (ch === '#') walls.push({ r, c })
            else if (ch === 'O') traps.push({ r, c })
            else if (ch === 'G') goal = { r, c }
            else if (ch === "S") spawnPt = { r, c }
          }
        ball = { x: spawnPt.c * T + T / 2, y: spawnPt.r * T + T / 2, vx: 0, vy: 0 }
        keys = {}
        lvEl.textContent = (nv + 1) + '/3'
        render()
      }

      function start() {
        totalFalls = 0
        running = true; over = false
        fallsEl.textContent = 0
        overlay.classList.add('hidden')
        load(0)
      }

      function resetBall() {
        ball.x = spawnPt.c * T + T / 2
        ball.y = spawnPt.r * T + T / 2
        ball.vx = 0; ball.vy = 0
      }

      function win() {
        if (level === LEVELS.length - 1) {
          running = false; over = true
          const score = Math.max(100, 1000 - totalFalls * 50)
          if (!best || score > best) { best = score; bestEl.textContent = best; localStorage.setItem('marblemaze-best', best) }
          overlay.querySelector('h1').textContent = '🔮 三关通关'
          overlay.querySelector('p').innerHTML = '总重置 ' + totalFalls + ' 次 · 得分 <b style="color:#ffd23f">' + score + '</b>'
          ovBtn.textContent = '再来一局'
          overlay.classList.remove('hidden')
        } else {
          setTimeout(() => load(level + 1), 500)
        }
      }

      function step() {
        // 倾斜力
        let ax = 0, ay = 0
        if (keys.ArrowLeft || keys.KeyA) ax -= 0.09
        if (keys.ArrowRight || keys.KeyD) ax += 0.09
        if (keys.ArrowUp || keys.KeyW) ay -= 0.09
        if (keys.ArrowDown || keys.KeyS) ay += 0.09
        ball.vx += ax
        ball.vy += ay
        ball.vx *= 0.96
        ball.vy *= 0.96
        const R = 9
        // 走子分轴移动 + 墙碰撞
        const tryAxis = (axis) => {
          const d = axis === 'x' ? ball.vx : ball.vy
          if (!d) return
          const pos = axis === 'x' ? 'x' : 'y'
          ball[pos] += d
          const r = ((ball.y - T / 2) / T) | 0, c = ((ball.x - T / 2) / T) | 0
          if (walls.some((w) => w.r === r && w.c === c) ||
              ball.x < T / 2 || ball.x > W - T / 2 || ball.y < T / 2 || ball.y > H - T / 2) {
            ball[pos] -= d
            if (axis === 'x') ball.vx = -ball.vx * 0.5
            else ball.vy = -ball.vy * 0.5
          }
        }
        tryAxis('x')
        tryAxis('y')
        // 陷阱
        const r = ((ball.y - T / 2) / T) | 0, c = ((ball.x - T / 2) / T) | 0
        if (traps.some((t) => t.r === r && t.c === c)) {
          totalFalls++
          fallsEl.textContent = totalFalls
          resetBall()
        }
        // 终点
        if (r === goal.r && c === goal.c && Math.hypot(ball.x - (goal.c * T + T / 2), ball.y - (goal.r * T + T / 2)) < 12) {
          win()
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        for (const w of walls) {
          ctx.fillStyle = '#2a3350'
          ctx.beginPath(); ctx.roundRect(w.c * T + 2, w.r * T + 2, T - 4, T - 4, 6); ctx.fill()
        }
        for (const t of traps) {
          ctx.fillStyle = '#0a0b10'
          ctx.beginPath(); ctx.arc(t.c * T + T / 2, t.r * T + T / 2, T * 0.32, 0, Math.PI * 2); ctx.fill()
          ctx.strokeStyle = '#ff4d5e'; ctx.lineWidth = 2
          ctx.beginPath(); ctx.arc(t.c * T + T / 2, t.r * T + T / 2, T * 0.32, 0, Math.PI * 2); ctx.stroke()
        }
        // 终点
        ctx.fillStyle = 'rgba(34,181,115,0.35)'
        ctx.beginPath(); ctx.arc(goal.c * T + T / 2, goal.r * T + T / 2, T * 0.34, 0, Math.PI * 2); ctx.fill()
        ctx.strokeStyle = '#22b573'
        ctx.lineWidth = 2
        ctx.beginPath(); ctx.arc(goal.c * T + T / 2, goal.r * T + T / 2, T * 0.34, 0, Math.PI * 2); ctx.stroke()
        // 滚珠
        if (running && !over) {
          ctx.fillStyle = '#5d84ff'
          ctx.beginPath(); ctx.arc(ball.x, ball.y, 9, 0, Math.PI * 2); ctx.fill()
          ctx.fillStyle = 'rgba(255,255,255,0.5)'
          ctx.beginPath(); ctx.arc(ball.x - 3, ball.y - 3, 3, 0, Math.PI * 2); ctx.fill()
        }
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code.startsWith('Arrow')) e.preventDefault() })
      window.addEventListener('keyup', (e) => { keys[e.code] = false })
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return Math.max(100, 1000 - totalFalls * 50) },
        get over() { return over },
        get started() { return running },
      }

      level = 0; walls = []; traps = []; goal = { r: 0, c: 0 }; spawnPt = { r: 0, c: 0 }
      ball = { x: 0, y: 0, vx: 0, vy: 0 }; falls = 0; totalFalls = 0
      keys = {}; running = false; over = false
    })()
  </script>
</body>
</html>
