<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高山滑雪</title><style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

:root{color-scheme:light;--blue:#5a9678;--yellow:#c57b3f;--ink:#345647;--muted:#71836b;--paper:#fffbed;--edge:#648d73;--floor:#edf2da}
*{box-sizing:border-box}html,body{height:auto;min-height:100%}body{margin:0;min-height:100svh;overflow:auto;display:grid;grid-template-columns:100%;place-items:center;background:radial-gradient(ellipse at 12% 10%,#fff1d4,transparent 70%),var(--floor);color:var(--ink);font-family:system-ui,-apple-system,'PingFang SC',sans-serif;touch-action:manipulation}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #da8054;outline-offset:2px}.shell{width:min(850px,calc(100% - 28px));padding:12px 0;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.top small,.side small{font:9px ui-monospace,monospace;letter-spacing:2px;color:var(--muted)}.top h1{font-size:22px;letter-spacing:2px;margin:3px 0 0}.tag{font-size:10px;padding:7px 10px;border:1px solid #c6d5b4;background:var(--paper);white-space:nowrap}.layout{display:flex;align-items:center;justify-content:center;gap:26px}#wrap{position:relative;width:min(440px,calc(100% - 196px));max-width:none;gap:10px;flex:none}#hud{position:static;width:100%;display:flex;gap:5px;justify-content:space-between;font-size:10px;color:var(--muted);margin:0 0 9px}#hud>span{flex:1;white-space:nowrap;padding:6px;background:var(--paper);border:1px solid #c6d5b4;box-shadow:0 2px 0 #d7dfbc}#hud b{font:700 16px ui-monospace,monospace;color:#b76c40;margin-left:4px}canvas{display:block;width:100%;height:auto;max-width:100%;max-height:none;image-rendering:pixelated;border:4px solid var(--edge);border-radius:0;background:#b6e0e3;box-shadow:0 5px 0 #365a43;touch-action:none}.side{width:170px;flex:none}.side svg{position:static;width:100%;height:110px;image-rendering:pixelated}.side h2{font-size:24px;line-height:1.5;margin:10px 0}.side p{font-size:12px;line-height:1.9;color:var(--muted);margin:8px 0}.side .tips{padding-top:12px;margin-top:18px;border-top:1px solid #cad6b7;font-size:11px}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:9px;color:var(--muted)}#msg{color:#59745f;font-size:12px;font-weight:500;text-align:center;line-height:1.6}#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:#eaf1d6ed;border-radius:0;gap:0}#overlay.hidden{display:none}.intro-card{width:min(360px,100%);padding:20px;text-align:center;border:3px solid var(--edge);background:var(--paper);box-shadow:6px 6px 0 #31523e30}.intro-card svg{display:block;position:static;width:140px;height:86px;margin:0 auto 6px;image-rendering:pixelated}#overlay h1{font-size:24px;letter-spacing:2px;text-shadow:none;margin:8px 0}#overlay p{font-size:12px;line-height:1.9;color:#718068;margin:0 0 17px}#overlay b{color:#c57546}#overlay button,.action{background:#e98255;color:#fffbed;border:2px solid #a55d3c;border-radius:0;box-shadow:0 4px 0 #a65c3b;font-weight:800;font-size:15px;padding:10px 24px;cursor:pointer}.action:active{transform:translateY(2px)}
@media(max-width:620px){.shell{width:calc(100% - 24px);padding:10px 0}.top{margin-bottom:9px}.top h1{font-size:18px}.top small{font-size:8px;letter-spacing:1px}.tag{font-size:9px;padding:5px 7px}.layout{display:block}.side{display:none}#wrap{margin:auto;width:min(100%,400px)}#hud{gap:4px}#hud>span{padding:5px 4px}#hud b{font-size:14px;margin-left:3px}.foot{font-size:8px;gap:8px;margin-top:12px}.foot span:last-child{display:none}#overlay h1{font-size:21px}.intro-card{padding:14px}.intro-card svg{height:66px}#overlay p{font-size:11px}}
@media(max-height:480px){.shell{padding:8px 0}.top{margin-bottom:8px}.top h1{font-size:18px}.side svg{height:55px}.side h2{font-size:20px}.side .tips{display:none}.intro-card{padding:12px 16px}.intro-card svg{height:48px}#overlay h1{font-size:21px;margin:6px 0}#overlay p{font-size:11px;margin-bottom:12px}#overlay button{padding:8px 20px}.foot{margin-top:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#wrap{width:min(380px,calc((100svh - 165px)*0.6333333333333333),calc(100% - 196px))}@media(max-width:620px){#wrap{width:min(100%,calc((100svh - 150px)*0.6333333333333333))}}</style></head><body><main class="shell"><header class="top"><div><small>SNOWY TRAIL</small><h1>高山滑雪</h1></div><span class="tag">雪松滑雪道</span></header><div class="layout">
  <div id="wrap">
    <div id="hud">
      <span>距离<b id="score">0m</b></span>
      <span>速度<b id="spd">1.0x</b></span>
      <span>BEST<b id="best">0m</b></span>
    </div>
    <canvas id="cv" width="380" height="600"></canvas>

  </div>
  <aside class="side"><svg viewBox="0 0 100 74" shape-rendering="crispEdges" aria-hidden="true"><rect x="40" y="8" width="4" height="4" fill="#71a879"/><rect x="44" y="8" width="4" height="4" fill="#71a879"/><rect x="36" y="12" width="4" height="4" fill="#71a879"/><rect x="40" y="12" width="4" height="4" fill="#fff6dc"/><rect x="44" y="12" width="4" height="4" fill="#fff6dc"/><rect x="48" y="12" width="4" height="4" fill="#71a879"/><rect x="32" y="16" width="4" height="4" fill="#71a879"/><rect x="36" y="16" width="4" height="4" fill="#71a879"/><rect x="40" y="16" width="4" height="4" fill="#71a879"/><rect x="44" y="16" width="4" height="4" fill="#71a879"/><rect x="48" y="16" width="4" height="4" fill="#71a879"/><rect x="52" y="16" width="4" height="4" fill="#71a879"/><rect x="28" y="20" width="4" height="4" fill="#71a879"/><rect x="32" y="20" width="4" height="4" fill="#71a879"/><rect x="36" y="20" width="4" height="4" fill="#fff6dc"/><rect x="40" y="20" width="4" height="4" fill="#fff6dc"/><rect x="44" y="20" width="4" height="4" fill="#71a879"/><rect x="48" y="20" width="4" height="4" fill="#71a879"/><rect x="52" y="20" width="4" height="4" fill="#71a879"/><rect x="56" y="20" width="4" height="4" fill="#71a879"/><rect x="24" y="24" width="4" height="4" fill="#71a879"/><rect x="28" y="24" width="4" height="4" fill="#71a879"/><rect x="32" y="24" width="4" height="4" fill="#71a879"/><rect x="36" y="24" width="4" height="4" fill="#71a879"/><rect x="40" y="24" width="4" height="4" fill="#71a879"/><rect x="44" y="24" width="4" height="4" fill="#71a879"/><rect x="48" y="24" width="4" height="4" fill="#71a879"/><rect x="52" y="24" width="4" height="4" fill="#71a879"/><rect x="56" y="24" width="4" height="4" fill="#71a879"/><rect x="60" y="24" width="4" height="4" fill="#71a879"/><rect x="36" y="28" width="4" height="4" fill="#55705c"/><rect x="40" y="28" width="4" height="4" fill="#55705c"/><rect x="44" y="28" width="4" height="4" fill="#55705c"/><rect x="48" y="28" width="4" height="4" fill="#55705c"/><rect x="36" y="32" width="4" height="4" fill="#55705c"/><rect x="40" y="32" width="4" height="4" fill="#55705c"/><rect x="44" y="32" width="4" height="4" fill="#55705c"/><rect x="48" y="32" width="4" height="4" fill="#55705c"/><path d="M12 64h76v5H12z" fill="#c2d9a5"/></svg><small>A LITTLE PIXEL BREAK.</small><h2>雪松滑雪道</h2><p>穿过雪松，留下一串轻快的雪痕。</p><p class="tips">左右键 / A D · 点屏幕左右半边转向</p></aside></div><footer class="foot"><span>左右键 / A D · 点屏幕左右半边转向</span><span>慢慢玩，也很好。</span></footer></main><div id="overlay"><section class="intro-card"><svg viewBox="0 0 100 74" shape-rendering="crispEdges" aria-hidden="true"><rect x="40" y="8" width="4" height="4" fill="#71a879"/><rect x="44" y="8" width="4" height="4" fill="#71a879"/><rect x="36" y="12" width="4" height="4" fill="#71a879"/><rect x="40" y="12" width="4" height="4" fill="#fff6dc"/><rect x="44" y="12" width="4" height="4" fill="#fff6dc"/><rect x="48" y="12" width="4" height="4" fill="#71a879"/><rect x="32" y="16" width="4" height="4" fill="#71a879"/><rect x="36" y="16" width="4" height="4" fill="#71a879"/><rect x="40" y="16" width="4" height="4" fill="#71a879"/><rect x="44" y="16" width="4" height="4" fill="#71a879"/><rect x="48" y="16" width="4" height="4" fill="#71a879"/><rect x="52" y="16" width="4" height="4" fill="#71a879"/><rect x="28" y="20" width="4" height="4" fill="#71a879"/><rect x="32" y="20" width="4" height="4" fill="#71a879"/><rect x="36" y="20" width="4" height="4" fill="#fff6dc"/><rect x="40" y="20" width="4" height="4" fill="#fff6dc"/><rect x="44" y="20" width="4" height="4" fill="#71a879"/><rect x="48" y="20" width="4" height="4" fill="#71a879"/><rect x="52" y="20" width="4" height="4" fill="#71a879"/><rect x="56" y="20" width="4" height="4" fill="#71a879"/><rect x="24" y="24" width="4" height="4" fill="#71a879"/><rect x="28" y="24" width="4" height="4" fill="#71a879"/><rect x="32" y="24" width="4" height="4" fill="#71a879"/><rect x="36" y="24" width="4" height="4" fill="#71a879"/><rect x="40" y="24" width="4" height="4" fill="#71a879"/><rect x="44" y="24" width="4" height="4" fill="#71a879"/><rect x="48" y="24" width="4" height="4" fill="#71a879"/><rect x="52" y="24" width="4" height="4" fill="#71a879"/><rect x="56" y="24" width="4" height="4" fill="#71a879"/><rect x="60" y="24" width="4" height="4" fill="#71a879"/><rect x="36" y="28" width="4" height="4" fill="#55705c"/><rect x="40" y="28" width="4" height="4" fill="#55705c"/><rect x="44" y="28" width="4" height="4" fill="#55705c"/><rect x="48" y="28" width="4" height="4" fill="#55705c"/><rect x="36" y="32" width="4" height="4" fill="#55705c"/><rect x="40" y="32" width="4" height="4" fill="#55705c"/><rect x="44" y="32" width="4" height="4" fill="#55705c"/><rect x="48" y="32" width="4" height="4" fill="#55705c"/><path d="M12 64h76v5H12z" fill="#c2d9a5"/></svg>
      <h1>高山滑雪</h1>
      <p>← → / A D 左右闪避<br/>手机点按左右半屏<br/>速度越来越快，距离就是分数</p>
      <button id="ov-btn">开始速降</button>
    </section></div><script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const spdEl = document.getElementById('spd')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let px, obstacles, dist, speed, running, over, snow
      let best=0;try{best=Number(localStorage.getItem('skiing-best'))||0}catch{}
      bestEl.textContent = best + 'm'

      function start() {
        px = W / 2; obstacles = []; dist = 0; speed = 4; frame=0
        running = true; over = false
        snow = Array.from({ length: 30 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 1 }))
        scoreEl.textContent = '0m'
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        const m = dist | 0
        if (m > best) { best = m; bestEl.textContent = best + 'm'; (()=>{try{localStorage.setItem('skiing-best',best)}catch{}})() }
        overlay.querySelector('h1').textContent = '💥 摔倒了'
        overlay.querySelector('p').innerHTML = '滑行 <b >' + m + 'm</b> · 最远 ' + best + 'm'
        ovBtn.textContent = '再滑一次'
        overlay.classList.remove('hidden')
      }

      let frame = 0
      function step() {
        frame++
        speed = 4 + Math.min(6, dist / 600)
        dist += speed * 0.12
        scoreEl.textContent = (dist | 0) + 'm'
        spdEl.textContent = (speed / 4).toFixed(1) + 'x'
        if (frame % Math.max(18, 42 - (speed | 0)) === 0) {
          const kinds = ['🌲', '🌲', '🌲', '🪨']
          obstacles.push({ x: 30 + Math.random() * (W - 60), y: -30, e: kinds[(Math.random() * kinds.length) | 0] })
        }
        for (let i = obstacles.length - 1; i >= 0; i--) {
          obstacles[i].y += speed
          if (obstacles[i].y > H + 30) { obstacles.splice(i, 1); continue }
          if (Math.abs(obstacles[i].x - px) < 26 && Math.abs(obstacles[i].y - (H - 110)) < 34) return end()
        }
        for (const s of snow) {
          s.y += speed * s.s * 0.4
          if (s.y > H) { s.y = -2; s.x = Math.random() * W }
        }
      }


      function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
      function cloud(x,y){box(x+8,y,32,8,'#fffbed');box(x,y+8,56,12,'#fffbed')}
      function sky(){box(0,0,cv.width,cv.height,'#b0dce4');cloud(28,55);cloud(cv.width-90,110);for(let i=0;i<8;i++){box(i*80,cv.height-90,65,90,'#c2d9a5');box(i*80+15,cv.height-106,35,16,'#c2d9a5')}box(0,cv.height-20,cv.width,20,'#8db685')}
      function disc(x,y,r,c){for(let yy=-r;yy<r;yy+=3){const xx=Math.floor(Math.sqrt(Math.max(0,r*r-yy*yy))/3)*3;box(x-xx,y+yy,xx*2,3,c)}}
      function kid(x,y){box(x+6,y,20,6,'#6b9162');box(x+4,y+6,24,18,'#ffdfaa');box(x+10,y+12,4,4,'#3d5647');box(x+20,y+12,4,4,'#3d5647');box(x+4,y+24,24,20,'#e88c5f');box(x+4,y+44,8,8,'#526f59');box(x+20,y+44,8,8,'#526f59')}
      function pine(x,y){box(x-4,y+12,8,16,'#95744b');box(x-12,y-22,24,10,'#86bda5');box(x-20,y-12,40,10,'#6ca08c');box(x-26,y-2,52,15,'#538574');box(x-10,y-22,16,5,'#f0fbef');box(x-18,y-12,26,5,'#f0fbef');box(x-24,y-2,34,5,'#f0fbef')}

      function draw(){box(0,0,W,H,'#e9f4eb');box(0,0,26,H,'#bdd8c6');box(W-26,0,26,H,'#bdd8c6');for(let y=(frame*2)%60-60;y<H;y+=60){box(21,y,5,24,'#87ada0');box(W-26,y,5,24,'#87ada0')}for(const s of snow)box(s.x,s.y,3+s.s,3+s.s,'#c7ded8');for(const o of obstacles){if(o.e==='🌲')pine(o.x,o.y);else{box(o.x-18,o.y-12,36,24,'#91aaa5');box(o.x-12,o.y-17,24,10,'#cbdcd3');box(o.x-14,o.y+10,30,4,'#d7e7de')}}const py=H-110;kid(px-16,py-35);box(px-15,py+14,7,22,'#669aab');box(px+9,py+14,7,22,'#669aab');box(px-24,py-10,3,34,'#b19364');box(px+22,py-10,3,34,'#b19364');}

      let lastTick=null,lag=0
      function loop(t){requestAnimationFrame(loop);if(lastTick===null)lastTick=t;lag+=Math.min(100,Math.max(0,t-lastTick));lastTick=t;while(lag>=1000/60){if(running&&!over)step();lag-=1000/60}draw()}

      window.addEventListener('keydown', (e) => {
        if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()
        if (!running || over) {
          if (e.code === 'Space' && !overlay.classList.contains('hidden')) start()
          return
        }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') px = Math.max(40, px - 30)
        if (e.code === 'ArrowRight' || e.code === 'KeyD') px = Math.min(W - 40, px + 30)
        if (e.code === 'Space') e.preventDefault()
      })
      cv.addEventListener('pointerdown', (e) => {
        const r = cv.getBoundingClientRect()
        const x = (e.clientX - r.left) * (W / r.width)
        if (!running || over) return
        px = x < W / 2 ? Math.max(40, px - 44) : Math.min(W - 40, px + 44)
      })
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return dist | 0 },
        get over() { return over },
        get started() { return running || over },
      }

      px = W / 2; obstacles = []; dist = 0; speed = 4; running = false; over = false; snow = []
      requestAnimationFrame(loop)
    })()
  </script></body></html>
