<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>六宫数独</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:min(88vw,360px); display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board {
      width:min(88vw,360px); aspect-ratio:1;
      display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(6,1fr);
      background:#1a1d29; border:3px solid #3a4152; border-radius:12px; gap:2px; padding:4px;
    }
    .cell { display:grid; place-items:center; font-size:20px; font-weight:900; background:#14161f;
      border-radius:4px; cursor:pointer; user-select:none; }
    .cell.given { color:#8b93a7; cursor:default; }
    .cell.user { color:var(--blue); }
    .cell.sel { outline:2px solid var(--yellow); }
    .cell.bad { color:#ff4d5e; }
    .cell.bt { border-top:2px solid #3a4152; }
    .cell.bl { border-left:2px solid #3a4152; }
    #nums { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; width:min(88vw,360px); }
    #nums button {
      height:44px; font-family:inherit; font-size:18px; font-weight:900;
      color:#eef1f6; background:#1a1d29; border:2px solid #2a2e3d; border-radius:10px; cursor:pointer;
    }
    #nums button:not(:disabled):active { background:var(--blue); }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.88); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>关卡<b id="lv">1/3</b></span>
      <span>空格<b id="left">0</b></span>
      <span>用时<b id="time">0s</b></span>
      <span>BEST<b id="best">—</b></span>
    </div>
    <div id="board"></div>
    <div id="nums"></div>
  </div>
  <div id="overlay">
    <h1>🔢 六宫数独</h1>
    <p>每行 / 列 / 宫（2×3）数字 1-6 不重复<br/>点空格再点数字填入，冲突标红<br/>三关挖空递增，越快分越高</p>
    <button id="ov-btn">开始游戏</button>
  </div>
  <script>
    (() => {
      const N = 6
      const SOLVE = [
        [1,2,3,4,5,6],[4,5,6,1,2,3],
        [2,3,4,5,6,1],[5,6,1,2,3,4],
        [3,4,5,6,1,2],[6,1,2,3,4,5],
      ]
      const HOLES = [14, 18, 22]
      const boardEl = document.getElementById('board')
      const numsEl = document.getElementById('nums')
      const lvEl = document.getElementById('lv')
      const leftEl = document.getElementById('left')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let grid, given, level, sel, seconds, totalSec, timer, running, over
      let best = Number(localStorage.getItem('minisudoku-best') || 0)
      if (best) bestEl.textContent = best

      for (let n = 1; n <= 6; n++) {
        const b = document.createElement('button')
        b.textContent = n
        b.onclick = () => fill(n)
        numsEl.appendChild(b)
      }

      function load(n) {
        level = n
        grid = SOLVE.map((row) => [...row])
        const holes = new Set()
        while (holes.size < HOLES[n]) holes.add((Math.random() * 36) | 0)
        given = Array.from({ length: 36 }, (_, i) => !holes.has(i))
        holes.forEach((i) => { grid[(i / 6) | 0][i % 6] = 0 })
        sel = -1
        lvEl.textContent = (n + 1) + '/3'
        render()
      }

      function start() {
        totalSec = 0; seconds = 0
        running = true; over = false
        clearInterval(timer)
        timer = setInterval(() => {
          if (running && !over) { seconds++; totalSec++; timeEl.textContent = totalSec + 's' }
        }, 1000)
        overlay.classList.add('hidden')
        load(0)
      }

      function conflicts(r, c) {
        const v = grid[r][c]
        if (!v) return false
        for (let i = 0; i < N; i++) {
          if (i !== c && grid[r][i] === v) return true
          if (i !== r && grid[i][c] === v) return true
        }
        const br = ((r / 2) | 0) * 2, bc = ((c / 3) | 0) * 3
        for (let i = br; i < br + 2; i++)
          for (let j = bc; j < bc + 3; j++)
            if ((i !== r || j !== c) && grid[i][j] === v) return true
        return false
      }

      function complete() {
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          if (!grid[r][c] || conflicts(r, c)) return false
        }
        return true
      }

      function fill(n) {
        if (!running || over || sel === -1 || given[sel]) return
        const r = (sel / 6) | 0, c = sel % 6
        grid[r][c] = grid[r][c] === n ? 0 : n
        render()
        if (complete()) win()
      }

      function win() {
        if (level === HOLES.length - 1) {
          running = false; over = true
          clearInterval(timer)
          const score = Math.max(200, 1500 - totalSec)
          if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('minisudoku-best', best) }
          overlay.querySelector('h1').textContent = '🏆 全部完成'
          overlay.querySelector('p').innerHTML = '用时 ' + totalSec + ' 秒 · 得分 <b style="color:#ffd23f">' + score + '</b>'
          ovBtn.textContent = '再来一局'
          overlay.classList.remove('hidden')
        } else {
          setTimeout(() => load(level + 1), 500)
        }
      }

      function render() {
        boardEl.innerHTML = ''
        let left = 0
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          const i = r * 6 + c
          const el = document.createElement('div')
          el.className = 'cell'
          if (r % 2 === 0 && r > 0) el.classList.add('bt')
          if (c % 3 === 0 && c > 0) el.classList.add('bl')
          if (i === sel) el.classList.add('sel')
          if (grid[r][c]) {
            el.textContent = grid[r][c]
            el.classList.add(given[i] ? 'given' : 'user')
            if (conflicts(r, c)) el.classList.add('bad')
          } else left++
          el.onclick = () => { sel = i; render() }
          boardEl.appendChild(el)
        }
        leftEl.textContent = left
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return Math.max(200, 1500 - totalSec) },
        get over() { return over },
        get started() { return running },
      }

      grid = SOLVE.map((row) => [...row])
      given = Array(36).fill(true)
      level = 0; sel = -1; seconds = 0; totalSec = 0; running = false; over = false
      render()
    })()
  </script>
</body>
</html>
