<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>疯狂打砖块</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; overflow: hidden;
    }
    #wrap { position: relative; }
    #hud {
      position: absolute; top: -34px; left: 4px; right: 4px;
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: #8b93a7; letter-spacing: 1px;
    }
    #hud b { color: var(--yellow); font-size: 16px; margin-left: 4px; }
    canvas {
      display: block; border: 3px solid #2a2e3d; border-radius: 10px;
      background: #14161f; max-width: 92vw; max-height: 74vh;
    }
    #overlay {
      position: absolute; inset: 0; border-radius: 10px;
      background: rgba(15, 17, 24, 0.88);
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; line-height: 1.9; }
    #overlay button {
      background: var(--blue); color: #fff; font-family: inherit;
      border: 2px solid #fff; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      font-size: 16px; font-weight: 700; padding: 10px 32px; border-radius: 8px; cursor: pointer;
    }

    /* Crafted pixel edition: the playable pieces, not just the surrounding UI. */
    :root{--ink:#48533d;--accent:#4e854d;--paper:#fff9e7;--edge:#6f9250;--page:#edf2d9}
    body{background:var(--page);color:var(--ink);background-image:radial-gradient(#ffffff70 1px,transparent 1px);background-size:12px 12px;overflow:auto;min-height:100%;height:auto;padding:24px 12px;gap:10px}
    body::before{content:'';position:fixed;inset:0;box-shadow:inset 0 0 100px #ffffff70;pointer-events:none;z-index:-1}
    button{font-family:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #d26c48;outline-offset:3px}
    #wrap{flex-shrink:0;max-width:100%}
    #hud,#bar{position:static;color:var(--ink);letter-spacing:0;font-size:11px;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 4px}
    #hud b,#bar b{color:var(--accent);font-size:17px}canvas{image-rendering:pixelated;border:4px solid var(--edge);border-radius:8px;box-shadow:0 5px 0 color-mix(in srgb,var(--edge),transparent 55%);background:var(--paper);max-width:100%;object-fit:contain}
    #overlay{z-index:20;background:color-mix(in srgb,var(--paper) 96%,transparent);color:var(--ink);border-radius:12px;gap:12px;padding:22px}
    #overlay::before{content:'';width:90px;height:90px;background:var(--mascot) center/contain no-repeat;image-rendering:pixelated}
    #overlay h1,#overlay h2{font-size:25px;letter-spacing:1px;text-shadow:none;color:var(--ink)}
    #overlay p{color:var(--ink);font-size:13px;line-height:1.9;max-width:340px}#overlay p b{color:var(--accent)!important}
    #overlay button,#new-game,#bar button,#pads button,.up,.garden-controls button{background:var(--accent);color:#fffaf0;border:2px solid var(--ink);box-shadow:0 3px 0 #0002;border-radius:7px;font-weight:800;cursor:pointer}
    #overlay button:hover{filter:brightness(1.1)}#overlay.hidden{display:none}
    .pixel-sprite{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
    .scene-title{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:5px}
    .scene-title strong{font-size:23px;letter-spacing:1px;display:block}.scene-title small{display:block;font-size:11px;line-height:1.8;letter-spacing:1px;color:var(--accent)}
    .scene-title svg{width:54px;height:54px;flex-shrink:0}.play-note{font-size:11px;text-align:center;color:var(--ink);line-height:1.7;margin-top:9px}
    .landscape{height:92px;position:relative;overflow:hidden;border-radius:10px 10px 0 0;background:linear-gradient(#a9dfdf 0 63%,#b7d878 63% 71%,#82b65e 71%);border:3px solid var(--edge);border-bottom:0}
    .landscape::before{content:'';position:absolute;left:15%;top:18px;width:40px;height:8px;background:#fffcec;box-shadow:8px -6px #fffcec,170px 5px #fffcec,178px -1px #fffcec}
    .landscape svg{position:absolute;bottom:0;width:76px;height:76px}.landscape svg:nth-child(2){left:2%;width:52px;height:52px}.landscape svg:nth-child(3){right:4%;width:44px;height:44px}.landscape svg:nth-child(4){right:15%;width:32px;height:32px}
    @media(max-width:480px){body{padding:14px 10px}.scene-title strong{font-size:20px}#hud b,#bar b{font-size:15px}.landscape{height:74px}.scene-title svg{width:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--page:#f7e4de;--ink:#82534a;--accent:#bf7759;--edge:#ba8b6c;--paper:#fff4dc;--mascot:url("data:image/svg+xml,%3Csvg%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2032%2032%22%20class%3D%22pixel-sprite%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%227%22%20y%3D%224%22%20width%3D%2218%22%20height%3D%2224%22%20fill%3D%22%23986334%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%227%22%20width%3D%2224%22%20height%3D%2218%22%20fill%3D%22%23986334%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%224%22%20width%3D%2216%22%20height%3D%2221%22%20fill%3D%22%23e6ac57%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%227%22%20width%3D%2222%22%20height%3D%2215%22%20fill%3D%22%23e6ac57%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%226%22%20width%3D%2216%22%20height%3D%2213%22%20fill%3D%22%23f9ce7b%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%227%22%20width%3D%229%22%20height%3D%222%22%20fill%3D%22%23ffe6a3%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2211%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%238f5a41%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2211%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23bc8650%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%2210%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%238f5a41%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%2210%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23bc8650%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%2218%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%238f5a41%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%2218%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23bc8650%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2221%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%238f5a41%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2221%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23bc8650%22%2F%3E%3C%2Fsvg%3E")}
body{flex-direction:column}#wrap{width:min(440px,94vw,calc((100dvh - 140px)*.774))}canvas{width:100%;height:auto;max-height:none}#overlay{position:fixed;inset:0}.scene-title strong{font-size:21px}.scene-title svg{width:44px;height:44px}

/* Compact landscape retains readable boards beside their controls. */
@media(min-width:600px) and (max-height:550px){body{padding:12px;gap:8px}.play-note{margin:0}#wrap{width:min(700px,96vw);display:grid;grid-template-columns:210px auto;column-gap:24px;align-items:center;justify-content:center}.scene-title{grid-column:1;align-self:end}#hud{grid-column:1;align-self:start;justify-content:flex-start}canvas{grid-column:2;grid-row:1/4;height:calc(100dvh - 76px);width:auto;max-width:none}}
@media(max-width:480px){body{padding:12px 10px}.play-note{margin-top:3px;font-size:10px}.scene-title{margin-bottom:0}.scene-title small{letter-spacing:.5px}}
  </style>
</head>
<body>
  <div id="wrap">
<header class="scene-title"><div><small>COOKIE BOUNCE · 疯狂打砖块</small><strong>饼干弹弹屋</strong></div><svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="7" y="4" width="18" height="24" fill="#986334"/><rect x="4" y="7" width="24" height="18" fill="#986334"/><rect x="8" y="4" width="16" height="21" fill="#e6ac57"/><rect x="5" y="7" width="22" height="15" fill="#e6ac57"/><rect x="8" y="6" width="16" height="13" fill="#f9ce7b"/><rect x="9" y="7" width="9" height="2" fill="#ffe6a3"/><rect x="10" y="11" width="3" height="3" fill="#8f5a41"/><rect x="10" y="11" width="2" height="1" fill="#bc8650"/><rect x="21" y="10" width="3" height="3" fill="#8f5a41"/><rect x="21" y="10" width="2" height="1" fill="#bc8650"/><rect x="17" y="18" width="3" height="3" fill="#8f5a41"/><rect x="17" y="18" width="2" height="1" fill="#bc8650"/><rect x="8" y="21" width="3" height="3" fill="#8f5a41"/><rect x="8" y="21" width="2" height="1" fill="#bc8650"/></svg></header>
    <div id="hud">
      <span>SCORE<b id="score">0</b></span>
      <span>LV<b id="level">1</b></span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="480" height="620"></canvas>
    <div id="overlay">
      <h1>疯狂打砖块</h1>
      <p>鼠标 / ← → 移动挡板 · 空格或点击发射<br />清空全部砖块过关，3 条命</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>

  <p class="play-note">移动鼠标 / 左右键控制擀面杖 · 点击或空格发射小饼干</p>
  <script>
    (() => {

      function pixels(kind) {
        const a=[]; const r=(x,y,w,h,c)=>a.push([x,y,w,h,c]);
        const face=(x,y)=>{r(x,y,2,3,'#332f36');r(x+8,y,2,3,'#332f36');r(x,y,1,1,'#fffdf0');r(x+8,y,1,1,'#fffdf0');r(x-2,y+4,3,2,'#f4998a');r(x+9,y+4,3,2,'#f4998a');r(x+4,y+4,2,1,'#8f4d48');};
        const round=(x,y,w,h,c)=>{r(x+3,y,w-6,h,c);r(x,y+3,w,h-6,c)};
        if(kind==='apple'||kind==='orange'||kind==='berry') {
          const p=kind==='apple'?['#8e3540','#d84b4e','#ff765f','#ffbea0']:kind==='orange'?['#ae5c2c','#ef9c34','#ffc650','#ffed9a']:['#48447d','#6f6fc1','#9d9ce3','#d2d1ff'];
          round(4,9,24,20,p[0]);round(6,10,20,17,p[1]);r(8,11,15,11,p[2]);r(8,13,4,5,p[3]);r(10,11,5,2,p[3]);r(13,6,3,6,'#72533e');r(16,4,9,4,'#3c7949');r(17,4,6,2,'#9bcd55');face(10,19);
        } else if(kind==='carrot'||kind==='sprout') {
          r(14,6,3,11,'#37774b');r(7,5,8,4,'#387d43');r(9,3,6,4,'#84bd50');r(17,4,8,4,'#3c8e46');r(18,2,6,3,'#b0d767');
          if(kind==='carrot'){r(9,13,15,5,'#ad552b');r(10,18,12,5,'#ad552b');r(12,23,8,4,'#ad552b');r(14,27,4,3,'#ad552b');r(10,14,12,4,'#ffb04b');r(11,18,9,5,'#f88132');r(13,23,5,4,'#f88132');r(11,15,3,5,'#ffda75');r(18,19,3,1,'#ba5c32');r(13,24,3,1,'#ba5c32');}
          else {r(5,23,22,4,'#654830');r(8,21,16,3,'#9d6c42');r(14,14,3,8,'#3c8747');}
        } else if(kind==='flower') {
          r(15,13,3,17,'#3c8b58');r(8,20,8,4,'#82be5f');r(18,23,8,4,'#58a657');
          round(10,2,12,20,'#e5bc88');round(5,7,22,10,'#e5bc88');round(11,2,10,18,'#fffbea');round(5,8,22,8,'#fffbea');r(12,8,9,8,'#e9a82d');r(13,8,6,5,'#ffd95c');r(14,9,3,2,'#fff5ac');
        } else if(kind==='mushroom') {
          r(11,16,11,13,'#af784d');r(12,16,9,11,'#ffe6b2');r(12,18,3,6,'#fff6da');r(6,8,21,11,'#9c3d43');r(10,4,13,5,'#9c3d43');r(4,13,25,7,'#9c3d43');r(7,9,19,8,'#e97564');r(10,5,13,9,'#f69b7e');r(5,14,23,3,'#e97564');r(10,8,4,4,'#fff0cf');r(20,12,5,4,'#fff0cf');face(12,22);
        } else if(kind==='mole'||kind==='goldmole'||kind==='bunny') {
          const bunny=kind==='bunny',gold=kind==='goldmole'; const dark=bunny?'#8c7974':gold?'#9c6327':'#704c46'; const base=bunny?'#f9eacb':gold?'#efb648':'#b38360';const light=bunny?'#fffbed':gold?'#ffe08a':'#dbac7a';
          if(bunny){r(8,1,6,12,dark);r(19,0,6,13,dark);r(9,2,4,11,light);r(20,1,4,12,light);r(10,4,2,7,'#e7a09b');r(21,3,2,8,'#e7a09b');}
          else{round(4,5,8,9,dark);round(21,5,8,9,dark);r(6,7,4,5,'#e7a09b');r(23,7,4,5,'#e7a09b');}
          round(4,11,25,20,dark);round(6,11,21,18,base);r(9,10,15,7,light);r(7,14,4,7,light);round(9,21,16,8,bunny?'#fffdf2':'#f8ddb0');face(11,16);r(14,24,6,2,'#8a534b');r(16,24,2,3,'#fff8e4');r(3,26,5,4,light);r(26,26,4,4,light);
        } else if(kind==='chick') {
          r(4,13,6,9,'#9a6129');r(7,8,18,18,'#9a6129');r(11,5,12,4,'#9a6129');r(8,10,17,14,'#ffca42');r(11,7,12,14,'#ffe777');r(12,8,9,6,'#fff2ac');r(6,16,10,7,'#f2a32d');r(6,16,8,3,'#ffda5b');r(19,10,6,8,'#fffbed');r(22,12,3,5,'#3f3831');r(22,12,1,1,'#fff');r(25,17,6,3,'#b9582c');r(25,17,5,1,'#ffad3b');r(19,20,4,2,'#f99059');r(11,26,3,3,'#c87c33');r(20,25,3,3,'#c87c33');r(11,3,3,4,'#c89c38');
        } else if(kind==='grape') {
          r(15,3,3,6,'#72513d');r(18,3,9,4,'#599657');
          for(const [x,y] of [[7,8],[17,8],[5,15],[14,15],[22,15],[10,22],[18,22]]){round(x,y,8,8,'#624274');round(x+1,y,6,6,'#a27bd0');r(x+2,y+1,2,2,'#e4bcf4');}
        } else if(kind==='melon') {
          r(4,9,24,13,'#326d52');r(7,22,18,4,'#326d52');r(11,26,10,3,'#326d52');r(5,9,22,12,'#a6d46c');r(8,21,16,3,'#a6d46c');r(6,9,20,9,'#f9807c');r(9,18,14,3,'#f9807c');r(12,21,8,2,'#f9807c');r(7,10,18,2,'#ffb0a0');for(const [x,y] of [[10,14],[16,12],[21,15],[15,18]])r(x,y,1,2,'#673f48');
        } else if(kind==='flag') {
          r(10,3,3,25,'#695447');r(13,4,14,10,'#9e4b4c');r(13,4,11,7,'#f47768');r(14,5,7,2,'#ffbea2');r(7,27,13,2,'#486a4a');
        } else if(kind==='mine') {
          r(14,2,4,28,'#47606b');r(2,14,28,4,'#47606b');r(6,6,20,20,'#47606b');round(7,7,18,18,'#6e8e97');r(10,9,6,4,'#c1d9cf');face(11,16);
        } else if(kind==='crate') {
          r(2,4,28,26,'#865637');r(4,5,24,22,'#d29b58');r(6,8,20,17,'#b77b46');r(7,9,18,3,'#e8b56b');r(7,16,18,2,'#e8b56b');r(4,5,3,22,'#f3c986');r(25,5,3,22,'#ad713f');r(5,5,22,3,'#ffe0a0');r(5,24,22,3,'#e4b06a');r(6,6,2,2,'#805b3d');r(24,25,2,2,'#805b3d');r(14,13,6,5,'#f1a13f');r(15,18,3,3,'#f1a13f');r(15,10,2,4,'#5f974f');r(17,10,4,2,'#9dc968');
        } else if(kind==='hedge') {
          r(1,5,30,27,'#376e4c');r(2,3,28,25,'#4b9550');r(5,1,22,26,'#75b44f');r(8,2,12,5,'#b9d663');r(4,8,8,5,'#a3ce5a');r(18,5,10,5,'#92c250');r(7,16,12,6,'#8fc352');r(21,16,8,6,'#447e45');r(4,24,11,4,'#467d43');r(21,11,3,3,'#d0e478');r(13,10,3,3,'#c0db69');r(15,25,8,3,'#64a34a');
        } else if(kind==='barn') {
          for(let i=0;i<6;i++)r(15-i*2,2+i*2,2+i*4,3,'#5c656c');r(6,14,23,17,'#9d4843');r(7,14,20,15,'#df775c');for(let i=9;i<27;i+=4)r(i,15,1,14,'#f59973');r(5,14,25,2,'#ffecbc');r(12,20,11,11,'#ffe8b4');r(14,21,7,10,'#975645');r(17,21,1,10,'#ffdb9e');r(14,23,7,1,'#ffdb9e');r(15,12,6,6,'#ffecbc');r(16,13,4,4,'#6aa7b5');
        } else if(kind==='cookie') {
          round(4,4,24,24,'#986334');round(5,4,22,21,'#e6ac57');r(8,6,16,13,'#f9ce7b');r(9,7,9,2,'#ffe6a3');for(const [x,y] of [[10,11],[21,10],[17,18],[8,21]]){r(x,y,3,3,'#8f5a41');r(x,y,2,1,'#bc8650');}
        }
        return a;
      }
      function sprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pixels(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function paint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pixels(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}

      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const levelEl = document.getElementById('level')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const PW = 92, PH = 14, PY = H - 44, BR = 7
      const COLORS = ['#ed9a96', '#f0b875', '#e6cb72', '#9ec58a', '#ae9cce']

      let crumbs = []
      let paddleX, ball, bricks, score, lives, level, running, over
      let best = Number(localStorage.getItem('breakout-best') || 0)
      bestEl.textContent = best

      function buildBricks() {
        bricks = []
        const cols = 8, rows = 5, gap = 6, left = 24, top = 64
        const bw = (W - left * 2 - gap * (cols - 1)) / cols, bh = 22
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++)
            bricks.push({ x: left + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh, c: COLORS[r] })
      }

      function resetBall() {
        ball = { x: paddleX + PW / 2, y: PY - BR - 1, vx: 0, vy: 0, stuck: true }
      }

      function launch() {
        if (!ball.stuck) return
        const a = (Math.random() * 0.6 - 0.3)
        const v = 4.2 + (level - 1) * 0.4
        ball.vx = v * Math.sin(a)
        ball.vy = -v * Math.cos(a)
        ball.stuck = false
      }

      function startGame() {
        crumbs = []; score = 0; lives = 3; level = 1; over = false; running = true
        paddleX = (W - PW) / 2
        scoreEl.textContent = 0; levelEl.textContent = 1; livesEl.textContent = '♥♥♥'
        buildBricks()
        resetBall()
        overlay.classList.add('hidden')
      }

      function gameOver(win) {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('breakout-best', best) }
        overlay.querySelector('h1').textContent = win ? '🎉 全部通关' : '游戏结束'
        overlay.querySelector('p').innerHTML =
          '得分 <b style="color:#ffd23f">' + score + '</b> · 到达第 ' + level + ' 关 · 最高分 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        crumbs = crumbs.filter(p=>p.t-- > 0); for (const p of crumbs) { p.x+=p.vx; p.y+=p.vy; p.vy+=.12 }
        if (!ball.stuck) {
          ball.x += ball.vx
          ball.y += ball.vy
          if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx) }
          if (ball.x > W - BR) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx) }
          if (ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy) }

          // 挡板
          if (ball.vy > 0 && ball.y + BR >= PY && ball.y + BR <= PY + PH + 8 &&
              ball.x >= paddleX - BR && ball.x <= paddleX + PW + BR) {
            const rel = Math.max(-1, Math.min(1, (ball.x - (paddleX + PW / 2)) / (PW / 2)))
            const v = 4.2 + (level - 1) * 0.4
            const a = rel * (Math.PI / 3)
            ball.vx = v * Math.sin(a)
            ball.vy = -v * Math.cos(a)
            ball.y = PY - BR - 1
          }

          // 砖块
          for (let i = bricks.length - 1; i >= 0; i--) {
            const b = bricks[i]
            const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w))
            const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h))
            const dx = ball.x - nx, dy = ball.y - ny
            if (dx * dx + dy * dy <= BR * BR) {
              if (Math.abs(dx) > Math.abs(dy)) ball.vx = -ball.vx
              else ball.vy = -ball.vy
              for (let j=0;j<7;j++) crumbs.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*5,vy:-Math.random()*3,t:28,c:b.c})
              bricks.splice(i, 1)
              score += 10
              scoreEl.textContent = score
              break
            }
          }

          if (!bricks.length) {
            level++
            levelEl.textContent = level
            buildBricks()
            resetBall()
            return
          }

          if (ball.y > H + BR) {
            lives--
            livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
            if (lives <= 0) return gameOver(false)
            resetBall()
          }
        } else {
          ball.x = paddleX + PW / 2
          ball.y = PY - BR - 1
        }
      }

      function draw() {
        ctx.fillStyle='#fff0d8';ctx.fillRect(0,0,W,H);
        for(let y=0;y<H;y+=32)for(let x=0;x<W;x+=32){ctx.fillStyle=((x+y)/32)%2?'#fbe8cd':'#fff3de';ctx.fillRect(x,y,32,32);ctx.fillStyle='#ecd3b3';ctx.fillRect(x+15,y+15,2,2)}
        for(let x=0;x<W;x+=40){ctx.fillStyle=(x/40)%2?'#e58f83':'#fff9e9';ctx.fillRect(x,0,40,25);ctx.fillRect(x+3,25,34,8)}
        ctx.fillStyle='#bd8a64';ctx.fillRect(0,36,W,3);
        for(const b of bricks){ctx.fillStyle='#b0784b';ctx.fillRect(b.x,b.y+3,b.w,b.h);ctx.fillStyle='#e5b577';ctx.fillRect(b.x+1,b.y+1,b.w-2,b.h-1);ctx.fillStyle=b.c;ctx.fillRect(b.x+3,b.y,b.w-6,b.h-5);ctx.fillStyle='#ffffff77';ctx.fillRect(b.x+5,b.y+2,b.w-10,3);ctx.fillStyle='#fff0b3';ctx.fillRect(b.x+10,b.y+7,4,2);ctx.fillStyle='#ffffffb0';ctx.fillRect(b.x+b.w-14,b.y+10,2,4)}
        ctx.globalAlpha=.35;paint('cookie',W/2-65,285,130);ctx.globalAlpha=1;
        for(const p of crumbs){ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)}
        ctx.fillStyle='#885838';ctx.fillRect(paddleX,PY+3,PW,PH-4);ctx.fillStyle='#c68e53';ctx.fillRect(paddleX+8,PY,PW-16,PH);ctx.fillStyle='#f1cc8a';ctx.fillRect(paddleX+12,PY+2,PW-24,5);ctx.fillStyle='#a86c3d';ctx.fillRect(paddleX+9,PY,3,PH);ctx.fillRect(paddleX+PW-12,PY,3,PH);
        paint('cookie',ball.x-9,ball.y-9,18);
        if(ball.stuck&&running){ctx.fillStyle='#9b6c54';ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillText('点击 / 空格，发射饼干',W/2,PY-45);ctx.textAlign='left'}
        ctx.fillStyle='#eac7a3';ctx.fillRect(0,H-12,W,12);
      }

      let lastFrame = 0, elapsedFrame = 0
      function loop(t = 0) {
        requestAnimationFrame(loop)
        elapsedFrame += Math.min(50, t - lastFrame); lastFrame = t
        while (elapsedFrame >= 1000 / 60) { if (running && !over) step(); elapsedFrame -= 1000 / 60 }
        draw()
      }

      function toGameX(clientX) {
        const r = cv.getBoundingClientRect()
        return (clientX - r.left) * (W / r.width)
      }

      cv.addEventListener('pointermove', (e) => {
        paddleX = Math.max(0, Math.min(W - PW, toGameX(e.clientX) - PW / 2))
      })
      cv.addEventListener('pointerdown', () => { if (running) launch() })

      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault()
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') paddleX = Math.max(0, paddleX - 34)
        if (e.code === 'ArrowRight' || e.code === 'KeyD') paddleX = Math.min(W - PW, paddleX + 34)
        if (e.code === 'Space') {
          e.preventDefault()
          if (running) launch()
          else if (!overlay.classList.contains('hidden')) startGame()
        }
      })

      ovBtn.addEventListener('click', startGame)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running || over },
      }

      paddleX = (W - PW) / 2
      buildBricks()
      ball = { x: W / 2, y: PY - BR - 1, vx: 0, vy: 0, stuck: true }
      score = 0; lives = 3; level = 1; running = false; over = false
      loop()
    })()
  </script>
</body>
</html>
