<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>舒尔特方格</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #grid { width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(5,1fr);
      grid-template-rows:repeat(5,1fr); gap:6px; background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:8px; }
    .cell { display:grid; place-items:center; font-size:26px; font-weight:900; background:#14161f;
      border-radius:8px; cursor:pointer; user-select:none; color:#c9d4f5; }
    .cell.next { color:var(--yellow); }
    .cell.hit { background:#122a1c; color:#22b573; cursor:default; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>下一个<b id="next">1</b></span>
      <span>用时<b id="time">0.0s</b></span>
      <span>BEST<b id="best">—</b></span>
    </div>
    <div id="grid"></div>
  </div>
  <div id="overlay">
    <h1>🔢 舒尔特方格</h1>
    <p>从 1 开始按顺序点到 25<br/>注意力测试金标准<br/>越快分越高，最快纪录本地保存</p>
    <button id="ov-btn">开始测试</button>
  </div>
  <script>
    (() => {
      const N = 5
      const nextEl = document.getElementById('next')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const gridEl = document.getElementById('grid')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let nums, target, t0, elapsed, running, over, timer
      let best = Number(localStorage.getItem('schulte-best') || 0)
      if (best) bestEl.textContent = (best / 1000).toFixed(1) + 's'

      function start() {
        nums = Array.from({ length: 25 }, (_, i) => i + 1).sort(() => Math.random() - 0.5)
        target = 1
        elapsed = 0
        running = true; over = false
        nextEl.textContent = 1
        overlay.classList.add('hidden')
        clearInterval(timer)
        timer = setInterval(() => {
          if (running && !over) {
            elapsed = performance.now() - t0
            timeEl.textContent = (elapsed / 1000).toFixed(1) + 's'
          }
        }, 100)
        render()
      }

      function end() {
        running = false; over = true
        clearInterval(timer)
        const ms = Math.round(elapsed)
        const score = Math.max(0, 2500 - (ms / 10 | 0))
        const isBest = !best || ms < best
        if (isBest) { best = ms; bestEl.textContent = (best / 1000).toFixed(1) + 's'; localStorage.setItem('schulte-best', best) }
        overlay.querySelector('h1').textContent = '🏁 测试完成'
        overlay.querySelector('p').innerHTML =
          '用时 <b style="color:#ffd23f">' + (ms / 1000).toFixed(2) + '</b> 秒 · 得分 ' + score +
          (isBest ? ' · 新纪录！' : '（最快 ' + (best / 1000).toFixed(1) + 's）')
        ovBtn.textContent = '再来一次'
        overlay.classList.remove('hidden')
      }

      function render() {
        gridEl.innerHTML = ''
        nums.forEach((v) => {
          const el = document.createElement('div')
          el.className = 'cell' + (v === target ? ' next' : v < target ? ' hit' : '')
          el.textContent = v
          el.onclick = () => {
            if (!running || over) return
            if (v === target) {
              target++
              nextEl.textContent = target <= 25 ? target : '✓'
              render()
              if (target > 25) end()
            }
          }
          gridEl.appendChild(el)
        })
      }

      ovBtn.addEventListener('click', () => { t0 = performance.now(); start() })

      window.__hub = {
        get score() { return Math.max(0, 2500 - ((elapsed / 10) | 0)) },
        get over() { return over },
        get started() { return running },
      }

      nums = []; target = 1; elapsed = 0; running = false; over = false
    })()
  </script>
</body>
</html>
