="4" fill="#55705c"/><rect x="52" y="32" width="4" height="4" fill="#55705c"/><rect x="56" y="32" width="4" height="4" fill="#55705c"/><rect x="60" y="32" width="4" height="4" fill="#55705c"/><path d="M12 64h76v5H12z" fill="#c2d9a5"/></svg><small>A LITTLE PIXEL BREAK.</small><h2>薄荷冰球场</h2><p>小小冰场，来一场轻快对决。</p><p class="tips">拖动下方球拍 · 攻进上方球门 · 先得 5 分</p></aside></div><footer class="foot"><span>拖动下方球拍 · 攻进上方球门 · 先得 5 分</span><span>慢慢玩，也很好。</span></footer></main><div id="overlay"><section class="intro-card"><svg viewBox="0 0 100 74" shape-rendering="crispEdges" aria-hidden="true"><rect x="32" y="8" width="4" height="4" fill="#55705c"/><rect x="36" y="8" width="4" height="4" fill="#55705c"/><rect x="40" y="8" width="4" height="4" fill="#55705c"/><rect x="44" y="8" width="4" height="4" fill="#55705c"/><rect x="48" y="8" width="4" height="4" fill="#55705c"/><rect x="52" y="8" width="4" height="4" fill="#55705c"/><rect x="56" y="8" width="4" height="4" fill="#55705c"/><rect x="60" y="8" width="4" height="4" fill="#55705c"/><rect x="28" y="12" width="4" height="4" fill="#55705c"/><rect x="32" y="12" width="4" height="4" fill="#83c4d4"/><rect x="36" y="12" width="4" height="4" fill="#83c4d4"/><rect x="40" y="12" width="4" height="4" fill="#83c4d4"/><rect x="44" y="12" width="4" height="4" fill="#83c4d4"/><rect x="48" y="12" width="4" height="4" fill="#83c4d4"/><rect x="52" y="12" width="4" height="4" fill="#83c4d4"/><rect x="56" y="12" width="4" height="4" fill="#83c4d4"/><rect x="60" y="12" width="4" height="4" fill="#83c4d4"/><rect x="64" y="12" width="4" height="4" fill="#55705c"/><rect x="24" y="16" width="4" height="4" fill="#55705c"/><rect x="28" y="16" width="4" height="4" fill="#83c4d4"/><rect x="32" y="16" width="4" height="4" fill="#83c4d4"/><rect x="36" y="16" width="4" height="4" fill="#83c4d4"/><rect x="40" y="16" width="4" height="4" fill="#ffdca3"/><rect x="44" y="16" width="4" height="4" fill="#ffdca3"/><rect x="48" y="16" width="4" height="4" fill="#83c4d4"/><rect x="52" y="16" width="4" height="4" fill="#83c4d4"/><rect x="56" y="16" width="4" height="4" fill="#83c4d4"/><rect x="60" y="16" width="4" height="4" fill="#83c4d4"/><rect x="64" y="16" width="4" height="4" fill="#83c4d4"/><rect x="68" y="16" width="4" height="4" fill="#55705c"/><rect x="24" y="20" width="4" height="4" fill="#55705c"/><rect x="28" y="20" width="4" height="4" fill="#83c4d4"/><rect x="32" y="20" width="4" height="4" fill="#83c4d4"/><rect x="36" y="20" width="4" height="4" fill="#83c4d4"/><rect x="40" y="20" width="4" height="4" fill="#ffdca3"/><rect x="44" y="20" width="4" height="4" fill="#ffdca3"/><rect x="48" y="20" width="4" height="4" fill="#83c4d4"/><rect x="52" y="20" width="4" height="4" fill="#83c4d4"/><rect x="56" y="20" width="4" height="4" fill="#83c4d4"/><rect x="60" y="20" width="4" height="4" fill="#83c4d4"/><rect x="64" y="20" width="4" height="4" fill="#83c4d4"/><rect x="68" y="20" width="4" height="4" fill="#55705c"/><rect x="24" y="24" width="4" height="4" fill="#55705c"/><rect x="28" y="24" width="4" height="4" fill="#83c4d4"/><rect x="32" y="24" width="4" height="4" fill="#83c4d4"/><rect x="36" y="24" width="4" height="4" fill="#83c4d4"/><rect x="40" y="24" width="4" height="4" fill="#83c4d4"/><rect x="44" y="24" width="4" height="4" fill="#83c4d4"/><rect x="48" y="24" width="4" height="4" fill="#83c4d4"/><rect x="52" y="24" width="4" height="4" fill="#83c4d4"/><rect x="56" y="24" width="4" height="4" fill="#83c4d4"/><rect x="60" y="24" width="4" height="4" fill="#83c4d4"/><rect x="64" y="24" width="4" height="4" fill="#83c4d4"/><rect x="68" y="24" width="4" height="4" fill="#55705c"/><rect x="28" y="28" width="4" height="4" fill="#55705c"/><rect x="32" y="28" width="4" height="4" fill="#83c4d4"/><rect x="36" y="28" width="4" height="4" fill="#83c4d4"/><rect x="40" y="28" width="4" height="4" fill="#83c4d4"/><rect x="44" y="28" width="4" height="4" fill="#83c4d4"/><rect x="48" y="28" width="4" height="4" fill="#83c4d4"/><rect x="52" y="28" width="4" height="4" fill="#83c4d4"/><rect x="56" y="28" width="4" height="4" fill="#83c4d4"/><rect x="60" y="28" width="4" height="4" fill="#83c4d4"/><rect x="64" y="28" width="4" height="4" fill="#55705c"/><rect x="32" y="32" width="4" height="4" fill="#55705c"/><rect x="36" y="32" width="4" height="4" fill="#55705c"/><rect x="40" y="32" width="4" height="4" fill="#55705c"/><rect x="44" y="32" width="4" height="4" fill="#55705c"/><rect x="48" y="32" width="4" height="4" fill="#55705c"/><rect x="52" y="32" width="4" height="4" fill="#55705c"/><rect x="56" y="32" width="4" height="4" fill="#55705c"/><rect x="60" y="32" width="4" height="4" fill="#55705c"/><path d="M12 64h76v5H12z" fill="#c2d9a5"/></svg>
      <h1>冰球对战</h1>
      <p>移动鼠标 / 手指控制下方球拍<br/>冰球高速滑行、四壁反弹<br/>先攻进对方球门 5 次获胜</p>
      <button id="ov-btn">开始比赛</button>
    </section></div><script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const GW = 150, PR = 26, PU = 11
      const psEl = document.getElementById('ps')
      const asEl = document.getElementById('as')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let px, puck, ps, as, serving, running, over
      const ai = { x: W / 2, y: 70 }

      function start() {
        ps = 0; as = 0
        running = true; over = false
        psEl.textContent = 0; asEl.textContent = 0
        overlay.classList.add('hidden')
        serve(1)
      }

      function serve(toPlayer) {
        puck = { x: W / 2, y: H / 2, vx: 0, vy: 0 }
        px = { x: W / 2, y: H - 80 }
        ai.x = W / 2; ai.y = 70
        serving = 40
        puck.vx = (Math.random() - 0.5) * 3
        puck.vy = toPlayer ? 4 : -4
      }

      function end(playerWin) {
        running = false; over = true
        overlay.querySelector('h1').textContent = playerWin ? '🏆 你赢了' : '😡 AI 获胜'
        overlay.querySelector('p').innerHTML = '比分 <b >' + ps + '</b> : ' + as
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        if (serving > 0) { serving--; return }
        // AI 追球（限制在上半场）
        if (puck.y < H / 2) {
          ai.x += Math.max(-6, Math.min(6, puck.x - ai.x))
          ai.y += Math.max(-4, Math.min(4, puck.y + 40 - ai.y))
        } else {
          ai.x += Math.max(-3, Math.min(3, W / 2 - ai.x))
          ai.y += Math.max(-3, Math.min(3, 70 - ai.y))
        }
        ai.x = Math.max(PR, Math.min(W - PR, ai.x))
        ai.y = Math.max(60, Math.min(H / 2 - 30, ai.y))
        puck.x += puck.vx
        puck.y += puck.vy
        puck.vx *= 0.995; puck.vy *= 0.995
        // 侧壁
        if (puck.x < PU) { puck.x = PU; puck.vx = Math.abs(puck.vx) }
        if (puck.x > W - PU) { puck.x = W - PU; puck.vx = -Math.abs(puck.vx) }
        // 进球检测（上下开口）
        const inGoalX = puck.x > W / 2 - GW / 2 && puck.x < W / 2 + GW / 2
        if (puck.y < PU && inGoalX) {
          ps++; psEl.textContent = ps
          if (ps >= 5) return end(true)
          return serve(0)
        }
        if (puck.y > H - PU && inGoalX) {
          as++; asEl.textContent = as
          if (as >= 5) return end(false)
          return serve(1)
        }
        // 顶底（非球门区）
        if (puck.y < PU) { puck.y = PU; puck.vy = Math.abs(puck.vy) }
        if (puck.y > H - PU) { puck.y = H - PU; puck.vy = -Math.abs(puck.vy) }
        // 球拍碰撞
        const hitPaddle = (pad, isPlayer) => {
          const dx = puck.x - pad.x, dy = puck.y - pad.y
          const d = Math.hypot(dx, dy)
          if (d < PR + PU && d > 0) {
            const sp = Math.hypot(puck.vx, puck.vy) + 3
            puck.vx = dx / d * sp
            puck.vy = dy / d * sp
            puck.x = pad.x + dx / d * (PR + PU)
            puck.y = pad.y + dy / d * (PR + PU)
          }
        }
        hitPaddle(px, true)
        hitPaddle(ai, false)
        // 限速
        const sp = Math.hypot(puck.vx, puck.vy)
        if (sp > 14) { puck.vx *= 14 / sp; puck.vy *= 14 / sp }
      }


      function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
      function cloud(x,y){box(x+8,y,32,8,'#fffbed');box(x,y+8,56,12,'#fffbed')}
      function sky(){box(0,0,cv.width,cv.height,'#b0dce4');cloud(28,55);cloud(cv.width-90,110);for(let i=0;i<8;i++){box(i*80,cv.height-90,65,90,'#c2d9a5');box(i*80+15,cv.height-106,35,16,'#c2d9a5')}box(0,cv.height-20,cv.width,20,'#8db685')}
      function disc(x,y,r,c){for(let yy=-r;yy<r;yy+=3){const xx=Math.floor(Math.sqrt(Math.max(0,r*r-yy*yy))/3)*3;box(x-xx,y+yy,xx*2,3,c)}}
      function kid(x,y){box(x+6,y,20,6,'#6b9162');box(x+4,y+6,24,18,'#ffdfaa');box(x+10,y+12,4,4,'#3d5647');box(x+20,y+12,4,4,'#3d5647');box(x+4,y+24,24,20,'#e88c5f');box(x+4,y+44,8,8,'#526f59');box(x+20,y+44,8,8,'#526f59')}
      function pine(x,y){box(x-4,y+12,8,16,'#95744b');box(x-12,y-22,24,10,'#86bda5');box(x-20,y-12,40,10,'#6ca08c');box(x-26,y-2,52,15,'#538574');box(x-10,y-22,16,5,'#f0fbef');box(x-18,y-12,26,5,'#f0fbef');box(x-24,y-2,34,5,'#f0fbef')}

      function draw(){box(0,0,W,H,'#d9eeea');for(let y=0;y<H;y+=40)for(let x=0;x<W;x+=40)box(x,y,40,40,(x+y)%80?'#d5e9e7':'#e5f2e8');box(7,12,W-14,H-24,'#def2ec');ctx.strokeStyle='#8ebbb4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H/2,50,0,Math.PI*2);ctx.stroke();for(let x=10;x<W;x+=18)box(x,H/2,10,3,'#8ebbb4');box(W/2-GW/2,0,GW,13,'#d8836d');box(W/2-GW/2,H-13,GW,13,'#5a9caf');disc(px.x,px.y,PR+3,'#477b80');disc(px.x,px.y-2,PR,'#7bb9c7');disc(px.x-4,px.y-6,12,'#b5e0df');disc(ai.x,ai.y,PR+3,'#a6664d');disc(ai.x,ai.y-2,PR,'#e39a79');disc(ai.x-4,ai.y-6,12,'#f3c8a0');disc(puck.x,puck.y,PU+2,'#405e57');disc(puck.x,puck.y-2,PU-1,'#f4d37f');ctx.font='bold 13px sans-serif';ctx.fillStyle='#6c9990';ctx.fillText('对手球门',W/2-26,36);ctx.fillText('你的球门',W/2-26,H-25);}

      let lastTick=null,lag=0
      function loop(t){requestAnimationFrame(loop);if(lastTick===null)lastTick=t;lag+=Math.min(100,Math.max(0,t-lastTick));lastTick=t;while(lag>=1000/60){if(running&&!over)step();lag-=1000/60}draw()}

      function toX(e) {
        const r = cv.getBoundingClientRect()
        return (e.clientX - r.left) * (W / r.width)
      }
      function movePaddle(e) {
        if (!running || over) return
        px.x = Math.max(PR, Math.min(W - PR, toX(e)))
        px.y = Math.max(H / 2 + 30, Math.min(H - PR, (e.clientY - cv.getBoundingClientRect().top) * (H / cv.getBoundingClientRect().height)))
      }
      cv.addEventListener('pointermove', movePaddle)
      cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);movePaddle(e)})
      cv.addEventListener('touchmove', (e) => {
        if (!running || over) return
        const r = cv.getBoundingClientRect()
        px.x = Math.max(PR, Math.min(W - PR, (e.touches[0].clientX - r.left) * (W / r.width)))
        px.y = Math.max(H / 2 + 30, Math.min(H - PR, (e.touches[0].clientY - r.top) * (H / r.height)))
      }, { passive: true })
      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return ps },
        get over() { return over },
        get started() { return running || over },
      }

      px = { x: W / 2, y: H - 80 }
      puck = { x: W / 2, y: H / 2, vx: 0, vy: 0 }
      ps = 0; as = 0; serving = 0; running = false; over = false
      ai.x = W / 2; ai.y = 70
    })()
  </script></body></html>
