<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>冰球对战</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:14px; font-weight:900; }
    #hud .me b { color:#5d84ff; margin-left:4px; }
    #hud .ai b { color:#ff4d5e; margin-right:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span class="ai">AI <b id="as">0</b></span>
      <span class="me"><b id="ps">0</b> 我</span>
    </div>
    <canvas id="cv" width="400" height="640"></canvas>
    <div id="overlay">
      <h1>🏒 冰球对战</h1>
      <p>移动鼠标 / 手指控制下方球拍<br/>冰球高速滑行、四壁反弹<br/>先攻进对方球门 5 次获胜</p>
      <button id="ov-btn">开始比赛</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const GW = 150, PR = 26, PU = 11
      const psEl = document.getElementById('ps')
      const asEl = document.getElementById('as')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let px, puck, ps, as, serving, running, over
      const ai = { x: W / 2, y: 70 }

      function start() {
        ps = 0; as = 0
        running = true; over = false
        psEl.textContent = 0; asEl.textContent = 0
        overlay.classList.add('hidden')
        serve(1)
      }

      function serve(toPlayer) {
        puck = { x: W / 2, y: H / 2, vx: 0, vy: 0 }
        px = { x: W / 2, y: H - 80 }
        ai.x = W / 2; ai.y = 70
        serving = 40
        puck.vx = (Math.random() - 0.5) * 3
        puck.vy = toPlayer ? 4 : -4
      }

      function end(playerWin) {
        running = false; over = true
        overlay.querySelector('h1').textContent = playerWin ? '🏆 你赢了' : '😡 AI 获胜'
        overlay.querySelector('p').innerHTML = '比分 <b style="color:#ffd23f">' + ps + '</b> : ' + as
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        if (serving > 0) { serving--; return }
        // AI 追球（限制在上半场）
        if (puck.y < H / 2) {
          ai.x += Math.max(-6, Math.min(6, puck.x - ai.x))
          ai.y += Math.max(-4, Math.min(4, puck.y + 40 - ai.y))
        } else {
          ai.x += Math.max(-3, Math.min(3, W / 2 - ai.x))
          ai.y += Math.max(-3, Math.min(3, 70 - ai.y))
        }
        ai.x = Math.max(PR, Math.min(W - PR, ai.x))
        ai.y = Math.max(60, Math.min(H / 2 - 30, ai.y))
        puck.x += puck.vx
        puck.y += puck.vy
        puck.vx *= 0.995; puck.vy *= 0.995
        // 侧壁
        if (puck.x < PU) { puck.x = PU; puck.vx = Math.abs(puck.vx) }
        if (puck.x > W - PU) { puck.x = W - PU; puck.vx = -Math.abs(puck.vx) }
        // 进球检测（上下开口）
        const inGoalX = puck.x > W / 2 - GW / 2 && puck.x < W / 2 + GW / 2
        if (puck.y < PU && inGoalX) {
          as++; asEl.textContent = as
          if (as >= 5) return end(false)
          return serve(1)
        }
        if (puck.y > H - PU && inGoalX) {
          ps++; psEl.textContent = ps
          if (ps >= 5) return end(true)
          return serve(0)
        }
        // 顶底（非球门区）
        if (puck.y < PU) { puck.y = PU; puck.vy = Math.abs(puck.vy) }
        if (puck.y > H - PU) { puck.y = H - PU; puck.vy = -Math.abs(puck.vy) }
        // 球拍碰撞
        const hitPaddle = (pad, isPlayer) => {
          const dx = puck.x - pad.x, dy = puck.y - pad.y
          const d = Math.hypot(dx, dy)
          if (d < PR + PU && d > 0) {
            const sp = Math.hypot(puck.vx, puck.vy) + 3
            puck.vx = dx / d * sp
            puck.vy = dy / d * sp
            puck.x = pad.x + dx / d * (PR + PU)
            puck.y = pad.y + dy / d * (PR + PU)
          }
        }
        hitPaddle(px, true)
        hitPaddle(ai, false)
        // 限速
        const sp = Math.hypot(puck.vx, puck.vy)
        if (sp > 14) { puck.vx *= 14 / sp; puck.vy *= 14 / sp }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        ctx.strokeStyle = '#2a3350'
        ctx.lineWidth = 2
        ctx.beginPath(); ctx.arc(W / 2, H / 2, 50, 0, Math.PI * 2); ctx.stroke()
        ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke()
        // 球门
        ctx.fillStyle = 'rgba(255,77,94,0.35)'
        ctx.fillRect(W / 2 - GW / 2, 0, GW, 8)
        ctx.fillStyle = 'rgba(93,132,255,0.35)'
        ctx.fillRect(W / 2 - GW / 2, H - 8, GW, 8)
        // 球拍
        ctx.fillStyle = '#5d84ff'
        ctx.beginPath(); ctx.arc(px.x, px.y, PR, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = '#ff4d5e'
        ctx.beginPath(); ctx.arc(ai.x, ai.y, PR, 0, Math.PI * 2); ctx.fill()
        // 冰球
        ctx.fillStyle = '#ffd23f'
        ctx.beginPath(); ctx.arc(puck.x, puck.y, PU, 0, Math.PI * 2); ctx.fill()
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      function toX(e) {
        const r = cv.getBoundingClientRect()
        return (e.clientX - r.left) * (W / r.width)
      }
      cv.addEventListener('pointermove', (e) => {
        if (!running || over) return
        px.x = Math.max(PR, Math.min(W - PR, toX(e.clientX)))
        px.y = Math.max(H / 2 + 30, Math.min(H - PR, (e.clientY - cv.getBoundingClientRect().top) * (H / cv.getBoundingClientRect().height)))
      })
      cv.addEventListener('touchmove', (e) => {
        if (!running || over) return
        const r = cv.getBoundingClientRect()
        px.x = Math.max(PR, Math.min(W - PR, (e.touches[0].clientX - r.left) * (W / r.width)))
        px.y = Math.max(H / 2 + 30, Math.min(H - PR, (e.touches[0].clientY - r.top) * (H / r.height)))
      }, { passive: true })
      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return ps },
        get over() { return over },
        get started() { return running },
      }

      px = { x: W / 2, y: H - 80 }
      puck = { x: W / 2, y: H / 2, vx: 0, vy: 0 }
      ps = 0; as = 0; serving = 0; running = false; over = false
      ai.x = W / 2; ai.y = 70
    })()
  </script>
</body>
</html>
