      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}



      let pxLast=0,pxAcc=0;
      function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
      function line(x,y,xx,yy,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}
      function disc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.fill()}
      function label(t,x,y,size=14,c='#566e65',align='left'){ctx.fillStyle=c;ctx.font='700 '+size+'px system-ui';ctx.textAlign=align;ctx.fillText(t,x,y);ctx.textAlign='left'}
      function panel(x,y,w,h,c='#e4c396',edge='#a58262'){box(x,y+4,w,h,edge);box(x,y,w,h,c);box(x+3,y+3,w-6,3,'#fff5d788');box(x+3,y+h-5,w-6,3,'#00000015')}
      function wood(x,y,w,h,c='#e8c799'){panel(x,y,w,h,c);for(let k=12;k<w;k+=27){box(x+k,y+6,1,h-12,'#cda57566');box(x+k+5,y+(k*7%Math.max(1,h-18))+6,9,2,'#d3b08466')}}
      function lawn(x,y,w,h){box(x,y,w,h,'#9bc58b');for(let r=0;r<h;r+=28)for(let c=0;c<w;c+=28)if((r+c)%56===0)box(x+c,y+r,28,28,'#a6cf97');for(let k=0;k<22;k++){let xx=x+(k*67)%Math.max(1,w-8),yy=y+(k*97)%Math.max(1,h-8);box(xx,yy,2,5,'#78aa76');box(xx+3,yy+2,2,3,'#78aa76')}}
      function bgSky(ground=H*.75){box(0,0,W,H,'#c1e4e0');for(let i=0;i<4;i++){let x=25+i*125,y=38+(i%2)*38;box(x,y,64,14,'#fff6dc');box(x+13,y-11,35,12,'#fff6dc')}for(let i=0;i<7;i++){box(i*82-20,ground-55-(i%3)*12,90,70,'#a9cdc0');box(i*82,ground-70-(i%3)*12,45,22,'#a9cdc0')}lawn(0,ground,W,H-ground);for(let i=0;i<6;i++){pxPaint('tree',i*93-20,ground-76,80)}for(let i=0;i<W;i+=26){box(i,ground-20,4,21,'#dac6a0')}box(0,ground-14,W,3,'#ead6b0');}
      function cosmos(){box(0,0,W,H,'#526a93');for(let i=0;i<65;i++){const x=(i*137+19)%W,y=(i*79+23)%H;box(x,y,i%5===0?3:2,i%5===0?3:2,i%3?'#b3c6d6':'#f9df9c')}disc(W-70,75,30,'#d3b8c4');box(W-84,57,12,8,'#b29eaf');box(W-66,81,16,8,'#b29eaf')}
      function targetArt(x,y,r){disc(x+2,y+4,r+3,'#9e876a');disc(x,y,r,'#fff1cf');disc(x,y,r*.72,'#df8f7d');disc(x,y,r*.43,'#fff1cf');disc(x,y,r*.18,'#a8ba81')}
      function marble(x,y,r,c='#79b4ba'){disc(x+1,y+2,r,'#719493');disc(x,y,r-1,c);disc(x-r*.3,y-r*.35,r*.27,'#fff9d8')}
      function meter(v,y=H-44){panel(24,y,W-48,14,'#ead7b4');box(27,y+3,(W-54)*Math.max(0,Math.min(1,v)),8,'#e8b66f')}
      function pointerKeys(entries){for(const[button,key]of entries){const b=document.getElementById(button);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);keys[key]=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[key]=false)}window.addEventListener('blur',()=>{keys={}})}

      let inv=0, transition=0;
      const T = 33, COLS = 14, ROWS = 12
      const W = COLS * T, H = ROWS * T
      const cv = document.getElementById('cv')
      cv.width = W; cv.height = H
      const ctx = cv.getContext('2d')
      const lvEl = document.getElementById('lv')
      const foesEl = document.getElementById('foes')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]
      let level, walls, bricks, player, foes, bombs, blasts, lives, kills, running, over, frame, bestKills
      let best = Number(localStorage.getItem('bomber-best') || 0)
      bestEl.textContent = best

      function genLevel(nv){level=nv;walls=Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,c)=>r===0||c===0||r===ROWS-1||c===COLS-1||r%2===0&&c%2===0?'#':Math.random()<.3?'B':'.'));for(const[r,c]of [[1,1],[1,2],[1,3],[2,1],[2,3],[3,1],[3,2],[3,3]])walls[r][c]='.';player={r:1,c:1};foes=[[ROWS-3,COLS-3],[1,COLS-3],[ROWS-3,1]].map(([r,c])=>{walls[r][c]='.';for(const[dx,dy]of DIRS)if(walls[r+dy]?.[c+dx]!=='#')walls[r+dy][c+dx]='.';return{r,c,dx:0,dy:1}});bombs=[];blasts=[];inv=90;transition=0;lvEl.textContent=nv;foesEl.textContent=foes.length;}

      function start(){pxLast=pxAcc=0;lives=2;kills=0;bestKills=0;running=true;over=false;frame=0;livesEl.textContent='♥♥';overlay.classList.add('hidden');genLevel(1)}

      function end(win) {
        running = false; over = true
        if (kills > best) { best = kills; bestEl.textContent = best; localStorage.setItem('bomber-best', best) }
        overlay.querySelector('h1').textContent = win ? '🏆 敌人清空' : '💀 被炸飞了'
        overlay.querySelector('p').innerHTML = '消灭 <b style="color:#ffd23f">' + kills + '</b> 个敌人 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function move(dx,dy){if(!running||over||transition)return;let r=player.r+dy,c=player.c+dx;if(walls[r]?.[c]!=='.'||bombs.some(b=>b.r===r&&b.c===c))return;player={r,c};damage()}

      function placeBomb() {
        if (!running || over || transition) return
        if (bombs.length >= 2) return
        if (bombs.some((b) => b.r === player.r && b.c === player.c)) return
        bombs.push({ r: player.r, c: player.c, t: 120 })
      }

      function explode(r,c){const cells=[[r,c]];for(const[dx,dy]of DIRS)for(let k=1;k<=2;k++){const nr=r+dy*k,nc=c+dx*k,t=walls[nr]?.[nc];if(!t||t==='#')break;cells.push([nr,nc]);if(t==='B'){walls[nr][nc]='.';break}}blasts.push({cells,t:18});for(const[br,bc]of cells){for(const b of bombs)if(b.r===br&&b.c===bc)b.t=0;const removed=foes.filter(f=>f.r===br&&f.c===bc).length;kills+=removed;foes=foes.filter(f=>f.r!==br||f.c!==bc)}foesEl.textContent=foes.length;damage();if(!foes.length&&!over&&!transition)transition=42;}

      function step(){frame++;if(inv>0)inv--;if(transition){if(--transition===0)genLevel(level+1);return}for(const b of bombs)b.t--;let due;while((due=bombs.find(b=>b.t<=0))){bombs.splice(bombs.indexOf(due),1);explode(due.r,due.c);if(over)return}blasts=blasts.filter(b=>--b.t>0);if(frame%22===0)for(const f of foes){for(let tries=0;tries<4;tries++){const d=DIRS[Math.floor(Math.random()*4)],r=f.r+d[1],c=f.c+d[0];if(walls[r]?.[c]==='.'&&!bombs.some(b=>b.r===r&&b.c===c)&&!foes.some(o=>o!==f&&o.r===r&&o.c===c)){f.r=r;f.c=c;break}}}for(const bl of blasts)for(const[r,c]of bl.cells){const removed=foes.filter(f=>f.r===r&&f.c===c).length;kills+=removed;foes=foes.filter(f=>f.r!==r||f.c!==c)}foesEl.textContent=foes.length;damage();if(!foes.length&&!over)transition=42;}

      function draw(){lawn(0,0,W,H);for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=c*T,y=r*T;if(walls[r][c]==='#'){box(x+1,y+3,T-2,T-3,'#5b8d70');box(x+2,y+1,T-4,T-7,'#9ac783');box(x+5,y+3,T-10,4,'#c7dd9e');box(x+T-7,y+12,4,8,'#7bab70');if((r*7+c)%9===0)pxPaint('flower',x+T-14,y+3,12)}else if(walls[r][c]==='B')pxPaint('crate',x+1,y+1,T-2);}for(const b of bombs){pxPaint('bomb',b.c*T+2,b.r*T+1,29);box(b.c*T+5,b.r*T+29,23,3,'#5e7764');box(b.c*T+5,b.r*T+29,23*b.t/120,3,b.t<40?'#f09b74':'#f6d77e')}for(const b of blasts)for(const[r,c]of b.cells){box(c*T+3,r*T+9,T-6,T-18,'#f3ac66');box(c*T+9,r*T+3,T-18,T-6,'#f3ac66');pxPaint('star',c*T+4,r*T+4,T-8)}for(const f of foes)pxPaint('robot',f.c*T+3,f.r*T+1,T-5);if(inv<=0||frame%10<7)pxPaint('bunny',player.c*T+2,player.r*T-1,T-3);if(transition){panel(W/2-90,H/2-24,180,45,'#fff1c8');label('花园清理完成！',W/2,H/2+4,16,'#547b61','center')}}

      function loop(t){requestAnimationFrame(loop);const now=Number.isFinite(t)?t:performance.now();if(!pxLast)pxLast=now;pxAcc+=Math.min(80,Math.max(0,now-pxLast));pxLast=now;while(pxAcc>=1000/60){pxAcc-=1000/60;if(running&&!over){step()}}draw()}

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(-1, 0)
        if (e.code === 'ArrowRight' || e.code === 'KeyD') move(1, 0)
        if (e.code === 'ArrowUp' || e.code === 'KeyW') move(0, -1)
        if (e.code === 'ArrowDown' || e.code === 'KeyS') move(0, 1)
        if (e.code === 'Space') { e.preventDefault(); if (!running && !overlay.classList.contains('hidden')) start(); else placeBomb() }
      })
      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return kills },
        get over() { return over },
        get started() { return running },
      }

      level = 1
      lives = 2; kills = 0; running = false; over = false; frame = 0
      genLevel(1)
    function damage(){if(inv>0||!running||over)return;const hit=foes.some(f=>f.r===player.r&&f.c===player.c)||blasts.some(b=>b.cells.some(([r,c])=>r===player.r&&c===player.c));if(hit){lives--;livesEl.textContent='♥'.repeat(Math.max(0,lives))||'—';if(!lives)return end(false);player={r:1,c:1};inv=90}}
for(const[id,dx,dy]of [['left',-1,0],['right',1,0],['up',0,-1],['down',0,1]])document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();move(dx,dy)});document.getElementById('bomb').addEventListener('pointerdown',e=>{e.preventDefault();placeBomb()});window.addEventListener('keydown',e=>{if(e.code.startsWith('Arrow'))e.preventDefault()});
})()
  </script>
</body>
</html>
