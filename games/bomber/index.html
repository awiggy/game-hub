<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>炸弹超人</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>关卡<b id="lv">1</b></span>
      <span>敌人<b id="foes">3</b></span>
      <span>命<b id="lives">♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="462" height="396"></canvas>
    <div id="overlay">
      <h1>💣 炸弹超人</h1>
      <p>方向键移动 · 空格放炸弹<br/>2 秒后十字方向爆炸<br/>炸碎砖墙消灭敌人，小心自己</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>
  <script>
    (() => {
      const T = 33, COLS = 14, ROWS = 12
      const W = COLS * T, H = ROWS * T
      const cv = document.getElementById('cv')
      cv.width = W; cv.height = H
      const ctx = cv.getContext('2d')
      const lvEl = document.getElementById('lv')
      const foesEl = document.getElementById('foes')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]
      let level, walls, bricks, player, foes, bombs, blasts, lives, kills, running, over, frame, bestKills
      let best = Number(localStorage.getItem('bomber-best') || 0)
      bestEl.textContent = best

      function genLevel(nv) {
        level = nv
        walls = Array.from({ length: ROWS }, () => Array(COLS).fill('#'))
        bricks = Array.from({ length: ROWS }, () => Array(COLS).fill(false))
        for (let r = 1; r < ROWS - 1; r++)
          for (let c = 1; c < COLS - 1; c++)
            if ((r + c) % 2 === 0) walls[r][c] = '#'
            else if (Math.random() < 0.32 && !(r < 3 && c < 3)) walls[r][c] = 'B'
        walls[0][0] = '.'; walls[0][1] = '.'; walls[1][0] = '.'
        player = { r: 0, c: 0 }
        foes = []
        for (let i = 0; i < 3; i++) {
          let r, c
          do {
            r = ROWS - 1 - ((Math.random() * 3) | 0)
            c = COLS - 1 - ((Math.random() * 3) | 0)
          } while (walls[r][c] !== '.')
          foes.push({ r, c, dx: 0, dy: 1 })
        }
        bombs = []; blasts = []
        lvEl.textContent = nv
        foesEl.textContent = foes.length
      }

      function start() {
        lives = lives || 2
        kills = kills || 0
        bestKills = bestKills || 0
        running = true; over = false; frame = 0
        livesEl.textContent = '♥'.repeat(lives)
        overlay.classList.add('hidden')
        genLevel(level || 1)
      }

      function end(win) {
        running = false; over = true
        if (kills > best) { best = kills; bestEl.textContent = best; localStorage.setItem('bomber-best', best) }
        overlay.querySelector('h1').textContent = win ? '🏆 敌人清空' : '💀 被炸飞了'
        overlay.querySelector('p').innerHTML = '消灭 <b style="color:#ffd23f">' + kills + '</b> 个敌人 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function move(dx, dy) {
        if (!running || over) return
        const nr = player.r + dy, nc = player.c + dx
        if (walls[nr][nc] === '#' || walls[nr][nc] === 'B') return
        if (bombs.some((b) => b.r === nr && b.c === nc)) return
        player.r = nr; player.c = nc
      }

      function placeBomb() {
        if (!running || over) return
        if (bombs.length >= 2) return
        if (bombs.some((b) => b.r === player.r && b.c === player.c)) return
        bombs.push({ r: player.r, c: player.c, t: 120 })
      }

      function explode(r, c) {
        const cells = [[r, c]]
        for (const [dx, dy] of DIRS) {
          for (let k = 1; k <= 2; k++) {
            const nr = r + dy * k, nc = c + dx * k
            if (walls[nr][nc] === '#') break
            cells.push([nr, nc])
            if (walls[nr][nc] === 'B') { walls[nr][nc] = '.'; break }
          }
        }
        blasts.push({ cells, t: 18 })
        // 伤害判定
        for (const [br, bc] of cells) {
          if (player.r === br && player.c === bc) {
            lives--
            livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
            if (lives <= 0) return end(false)
          }
          const foe = foes.find((f) => f.r === br && f.c === bc)
          if (foe) {
            foes.splice(foes.indexOf(foe), 1)
            kills++
            foesEl.textContent = foes.length
            if (!foes.length) {
              setTimeout(() => {
                if (running && !over) {
                  genLevel(level + 1)
                }
              }, 700)
            }
          }
        }
      }

      function step() {
        frame++
        // 炸弹倒计时
        for (let i = bombs.length - 1; i >= 0; i--) {
          bombs[i].t--
          if (bombs[i].t <= 0) {
            const b = bombs[i]
            bombs.splice(i, 1)
            explode(b.r, b.c)
          }
        }
        for (let i = blasts.length - 1; i >= 0; i--) {
          blasts[i].t--
          if (blasts[i].t <= 0) blasts.splice(i, 1)
        }
        // 敌人移动
        if (frame % 22 === 0) {
          for (const f of foes) {
            for (let tries = 0; tries < 4; tries++) {
              const d = (Math.random() * 4) | 0
              const nr = f.r + DIRS[d][1], nc = f.c + DIRS[d][0]
              if (walls[nr][nc] === '.' && !bombs.some((b) => b.r === nr && b.c === nc)) {
                f.r = nr; f.c = nc
                break
              }
            }
            // 碰到玩家
            if (f.r === player.r && f.c === player.c) {
              lives--
              livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
              if (lives <= 0) return end(false)
              player.r = 0; player.c = 0
            }
          }
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++) {
            const x = c * T, y = r * T
            if (walls[r][c] === '#') {
              ctx.fillStyle = '#3a4152'
              ctx.fillRect(x + 1, y + 1, T - 2, T - 2)
            } else if (walls[r][c] === 'B') {
              ctx.fillStyle = '#8a4a2a'
              ctx.fillRect(x + 2, y + 2, T - 4, T - 4)
            }
          }
        ctx.font = (T - 8) + 'px sans-serif'
        for (const b of bombs) {
          ctx.fillStyle = '#14161f'
          ctx.fillRect(b.c * T + 2, b.r * T + 2, T - 4, T - 4)
          ctx.fillStyle = '#ffd23f'
          ctx.fillText('💣', b.c * T + 4, b.r * T + T - 6)
        }
        for (const bl of blasts) {
          ctx.fillStyle = 'rgba(255,160,60,0.75)'
          for (const [r, c] of bl.cells) ctx.fillRect(c * T + 2, r * T + 2, T - 4, T - 4)
        }
        if (running && !over) ctx.fillText('🟢', player.c * T + 4, player.r * T + T - 6)
        for (const f of foes) ctx.fillText('👹', f.c * T + 4, f.r * T + T - 6)
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(-1, 0)
        if (e.code === 'ArrowRight' || e.code === 'KeyD') move(1, 0)
        if (e.code === 'ArrowUp' || e.code === 'KeyW') move(0, -1)
        if (e.code === 'ArrowDown' || e.code === 'KeyS') move(0, 1)
        if (e.code === 'Space') { e.preventDefault(); if (!running && !overlay.classList.contains('hidden')) start(); else placeBomb() }
      })
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return kills },
        get over() { return over },
        get started() { return running },
      }

      level = 1; walls = []; bricks = []
      player = { r: 0, c: 0 }; foes = []; bombs = []; blasts = []
      lives = 2; kills = 0; running = false; over = false; frame = 0
    })()
  </script>
</body>
</html>
