<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>吃豆小人</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #pads { position:absolute; bottom:8px; left:10px; right:10px; display:flex; justify-content:center; gap:10px; }
    #pads button { width:46px; height:40px; font-size:16px; font-weight:900; font-family:inherit;
      color:#eef1f6; background:rgba(26,29,41,.8); border:2px solid #2a2e3d; border-radius:8px; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>得分<b id="score">0</b></span>
      <span>关卡<b id="lv">1</b></span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="416" height="448"></canvas>
    <div id="pads">
      <button data-d="-1,0">←</button>
      <button data-d="0,-1">↑</button>
      <button data-d="0,1">↓</button>
      <button data-d="1,0">→</button>
    </div>
    <div id="overlay">
      <h1>🟡 吃豆小人</h1>
      <p>方向键 / 滑动 / 底部按钮 移动<br/>吃光所有豆子过关<br/>幽灵会追踪你，被碰 -1 命</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>
  <script>
    (() => {
      // 迷宫：# 墙 . 豆 空；13 列 x 14 行
      const MAP = [
        '#############',
        '#....#.#....#',
        '#.##.#.#.##.#',
        '#...........#',
        '#.##.#.#.##.#',
        '#....#...#..#',
        '####.#.####.#',
        '#...........#',
        '#.##.#.#.##.#',
        '#....#.#....#',
        '#############',
      ]
      const ROWS = MAP.length, COLS = MAP[0].length
      const T = 32
      const cv = document.getElementById('cv')
      cv.width = COLS * T; cv.height = ROWS * T
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const lvEl = document.getElementById('lv')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const DIRS = [[0,-1],[1,0],[0,1],[-1,0]] // 上右下左
      let dots, totalDots, px, py, pdx, pdy, want, ghosts, score, lives, level, running, over, frame, acc
      let best = Number(localStorage.getItem('minipac-best') || 0)
      bestEl.textContent = best

      function isWall(r, c) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true
        return MAP[r][c] === '#'
      }

      function start() {
        score = score || 0
        lives = lives || 3
        level = level || 1
        running = true; over = false; frame = 0; acc = 0
        scoreEl.textContent = score; livesEl.textContent = '♥'.repeat(lives); lvEl.textContent = level
        // 豆子
        dots = new Set()
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (MAP[r][c] === '.') dots.add(r + ',' + c)
        totalDots = dots.size
        px = 1; py = (ROWS / 2) | 0
        pdx = 1; pdy = 0; want = null
        ghosts = [
          { r: 1, c: COLS - 2, dx: -1, dy: 0, e: '👻' },
          { r: ROWS - 2, c: COLS - 2, dx: 0, dy: -1, e: '🟥' },
        ]
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('minipac-best', best) }
        overlay.querySelector('h1').textContent = '👻 被抓住了'
        overlay.querySelector('p').innerHTML = '得分 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function tryMove(dirIdx, obj) {
        const [dx, dy] = DIRS[dirIdx]
        const nr = obj.r + dy, nc = obj.c + dx
        if (!isWall(nr, nc)) { obj.r = nr; obj.c = nc; return true }
        return false
      }

      function step() {
        frame++
        acc++
        // 玩家每 6 帧走一格
        if (acc % Math.max(4, 7 - level) === 0) {
          if (want !== null) {
            const [dx, dy] = DIRS[want]
            if (!isWall(py + dy, px + dx)) { pdx = dx; pdy = dy }
          }
          const nr = py + pdy, nc = px + pdx
          if (!isWall(nr, nc)) { py = nr; px = nc }
          const key = py + ',' + px
          if (dots.has(key)) { dots.delete(key); score += 10; scoreEl.textContent = score }
          if (dots.size === 0) {
            level++
            lvEl.textContent = level
            return start()
          }
        }
        // 幽灵每 8 帧走一格
        if (acc % 8 === 0) {
          for (const g of ghosts) {
            // 追踪：优先选择缩短距离的方向，避免回头
            const opts = []
            for (let d = 0; d < 4; d++) {
              const nr = g.r + DIRS[d][1], nc = g.c + DIRS[d][0]
              if (isWall(nr, nc)) continue
              if (nr === g.r - g.dy && nc === g.c - g.dx && opts.length) continue
              opts.push(d)
            }
            if (opts.length) {
              let bd = 1e9, bi = opts[0]
              for (const d of opts) {
                const nr = g.r + DIRS[d][1], nc = g.c + DIRS[d][0]
                const dist = Math.abs(nr - py) + Math.abs(nc - px) + Math.random() * 2.5
                if (dist < bd) { bd = dist; bi = d }
              }
              g.dx = DIRS[bi][0]; g.dy = DIRS[bi][1]
              g.r += g.dy; g.c += g.dx
            }
          }
        }
        // 碰撞
        for (const g of ghosts) {
          if (g.r === py && g.c === px) {
            lives--
            livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
            if (lives <= 0) return end()
            px = 1; py = (ROWS / 2) | 0
            ghosts[0].r = 1; ghosts[0].c = COLS - 2
            ghosts[1].r = ROWS - 2; ghosts[1].c = COLS - 2
          }
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++) {
            if (isWall(r, c)) {
              ctx.fillStyle = '#22337a'
              ctx.fillRect(c * T + 2, r * T + 2, T - 4, T - 4)
            } else if (dots.has(r + ',' + c)) {
              ctx.fillStyle = '#ffd23f'
              ctx.beginPath(); ctx.arc(c * T + T / 2, r * T + T / 2, 3, 0, Math.PI * 2); ctx.fill()
            }
          }
        ctx.font = (T - 8) + 'px sans-serif'
        if (running && !over) ctx.fillText('🟡', px * T + 4, py * T + T - 6)
        for (const g of ghosts) ctx.fillText(g.e, g.c * T + 4, g.r * T + T - 6)
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      function queueDir(dx, dy) {
        if (!running || over) return
        want = DIRS.findIndex(([a, b]) => a === dx && b === dy)
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); queueDir(-1, 0) }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); queueDir(1, 0) }
        if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); queueDir(0, -1) }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); queueDir(0, 1) }
      })
      document.querySelectorAll('#pads button').forEach((b) => {
        const [dx, dy] = b.dataset.d.split(',').map(Number)
        b.addEventListener('pointerdown', (e) => { e.preventDefault(); queueDir(dx, dy) })
      })
      // 触屏滑动
      let tx = 0, ty = 0
      window.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY }, { passive: true })
      window.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty
        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return
        if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0)
        else queueDir(0, dy > 0 ? 1 : -1)
      }, { passive: true })
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      dots = new Set(); totalDots = 0
      px = 1; py = 5; pdx = 1; pdy = 0; want = null
      ghosts = []; score = 0; lives = 3; level = 1
      running = false; over = false; frame = 0; acc = 0
    })()
  </script>
</body>
</html>
