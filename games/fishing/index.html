<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>休闲钓鱼</title><style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;

    #wrap { width:min(92vw,420px); position:relative; display:flex; flex-direction:column; gap:12px; }

    #green { position:absolute; left:0; right:0; background:rgba(34,181,115,.3); border-top:2px solid #22b573; border-bottom:2px solid #22b573; }
    #marker { position:absolute; left:8%; right:8%; height:10px; background:var(--yellow); border-radius:5px; }
    #catch-bar { height:12px; background:#14161f; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; }
    #catch-fill { height:100%; width:0%; background:var(--blue); transition:width .1s; }
    #msg { text-align:center; font-size:14px; font-weight:900; min-height:20px; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

" y="40" width="4" height="4" fill="#55705c"/><rect x="44" y="40" width="4" height="4" fill="#55705c"/><rect x="48" y="40" width="4" height="4" fill="#55705c"/><rect x="68" y="40" width="4" height="4" fill="#55705c"/><rect x="72" y="40" width="4" height="4" fill="#55705c"/><path d="M12 64h76v5H12z" fill="#c2d9a5"/></svg>
    <h1>休闲钓鱼</h1>
    <p>自动抛竿，看到“咬钩了”点一下<br/>拉扯时按住升起、松开下落<br/>让标记停在绿区充满进度即钓到</p>
    <button id="ov-btn">开始钓鱼</button>
  </section></div><script>
    (() => {
      const bobber = document.getElementById('bobber')
      const splashEl = document.getElementById('splash')
      const zoneEl = document.getElementById('bar-zone')
      const greenEl = document.getElementById('green')
      const markerEl = document.getElementById('marker')
      const fillEl = document.getElementById('catch-fill')
      const msgEl = document.getElementById('msg')
      const scoreEl = document.getElementById('score')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const FISH = [
        { e: '🐟', v: 1, p: 0.55 },
        { e: '🐠', v: 2, p: 0.3 },
        { e: '🦐', v: 2, p: 0.1 },
        { e: '🦈', v: 5, p: 0.05 },
      ]

      let pending=null,biteTimer=null,reelFrames=0
      let phase, waitT, marker, markerV, greenPos, greenH, progress, fish, score, timeLeft, running, over, holding
      let best=0;try{best=Number(localStorage.getItem('fishing-best'))||0}catch{}
      bestEl.textContent = best

      function start() {
        clearTimeout(pending);clearTimeout(biteTimer);holding=false;score = 0; timeLeft = 60
        running = true; over = false
        scoreEl.textContent = 0; timeEl.textContent = '60s'
        overlay.classList.add('hidden')
        idle()
      }

      function idle() {
        if(!running||over)return
        phase = 'wait'
        holding=false;document.getElementById('reel-handle').textContent='等待咬钩…'
        waitT = 60 + Math.random() * 180
        bobber.style.top = '70px'
        splashEl.style.opacity = 0
        zoneEl.style.opacity = 0.25
        greenEl.style.height = '0'
        markerEl.style.display = 'none'
        fillEl.style.width = '0%'
        progress = 0
        msgEl.textContent = '等待鱼咬钩…'
      }

      function bite() {
        phase = 'bite'
        document.getElementById('reel-handle').textContent='咬钩了！点一下'
        bobber.style.top = '86px'
        splashEl.style.opacity = 1
        msgEl.textContent = '快点击！'
        biteTimer=setTimeout(() => { if (running&&!over&&phase === 'bite') idle() }, 1500)
      }

      function reel() {
        clearTimeout(biteTimer);reelFrames=0
        phase = 'reel'
        document.getElementById('reel-handle').textContent='按住上升 · 松开下降'
        splashEl.style.opacity = 0
        zoneEl.style.opacity = 1
        markerEl.style.display = 'block'
        marker = 50; markerV = 0; holding = false;progress=20
        greenH = 32 + Math.random() * 6
        greenPos = 25 + Math.random() * 15
        greenEl.style.height = greenH + '%'
        greenEl.style.top = greenPos + '%'
        const roll = Math.random()
        let acc = 0
        fish = FISH[0]
        for (const f of FISH) { acc += f.p; if (roll < acc) { fish = f; break } }
        msgEl.textContent = '稳住标记在绿区！'
      }

      function caught() {
        phase = 'idle'
        score += fish.v
        scoreEl.textContent = score
        msgEl.textContent = '钓到 ' + fish.e + ' +' + fish.v + '！'
        pending=setTimeout(idle, 700)
      }

      function escaped() {
        phase = 'idle'
        msgEl.textContent = '😮‍💨 鱼跑了'
        pending=setTimeout(idle, 600)
      }

      function step() {
        if (phase === 'wait') {
          waitT--
          if (waitT <= 0) bite()
        } else if (phase === 'reel') {
          reelFrames++
          markerV += holding ? -0.9 : 0.9
          markerV = Math.max(-2.6, Math.min(2.6, markerV))
          marker += markerV
          if (marker < 0) { marker = 0; markerV = 0 }
          if (marker > 100) { marker = 100; markerV = 0 }
          const inGreen = marker >= greenPos && marker <= greenPos + greenH
          progress += inGreen ? 1.1 : -0.8
          progress = Math.max(0, Math.min(100, progress))
          fillEl.style.width = progress + '%'
          markerEl.style.top = 'calc(' + marker + '% - 5px)'
          if (progress >= 100) caught()
          else if (progress <= 0 && reelFrames > 90) escaped()
        }
      }

      function press() {
        if (!running || over) {
          if (!overlay.classList.contains('hidden')) start()
          return
        }
        if (phase === 'wait') return
        else if (phase === 'bite') reel()
        else if (phase === 'reel') holding = true
      }
      function unpress() { holding = false }

      let lastT = 0,fishLag=0
      function loop(t) {
        requestAnimationFrame(loop)
        if (!lastT) lastT = t
        const dt = Math.min(60, t - lastT)
        lastT = t
        if (running && !over) {
          timeLeft -= dt / 1000
          timeEl.textContent = Math.max(0, Math.ceil(timeLeft)) + 's'
          if (timeLeft <= 0) {
            running = false; over = true
            if (score > best) { best = score; bestEl.textContent = best; (()=>{try{localStorage.setItem('fishing-best',best)}catch{}})() }
            overlay.querySelector('h1').textContent = '🌙 收竿了'
            overlay.querySelector('p').innerHTML = '渔获价值 <b >' + score + '</b> · 最佳 ' + best
            ovBtn.textContent = '再钓一场'
            overlay.classList.remove('hidden')
            return
          }
          fishLag+=dt;while(fishLag>=1000/60){step();fishLag-=1000/60}
        }
      }

      window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); if(!e.repeat)press() } })
      window.addEventListener('keyup', (e) => { if (e.code === 'Space') unpress() })
      document.getElementById('pond').addEventListener('pointerdown', (e) => { e.preventDefault(); press() })
      zoneEl.addEventListener('pointerdown', (e) => { e.preventDefault(); press() })
      window.addEventListener('pointerup', unpress)
      document.getElementById('reel-handle').addEventListener('pointerdown',e=>{e.preventDefault();press()})
      window.addEventListener('pointercancel',unpress)
      window.addEventListener('blur',unpress)
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running || over },
      }

      phase = 'idle'; score = 0; timeLeft = 60; running = false; over = false
      requestAnimationFrame(loop)
    })()
  </script></body></html>
