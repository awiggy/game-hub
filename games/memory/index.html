<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>记忆翻牌</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; touch-action: manipulation; overflow: hidden;
    }
    #bar {
      width: min(92vw, 380px);
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: #8b93a7; letter-spacing: 1px;
    }
    #bar b { color: var(--yellow); font-size: 16px; margin-left: 4px; }
    #board {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      width: min(92vw, 380px);
    }
    .card {
      aspect-ratio: 3 / 4; border: 2px solid #2a2e3d; border-radius: 10px;
      background: linear-gradient(135deg, #2a3350, #1a1d29);
      font-size: clamp(24px, 7vw, 34px);
      display: grid; place-items: center; cursor: pointer; color: transparent;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .card.open { color: #fff; background: var(--blue); border-color: #5d84ff; }
    .card.matched { color: #fff; background: var(--yellow); border-color: var(--yellow); cursor: default; }
    #overlay {
      position: fixed; inset: 0; background: rgba(15, 17, 24, 0.88);
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; line-height: 1.9; }
    #overlay button {
      background: var(--blue); color: #fff; font-family: inherit;
      border: 2px solid #fff; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      font-size: 16px; font-weight: 700; padding: 10px 32px; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="bar">
    <span>步数<b id="moves">0</b></span>
    <span>配对<b id="pairs">0/8</b></span>
    <span>TIME<b id="time">0s</b></span>
    <span>BEST<b id="best">—</b></span>
  </div>
  <div id="board"></div>
  <div id="overlay">
    <h1>记忆翻牌</h1>
    <p>8 对图案藏在 16 张牌下<br />两两配对，步数越少越强</p>
    <button id="ov-btn">开始游戏</button>
  </div>

  <script>
    (() => {
      const EMOJIS = ['🎮', '🚀', '🧩', '⚽', '🎲', '🕹️', '🎯', '🍬']
      const boardEl = document.getElementById('board')
      const movesEl = document.getElementById('moves')
      const pairsEl = document.getElementById('pairs')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let deck, open, lock, matched, moves, seconds, timer, over
      let best = Number(localStorage.getItem('memory-best') || 0)
      if (best) bestEl.textContent = best

      function startGame() {
        deck = [...EMOJIS, ...EMOJIS]
          .map((e) => ({ e }))
          .sort(() => Math.random() - 0.5)
        open = []; lock = false; matched = 0; moves = 0; seconds = 0; over = false
        movesEl.textContent = 0
        pairsEl.textContent = '0/8'
        timeEl.textContent = '0s'
        clearInterval(timer)
        overlay.classList.add('hidden')
        render()
      }

      function render() {
        boardEl.innerHTML = ''
        deck.forEach((card, i) => {
          const el = document.createElement('button')
          el.className = 'card'
          el.textContent = card.e
          if (card.open) el.classList.add(card.matched ? 'matched' : 'open')
          el.addEventListener('click', () => flip(i))
          boardEl.appendChild(el)
        })
      }

      function flip(i) {
        if (over || lock || deck[i].open) return
        deck[i].open = true
        open.push(i)
        render()

        if (open.length < 2) return
        const [a, b] = open
        moves++
        movesEl.textContent = moves
        if (deck[a].e === deck[b].e) {
          deck[a].matched = deck[b].matched = true
          matched++
          pairsEl.textContent = matched + '/8'
          open = []
          render()
          if (matched === 8) win()
        } else {
          lock = true
          setTimeout(() => {
            deck[a].open = deck[b].open = false
            open = []
            lock = false
            render()
          }, 700)
        }
      }

      function win() {
        over = true
        clearInterval(timer)
        const isBest = !best || moves < best
        if (isBest) { best = moves; bestEl.textContent = best; localStorage.setItem('memory-best', best) }
        overlay.querySelector('h1').textContent = '🏆 配对完成'
        overlay.querySelector('p').innerHTML =
          '用时 ' + seconds + ' 秒 · <b style="color:#ffd23f">' + moves + '</b> 步' +
          (isBest ? ' · 新纪录！' : '（最少 ' + best + ' 步）')
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      ovBtn.addEventListener('click', startGame)

      window.__hub = {
        get score() { return 100 - moves },
        get over() { return over },
        get started() { return deck && deck.some((c) => c.open || c.matched) },
      }

      startGame()
      clearInterval(timer)
      timer = setInterval(() => {
        if (!over && (moves > 0 || open.length > 0)) {
          seconds++
          timeEl.textContent = seconds + 's'
        }
      }, 1000)
    })()
  </script>
</body>
</html>
