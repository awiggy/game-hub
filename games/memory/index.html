<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>记忆翻牌</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; touch-action: manipulation; overflow: hidden;
    }
    #bar {
      width: min(92vw, 380px);
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: #8b93a7; letter-spacing: 1px;
    }
    #bar b { color: var(--yellow); font-size: 16px; margin-left: 4px; }
    #board {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      width: min(92vw, 380px);
    }
    .card {
      aspect-ratio: 3 / 4; border: 2px solid #2a2e3d; border-radius: 10px;
      background: linear-gradient(135deg, #2a3350, #1a1d29);
      font-size: clamp(24px, 7vw, 34px);
      display: grid; place-items: center; cursor: pointer; color: transparent;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .card.open { color: #fff; background: var(--blue); border-color: #5d84ff; }
    .card.matched { color: #fff; background: var(--yellow); border-color: var(--yellow); cursor: default; }
    #overlay {
      position: fixed; inset: 0; background: rgba(15, 17, 24, 0.88);
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; line-height: 1.9; }
    #overlay button {
      background: var(--blue); color: #fff; font-family: inherit;
      border: 2px solid #fff; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      font-size: 16px; font-weight: 700; padding: 10px 32px; border-radius: 8px; cursor: pointer;
    }

    /* Crafted pixel edition: the playable pieces, not just the surrounding UI. */
    :root{--ink:#48533d;--accent:#4e854d;--paper:#fff9e7;--edge:#6f9250;--page:#edf2d9}
    body{background:var(--page);color:var(--ink);background-image:radial-gradient(#ffffff70 1px,transparent 1px);background-size:12px 12px;overflow:auto;min-height:100%;height:auto;padding:24px 12px;gap:10px}
    body::before{content:'';position:fixed;inset:0;box-shadow:inset 0 0 100px #ffffff70;pointer-events:none;z-index:-1}
    button{font-family:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #d26c48;outline-offset:3px}
    #wrap{flex-shrink:0;max-width:100%}
    #hud,#bar{position:static;color:var(--ink);letter-spacing:0;font-size:11px;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 4px}
    #hud b,#bar b{color:var(--accent);font-size:17px}canvas{image-rendering:pixelated;border:4px solid var(--edge);border-radius:8px;box-shadow:0 5px 0 color-mix(in srgb,var(--edge),transparent 55%);background:var(--paper);max-width:100%;object-fit:contain}
    #overlay{z-index:20;background:color-mix(in srgb,var(--paper) 96%,transparent);color:var(--ink);border-radius:12px;gap:12px;padding:22px}
    #overlay::before{content:'';width:90px;height:90px;background:var(--mascot) center/contain no-repeat;image-rendering:pixelated}
    #overlay h1,#overlay h2{font-size:25px;letter-spacing:1px;text-shadow:none;color:var(--ink)}
    #overlay p{color:var(--ink);font-size:13px;line-height:1.9;max-width:340px}#overlay p b{color:var(--accent)!important}
    #overlay button,#new-game,#bar button,#pads button,.up,.garden-controls button{background:var(--accent);color:#fffaf0;border:2px solid var(--ink);box-shadow:0 3px 0 #0002;border-radius:7px;font-weight:800;cursor:pointer}
    #overlay button:hover{filter:brightness(1.1)}#overlay.hidden{display:none}
    .pixel-sprite{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
    .scene-title{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:5px}
    .scene-title strong{font-size:23px;letter-spacing:1px;display:block}.scene-title small{display:block;font-size:11px;line-height:1.8;letter-spacing:1px;color:var(--accent)}
    .scene-title svg{width:54px;height:54px;flex-shrink:0}.play-note{font-size:11px;text-align:center;color:var(--ink);line-height:1.7;margin-top:9px}
    .landscape{height:92px;position:relative;overflow:hidden;border-radius:10px 10px 0 0;background:linear-gradient(#a9dfdf 0 63%,#b7d878 63% 71%,#82b65e 71%);border:3px solid var(--edge);border-bottom:0}
    .landscape::before{content:'';position:absolute;left:15%;top:18px;width:40px;height:8px;background:#fffcec;box-shadow:8px -6px #fffcec,170px 5px #fffcec,178px -1px #fffcec}
    .landscape svg{position:absolute;bottom:0;width:76px;height:76px}.landscape svg:nth-child(2){left:2%;width:52px;height:52px}.landscape svg:nth-child(3){right:4%;width:44px;height:44px}.landscape svg:nth-child(4){right:15%;width:32px;height:32px}
    @media(max-width:480px){body{padding:14px 10px}.scene-title strong{font-size:20px}#hud b,#bar b{font-size:15px}.landscape{height:74px}.scene-title svg{width:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--page:#f9e7e0;--ink:#805a58;--accent:#be776f;--edge:#c99388;--paper:#fff6e4;--mascot:url("data:image/svg+xml,%3Csvg%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2032%2032%22%20class%3D%22pixel-sprite%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%228%22%20y%3D%221%22%20width%3D%226%22%20height%3D%2212%22%20fill%3D%22%238c7974%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%220%22%20width%3D%226%22%20height%3D%2213%22%20fill%3D%22%238c7974%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%222%22%20width%3D%224%22%20height%3D%2211%22%20fill%3D%22%23fffbed%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%221%22%20width%3D%224%22%20height%3D%2212%22%20fill%3D%22%23fffbed%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%224%22%20width%3D%222%22%20height%3D%227%22%20fill%3D%22%23e7a09b%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%223%22%20width%3D%222%22%20height%3D%228%22%20fill%3D%22%23e7a09b%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%2211%22%20width%3D%2219%22%20height%3D%2220%22%20fill%3D%22%238c7974%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2214%22%20width%3D%2225%22%20height%3D%2214%22%20fill%3D%22%238c7974%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2211%22%20width%3D%2215%22%20height%3D%2218%22%20fill%3D%22%23f9eacb%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%2214%22%20width%3D%2221%22%20height%3D%2212%22%20fill%3D%22%23f9eacb%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2210%22%20width%3D%2215%22%20height%3D%227%22%20fill%3D%22%23fffbed%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%2214%22%20width%3D%224%22%20height%3D%227%22%20fill%3D%22%23fffbed%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2221%22%20width%3D%2210%22%20height%3D%228%22%20fill%3D%22%23fffdf2%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2224%22%20width%3D%2216%22%20height%3D%222%22%20fill%3D%22%23fffdf2%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2216%22%20width%3D%222%22%20height%3D%223%22%20fill%3D%22%23332f36%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2216%22%20width%3D%222%22%20height%3D%223%22%20fill%3D%22%23332f36%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2216%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23fffdf0%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2216%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23fffdf0%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2220%22%20width%3D%223%22%20height%3D%222%22%20fill%3D%22%23f4998a%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%2220%22%20width%3D%223%22%20height%3D%222%22%20fill%3D%22%23f4998a%22%2F%3E%3Crect%20x%3D%2215%22%20y%3D%2220%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%238f4d48%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2224%22%20width%3D%226%22%20height%3D%222%22%20fill%3D%22%238a534b%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2224%22%20width%3D%222%22%20height%3D%223%22%20fill%3D%22%23fff8e4%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%2226%22%20width%3D%225%22%20height%3D%224%22%20fill%3D%22%23fffbed%22%2F%3E%3Crect%20x%3D%2226%22%20y%3D%2226%22%20width%3D%224%22%20height%3D%224%22%20fill%3D%22%23fffbed%22%2F%3E%3C%2Fsvg%3E")}
.scene-title,#bar{width:min(390px,94vw)}#board{width:min(390px,94vw);gap:9px;padding:12px;background:#e9cbbb;border:3px solid #c99388;border-radius:10px;box-shadow:0 5px #c9938855}.card{aspect-ratio:1;position:relative;background:repeating-conic-gradient(#eaa799 0% 25%,#f5c4ae 0% 50%) 0 0/12px 12px;border:3px solid #fff5dc;border-radius:7px;box-shadow:0 3px #b47c6b;color:transparent;overflow:hidden}.card::after{content:"✿";position:absolute;font-size:27px;color:#fff6d7;text-shadow:0 2px #c08a73}.card svg{width:86%;height:86%;visibility:hidden}.card.open,.card.matched{background:#fff4d7;border-color:#fef9e9}.card.open svg,.card.matched svg{visibility:visible}.card.open::after,.card.matched::after{display:none}.card.matched{background:#e8efc9;border-color:#b7c997;box-shadow:0 3px #91a678}.card.matched::before{content:"✓";position:absolute;right:4px;top:1px;font-size:12px;color:#4e804b}.card:hover{transform:translateY(-2px)}

/* Compact landscape retains readable boards beside their controls. */
@media(min-width:600px) and (max-height:550px){body{padding:12px;gap:8px}.play-note{margin:0}body{display:grid;grid-template-columns:210px auto;grid-template-rows:1fr auto 1fr;gap:8px 24px;align-items:center;justify-content:center;height:100dvh;padding:14px}.scene-title{grid-column:1;align-self:end;width:210px}#bar{grid-column:1;width:210px;justify-content:flex-start;gap:14px}#board{grid-column:2;grid-row:1/4;width:min(340px,calc(100dvh - 32px));height:auto}.play-note{grid-column:1;align-self:start;width:210px}}
@media(max-width:480px){body{padding:12px 10px}.play-note{margin-top:3px;font-size:10px}.scene-title{margin-bottom:0}.scene-title small{letter-spacing:.5px}}
  </style>
</head>

    <h1>记忆翻牌</h1>

  <p class="play-note">翻开两张牌，找到相同的小伙伴 · 配成一对会留下绿色小勾</p>
  <script>

          r(14,2,4,28,'#47606b');r(2,14,28,4,'#47606b');r(6,6,20,20,'#47606b');round(7,7,18,18,'#6e8e97');r(10,9,6,4,'#c1d9cf');face(11,16);
        } else if(kind==='crate') {
          r(2,4,28,26,'#865637');r(4,5,24,22,'#d29b58');r(6,8,20,17,'#b77b46');r(7,9,18,3,'#e8b56b');r(7,16,18,2,'#e8b56b');r(4,5,3,22,'#f3c986');r(25,5,3,22,'#ad713f');r(5,5,22,3,'#ffe0a0');r(5,24,22,3,'#e4b06a');r(6,6,2,2,'#805b3d');r(24,25,2,2,'#805b3d');r(14,13,6,5,'#f1a13f');r(15,18,3,3,'#f1a13f');r(15,10,2,4,'#5f974f');r(17,10,4,2,'#9dc968');
        } else if(kind==='hedge') {
          r(1,5,30,27,'#376e4c');r(2,3,28,25,'#4b9550');r(5,1,22,26,'#75b44f');r(8,2,12,5,'#b9d663');r(4,8,8,5,'#a3ce5a');r(18,5,10,5,'#92c250');r(7,16,12,6,'#8fc352');r(21,16,8,6,'#447e45');r(4,24,11,4,'#467d43');r(21,11,3,3,'#d0e478');r(13,10,3,3,'#c0db69');r(15,25,8,3,'#64a34a');
        } else if(kind==='barn') {
          for(let i=0;i<6;i++)r(15-i*2,2+i*2,2+i*4,3,'#5c656c');r(6,14,23,17,'#9d4843');r(7,14,20,15,'#df775c');for(let i=9;i<27;i+=4)r(i,15,1,14,'#f59973');r(5,14,25,2,'#ffecbc');r(12,20,11,11,'#ffe8b4');r(14,21,7,10,'#975645');r(17,21,1,10,'#ffdb9e');r(14,23,7,1,'#ffdb9e');r(15,12,6,6,'#ffecbc');r(16,13,4,4,'#6aa7b5');
        } else if(kind==='cookie') {
          round(4,4,24,24,'#986334');round(5,4,22,21,'#e6ac57');r(8,6,16,13,'#f9ce7b');r(9,7,9,2,'#ffe6a3');for(const [x,y] of [[10,11],[21,10],[17,18],[8,21]]){r(x,y,3,3,'#8f5a41');r(x,y,2,1,'#bc8650');}
        }
        return a;
      }
      function sprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pixels(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function paint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pixels(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}

      const EMOJIS = ['apple', 'chick', 'bunny', 'carrot', 'flower', 'berry', 'mushroom', 'mole']
      const boardEl = document.getElementById('board')
      const movesEl = document.getElementById('moves')
      const pairsEl = document.getElementById('pairs')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let flipTimer = 0
      let deck, open, lock, matched, moves, seconds, timer, over
      let best = Number(localStorage.getItem('memory-best') || 0)
      if (best) bestEl.textContent = best

      function startGame() {
        deck = [...EMOJIS, ...EMOJIS]
          .map((e) => ({ e }))
          .sort(() => Math.random() - 0.5)
        open = []; lock = false; matched = 0; moves = 0; seconds = 0; over = false
        movesEl.textContent = 0
        pairsEl.textContent = '0/8'
        timeEl.textContent = '0s'
        clearInterval(timer); clearTimeout(flipTimer)
        timer = setInterval(() => { if (!over && (moves > 0 || open.length > 0)) { seconds++; timeEl.textContent = seconds + 's' } }, 1000)
        overlay.classList.add('hidden')
        render()
      }

      function render() {
        boardEl.innerHTML = ''
        deck.forEach((card, i) => {
          const el = document.createElement('button')
          el.className = 'card'
          el.innerHTML = sprite(card.e)
          el.setAttribute('aria-label', card.open ? ({apple:'苹果',chick:'小鸟',bunny:'兔子',carrot:'胡萝卜',flower:'花朵',berry:'蓝莓',mushroom:'蘑菇',mole:'地鼠'}[card.e]) + (card.matched ? '，已配对' : '') : '未翻开的牌 ' + (i + 1))
          if (card.open) el.classList.add(card.matched ? 'matched' : 'open')
          el.addEventListener('click', () => flip(i))
          boardEl.appendChild(el)
        })
      }

      function flip(i) {
        if (over || lock || deck[i].open) return
        deck[i].open = true
        open.push(i)
        render()

        if (open.length < 2) return
        const [a, b] = open
        moves++
        movesEl.textContent = moves
        if (deck[a].e === deck[b].e) {
          deck[a].matched = deck[b].matched = true
          matched++
          pairsEl.textContent = matched + '/8'
          open = []
          render()
          if (matched === 8) win()
        } else {
          lock = true
          flipTimer = setTimeout(() => {
            deck[a].open = deck[b].open = false
            open = []
            lock = false
            render()
          }, 700)
        }
      }

      function win() {
        over = true
        clearInterval(timer)
        const isBest = !best || moves < best
        if (isBest) { best = moves; bestEl.textContent = best; localStorage.setItem('memory-best', best) }
        overlay.querySelector('h1').textContent = '🏆 配对完成'
        overlay.querySelector('p').innerHTML =
          '用时 ' + seconds + ' 秒 · <b style="color:#ffd23f">' + moves + '</b> 步' +
          (isBest ? ' · 新纪录！' : '（最少 ' + best + ' 步）')
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      ovBtn.addEventListener('click', startGame)

      window.__hub = {
        get score() { return 100 - moves },
        get over() { return over },
        get started() { return deck && deck.some((c) => c.open || c.matched) },
      }

      startGame()
    })()
  </script>
</body>
