<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>乒乓快打</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>回合胜<b id="score">0</b></span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="520" height="440"></canvas>
    <div id="overlay">
      <h1>🏓 乒乓快打</h1>
      <p>鼠标 / ↑↓ / 滑动 控制左侧球拍<br/>球速逐回合加快，AI 有反应极限<br/>漏球 -1 命，共 3 命</p>
      <button id="ov-btn">开始比赛</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const PH = 76
      const scoreEl = document.getElementById('score')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let py, ay, ball, score, lives, rally, running, over, targetY
      let best = Number(localStorage.getItem('tabletennis-best') || 0)
      bestEl.textContent = best

      function serve(dir) {
        ball = { x: W / 2, y: H / 2, vx: 4.6 * dir, vy: (Math.random() * 3 - 1.5), }
      }

      function start() {
        py = H / 2; ay = H / 2
        score = 0; lives = 3; rally = 0
        running = true; over = false
        scoreEl.textContent = 0; livesEl.textContent = '♥♥♥'
        serve(1)
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('tabletennis-best', best) }
        overlay.querySelector('h1').textContent = '🏁 比赛结束'
        overlay.querySelector('p').innerHTML = '赢下 <b style="color:#ffd23f">' + score + '</b> 个回合 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        // 玩家拍跟随
        py += (targetY - py) * 0.3
        py = Math.max(PH / 2, Math.min(H - PH / 2, py))
        // AI 拍
        const aiSpeed = Math.min(4.2 + rally * 0.12, 6.4)
        const dy = ball.y - ay
        ay += Math.max(-aiSpeed, Math.min(aiSpeed, dy * 0.2))
        ay = Math.max(PH / 2, Math.min(H - PH / 2, ay))
        // 球
        ball.x += ball.vx
        ball.y += ball.vy
        if (ball.y < 8) { ball.y = 8; ball.vy = Math.abs(ball.vy) }
        if (ball.y > H - 8) { ball.y = H - 8; ball.vy = -Math.abs(ball.vy) }
        // 玩家击球
        if (ball.vx < 0 && ball.x < 34 && ball.x > 22 && Math.abs(ball.y - py) < PH / 2 + 8) {
          ball.vx = Math.abs(ball.vx) * 1.03
          ball.vy += (ball.y - py) * 0.12
          rally++
        }
        // AI 击球
        if (ball.vx > 0 && ball.x > W - 34 && ball.x < W - 22 && Math.abs(ball.y - ay) < PH / 2 + 8) {
          ball.vx = -Math.abs(ball.vx) * 1.03
          ball.vy += (ball.y - ay) * 0.12
        }
        // 得失分
        if (ball.x > W + 12) {
          score++
          scoreEl.textContent = score
          serve(-1)
        } else if (ball.x < -12) {
          lives--
          livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
          if (lives <= 0) return end()
          serve(1)
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        ctx.setLineDash([6, 8])
        ctx.strokeStyle = '#2a2e3d'
        ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke()
        ctx.setLineDash([])
        ctx.fillStyle = '#5d84ff'
        ctx.fillRect(22, py - PH / 2, 8, PH)
        ctx.fillStyle = '#ff4d5e'
        ctx.fillRect(W - 30, ay - PH / 2, 8, PH)
        ctx.fillStyle = '#ffd23f'
        ctx.beginPath(); ctx.arc(ball.x, ball.y, 6, 0, Math.PI * 2); ctx.fill()
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      function toGameY(clientY) {
        const r = cv.getBoundingClientRect()
        return (clientY - r.top) * (H / r.height)
      }
      cv.addEventListener('pointermove', (e) => { targetY = toGameY(e.clientY) })
      let ty = 0, touching = false
      cv.addEventListener('touchstart', (e) => { touching = true; ty = e.touches[0].clientY }, { passive: true })
      cv.addEventListener('touchmove', (e) => {
        if (!touching) return
        targetY += (e.touches[0].clientY - ty) * (H / cv.getBoundingClientRect().height)
        ty = e.touches[0].clientY
      }, { passive: true })
      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowUp' || e.code === 'KeyW') targetY = py - 42
        if (e.code === 'ArrowDown' || e.code === 'KeyS') targetY = py + 42
      })
      ovBtn.addEventListener('click', start)
      targetY = H / 2

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      py = H / 2; ay = H / 2; score = 0; lives = 3; rally = 0; running = false; over = false
      serve(1)
      loop()
    })()
  </script>
</body>
</html>
