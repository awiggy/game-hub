  <title>彩球分装</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:min(92vw,460px); display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board { width:min(92vw,460px); height:min(48vh,340px); display:flex; justify-content:center; gap:12px; align-items:flex-end; }
    .tube {
      width:44px; height:100%; border:3px solid #3a4152; border-bottom:0;
      border-radius:0 0 14px 14px; background:rgba(26,29,41,.8); cursor:pointer;
      display:flex; flex-direction:column-reverse; align-items:center; padding-bottom:4px; gap:3px;
      position:relative;
    }
    .tube.sel { border-color:var(--yellow); box-shadow:0 0 12px rgba(255,210,63,.4); }
    .tube .ball { width:32px; height:32px; border-radius:50%; border:2px solid rgba(0,0,0,.35); }
    .tube .hold { position:absolute; top:-40px; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

  <div id="wrap">

        }
        if(kind==='jar'){
          r(8,3,16,4,'#9b7664');r(8,3,16,2,'#e5c59b');r(6,8,20,21,'#7b9e98');r(7,8,18,19,'#cce5d6');r(9,10,3,13,'#fff7de');r(12,16,9,9,'#e4a17e');r(14,14,6,9,'#f9c690');r(14,16,2,2,'#fff0c2');r(8,27,16,2,'#a7c7b5');
        }
        return a;
      }
      function pxSprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pxRects(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}


      const CAP = 4
      const COLORS = ['#ed9a9b', '#efc46e', '#99c5a1', '#91becf', '#bca2d5']
      const boardEl = document.getElementById('board')
      const lvEl = document.getElementById('lv')
      const movesEl = document.getElementById('moves')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let busy=false, pending=0, history=[], initial=[], generationSolution=[]
      let tubes, sel, moves, level, totalMoves, running, over
      let best = Number(localStorage.getItem('ballsort-best') || 0)
      if (best) bestEl.textContent = best

      function genLevel(nColors) {
        const t=Array.from({length:nColors},(_,i)=>Array(CAP).fill(i));t.push([],[])
        const reverse=[];let last=null
        for(let k=0;k<42;k++){
          const options=[]
          for(let from=0;from<t.length;from++){
            const a=t[from];if(!a.length||a.length>1&&a.at(-1)!==a.at(-2))continue
            for(let to=0;to<t.length;to++)if(from!==to&&t[to].length<CAP&&!(last&&from===last[1]&&to===last[0]))options.push([from,to])
          }
          if(!options.length)break
          const[from,to]=options[Math.floor(Math.random()*options.length)];t[to].push(t[from].pop());reverse.push([to,from]);last=[from,to]
        }
        if(t.every(a=>!a.length||done(a))) {
          t[0]=[0,0,0,1];t[1]=[1,1,1,0];for(let c=2;c<nColors;c++)t[c]=Array(CAP).fill(c);t[nColors]=[];t[nColors+1]=[]
          generationSolution=[[0,nColors],[1,0],[nColors,1]]
        } else generationSolution=reverse.reverse()
        return t
      }

      function load(nv) {
        level = nv
        tubes = genLevel(3 + nv); initial=tubes.map(t=>[...t]); history=[]; busy=false
        sel = -1
        moves = 0
        lvEl.textContent = (nv + 1) + '/3'
        movesEl.textContent = 0
        render()
      }

      function start() {
        clearTimeout(pending);busy=false
        totalMoves = 0
        running = true; over = false
        overlay.classList.add('hidden')
        load(0)
      }

      function done(t) {
        return t.length === CAP && t.every((b) => b === t[0])
      }

      function checkWin() {
        if (!tubes.every((t) => t.length === 0 || done(t))) return false
        if (level === 2) {
          running = false; over = true
          const score = Math.max(100, 1500 - totalMoves * 5)
          if (!best || score > best) { best = score; bestEl.textContent = best; localStorage.setItem('ballsort-best', best) }
          overlay.querySelector('h1').textContent = '🧪 全部分装完成'
          overlay.querySelector('p').innerHTML = '总步数 ' + totalMoves + ' · 得分 <b style="color:#ffd23f">' + score + '</b>'
          ovBtn.textContent = '再来一局'
          overlay.classList.remove('hidden')
        } else {
          msg('✓ 过关！')
          busy=true; pending=setTimeout(() => load(level + 1), 700)
        }
        return true
      }

      function msg(t) {
        lvEl.textContent = (level + 1) + '/3 · ' + t
        setTimeout(() => { lvEl.textContent = (level + 1) + '/3' }, 650)
      }

      function click(i) {
        if (!running || over || busy) return
        if (sel === -1) {
          if (!tubes[i].length) return
          sel = i
          render()
          return
        }
        if (sel === i) { sel = -1; render(); return }
        const from = tubes[sel], to = tubes[i]
        const ball = from[from.length - 1]
        if (to.length < CAP && (to.length === 0 || to[to.length - 1] === ball)) {
          history.push({tubes:tubes.map(t=>[...t]),moves,totalMoves})
          to.push(from.pop())
          moves++; totalMoves++
          movesEl.textContent = moves
          sel = -1
          render()
          checkWin()
        } else {
          sel = -1
          render()
        }
      }

      function render() {
        boardEl.innerHTML = ''
        tubes.forEach((t, i) => {
          const el = document.createElement('button')
          el.setAttribute('aria-label','糖豆瓶 '+(i+1));el.dataset.label=String(i+1)
          el.className = 'tube' + (i === sel ? ' sel' : '')
          el.onclick = () => click(i)
          t.forEach((b, j) => {
            const d = document.createElement('div')
            d.className = 'ball' + (i === sel && j === t.length - 1 ? ' hold' : '')
            d.style.background = COLORS[b];d.dataset.symbol=['♥','●','✿','◆','★'][b]
            el.appendChild(d)
          })
          boardEl.appendChild(el)
        })
      }

      document.getElementById('undo').onclick=()=>{if(!running||over||busy||!history.length)return;const prev=history.pop();tubes=prev.tubes;moves=prev.moves;totalMoves=prev.totalMoves;sel=-1;movesEl.textContent=moves;render()}
      document.getElementById('retry').onclick=()=>{if(!running||over||busy)return;tubes=initial.map(t=>[...t]);sel=-1;moves=0;history=[];movesEl.textContent=0;render()}
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return Math.max(100, 1500 - totalMoves * 5) },
        get over() { return over },
        get started() { return running || over },
      }

      tubes = [[0, 1, 2, 0], [1, 0, 2, 1], [2, 0, 1, 2], [], []]
      sel = -1; moves = 0; level = 0; totalMoves = 0; running = false; over = false
      render()
    })()
  </script>
</body>
