  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:min(92vw,440px); display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board { display:grid; gap:2px; background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:8px; }
    .clue { display:flex; align-items:flex-end; justify-content:flex-end; gap:2px; font-size:11px; font-weight:900; color:#8b93a7; padding:2px; }
    .cell {
      aspect-ratio:1; border-radius:4px; background:#14161f; border:2px solid #2a3350; cursor:pointer;
    }
    .cell.on { background:var(--blue); border-color:#5d84ff; }
    .cell.bad { background:#ff4d5e; border-color:#c22739; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

/* Storybook pixel edition: authored game pieces and material-rich playfields. */
:root{--paper:#fff4e0;--ink:#795b69;--edge:#b48e9f;--accent:#795b69;--blue:#795b69;--yellow:#c48a37}

%22%20fill%3D%22%239e6676%22%2F%3E%3Crect%20x%3D%2223%22%20y%3D%2228%22%20width%3D%227%22%20height%3D%222%22%20fill%3D%22%239e6676%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%222%22%20width%3D%222%22%20height%3D%229%22%20fill%3D%22%23917c60%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%222%22%20width%3D%226%22%20height%3D%222%22%20fill%3D%22%23d4b68b%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}#overlay h1{font-size:25px;text-shadow:none;letter-spacing:1px}#overlay p{font-size:13px;color:var(--ink);line-height:1.9;max-width:360px}#overlay p b{color:var(--ink)!important}#overlay.hidden{display:none}#overlay button,.story-controls button,#shuffle{font:700 13px system-ui;color:var(--paper);background:var(--ink);border:2px solid var(--edge);border-radius:7px;box-shadow:0 3px #0002;padding:10px 18px;cursor:pointer}
button{font-family:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #cb875d;outline-offset:2px}.story-note{font-size:11px;line-height:1.8;text-align:center;width:100%;margin:2px 0;color:var(--ink)}.story-controls{display:flex;gap:8px;justify-content:center}.story-controls button{padding:8px 12px}.story-controls button:disabled{opacity:.5}.scene-strip{position:relative;height:72px;overflow:hidden;border:3px solid var(--edge);border-bottom:0;background:linear-gradient(#b4dfda 0 65%,#abc979 65%);border-radius:8px 8px 0 0;margin-bottom:-10px}.scene-strip svg{position:absolute;bottom:0;width:65px;height:65px}.scene-strip svg:nth-child(1){left:5%}.scene-strip svg:nth-child(2){left:43%}.scene-strip svg:nth-child(3){right:3%}
@media(max-width:480px){body{padding:12px 10px}.scene-head h2{font-size:19px}.scene-head svg{width:44px;height:44px}.scene-head small{letter-spacing:1px}#wrap{gap:8px}#hud b{font-size:15px}.story-note{font-size:10px}.scene-strip{height:56px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

#board{width:100%;aspect-ratio:1;gap:5px;padding:14px;background:repeating-linear-gradient(0deg,#ecdcc4 0 3px,#f1e2cc 3px 5px);border:8px solid #b88d6c;border-top-color:#d6b18d;border-left-color:#d6b18d;border-radius:20px}.clue{color:#836371;font-size:14px;align-items:center;justify-content:center;background:#f9ecd8;border-radius:4px;min-width:30px}.cell{position:relative;background:#fff5e0;border:1px dashed #c6af98;border-radius:3px;min-width:0}.cell.on{background:#d7a0a7;border-color:#b9788a}.cell.on::before,.cell.on::after{content:'';position:absolute;width:75%;height:4px;left:12%;top:45%;background:#f8d4c8;transform:rotate(45deg);box-shadow:0 2px #af7286}.cell.on::after{transform:rotate(-45deg)}.cell.bad{background:#d9957e}.scene-strip{background:repeating-conic-gradient(#ead4cf 0% 25%,#f5e6d8 0% 50%) 0 0/20px 20px}

      function pxSprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pxRects(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}


      // 三关 5x5 隐藏图案（人工设计，行/列提示由程序生成）
      const PATTERNS = [
        [
          '.....',
          '.###.',
          '.#.#.',
          '.###.',
          '.....',
        ],
        [
          '#...#',
          '##.##',
          '#####',
          '.###.',
          '..#..',
        ],
        [
          '..#..',
          '.###.',
          '#####',
          '.###.',
          '..#..',
        ],
      ]
      const boardEl = document.getElementById('board')
      const lvEl = document.getElementById('lv')
      const wrongEl = document.getElementById('wrong')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const N = 5
      let busy=false,pending=0
      let level, solution, marks, wrongs, running, over
      let best = Number(localStorage.getItem('picross-best') || 0)
      if (best) bestEl.textContent = best

      function clueOf(line) {
        const runs = []
        let n = 0
        for (const ch of line) {
          if (ch === '#') n++
          else if (n) { runs.push(n); n = 0 }
        }
        if (n) runs.push(n)
        return runs.length ? runs : [0]
      }

      function load(nv) {
        level = nv
        solution = PATTERNS[nv].map((row) => row.split(''))
        marks = Array.from({ length: N }, () => Array(N).fill(false))
        busy=false
        wrongEl.textContent = wrongs
        lvEl.textContent = (nv + 1) + '/3'
        render()
      }

      function start() {
        clearTimeout(pending);wrongs=0;busy=false
        running = true; over = false
        overlay.classList.add('hidden')
        load(0)
      }

      function rowClue(r) { return clueOf(solution[r].join('')) }
      function colClue(c) { return clueOf(solution.map((row) => row[c]).join('')) }

      function check() {
        // 涂满的格子与答案完全一致即胜
        for (let r = 0; r < N; r++)
          for (let c = 0; c < N; c++)
            if (marks[r][c] !== (solution[r][c] === '#')) return
        if (level === PATTERNS.length - 1) {
          running = false; over = true
          const score = Math.max(100, 900 - wrongs * 30)
          if (!best || score > best) { best = score; bestEl.textContent = best; localStorage.setItem('picross-best', best) }
          overlay.querySelector('h1').textContent = '🟦 三关全部解出'
          overlay.querySelector('p').innerHTML = '涂错 ' + wrongs + ' 次 · 得分 <b style="color:#ffd23f">' + score + '</b>'
          ovBtn.textContent = '再来一局'
          overlay.classList.remove('hidden')
        } else {
          msg('✓ 过关！')
          busy=true;pending=setTimeout(() => load(level + 1), 700)
        }
      }

      function msg(t) {
        lvEl.textContent = (level + 1) + '/3 · ' + t
        setTimeout(() => { lvEl.textContent = (level + 1) + '/3' }, 650)
      }

      function render() {
        boardEl.innerHTML = ''
        boardEl.style.gridTemplateColumns = 'auto repeat(' + N + ',1fr)'
        boardEl.style.gridTemplateRows = 'auto repeat(' + N + ',1fr)'
        // 空角
        boardEl.appendChild(document.createElement('div'))
        // 列提示
        for (let c = 0; c < N; c++) {
          const el = document.createElement('div')
          el.className = 'clue'
          el.style.flexDirection = 'column'
          el.innerHTML = colClue(c).map((n) => '<span>' + n + '</span>').join('')
          boardEl.appendChild(el)
        }
        for (let r = 0; r < N; r++) {
          // 行提示
          const el = document.createElement('div')
          el.className = 'clue'
          el.innerHTML = rowClue(r).map((n) => '<span>' + n + '</span>').join('')
          boardEl.appendChild(el)
          for (let c = 0; c < N; c++) {
            const cell = document.createElement('button')
            cell.setAttribute('aria-label','第 '+(r+1)+' 行第 '+(c+1)+' 列')
            cell.className = 'cell' + (marks[r][c] ? ' on' : '') + (marks[r][c] && solution[r][c] !== '#' ? ' bad' : '')
            cell.onclick = () => {
              if (!running || over || busy) return
              marks[r][c] = !marks[r][c]
              const isWrong = marks[r][c] && solution[r][c] !== '#'
              if (isWrong) { wrongs++; wrongEl.textContent = wrongs }
              render()
              check()
            }
            boardEl.appendChild(cell)
          }
        }
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return Math.max(100, 900 - wrongs * 30) },
        get over() { return over },
        get started() { return running || over },
      }

      level = 0; solution = PATTERNS[0].map((row) => row.split(''))
      marks = Array.from({ length: N }, () => Array(N).fill(false))
      wrongs = 0; running = false; over = false
      render()
    })()
  </script>
