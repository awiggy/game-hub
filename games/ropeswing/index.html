<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>荡绳飞跃</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>平台<b id="score">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="520" height="560"></canvas>
    <div id="overlay">
      <h1>🕸️ 荡绳飞跃</h1>
      <p>角色抓绳摆动（自动）<br/>摆到高处松手飞向下一平台<br/>掉下悬崖即结束</p>
      <button id="ov-btn">开始飞跃</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const GROUND = H - 40
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      // 世界随角色前移滚动
      let plats, idx, wx, phase, ang, angDir, vx, vy, guy, running, over, frame
      let best = Number(localStorage.getItem('ropeswing-best') || 0)
      bestEl.textContent = best

      const ROPE = 170

      function newPlat(dist) {
        const last = plats[plats.length - 1]
        return { x: last.x + dist, w: 90 + Math.random() * 50, y: 0 }
      }

      function start() {
        plats = [{ x: 0, w: 130 }]
        for (let i = 0; i < 6; i++) plats.push(newPlat(230 + Math.random() * 90))
        idx = 0; wx = 0
        phase = 'swing'
        ang = -0.9; angDir = 1
        vx = 0; vy = 0
        guy = { x: 0, y: GROUND - 20 }
        running = true; over = false; frame = 0
        scoreEl.textContent = 0
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (idx > best) { best = idx; bestEl.textContent = best; localStorage.setItem('ropeswing-best', best) }
        overlay.querySelector('h1').textContent = '😱 掉下去了'
        overlay.querySelector('p').innerHTML = '飞跃 <b style="color:#ffd23f">' + idx + '</b> 个平台 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function release() {
        if (!running || over || phase !== 'swing') return
        // 切向速度 = 角速度 × 绳长
        const spd = 7.2
        vx = Math.cos(ang) * spd * angDir
        vy = Math.sin(ang) * spd
        // 向上分量补偿：让摆动高处释放有较大上升
        vy -= Math.abs(ang) * 3.4
        phase = 'fly'
        guy.x += Math.cos(ang) * 8 * angDir
      }

      function step() {
        frame++
        if (phase === 'swing') {
          ang += angDir * 0.032
          if (ang > 0.95) { ang = 0.95; angDir = -1 }
          if (ang < -0.95) { ang = -0.95; angDir = 1 }
        } else if (phase === 'fly') {
          vy += 0.3
          wx += vx
          guy.x += vx
          guy.y += vy
          const p = plats[idx + 1]
          if (p && guy.y >= GROUND - p.y && vy > 0) {
            // 落点判定
            const worldX = guy.x
            if (worldX > p.x + 8 && worldX < p.x + p.w - 8) {
              idx++
              scoreEl.textContent = idx
              guy.y = GROUND - 20
              plats.push(newPlat(230 + Math.random() * 90))
              phase = 'swing'
              ang = -0.6; angDir = 1
            } else return end()
          }
          if (guy.y > H + 30) return end()
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        // 悬崖底
        ctx.fillStyle = '#10121a'
        ctx.fillRect(0, GROUND + 24, W, H - GROUND)
        // 平台（世界坐标 → 屏幕）
        const anchorX = plats[idx].x + plats[idx].w / 2
        for (const p of plats) {
          const sx = p.x - wx
          if (sx + p.w < -50 || sx > W + 50) continue
          ctx.fillStyle = '#2f55e4'
          ctx.beginPath(); ctx.roundRect(sx, GROUND - p.y, p.w, 26, 6); ctx.fill()
        }
        // 绳 + 角色在摆动相位
        if (phase === 'swing') {
          const ax = anchorX - wx + 0, ay = 30
          const gx = ax + Math.sin(ang) * ROPE
          const gy = ay + Math.cos(ang) * ROPE
          ctx.strokeStyle = '#8b93a7'
          ctx.lineWidth = 2
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(gx, gy); ctx.stroke()
          ctx.font = '30px sans-serif'
          ctx.fillText('🧗', gx - 14, gy + 10)
        } else {
          ctx.font = '30px sans-serif'
          ctx.fillText('🧗', guy.x - wx - 14, guy.y)
        }
        // 下一平台标记
        const next = plats[idx + 1]
        if (next) {
          const sx = next.x - wx + next.w / 2
          ctx.fillStyle = '#ffd23f'
          ctx.font = '700 12px sans-serif'
          ctx.fillText('↓ 目标', sx - 18, GROUND - next.y - 34)
        }
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault()
          if (!running && !overlay.classList.contains('hidden')) start()
          else release()
        }
      })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); release() })
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return idx },
        get over() { return over },
        get started() { return running },
      }

      plats = [{ x: 0, w: 130 }]
      idx = 0; wx = 0; phase = 'swing'
      ang = -0.9; angDir = 1; vx = 0; vy = 0
      guy = { x: 0, y: GROUND - 20 }
      running = false; over = false; frame = 0
    })()
  </script>
</body>
</html>
