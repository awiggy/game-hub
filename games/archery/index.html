<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>百步穿杨</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>环数<b id="score">0</b></span>
      <span>剩余<b id="left">10</b>箭</span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="560" height="420"></canvas>
    <div id="overlay">
      <h1>🏹 百步穿杨</h1>
      <p>← → 调角度 · 按住蓄力 · 松开放箭<br/>注意顶部风向与靶距<br/>10 支箭打出最高总环数</p>
      <button id="ov-btn">开始射箭</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const G = 0.22
      const scoreEl = document.getElementById('score')
      const leftEl = document.getElementById('left')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let angle, power, powerDir, charging, wind, dist, arrows, score, flying, running, over, flyResult
      let best = Number(localStorage.getItem('archery-best') || 0)
      bestEl.textContent = best

      function newRound() {
        dist = 320 + Math.random() * 180
        wind = ((Math.random() * 7) | 0) - 3
        flying = null
      }

      function start() {
        angle = 45; power = 0; powerDir = 1; charging = false
        arrows = 10; score = 0; running = true; over = false
        scoreEl.textContent = 0; leftEl.textContent = 10
        newRound()
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('archery-best', best) }
        overlay.querySelector('h1').textContent = '🏁 射击结束'
        overlay.querySelector('p').innerHTML = '总环数 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function shoot() {
        const rad = angle * Math.PI / 180
        const v = 8 + power / 100 * 8
        flying = {
          x: 56, y: H - 52,
          vx: Math.cos(rad) * v, vy: -Math.sin(rad) * v,
        }
      }

      function step() {
        if (charging) {
          power += powerDir * 2.2
          if (power >= 100) { power = 100; powerDir = -1 }
          if (power <= 0) { power = 0; powerDir = 1 }
        }
        if (!flying) return
        flying.vy += G
        flying.vx += wind * 0.012
        flying.x += flying.vx
        flying.y += flying.vy
        // 靶心
        const tx = 56 + dist, ty = H - 52
        const d = Math.hypot(flying.x - tx, flying.y - ty)
        if (d < 78) {
          const pts = d < 14 ? 10 : d < 28 ? 8 : d < 44 ? 6 : d < 60 ? 4 : 2
          score += pts
          scoreEl.textContent = score
          flyResult = pts ? '+' + pts + ' 环！' : '脱靶'
          flyResult = '+' + pts + ' 环！'
          next()
        } else if (flying.y > H - 40 || flying.x > W + 20) {
          flyResult = '脱靶…'
          next()
        }
      }

      function next() {
        flying = null
        arrows--
        leftEl.textContent = arrows
        if (arrows <= 0) end()
        else newRound()
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = '#1a1d29'
        ctx.fillRect(0, H - 40, W, 40)
        // 风向
        ctx.font = '700 13px sans-serif'
        ctx.fillStyle = '#8b93a7'
        ctx.fillText('风：', 14, 26)
        for (let i = 0; i < Math.abs(wind); i++) {
          ctx.fillStyle = '#5d84ff'
          ctx.fillText(wind > 0 ? '→' : '←', 48 + i * 16, 26)
        }
        // 靶
        const tx = 56 + dist, ty = H - 52
        const rings = [['#eef1f6', 78], ['#14161f', 60], ['#5d84ff', 44], ['#ff4d5e', 28], ['#ffd23f', 14]]
        for (const [c, r] of rings) {
          ctx.fillStyle = c
          ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2); ctx.fill()
        }
        // 弓箭手
        ctx.font = '30px sans-serif'
        ctx.fillText('🏹', 30, H - 40)
        // 角度与蓄力
        ctx.fillStyle = '#eef1f6'
        ctx.font = '700 13px sans-serif'
        ctx.fillText('角度 ' + angle + '°', 14, 48)
        if (charging) {
          ctx.fillStyle = '#2a2e3d'; ctx.fillRect(14, 56, 90, 10)
          ctx.fillStyle = '#ffd23f'; ctx.fillRect(14, 56, 90 * power / 100, 10)
        }
        // 飞行中的箭
        if (flying) {
          ctx.strokeStyle = '#ffd23f'
          ctx.lineWidth = 3
          ctx.beginPath()
          ctx.moveTo(flying.x, flying.y)
          ctx.lineTo(flying.x - flying.vx * 2.2, flying.y + flying.vy * 2.2)
          ctx.stroke()
        }
        // 轨迹预览
        if (!flying && running && !over) {
          const rad = angle * Math.PI / 180
          const v = 8 + power / 100 * 8
          let px = 56, py = H - 52, vx = Math.cos(rad) * v, vy = -Math.sin(rad) * v
          ctx.fillStyle = 'rgba(255,210,63,0.3)'
          for (let i = 0; i < 40; i++) {
            vy += G; vx += wind * 0.012; px += vx; py += vy
            if (i % 3 === 0) ctx.fillRect(px, py, 3, 3)
          }
        }
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => {
        if (!running || over) {
          if (e.code === 'Space' && !overlay.classList.contains('hidden')) start()
          return
        }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { angle = Math.max(15, angle - 2) }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { angle = Math.min(75, angle + 2) }
        if (e.code === 'Space') {
          e.preventDefault()
          if (!flying && !charging) { charging = true; power = 0; powerDir = 1 }
        }
      })
      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' && running && !over && charging && !flying) { charging = false; shoot() }
      })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); if (running && !over && !flying && !charging) { charging = true; power = 0; powerDir = 1 } })
      window.addEventListener('pointerup', () => { if (running && !over && charging && !flying) { charging = false; shoot() } })
      cv.addEventListener('pointermove', (e) => {
        if (!running || over) return
        const r = cv.getBoundingClientRect()
        const x = (e.clientX - r.left) * (W / r.width)
        angle = Math.max(15, Math.min(75, Math.round(Math.atan2(H - 52 - (e.clientY - r.top) * (H / r.height), x - 56) * 180 / Math.PI)))
      })
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      angle = 45; power = 0; powerDir = 1; charging = false
      arrows = 10; score = 0; running = false; over = false; flying = null
      newRound()
    })()
  </script>
</body>
</html>
