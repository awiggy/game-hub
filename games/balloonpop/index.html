<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戳气球</title><style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

:root{color-scheme:light;--blue:#5a9678;--yellow:#c57b3f;--ink:#345647;--muted:#71836b;--paper:#fffbed;--edge:#648d73;--floor:#edf2da}
*{box-sizing:border-box}html,body{height:auto;min-height:100%}body{margin:0;min-height:100svh;overflow:auto;display:grid;grid-template-columns:100%;place-items:center;background:radial-gradient(ellipse at 12% 10%,#fff1d4,transparent 70%),var(--floor);color:var(--ink);font-family:system-ui,-apple-system,'PingFang SC',sans-serif;touch-action:manipulation}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #da8054;outline-offset:2px}.shell{width:min(850px,calc(100% - 28px));padding:12px 0;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.top small,.side small{font:9px ui-monospace,monospace;letter-spacing:2px;color:var(--muted)}.top h1{font-size:22px;letter-spacing:2px;margin:3px 0 0}.tag{font-size:10px;padding:7px 10px;border:1px solid #c6d5b4;background:var(--paper);white-space:nowrap}.layout{display:flex;align-items:center;justify-content:center;gap:26px}#wrap{position:relative;width:min(440px,calc(100% - 196px));max-width:none;gap:10px;flex:none}#hud{position:static;width:100%;display:flex;gap:5px;justify-content:space-between;font-size:10px;color:var(--muted);margin:0 0 9px}#hud>span{flex:1;white-space:nowrap;padding:6px;background:var(--paper);border:1px solid #c6d5b4;box-shadow:0 2px 0 #d7dfbc}#hud b{font:700 16px ui-monospace,monospace;color:#b76c40;margin-left:4px}canvas{display:block;width:100%;height:auto;max-width:100%;max-height:none;image-rendering:pixelated;border:4px solid var(--edge);border-radius:0;background:#b6e0e3;box-shadow:0 5px 0 #365a43;touch-action:none}.side{width:170px;flex:none}.side svg{position:static;width:100%;height:110px;image-rendering:pixelated}.side h2{font-size:24px;line-height:1.5;margin:10px 0}.side p{font-size:12px;line-height:1.9;color:var(--muted);margin:8px 0}.side .tips{padding-top:12px;margin-top:18px;border-top:1px solid #cad6b7;font-size:11px}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:9px;color:var(--muted)}#msg{color:#59745f;font-size:12px;font-weight:500;text-align:center;line-height:1.6}#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:#eaf1d6ed;border-radius:0;gap:0}#overlay.hidden{display:none}.intro-card{width:min(360px,100%);padding:20px;text-align:center;border:3px solid var(--edge);background:var(--paper);box-shadow:6px 6px 0 #31523e30}.intro-card svg{display:block;position:static;width:140px;height:86px;margin:0 auto 6px;image-rendering:pixelated}#overlay h1{font-size:24px;letter-spacing:2px;text-shadow:none;margin:8px 0}#overlay p{font-size:12px;line-height:1.9;color:#718068;margin:0 0 17px}#overlay b{color:#c57546}#overlay button,.action{background:#e98255;color:#fffbed;border:2px solid #a55d3c;border-radius:0;box-shadow:0 4px 0 #a65c3b;font-weight:800;font-size:15px;padding:10px 24px;cursor:pointer}.action:active{transform:translateY(2px)}
@media(max-width:620px){.shell{width:calc(100% - 24px);padding:10px 0}.top{margin-bottom:9px}.top h1{font-size:18px}.top small{font-size:8px;letter-spacing:1px}.tag{font-size:9px;padding:5px 7px}.layout{display:block}.side{display:none}#wrap{margin:auto;width:min(100%,400px)}#hud{gap:4px}#hud>span{padding:5px 4px}#hud b{font-size:14px;margin-left:3px}.foot{font-size:8px;gap:8px;margin-top:12px}.foot span:last-child{display:none}#overlay h1{font-size:21px}.intro-card{padding:14px}.intro-card svg{height:66px}#overlay p{font-size:11px}}
@media(max-height:480px){.shell{padding:8px 0}.top{margin-bottom:8px}.top h1{font-size:18px}.side svg{height:55px}.side h2{font-size:20px}.side .tips{display:none}.intro-card{padding:12px 16px}.intro-card svg{height:48px}#overlay h1{font-size:21px;margin:6px 0}#overlay p{font-size:11px;margin-bottom:12px}#overlay button{padding:8px 20px}.foot{margin-top:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#wrap{width:min(420px,calc((100svh - 165px)*0.7),calc(100% - 196px))}@media(max-width:620px){#wrap{width:min(100%,calc((100svh - 150px)*0.7))}}</style></head><body><main class="shell"><header class="top"><div><small>BALLOON PICNIC</small><h1>戳气球</h1></div><span class="tag">气球野餐会</span></header><div class="layout">
  <div id="wrap">
    <div id="hud">

    <canvas id="cv" width="420" height="600"></canvas>

  </div>
  <aside class="side"><svg viewBox="0 0 100 74" shape-rendering="crispEdges" aria-hidden="true"><rect x="36" y="8" width="4" height="4" fill="#e78368"/><rect x="40" y="8" width="4" height="4" fill="#e78368"/><rect x="44" y="8" width="4" height="4" fill="#e78368"/><rect x="48" y="8" width="4" height="4" fill="#e78368"/><rect x="28" y="12" width="4" height="4" fill="#e78368"/><rect x="32" y="12" width="4" height="4" fill="#e78368"/><rect x="36" y="12" width="4" height="4" fill="#e78368"/><rect x="40" y="12" width="4" height="4" fill="#e78368"/><rect x="44" y="12" width="4" height="4" fill="#e78368"/><rect x="48" y="12" width="4" height="4" fill="#e78368"/><rect x="52" y="12" width="4" height="4" fill="#e78368"/><rect x="56" y="12" width="4" height="4" fill="#e78368"/><rect x="24" y="16" width="4" height="4" fill="#e78368"/><rect x="28" y="16" width="4" height="4" fill="#e78368"/><rect x="32" y="16" width="4" height="4" fill="#ffdca3"/><rect x="36" y="16" width="4" height="4" fill="#ffdca3"/><rect x="40" y="16" width="4" height="4" fill="#e78368"/><rect x="44" y="16" width="4" height="4" fill="#e78368"/><rect x="48" y="16" width="4" height="4" fill="#e78368"/><rect x="52" y="16" width="4" height="4" fill="#e78368"/><rect x="56" y="16" width="4" height="4" fill="#e78368"/><rect x="60" y="16" width="4" height="4" fill="#e78368"/><rect x="24" y="20" width="4" height="4" fill="#e78368"/><rect x="28" y="20" width="4" height="4" fill="#e78368"/><rect x="32" y="20" width="4" height="4" fill="#ffdca3"/><rect x="36" y="20" width="4" height="4" fill="#ffdca3"/><rect x="40" y="20" width="4" height="4" fill="#e78368"/><rect x="44" y="20" width="4" height="4" fill="#e78368"/><rect x="48" y="20" width="4" height="4" fill="#e78368"/><rect x="52" y="20" width="4" height="4" fill="#e78368"/><rect x="56" y="20" width="4" height="4" fill="#e78368"/><rect x="60" y="20" width="4" height="4" fill="#e78368"/><rect x="24" y="24" width="4" height="4" fill="#e78368"/><rect x="28" y="24" width="4" height="4" fill="#e78368"/><rect x="32" y="24" width="4" height="4" fill="#e78368"/><rect x="36" y="24" width="4" height="4" fill="#e78368"/><rect x="40" y="24" width="4" height="4" fill="#e78368"/><rect x="44" y="24" width="4" height="4" fill="#e78368"/><rect x="48" y="24" width="4" height="4" fill="#e78368"/><rect x="52" y="24" width="4" height="4" fill="#e78368"/><rect x="56" y="24" width="4" height="4" fill="#e78368"/><rect x="60" y="24" width="4" height="4" fill="#e78368"/><rect x="28" y="28" width="4" height="4" fill="#e78368"/><rect x="32" y="28" width="4" height="4" fill="#e78368"/><rect x="36" y="28" width="4" height="4" fill="#e78368"/><rect x="40" y="28" width="4" height="4" fill="#e78368"/><rect x="44" y="28" width="4" height="4" fill="#e78368"/><rect x="48" y="28" width="4" height="4" fill="#e78368"/><rect x="52" y="28" width="4" height="4" fill="#e78368"/><rect x="56" y="28" width="4" height="4" fill="#e78368"/><rect x="36" y="32" width="4" height="4" fill="#e78368"/><rect x="40" y="32" width="4" height="4" fill="#e78368"/><rect x="44" y="32" width="4" height="4" fill="#e78368"/><rect x="48" y="32" width="4" height="4" fill="#e78368"/><rect x="40" y="36" width="4" height="4" fill="#e78368"/><rect x="44" y="36" width="4" height="4" fill="#e78368"/><rect x="40" y="40" width="4" height="4" fill="#55705c"/><rect x="36" y="44" width="4" height="4" fill="#55705c"/><path d="M12 64h76v5H12z" fill="#c2d9a5"/></svg><small>A LITTLE PIXEL BREAK.</small><h2>气球野餐会</h2><p>把彩色小气球变成今日好心情。</p><p class="tips">点击气球 · 金色 +3 · 黑炸弹扣命</p></aside></div><footer class="foot"><span>点击气球 · 金色 +3 · 黑炸弹扣命</span><span>慢慢玩，也很好。</span></footer></main><div id="overlay"><section class="intro-card"><svg viewBox="0 0 100 74" shape-rendering="crispEdges" aria-hidden="true"><rect x="36" y="8" width="4" height="4" fill="#e78368"/><rect x="40" y="8" width="4" height="4" fill="#e78368"/><rect x="44" y="8" width="4" height="4" fill="#e78368"/><rect x="48" y="8" width="4" height="4" fill="#e78368"/><rect x="28" y="12" width="4" height="4" fill="#e78368"/><rect x="32" y="12" width="4" height="4" fill="#e78368"/><rect x="36" y="12" width="4" height="4" fill="#e78368"/><rect x="40" y="12" width="4" height="4" fill="#e78368"/><rect x="44" y="12" width="4" height="4" fill="#e78368"/><rect x="48" y="12" width="4" height="4" fill="#e78368"/><rect x="52" y="12" width="4" height="4" fill="#e78368"/><rect x="56" y="12" width="4" height="4" fill="#e78368"/><rect x="24" y="16" width="4" height="4" fill="#e78368"/><rect x="28" y="16" width="4" height="4" fill="#e78368"/><rect x="32" y="16" width="4" height="4" fill="#ffdca3"/><rect x="36" y="16" width="4" height="4" fill="#ffdca3"/><rect x="40" y="16" width="4" height="4" fill="#e78368"/><rect x="44" y="16" width="4" height="4" fill="#e78368"/><rect x="48" y="16" width="4" height="4" fill="#e78368"/><rect x="52" y="16" width="4" height="4" fill="#e78368"/><rect x="56" y="16" width="4" height="4" fill="#e78368"/><rect x="60" y="16" width="4" height="4" fill="#e78368"/><rect x="24" y="20" width="4" height="4" fill="#e78368"/><rect x="28" y="20" width="4" height="4" fill="#e78368"/><rect x="32" y="20" width="4" height="4" fill="#ffdca3"/><rect x="36" y="20" width="4" height="4" fill="#ffdca3"/><rect x="40" y="20" width="4" height="4" fill="#e78368"/><rect x="44" y="20" width="4" height="4" fill="#e78368"/><rect x="48" y="20" width="4" height="4" fill="#e78368"/><rect x="52" y="20" width="4" height="4" fill="#e78368"/><rect x="56" y="20" width="4" height="4" fill="#e78368"/><rect x="60" y="20" width="4" height="4" fill="#e78368"/><rect x="24" y="24" width="4" height="4" fill="#e78368"/><rect x="28" y="24" width="4" height="4" fill="#e78368"/><rect x="32" y="24" width="4" height="4" fill="#e78368"/><rect x="36" y="24" width="4" height="4" fill="#e78368"/><rect x="40" y="24" width="4" height="4" fill="#e78368"/><rect x="44" y="24" width="4" height="4" fill="#e78368"/><rect x="48" y="24" width="4" height="4" fill="#e78368"/><rect x="52" y="24" width="4" height="4" fill="#e78368"/><rect x="56" y="24" width="4" height="4" fill="#e78368"/><rect x="60" y="24" width="4" height="4" fill="#e78368"/><rect x="28" y="28" width="4" height="4" fill="#e78368"/><rect x="32" y="28" width="4" height="4" fill="#e78368"/><rect x="36" y="28" width="4" height="4" fill="#e78368"/><rect x="40" y="28" width="4" height="4" fill="#e78368"/><rect x="44" y="28" width="4" height="4" fill="#e78368"/><rect x="48" y="28" width="4" height="4" fill="#e78368"/><rect x="52" y="28" width="4" height="4" fill="#e78368"/><rect x="56" y="28" width="4" height="4" fill="#e78368"/><rect x="36" y="32" width="4" height="4" fill="#e78368"/><rect x="40" y="32" width="4" height="4" fill="#e78368"/><rect x="44" y="32" width="4" height="4" fill="#e78368"/><rect x="48" y="32" width="4" height="4" fill="#e78368"/><rect x="40" y="36" width="4" height="4" fill="#e78368"/><rect x="44" y="36" width="4" height="4" fill="#e78368"/><rect x="40" y="40" width="4" height="4" fill="#55705c"/><rect x="36" y="44" width="4" height="4" fill="#55705c"/><path d="M12 64h76v5H12z" fill="#c2d9a5"/></svg>
      <h1>戳气球</h1>
      <p>点击升起的气球戳破得分<br/>金气球 ⭐ +3 · 黑炸弹 💣 -1 命<br/>共 3 命，越来越快</p>
      <button id="ov-btn">开始游戏</button>
    </section></div><script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const KINDS = [
        { e: '🎈', c: '#e68e7e', v: 1 },
        { e: '🎈', c: '#7bb9cb', v: 1 },
        { e: '🎈', c: '#8db786', v: 1 },
        { e: '🎈', c: '#edc773', v: 3, star: true },
        { e: '💣', c: '#333', v: 0, bomb: true },
      ]

      let balloons, score, lives, running, over, frame, pops
      let best=0;try{best=Number(localStorage.getItem('balloonpop-best'))||0}catch{}
      bestEl.textContent = best

      function start() {
        balloons = []; score = 0; lives = 3; frame = 0; pops = []
        running = true; over = false
        scoreEl.textContent = 0; livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; (()=>{try{localStorage.setItem('balloonpop-best',best)}catch{}})() }
        overlay.querySelector('h1').textContent = '💥 游戏结束'
        overlay.querySelector('p').innerHTML = '得分 <b >' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        frame++
        const rate = Math.max(20, Math.floor(55 - frame / 40))
        if (frame % rate === 0) {
          const roll = Math.random()
          const k = roll < 0.1 ? KINDS[4] : roll < 0.22 ? KINDS[3] : KINDS[(Math.random() * 3) | 0]
          balloons.push({
            x: 30 + Math.random() * (W - 60), y: H + 20,
            v: 1.1 + frame / 1400, k,
            sway: Math.random() * Math.PI * 2,
          })
        }
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i]
          b.y -= b.v
          b.sway += 0.03
          if (b.y < -24) balloons.splice(i, 1)
        }
        for (let i = pops.length - 1; i >= 0; i--) {
          pops[i].t -= 1
          if (pops[i].t <= 0) pops.splice(i, 1)
        }
      }


      function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
      function cloud(x,y){box(x+8,y,32,8,'#fffbed');box(x,y+8,56,12,'#fffbed')}
      function sky(){box(0,0,cv.width,cv.height,'#b0dce4');cloud(28,55);cloud(cv.width-90,110);for(let i=0;i<8;i++){box(i*80,cv.height-90,65,90,'#c2d9a5');box(i*80+15,cv.height-106,35,16,'#c2d9a5')}box(0,cv.height-20,cv.width,20,'#8db685')}
      function disc(x,y,r,c){for(let yy=-r;yy<r;yy+=3){const xx=Math.floor(Math.sqrt(Math.max(0,r*r-yy*yy))/3)*3;box(x-xx,y+yy,xx*2,3,c)}}
      function kid(x,y){box(x+6,y,20,6,'#6b9162');box(x+4,y+6,24,18,'#ffdfaa');box(x+10,y+12,4,4,'#3d5647');box(x+20,y+12,4,4,'#3d5647');box(x+4,y+24,24,20,'#e88c5f');box(x+4,y+44,8,8,'#526f59');box(x+20,y+44,8,8,'#526f59')}
      function pine(x,y){box(x-4,y+12,8,16,'#95744b');box(x-12,y-22,24,10,'#86bda5');box(x-20,y-12,40,10,'#6ca08c');box(x-26,y-2,52,15,'#538574');box(x-10,y-22,16,5,'#f0fbef');box(x-18,y-12,26,5,'#f0fbef');box(x-24,y-2,34,5,'#f0fbef')}

      function draw(){sky();for(const b of balloons){const x=b.x+Math.sin(b.sway)*8,y=b.y-9;if(b.k.bomb){disc(x,y,18,'#42574d');box(x-8,y-10,5,5,'#a8b7a0');box(x-2,y-25,6,10,'#8b734f');box(x+3,y-29,6,6,'#efba61');box(x-7,y-3,4,4,'#f7eac2');box(x+4,y-3,4,4,'#f7eac2')}else{ctx.strokeStyle='#8e9e89';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+15);ctx.lineTo(x-3,y+31);ctx.lineTo(x+2,y+44);ctx.stroke();disc(x,y,19,b.k.c);box(x-9,y-10,6,9,'#fff0ce');box(x-3,y+17,6,5,b.k.c);if(b.k.star){box(x-5,y-3,10,6,'#a67d42');box(x-2,y-6,4,12,'#a67d42')}else{box(x-4,y+3,3,3,'#526b58');box(x+5,y+3,3,3,'#526b58')}}}ctx.font='bold 17px sans-serif';for(const p of pops){ctx.fillStyle='#906435';ctx.fillText('+'+p.v,p.x-8,p.y-(24-p.t)*1.2)}}

      let lastTick=null,lag=0
      function loop(t){requestAnimationFrame(loop);if(lastTick===null)lastTick=t;lag+=Math.min(100,Math.max(0,t-lastTick));lastTick=t;while(lag>=1000/60){if(running&&!over)step();lag-=1000/60}draw()}

      cv.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        if (!running || over) return
        const r = cv.getBoundingClientRect()
        const x = (e.clientX - r.left) * (W / r.width)
        const y = (e.clientY - r.top) * (H / r.height)
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i]
          const sx = b.x + Math.sin(b.sway) * 8
          if (Math.hypot(x - sx, y - (b.y - 9)) < 22) {
            balloons.splice(i, 1)
            if (b.k.bomb) {
              lives--
              livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
              if (lives <= 0) end()
            } else {
              score += b.k.v
              scoreEl.textContent = score
              pops.push({ x: sx, y: b.y, v: b.k.v, t: 24 })
            }
            return
          }
        }
      })
      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running || over },
      }

      balloons = []; score = 0; lives = 3; frame = 0; pops = []; running = false; over = false
    })()
  </script></body></html>
