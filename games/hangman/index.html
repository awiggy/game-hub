<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>猜单词</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,460px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #figure { font-size:15px; line-height:1.5; color:#8b93a7; white-space:pre; text-align:center; font-family:monospace; }
    #hint { font-size:16px; font-weight:900; color:var(--yellow); }
    #word { display:flex; gap:8px; min-height:52px; }
    #word span {
      width:34px; height:46px; border-bottom:3px solid #3a4152;
      display:grid; place-items:center; font-size:24px; font-weight:900;
    }
    #word span.hit { color:var(--blue); border-color:var(--blue); }
    #keys { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; width:100%; }
    #keys button {
      height:40px; font-family:inherit; font-size:15px; font-weight:900; color:#eef1f6;
      background:#1a1d29; border:2px solid #2a2e3d; border-radius:8px; cursor:pointer;
    }
    #keys button:disabled { opacity:.25; cursor:default; }
    #keys button.miss { color:#ff4d5e; opacity:.6; }
    #keys button.ok { color:#22b573; opacity:.6; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>解开<b id="score">0</b>词</span>
      <span>机会<b id="lives">6</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="figure"></div>
    <div id="hint"></div>
    <div id="word"></div>
    <div id="keys"></div>
  </div>
  <div id="overlay">
    <h1>🔤 猜单词</h1>
    <p>按提示猜英文单词，点击字母键试<br/>猜对填入，猜错画一笔小人<br/>6 笔画完就输，解开自动下一词</p>
    <button id="ov-btn">开始猜词</button>
  </div>
  <script>
    (() => {
      const WORDS = [
        ['game', '游戏'], ['star', '星星'], ['cloud', '云'], ['ocean', '海洋'], ['tiger', '老虎'],
        ['apple', '苹果'], ['house', '房子'], ['music', '音乐'], ['piano', '钢琴'], ['raven', '渡鸦'],
        ['storm', '暴风雨'], ['brave', '勇敢'], ['flame', '火焰'], ['ghost', '幽灵'], ['honey', '蜂蜜'],
        ['lemon', '柠檬'], ['maple', '枫树'], ['pearl', '珍珠'], ['quartz', '石英'], ['rocket', '火箭'],
        ['solar', '太阳的'], ['vivid', '鲜艳的'], ['wizard', '巫师'], ['zebra', '斑马'], ['planet', '行星'],
        ['shadow', '影子'], ['castle', '城堡'], ['dolphin', '海豚'], ['emerald', '翡翠'], ['forest', '森林'],
      ]
      const FIG = [
        '', '  o  ', '  o\n  |  ', '  o\n /|  ', '  o\n /|\\\n ', '  o\n /|\\\n /  ', '  o\n /|\\\n / \\',
      ]
      const figEl = document.getElementById('figure')
      const hintEl = document.getElementById('hint')
      const wordEl = document.getElementById('word')
      const keysEl = document.getElementById('keys')
      const scoreEl = document.getElementById('score')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const AZ = 'abcdefghijklmnopqrstuvwxyz'.split('')
      const keyBtns = {}
      AZ.forEach((ch) => {
        const b = document.createElement('button')
        b.textContent = ch.toUpperCase()
        keysEl.appendChild(b)
        keyBtns[ch] = b
      })

      let word, hint, guessed, misses, solved, running, over
      let best = Number(localStorage.getItem('hangman-best') || 0)
      bestEl.textContent = best

      function newWord() {
        const pick = WORDS[(Math.random() * WORDS.length) | 0]
        word = pick[0]; hint = pick[1]
        guessed = new Set(); misses = 0
        hintEl.textContent = '提示：' + hint
        Object.values(keyBtns).forEach((b) => { b.disabled = false; b.className = '' })
        render()
      }

      function start() {
        solved = 0
        running = true; over = false
        scoreEl.textContent = 0; livesEl.textContent = 6
        overlay.classList.add('hidden')
        newWord()
      }

      function end() {
        running = false; over = true
        if (solved > best) { best = solved; bestEl.textContent = best; localStorage.setItem('hangman-best', best) }
        overlay.querySelector('h1').textContent = '💀 小人被吊起来了'
        overlay.querySelector('p').innerHTML = '答案 <b style="color:#ffd23f">' + word + '</b> · 解开 ' + solved + ' 词 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function render() {
        figEl.textContent = FIG[misses] || ''
        livesEl.textContent = 6 - misses
        wordEl.innerHTML = ''
        let done = true
        for (const ch of word) {
          const s = document.createElement('span')
          if (guessed.has(ch)) { s.textContent = ch.toUpperCase(); s.className = 'hit' }
          else done = false
          wordEl.appendChild(s)
        }
        if (done && running && !over) {
          solved++
          scoreEl.textContent = solved
          setTimeout(() => { if (running && !over) newWord() }, 800)
        }
      }

      function guess(ch) {
        if (!running || over || guessed.has(ch)) return
        guessed.add(ch)
        const b = keyBtns[ch]
        if (word.includes(ch)) b.classList.add('ok')
        else {
          b.classList.add('miss')
          misses++
        }
        b.disabled = true
        render()
        if (misses >= 6) end()
      }

      AZ.forEach((ch) => { keyBtns[ch].onclick = () => guess(ch) })
      window.addEventListener('keydown', (e) => {
        const ch = e.key.toLowerCase()
        if (AZ.includes(ch)) guess(ch)
        if (e.code === 'Space' && !running && !overlay.classList.contains('hidden')) { e.preventDefault(); start() }
      })
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return solved },
        get over() { return over },
        get started() { return running },
      }

      word = 'game'; hint = '游戏'; guessed = new Set(); misses = 0; solved = 0
      running = false; over = false
    })()
  </script>
</body>
</html>
