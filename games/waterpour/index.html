<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倒水谜题</title><style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; display:flex; flex-direction:column; gap:14px; align-items:center; }
    #hud { width:min(92vw,460px); display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #goal { font-size:16px; font-weight:900; color:var(--yellow); }
    #jugs { display:flex; gap:26px; align-items:flex-end; height:min(44vh,300px); }
    .jug { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; }
    .jug .vessel {
      width:74px; border:3px solid #3a4152; border-top:0; border-radius:0 0 12px 12px;
      background:rgba(26,29,41,.7); position:relative; overflow:hidden; transition:outline .1s;
      outline:3px solid transparent;
    }
    .jug.sel .vessel { outline-color:var(--yellow); }
    .jug .water { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg,#3f7bff,#2f55e4); transition:height .25s; }
    .jug .cap { font-size:13px; font-weight:900; color:#8b93a7; }
    .jug .cur { font-size:20px; font-weight:900; color:#eef1f6; }
    #msg { font-size:14px; font-weight:900; min-height:20px; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

:root{color-scheme:light;--blue:#5a9678;--yellow:#d88544;--ink:#345647;--muted:#7a8b6c;--paper:#fffbed;--edge:#598367;--floor:#edf2da}
*{box-sizing:border-box}html,body{height:auto;min-height:100%}body{margin:0;min-height:100svh;overflow:auto;display:grid;place-items:center;background:radial-gradient(ellipse at 12% 10%,#fff4d6,transparent 70%),var(--floor);color:var(--ink);font-family:system-ui,-apple-system,'PingFang SC',sans-serif;touch-action:manipulation}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #e98458;outline-offset:2px}.shell{width:min(850px,calc(100% - 28px));padding:12px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.top small,.side small{font:9px ui-monospace,monospace;letter-spacing:2px;color:var(--muted)}.top h1{font-size:22px;letter-spacing:2px;margin:3px 0 0}.tag{font-size:10px;padding:7px 10px;border:1px solid #c6d5b4;background:var(--paper);white-space:nowrap}.layout{display:flex;align-items:center;justify-content:center;gap:26px}#wrap{position:relative;width:min(440px,calc(100% - 196px));max-width:none;gap:10px;flex:none}#hud{position:static;width:100%;display:flex;gap:5px;justify-content:space-between;font-size:10px;color:var(--muted);margin:0 0 9px}#hud>span{flex:1;white-space:nowrap;padding:6px;background:var(--paper);border:1px solid #c6d5b4;box-shadow:0 2px 0 #d7dfbc}#hud b{font:700 16px ui-monospace,monospace;color:#b76c40;margin-left:4px}canvas{display:block;width:100%;height:auto;max-width:100%;max-height:none;image-rendering:pixelated;border:4px solid var(--edge);border-radius:0;background:#aadae1;box-shadow:0 5px 0 #365a43;touch-action:none}.side{width:170px;flex:none}.side svg{width:100%;height:110px;image-rendering:pixelated}.side h2{font-size:24px;line-height:1.5;margin:10px 0}.side p{font-size:12px;line-height:1.9;color:var(--muted);margin:8px 0}.side .tips{padding-top:12px;margin-top:18px;border-top:1px solid #cad6b7;font-size:11px}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:9px;color:var(--muted)}#msg{color:#69816b;font-size:12px;font-weight:500;text-align:center}#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:#eaf1d6dc;border-radius:0;gap:0}#overlay.hidden{display:none}.intro-card{width:min(360px,100%);padding:20px;text-align:center;border:3px solid var(--edge);background:var(--paper);box-shadow:6px 6px 0 #31523e30}.intro-card svg{display:block;width:140px;height:86px;margin:0 auto 6px;image-rendering:pixelated}#overlay h1{font-size:24px;letter-spacing:2px;text-shadow:none;margin:8px 0}#overlay p{font-size:12px;line-height:1.9;color:#778467;margin:0 0 17px}#overlay b{color:#ce7646}#overlay button{background:#e98255;color:#fffbed;border:2px solid #a55d3c;border-radius:0;box-shadow:0 4px 0 #a65c3b;font-weight:800;font-size:15px;padding:10px 24px}.act,#opts button,#nums button,#keys button{border-radius:0;box-shadow:0 3px 0 #b5bd94}.act:active,#opts button:active,#nums button:active,#keys button:active{transform:translateY(2px)}
@media(max-width:620px){.shell{width:calc(100% - 24px);padding:10px 0}.top{margin-bottom:9px}.top h1{font-size:18px}.top small{font-size:8px;letter-spacing:1px}.tag{font-size:9px;padding:5px 7px}.layout{display:block}.side{display:none}#wrap{margin:auto;width:min(100%,400px)}#hud{gap:4px}#hud>span{padding:5px 4px}#hud b{font-size:14px;margin-left:3px}.foot{font-size:8px;gap:8px;margin-top:12px}.foot span:last-child{display:none}#overlay h1{font-size:21px}.intro-card{padding:14px}.intro-card svg{height:66px}#overlay p{font-size:11px}}
@media(max-height:480px){.side svg{height:55px}.side h2{font-size:20px}.side .tips{display:none}.intro-card{padding:12px 16px}.intro-card svg{height:48px}#overlay h1{font-size:21px;margin:6px 0}#overlay p{font-size:11px;margin-bottom:12px}#overlay button{padding:8px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#wrap{padding:14px;background:#fffbed;border:2px solid #9bb89c}#goal{font-size:14px;color:#517d72}#jugs{width:100%;justify-content:center;height:210px;gap:20px}.jug{background:none;border:0;padding:0;color:inherit}.jug .vessel{width:70px!important;max-height:150px;border:4px solid #78a6a1;border-top:2px solid #b2d0b7;border-radius:0;background:#e9f1dc;box-shadow:inset 6px 0 #fffbed88;outline-offset:3px}.jug.sel .vessel{outline-color:#e3a65d}.jug .water{background:repeating-linear-gradient(0deg,#80c4cb 0 18px,#96d5d9 18px 21px);border-top:4px solid #c3edf0}.jug .cur{color:#36746f;font:700 19px ui-monospace,monospace}.jug .cap{font-size:11px;color:#85906f}.jug-actions{display:flex;gap:8px}.jug-actions button{background:#d9ebd0;border:1px solid #90ae88;color:#53715c;padding:7px 14px;font-size:12px}.jug-actions button:disabled{opacity:.45}#msg{min-height:18px;font-size:11px}@media(max-height:480px){#jugs{height:160px}.jug .vessel{max-height:105px}.jug .cur{font-size:16px}#wrap{gap:7px;padding:9px}#goal{font-size:12px}.jug-actions button{padding:6px 12px}}body{grid-template-columns:100%;justify-content:stretch}
@media(max-height:480px){.side p.tips{display:none}.side svg{height:48px}.side h2{font-size:18px}}
@media(max-height:430px){.shell{padding:8px 0}.top{margin-bottom:8px}.top h1{font-size:18px}.foot{margin-top:8px;font-size:8px}.side .tips{display:none}}@media(max-height:480px){#jugs{height:120px}.jug .vessel{max-height:75px}#wrap{gap:6px}#msg{font-size:10px}}</style></head><body><main class="shell"><header class="top"><div><small>LITTLE WATER LAB</small><h1>倒水谜题</h1></div><span class="tag">溪边水实验</span></header><div class="layout">
  <div id="wrap">
    <div id="hud">
      <span>关卡<b id="lv">1/3</b></span>
      <span>步数<b id="moves">0</b></span>
      <span>BEST<b id="best">—</b></span>
    </div>
    <div id="goal"></div>
    <div id="jugs"></div>
    <div class="jug-actions"><button id="fill-jug">灌满选中壶</button><button id="empty-jug">倒空选中壶</button></div><div id="msg">点源壶 → 点目标壶完成倾倒</div>
  </div>

  <aside class="side"><svg viewBox="0 0 120 80" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 65h120v15H0z" fill="#91b967"/><path d="M0 65h120v4H0z" fill="#cbe49c"/><path d="M28 18v42h25V18m14 8v34h25V26" stroke="#659ea0" stroke-width="4" fill="#d9f0e3"/><path d="M31 40h19v17H31zM70 34h19v23H70z" fill="#76c5cf"/><path d="M34 44h5v5h-5zM74 39h5v5h-5z" fill="#d8f8e8"/><path d="M10 56h4v12h-4zM6 60h12v4H6zM105 54h4v12h-4zM101 58h12v4h-12z" fill="#fffbed"/><path d="M10 60h4v4h-4zM105 58h4v4h-4z" fill="#efc55b"/></svg><small>A LITTLE PIXEL BREAK.</small><h2>溪边水实验</h2><p>倒一倒，让水量刚刚好。</p><p class="tips">选源壶再选目标壶 · 可灌满、倒空</p></aside></div><footer class="foot"><span>选源壶再选目标壶 · 可灌满、倒空</span><span>慢慢玩，也很好。</span></footer></main><div id="overlay"><section class="intro-card"><svg viewBox="0 0 120 80" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 65h120v15H0z" fill="#91b967"/><path d="M0 65h120v4H0z" fill="#cbe49c"/><path d="M28 18v42h25V18m14 8v34h25V26" stroke="#659ea0" stroke-width="4" fill="#d9f0e3"/><path d="M31 40h19v17H31zM70 34h19v23H70z" fill="#76c5cf"/><path d="M34 44h5v5h-5zM74 39h5v5h-5z" fill="#d8f8e8"/><path d="M10 56h4v12h-4zM6 60h12v4H6zM105 54h4v12h-4zM101 58h12v4h-12z" fill="#fffbed"/><path d="M10 60h4v4h-4zM105 58h4v4h-4z" fill="#efc55b"/></svg>
    <h1>倒水谜题</h1>
    <p>点源壶再点目标壶倒水<br/>倒到目标壶满或源壶空为止<br/>可灌满或倒空选中的壶<br/>任一壶达到目标水量即过关</p>
    <button id="ov-btn">开始解谜</button>
  </section></div><script>
    (() => {
      const LEVELS = [
        { caps: [5, 3], start: [5, 0], goal: 4 },
        { caps: [8, 5, 3], start: [8, 0, 0], goal: 4 },
        { caps: [9, 4], start: [9, 0], goal: 6 },
      ]
      const jugsEl = document.getElementById('jugs')
      const goalEl = document.getElementById('goal')
      const lvEl = document.getElementById('lv')
      const movesEl = document.getElementById('moves')
      const bestEl = document.getElementById('best')
      const msgEl = document.getElementById('msg')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const MAXH = 160
      let level, caps, jugs, goal, sel, moves, totalMoves, running, over, transitioning=false
      let best=0;try{best=Number(localStorage.getItem('waterpour-best'))||0}catch{}
      if (best) bestEl.textContent = best

      function load(nv) {
        transitioning=false
        level = nv
        caps = LEVELS[nv].caps
        jugs = [...LEVELS[nv].start]
        goal = LEVELS[nv].goal
        sel = -1
        moves = 0
        lvEl.textContent = (nv + 1) + '/3'
        movesEl.textContent = 0
        goalEl.textContent = '🎯 目标：任一壶恰好装 ' + goal + ' 升'
        msg('选源壶再选目标壶；也可灌满或倒空')
        render()
      }

      function start() {
        totalMoves = 0
        running = true; over = false
        overlay.classList.add('hidden')
        load(0)
      }

      function win() {
        if(transitioning)return; transitioning=true
        const gain = Math.max(100, 800 - totalMoves * 20)
        totalMoves // 保留
        if (level === LEVELS.length - 1) {
          running = false; over = true
          const score = Math.max(100, 1200 - totalMoves * 15)
          if (!best || score > best) { best = score; bestEl.textContent = best; (()=>{try{localStorage.setItem('waterpour-best',best)}catch{}})() }
          overlay.querySelector('h1').textContent = '🫗 全部解出'
          overlay.querySelector('p').innerHTML = '总步数 ' + totalMoves + ' · 得分 <b >' + score + '</b>'
          ovBtn.textContent = '再来一局'
          overlay.classList.remove('hidden')
        } else {
          msg('✓ 过关！')
          setTimeout(() => load(level + 1), 700)
        }
      }

      function msg(t) {
        msgEl.textContent = t
      }

      function pour(from, to) {
        if (from === to) return
        if (!jugs[from]) { msg('源壶是空的'); return }
        const space = caps[to] - jugs[to]
        if (!space) { msg('目标壶已满'); return }
        const amount = Math.min(jugs[from], space)
        jugs[from] -= amount
        jugs[to] += amount
        moves++; totalMoves++
        movesEl.textContent = moves
        render()
        if (jugs.some((j) => j === goal)) win()
      }

      function click(i) {
        if (!running || over || transitioning) return
        if (sel === -1) {

          sel = i
          render()
          return
        }
        if (sel === i) { sel = -1; render(); return }
        pour(sel, i)
        sel = -1
        render()
      }

      function render() {
        document.getElementById('fill-jug').disabled=sel<0||transitioning||!running
        document.getElementById('empty-jug').disabled=sel<0||transitioning||!running
        jugsEl.innerHTML = ''
        jugs.forEach((v, i) => {
          const wrap = document.createElement('button')
          wrap.className = 'jug' + (i === sel ? ' sel' : '')
          wrap.setAttribute('aria-label', '水壶'+(i+1)+'，'+v+'升，容量'+caps[i]+'升')
          const h = Math.max(10, v / caps[i] * MAXH)
          wrap.innerHTML =
            '<div class="vessel" style="height:' + MAXH + 'px">' +
            '<div class="water" style="height:' + (v / caps[i] * 100) + '%"></div></div>' +
            '<div class="cur">' + v + 'L</div><div class="cap">容量 ' + caps[i] + 'L</div>'
          wrap.onclick = () => click(i)
          jugsEl.appendChild(wrap)
        })
      }

      function changeWater(fill){if(!running||over||transitioning||sel<0)return;const value=fill?caps[sel]:0;if(jugs[sel]===value)return;jugs[sel]=value;moves++;totalMoves++;movesEl.textContent=moves;sel=-1;render();if(jugs.some(v=>v===goal))win()}
      document.getElementById('fill-jug').addEventListener('click',()=>changeWater(true))
      document.getElementById('empty-jug').addEventListener('click',()=>changeWater(false))
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return Math.max(100, 1200 - totalMoves * 15) },
        get over() { return over },
        get started() { return running || over },
      }

      caps = LEVELS[0].caps; jugs = [...LEVELS[0].start]; goal = LEVELS[0].goal
      sel = -1; moves = 0; totalMoves = 0; level = 0; running = false; over = false
      render()
    })()
  </script></body></html>
