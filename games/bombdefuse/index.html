<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>拆弹专家</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,420px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #timer {
      font-size:44px; font-weight:900; letter-spacing:4px; color:var(--yellow);
      text-shadow:0 0 18px rgba(255,210,63,.35); font-variant-numeric:tabular-nums;
    }
    #timer.danger { color:#ff4d5e; animation:blink .4s infinite; }
    @keyframes blink { 50% { opacity:.4; } }
    #manual { width:100%; text-align:center; background:#1a1d29; border:2px solid #2a2e3d; border-radius:10px;
      padding:10px; font-size:14px; font-weight:900; letter-spacing:2px; }
    #wires { width:100%; display:flex; flex-direction:column; gap:10px; }
    .wire {
      height:34px; border-radius:8px; cursor:pointer; position:relative;
      display:flex; align-items:center; padding:0 12px; font-size:12px; font-weight:900; color:#14161f;
    }
    .wire.cut { opacity:.18; pointer-events:none; }
    .wire::before { content:''; position:absolute; left:0; right:0; top:50%; height:4px; background:rgba(0,0,0,.35); }
    .wire span { background:rgba(255,255,255,.75); border-radius:4px; padding:1px 6px; z-index:1; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.92); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>已拆<b id="score">0</b>颗</span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="timer">30.0</div>
    <div id="manual">📋 剪线顺序：--</div>
    <div id="wires"></div>
  </div>
  <div id="overlay">
    <h1>💣 拆弹专家</h1>
    <p>按顶部手册顺序剪断线路<br/>倒计时随炸弹编号越来越短<br/>剪错或超时即爆炸！</p>
    <button id="ov-btn">戴上耳机开工</button>
  </div>
  <script>
    (() => {
      const COLORS = [
        { n: '红', c: '#ff4d5e' }, { n: '蓝', c: '#2f55e4' }, { n: '绿', c: '#22b573' },
        { n: '黄', c: '#ffd23f' }, { n: '紫', c: '#8a5cf6' }, { n: '橙', c: '#f5a623' },
        { n: '白', c: '#eef1f6' }, { n: '青', c: '#00b8a9' },
      ]
      const timerEl = document.getElementById('timer')
      const manualEl = document.getElementById('manual')
      const wiresEl = document.getElementById('wires')
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let order, pos, wiresLeft, timeLeft, bombNo, score, running, over, lastT
      let best = Number(localStorage.getItem('bombdefuse-best') || 0)
      bestEl.textContent = best

      function newBomb() {
        const pool = [...COLORS].sort(() => Math.random() - 0.5)
        const count = Math.min(8, 5 + (bombNo / 3 | 0))
        const picked = pool.slice(0, count)
        order = picked.map((p) => p.n)
        pos = 0
        wiresLeft = picked.length
        timeLeft = Math.max(9, 30 - bombNo * 1.6)
        manualEl.textContent = '📋 剪线顺序：' + order.join(' → ')
        wiresEl.innerHTML = ''
        picked.forEach((p) => {
          const w = document.createElement('div')
          w.className = 'wire'
          w.style.background = p.c
          w.innerHTML = '<span>' + p.n + '线</span>'
          w.onclick = () => cut(w, p.n)
          wiresEl.appendChild(w)
        })
      }

      function start() {
        bombNo = 1; score = 0
        running = true; over = false
        scoreEl.textContent = 0
        overlay.classList.add('hidden')
        newBomb()
      }

      function boom(title) {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('bombdefuse-best', best) }
        overlay.querySelector('h1').textContent = title
        overlay.querySelector('p').innerHTML = '成功拆除 <b style="color:#ffd23f">' + score + '</b> 颗 · 最佳 ' + best
        ovBtn.textContent = '再来一次'
        overlay.classList.remove('hidden')
      }

      function cut(el, name) {
        if (!running || over || el.classList.contains('cut')) return
        if (name === order[pos]) {
          el.classList.add('cut')
          pos++
          wiresLeft--
          if (wiresLeft === 0) {
            score++
            scoreEl.textContent = score
            bombNo++
            msgFlash('✂ 拆除成功！下一颗…')
            setTimeout(newBomb, 700)
          }
        } else {
          el.style.background = '#ff4d5e'
          boom('💥 轰！剪错线了')
        }
      }

      function msgFlash(t) {
        manualEl.textContent = t
        setTimeout(() => { if (running && !over) manualEl.textContent = '📋 剪线顺序：' + order.join(' → ') }, 650)
      }

      function loop(t) {
        requestAnimationFrame(loop)
        if (!lastT) lastT = t
        const dt = Math.min(60, t - lastT)
        lastT = t
        if (running && !over) {
          timeLeft -= dt / 1000
          timerEl.textContent = Math.max(0, timeLeft).toFixed(1)
          timerEl.classList.toggle('danger', timeLeft < 5)
          if (timeLeft <= 0) boom('⏰ 轰！超时爆炸')
        }
      }

      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      order = []; pos = 0; wiresLeft = 0; timeLeft = 30; bombNo = 1
      score = 0; running = false; over = false
    })()
  </script>
</body>
</html>
