<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>星环躲避</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>躲过<b id="score">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="480" height="480"></canvas>
    <div id="overlay">
      <h1>🪐 星环躲避</h1>
      <p>小球绕环匀速转动<br/>点击 / 空格随时反向<br/>流星飞过中心线 +1，撞上即终</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const CX = W / 2, CY = H / 2, R = 92
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      // 状态先初始化，再启动绘制循环
      let ang = 0, dir = 1, rocks = [], score = 0, frame = 0
      let running = false, over = false
      let best = Number(localStorage.getItem('orbit-best') || 0)
      bestEl.textContent = best

      function start() {
        ang = 0; dir = 1; rocks = []; score = 0; frame = 0
        running = true; over = false
        scoreEl.textContent = 0
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('orbit-best', best) }
        overlay.querySelector('h1').textContent = '💥 被击中了'
        overlay.querySelector('p').innerHTML = '躲过 <b style="color:#ffd23f">' + score + '</b> 颗流星 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        frame++
        ang += dir * 0.045
        if (frame % Math.max(24, 60 - frame / 120) === 0) {
          const edge = (Math.random() * 4) | 0
          const x = edge === 0 ? 0 : edge === 1 ? W : Math.random() * W
          const y = edge === 2 ? 0 : edge === 3 ? H : Math.random() * H
          rocks.push({ x, y, passed: false })
        }
        const spd = 2 + Math.min(3, frame / 900)
        const px = CX + Math.cos(ang) * R, py = CY + Math.sin(ang) * R
        for (let i = rocks.length - 1; i >= 0; i--) {
          const k = rocks[i]
          const dx = CX - k.x, dy = CY - k.y
          const d = Math.hypot(dx, dy)
          k.x += dx / d * spd
          k.y += dy / d * spd
          if (d < R - 4 && !k.passed) { k.passed = true; score++; scoreEl.textContent = score }
          if (Math.hypot(k.x - px, k.y - py) < 12) return end()
          if (k.x < -20 || k.x > W + 20 || k.y < -20 || k.y > H + 20) rocks.splice(i, 1)
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        ctx.strokeStyle = '#2a2e3d'
        ctx.lineWidth = 2
        ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke()
        ctx.font = '22px sans-serif'
        ctx.fillText('🪐', CX - 11, CY + 8)
        ctx.fillStyle = '#5d84ff'
        const px = CX + Math.cos(ang) * R, py = CY + Math.sin(ang) * R
        ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = '#8b93a7'
        ctx.font = '16px sans-serif'
        for (const k of rocks) ctx.fillText('☄️', k.x - 8, k.y + 6)
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault()
          if (!running && !overlay.classList.contains('hidden')) start()
          else dir *= -1
        }
      })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); if (running && !over) dir *= -1 })
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }
    })()
  </script>
</body>
</html>
