<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>饼干工坊</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #big { font-size:74px; cursor:pointer; user-select:none; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5)); transition:transform .08s; }
    #big:active { transform:scale(.9); }
    #cps { font-size:12px; font-weight:700; color:#8b93a7; }
    #helpers { width:100%; display:flex; flex-direction:column; gap:8px; }
    .helper {
      display:flex; align-items:center; gap:10px; background:#1a1d29;
      border:2px solid #2a2e3d; border-radius:10px; padding:8px 12px;
    }
    .helper .ico { font-size:24px; }
    .helper .info { flex:1; line-height:1.4; }
    .helper .info b { font-size:13px; }
    .helper .info span { display:block; font-size:11px; color:#8b93a7; font-weight:700; }
    .helper .have { font-size:13px; font-weight:900; color:var(--yellow); }
    .helper button {
      font-family:inherit; font-weight:900; font-size:12px; color:#eef1f6;
      background:var(--blue); border:2px solid #fff; border-radius:8px; padding:8px 12px; cursor:pointer;
    }
    .helper button:disabled { opacity:.35; cursor:not-allowed; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

/* Hand-authored pixel workshop edition. */
:root{--ink:#855b40;--edge:#c7976a;--paper:#fff3d7;--blue:#855b40;--yellow:#855b40}body{height:auto;min-height:100dvh;padding:14px 10px;overflow:auto;background:#f4e4d4;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:12px 12px;color:var(--ink);flex-direction:column;gap:8px;touch-action:manipulation}#wrap{position:relative;width:min(460px,94vw);display:flex;flex-direction:column;align-items:stretch;gap:10px;flex-shrink:0}.scene-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.scene-head small{font-size:9px;letter-spacing:2px;opacity:.7}.scene-head h2{font-size:22px;line-height:1.4;margin:3px 0;letter-spacing:.5px}.scene-head>.pixel-sprite{width:58px;height:58px;flex:none}#hud,#bar{position:static;width:100%;padding:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;color:var(--ink);font-size:11px}#hud b,#bar b{font-size:16px;color:var(--ink)}#board,#grid,canvas{width:min(100%,calc(100dvh - 225px));max-width:100%;max-height:none;align-self:center;height:auto;border:4px solid var(--edge);border-radius:9px;box-shadow:0 5px #0002;background:var(--paper);flex-shrink:0}#msg,#hint,#fleet,#cps{color:var(--ink);font-size:12px;text-align:center;line-height:1.7;min-height:0}.work-note{font-size:10px;line-height:1.7;text-align:center;opacity:.8}canvas{image-rendering:pixelated;touch-action:none}#overlay{position:fixed;inset:0;z-index:40;border-radius:0;background:color-mix(in srgb,#f4e4d4 97%,transparent);color:var(--ink);padding:20px;gap:14px}#overlay::before{content:'';display:block;width:100px;height:100px;background:url("data:image/svg+xml,%3Csvg%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2032%2032%22%20class%3D%22pixel-sprite%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%227%22%20y%3D%224%22%20width%3D%2218%22%20height%3D%2224%22%20fill%3D%22%23986334%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%227%22%20width%3D%2224%22%20height%3D%2218%22%20fill%3D%22%23986334%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%224%22%20width%3D%2216%22%20height%3D%2221%22%20fill%3D%22%23e6ac57%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%227%22%20width%3D%2222%22%20height%3D%2215%22%20fill%3D%22%23e6ac57%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%226%22%20width%3D%2216%22%20height%3D%2213%22%20fill%3D%22%23f9ce7b%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%227%22%20width%3D%229%22%20height%3D%222%22%20fill%3D%22%23ffe6a3%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2211%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%238f5a41%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2211%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23bc8650%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%2210%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%238f5a41%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%2210%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23bc8650%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%2218%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%238f5a41%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%2218%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23bc8650%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2221%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%238f5a41%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2221%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23bc8650%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;image-rendering:pixelated}#overlay h1{font-size:25px;letter-spacing:1px;text-shadow:none}#overlay p{color:var(--ink);max-width:380px;line-height:1.9}#overlay p b{color:var(--ink)!important}#overlay button,#again,#bar button{color:var(--paper);background:var(--ink);border:2px solid var(--edge);box-shadow:0 3px #0002;border-radius:8px;padding:10px 20px}#overlay.hidden{display:none}button{font-family:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #d88050;outline-offset:2px}.pixel-sprite{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}button:disabled{cursor:default;opacity:.45}.tools{display:flex;justify-content:center;gap:8px}.tools button,#pads button{background:var(--paper);border:2px solid var(--edge);color:var(--ink);padding:8px 13px;border-radius:7px;box-shadow:0 3px #0001;font-weight:800}
@media(max-width:480px){.scene-head h2{font-size:19px}.scene-head>.pixel-sprite{width:44px;height:44px}#wrap{gap:8px}#hud b{font-size:14px}#board,#grid,canvas{width:min(100%,calc(100dvh - 205px))}}
@media(min-width:600px) and (max-height:550px){#wrap{width:min(800px,96vw);display:grid;grid-template-columns:220px auto;gap:8px 24px;justify-content:center;align-items:center}#wrap>:where(:not(#board):not(#grid):not(canvas)){grid-column:1}#board,#grid,canvas{grid-column:2;grid-row:1/6;width:calc(100dvh - 58px);max-height:calc(100dvh - 38px)}.scene-head h2{font-size:20px}#overlay{gap:8px}#overlay::before{width:65px;height:65px}#overlay h1{font-size:22px}#overlay p{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.bakery{position:relative;padding:24px 20px 0;border:4px solid #bd9068;border-radius:10px;background:repeating-linear-gradient(90deg,#f0cf9f 0 28px,#e7c18f 28px 30px);overflow:hidden}.awning{position:absolute;top:0;left:0;right:0;height:24px;background:repeating-linear-gradient(90deg,#e89a84 0 30px,#fff0cc 30px 60px);border-bottom:4px solid #d18973}#big{display:flex;align-items:center;justify-content:center;flex-direction:column;width:100%;height:150px;border:0;background:none;filter:none;color:var(--ink);box-shadow:none;font-size:11px}#big svg{width:126px;height:126px;filter:drop-shadow(3px 5px #aa785c40)}#big span{font-size:10px;font-weight:700}#big:active{transform:scale(.96)}.shelf{height:45px;display:flex;justify-content:space-between;border-bottom:8px solid #b78255;background:#e5ba88}.shelf svg{width:46px}.helper{background:#fff4dc;border:2px solid #d4b68c;box-shadow:0 3px #d6b690;min-height:57px;padding:5px 10px;gap:8px}.helper .ico{width:42px;height:42px}.helper .info span{color:#927450;font-size:10px}.helper .info b{font-size:12px}.helper .have{color:var(--ink);font-size:11px}.helper button{background:#9b7350;color:#fff5db;border-color:#c2a17c;padding:6px 10px}#helpers{gap:7px}#cps{font-size:10px}@media(max-height:650px){#big{height:118px}#big svg{width:98px;height:98px}.shelf{height:32px}.shelf svg{width:34px}.helper{min-height:50px}.helper .ico{width:35px;height:35px}}@media(min-width:600px) and (max-height:550px){#wrap>.bakery{grid-column:2;grid-row:1/7;width:280px}.bakery #big{height:220px}.bakery #big svg{width:180px;height:180px}.bakery .shelf{height:62px}.bakery .shelf svg{width:65px}}
@media(min-width:600px) and (max-height:550px){#wrap>.scene-head{grid-row:1}#wrap>#hud{grid-row:2}#wrap>#cps{grid-row:3}#wrap>#helpers{grid-row:4}#wrap>.bakery{grid-row:1/5}.helper{min-height:48px}.helper .ico{width:28px;height:28px}#hud{font-size:10px}#hud b{font-size:12px}#cps{font-size:9px}.scene-head h2{font-size:18px}}
</style>

<body>
  <div id="wrap"><header class="scene-head"><div><small>BUTTER & CRUMBS</small><h2>松鼠的黄油饼干屋</h2></div><svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="7" y="4" width="18" height="24" fill="#986334"/><rect x="4" y="7" width="24" height="18" fill="#986334"/><rect x="8" y="4" width="16" height="21" fill="#e6ac57"/><rect x="5" y="7" width="22" height="15" fill="#e6ac57"/><rect x="8" y="6" width="16" height="13" fill="#f9ce7b"/><rect x="9" y="7" width="9" height="2" fill="#ffe6a3"/><rect x="10" y="11" width="3" height="3" fill="#8f5a41"/><rect x="10" y="11" width="2" height="1" fill="#bc8650"/><rect x="21" y="10" width="3" height="3" fill="#8f5a41"/><rect x="21" y="10" width="2" height="1" fill="#bc8650"/><rect x="17" y="18" width="3" height="3" fill="#8f5a41"/><rect x="17" y="18" width="2" height="1" fill="#bc8650"/><rect x="8" y="21" width="3" height="3" fill="#8f5a41"/><rect x="8" y="21" width="2" height="1" fill="#bc8650"/></svg></header>

#fff8df"/><rect x="6" y="4" width="20" height="1" fill="#fff8df"/><rect x="9" y="7" width="15" height="5" fill="#fff8df"/><rect x="11" y="12" width="12" height="13" fill="#dfac84"/><rect x="8" y="15" width="18" height="7" fill="#dfac84"/><rect x="10" y="12" width="14" height="7" fill="#ffdfb1"/><rect x="10" y="16" width="2" height="3" fill="#332f36"/><rect x="18" y="16" width="2" height="3" fill="#332f36"/><rect x="10" y="16" width="1" height="1" fill="#fffdf0"/><rect x="18" y="16" width="1" height="1" fill="#fffdf0"/><rect x="8" y="20" width="3" height="2" fill="#f4998a"/><rect x="19" y="20" width="3" height="2" fill="#f4998a"/><rect x="14" y="20" width="2" height="1" fill="#8f4d48"/><rect x="7" y="25" width="20" height="7" fill="#8aa78a"/><rect x="11" y="25" width="12" height="7" fill="#ffedc9"/><rect x="15" y="27" width="3" height="2" fill="#c58b63"/></svg><svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="3" y="5" width="26" height="26" fill="#826856"/><rect x="4" y="6" width="24" height="23" fill="#dccab0"/><rect x="5" y="7" width="22" height="4" fill="#f5ebcf"/><rect x="7" y="8" width="3" height="2" fill="#d68c60"/><rect x="22" y="8" width="3" height="2" fill="#d68c60"/><rect x="6" y="13" width="20" height="13" fill="#846b60"/><rect x="8" y="15" width="16" height="9" fill="#555e62"/><rect x="10" y="19" width="12" height="3" fill="#ecb665"/><rect x="9" y="15" width="2" height="6" fill="#acc5b9"/><rect x="9" y="27" width="14" height="2" fill="#967454"/></svg></div></div>

  <script>
    (() => {
      function pxRects(kind) {
        const a=[]; const r=(x,y,w,h,c)=>a.push([x,y,w,h,c]);
        const face=(x,y)=>{r(x,y,2,3,'#332f36');r(x+8,y,2,3,'#332f36');r(x,y,1,1,'#fffdf0');r(x+8,y,1,1,'#fffdf0');r(x-2,y+4,3,2,'#f4998a');r(x+9,y+4,3,2,'#f4998a');r(x+4,y+4,2,1,'#8f4d48');};
        const round=(x,y,w,h,c)=>{r(x+3,y,w-6,h,c);r(x,y+3,w,h-6,c)};
        if(kind==='apple'||kind==='orange'||kind==='berry') {
          const p=kind==='apple'?['#8e3540','#d84b4e','#ff765f','#ffbea0']:kind==='orange'?['#ae5c2c','#ef9c34','#ffc650','#ffed9a']:['#48447d','#6f6fc1','#9d9ce3','#d2d1ff'];
          round(4,9,24,20,p[0]);round(6,10,20,17,p[1]);r(8,11,15,11,p[2]);r(8,13,4,5,p[3]);r(10,11,5,2,p[3]);r(13,6,3,6,'#72533e');r(16,4,9,4,'#3c7949');r(17,4,6,2,'#9bcd55');face(10,19);
        } else if(kind==='carrot'||kind==='sprout') {
          r(14,6,3,11,'#37774b');r(7,5,8,4,'#387d43');r(9,3,6,4,'#84bd50');r(17,4,8,4,'#3c8e46');r(18,2,6,3,'#b0d767');
          if(kind==='carrot'){r(9,13,15,5,'#ad552b');r(10,18,12,5,'#ad552b');r(12,23,8,4,'#ad552b');r(14,27,4,3,'#ad552b');r(10,14,12,4,'#ffb04b');r(11,18,9,5,'#f88132');r(13,23,5,4,'#f88132');r(11,15,3,5,'#ffda75');r(18,19,3,1,'#ba5c32');r(13,24,3,1,'#ba5c32');}
          else {r(5,23,22,4,'#654830');r(8,21,16,3,'#9d6c42');r(14,14,3,8,'#3c8747');}
        } else if(kind==='flower') {
          r(15,13,3,17,'#3c8b58');r(8,20,8,4,'#82be5f');r(18,23,8,4,'#58a657');
          round(10,2,12,20,'#e5bc88');round(5,7,22,10,'#e5bc88');round(11,2,10,18,'#fffbea');round(5,8,22,8,'#fffbea');r(12,8,9,8,'#e9a82d');r(13,8,6,5,'#ffd95c');r(14,9,3,2,'#fff5ac');
        } else if(kind==='mushroom') {
          r(11,16,11,13,'#af784d');r(12,16,9,11,'#ffe6b2');r(12,18,3,6,'#fff6da');r(6,8,21,11,'#9c3d43');r(10,4,13,5,'#9c3d43');r(4,13,25,7,'#9c3d43');r(7,9,19,8,'#e97564');r(10,5,13,9,'#f69b7e');r(5,14,23,3,'#e97564');r(10,8,4,4,'#fff0cf');r(20,12,5,4,'#fff0cf');face(12,22);
        } else if(kind==='mole'||kind==='goldmole'||kind==='bunny') {
          const bunny=kind==='bunny',gold=kind==='goldmole'; const dark=bunny?'#8c7974':gold?'#9c6327':'#704c46'; const base=bunny?'#f9eacb':gold?'#efb648':'#b38360';const light=bunny?'#fffbed':gold?'#ffe08a':'#dbac7a';
          if(bunny){r(8,1,6,12,dark);r(19,0,6,13,dark);r(9,2,4,11,light);r(20,1,4,12,light);r(10,4,2,7,'#e7a09b');r(21,3,2,8,'#e7a09b');}
          else{round(4,5,8,9,dark);round(21,5,8,9,dark);r(6,7,4,5,'#e7a09b');r(23,7,4,5,'#e7a09b');}

      function pxSprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pxRects(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}



      const HELPERS = [
        { e: '🧑‍🍳', n: '小学徒', cost: 15, rate: 0.5 },

      const big = document.getElementById('big')
      const cpsEl = document.getElementById('cps')
      const helpersEl = document.getElementById('helpers')
      const scoreEl = document.getElementById('score')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let cookies, total, counts, timeLeft, running, over
      let best = Number(localStorage.getItem('cookieidler-best') || 0)
      bestEl.textContent = best

      function cps() {
        return HELPERS.reduce((s, h, i) => s + counts[i] * h.rate, 0)
      }

      function start() {
        lastT=0;
        cookies = 0; total = 0
        counts = [0, 0, 0]
        timeLeft = 60
        running = true; over = false
        scoreEl.textContent = 0; timeEl.textContent = '60s'
        overlay.classList.add('hidden')
        render()
      }

      function end() {
        running = false; over = true
        if (total > best) { best = Math.floor(total); bestEl.textContent = best; localStorage.setItem('cookieidler-best', best) }
        overlay.querySelector('h1').textContent = '🏭 打烊结算'
        overlay.querySelector('p').innerHTML =
          '总产量 <b style="color:#ffd23f">' + Math.floor(total) + '</b> 块饼干 · 最佳 ' + best
        ovBtn.textContent = '明天再来'
        overlay.classList.remove('hidden')
      }

      function render() {
        scoreEl.textContent=Math.floor(cookies);document.getElementById('total').textContent=Math.floor(total);cpsEl.textContent='每秒出炉 '+cps().toFixed(1)+' 块 · 买帮手不扣总产量';
        if(!helpersEl.children.length)HELPERS.forEach((h,i)=>{const row=document.createElement('div');row.className='helper';row.innerHTML='<span class="ico">'+pxSprite(['chef','oven','barn'][i])+'</span><span class="info"><b></b><span></span></span><span class="have"></span>';const b=document.createElement('button');b.textContent='添置';b.setAttribute('aria-label','添置'+h.n);b.onclick=()=>{const cost=Math.round(h.cost*Math.pow(1.35,counts[i]));if(!running||over||cookies<cost)return;cookies-=cost;counts[i]++;render()};row.appendChild(b);helpersEl.appendChild(row)});
        HELPERS.forEach((h,i)=>{const row=helpersEl.children[i],cost=Math.round(h.cost*Math.pow(1.35,counts[i]));row.querySelector('.info b').textContent=h.n+' ×'+counts[i];row.querySelector('.info span').textContent='每秒 +'+h.rate+' 块';row.querySelector('.have').textContent=cost+' 块';row.querySelector('button').disabled=!running||over||cookies<cost;});
      }

      big.addEventListener('click', () => {
        if (!running || over) return
        cookies += 1
        total += 1
        render()
      })

      let lastT = 0
      function loop(t) {
        requestAnimationFrame(loop)
        if (!lastT) lastT = t
        const dt = Math.min(80, t - lastT)
        lastT = t
        if (running && !over) {
          const gain = cps() * dt / 1000
          cookies += gain
          total += gain
          timeLeft -= dt / 1000
          timeEl.textContent = Math.max(0, Math.ceil(timeLeft)) + 's'
          if (timeLeft <= 0) return end()
          render()
        }
      }

      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return Math.floor(total) },
        get over() { return over },
        get started() { return running },
      }
