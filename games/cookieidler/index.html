<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>饼干工坊</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #big { font-size:74px; cursor:pointer; user-select:none; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5)); transition:transform .08s; }
    #big:active { transform:scale(.9); }
    #cps { font-size:12px; font-weight:700; color:#8b93a7; }
    #helpers { width:100%; display:flex; flex-direction:column; gap:8px; }
    .helper {
      display:flex; align-items:center; gap:10px; background:#1a1d29;
      border:2px solid #2a2e3d; border-radius:10px; padding:8px 12px;
    }
    .helper .ico { font-size:24px; }
    .helper .info { flex:1; line-height:1.4; }
    .helper .info b { font-size:13px; }
    .helper .info span { display:block; font-size:11px; color:#8b93a7; font-weight:700; }
    .helper .have { font-size:13px; font-weight:900; color:var(--yellow); }
    .helper button {
      font-family:inherit; font-weight:900; font-size:12px; color:#eef1f6;
      background:var(--blue); border:2px solid #fff; border-radius:8px; padding:8px 12px; cursor:pointer;
    }
    .helper button:disabled { opacity:.35; cursor:not-allowed; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>饼干<b id="score">0</b></span>
      <span>时间<b id="time">60s</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="big">🍪</div>
    <div id="cps">每秒自动产出 0</div>
    <div id="helpers"></div>
  </div>
  <div id="overlay">
    <h1>🍪 饼干工坊</h1>
    <p>疯狂点击大饼干手动生产<br/>雇帮手（学徒/烤箱/工厂）自动产出<br/>60 秒结算总产量，看滚雪球多快</p>
    <button id="ov-btn">开门营业</button>
  </div>
  <script>
    (() => {
      const HELPERS = [
        { e: '🧑‍🍳', n: '小学徒', cost: 15, rate: 0.5 },
        { e: '🔥', n: '老烤箱', cost: 60, rate: 2.5 },
        { e: '🏭', n: '大工厂', cost: 240, rate: 10 },
      ]
      const big = document.getElementById('big')
      const cpsEl = document.getElementById('cps')
      const helpersEl = document.getElementById('helpers')
      const scoreEl = document.getElementById('score')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let cookies, total, counts, timeLeft, running, over
      let best = Number(localStorage.getItem('cookieidler-best') || 0)
      bestEl.textContent = best

      function cps() {
        return HELPERS.reduce((s, h, i) => s + counts[i] * h.rate, 0)
      }

      function start() {
        cookies = 0; total = 0
        counts = [0, 0, 0]
        timeLeft = 60
        running = true; over = false
        scoreEl.textContent = 0; timeEl.textContent = '60s'
        overlay.classList.add('hidden')
        render()
      }

      function end() {
        running = false; over = true
        if (total > best) { best = Math.floor(total); bestEl.textContent = best; localStorage.setItem('cookieidler-best', best) }
        overlay.querySelector('h1').textContent = '🏭 打烊结算'
        overlay.querySelector('p').innerHTML =
          '总产量 <b style="color:#ffd23f">' + Math.floor(total) + '</b> 块饼干 · 最佳 ' + best
        ovBtn.textContent = '明天再来'
        overlay.classList.remove('hidden')
      }

      function render() {
        scoreEl.textContent = Math.floor(cookies)
        cpsEl.textContent = '每秒自动产出 ' + cps().toFixed(1)
        helpersEl.innerHTML = ''
        HELPERS.forEach((h, i) => {
          const cost = Math.round(h.cost * Math.pow(1.35, counts[i]))
          const row = document.createElement('div')
          row.className = 'helper'
          row.innerHTML =
            '<span class="ico">' + h.e + '</span>' +
            '<span class="info"><b>' + h.n + ' ×' + counts[i] + '</b><span>每人每秒 +' + h.rate + '</span></span>' +
            '<span class="have">' + cost + '</span>'
          const b = document.createElement('button')
          b.textContent = '雇'
          b.disabled = cookies < cost
          b.onclick = () => {
            if (cookies < cost) return
            cookies -= cost
            counts[i]++
            render()
          }
          row.appendChild(b)
          helpersEl.appendChild(row)
        })
      }

      big.addEventListener('pointerdown', () => {
        if (!running || over) return
        cookies += 1
        total += 1
        scoreEl.textContent = Math.floor(cookies)
      })

      let lastT = 0
      function loop(t) {
        requestAnimationFrame(loop)
        if (!lastT) lastT = t
        const dt = Math.min(80, t - lastT)
        lastT = t
        if (running && !over) {
          const gain = cps() * dt / 1000
          cookies += gain
          total += gain
          timeLeft -= dt / 1000
          timeEl.textContent = Math.max(0, Math.ceil(timeLeft)) + 's'
          if (timeLeft <= 0) return end()
          render()
        }
      }

      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return Math.floor(total) },
        get over() { return over },
        get started() { return running },
      }

      cookies = 0; total = 0; counts = [0, 0, 0]
      timeLeft = 60; running = false; over = false
    })()
  </script>
</body>
</html>
