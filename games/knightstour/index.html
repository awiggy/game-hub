<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>骑士巡游</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board { width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(5,1fr);
      grid-template-rows:repeat(5,1fr); gap:4px; background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:6px; }
    .cell { border-radius:8px; background:#14161f; display:grid; place-items:center; font-size:22px; cursor:pointer; }
    .cell.legal { background:#1e2a52; outline:2px solid #5d84ff; }
    .cell.visited { background:#122a1c; color:#22b573; font-weight:900; }
    .cell.knight { font-size:30px; }
    #msg { font-size:14px; font-weight:900; min-height:20px; }
    #hint { font-size:12px; font-weight:700; color:#8b93a7; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>步数<b id="steps">0</b>/25</span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="board"></div>
    <div id="msg">点击任意格放置骑士</div>
    <div id="hint">马走日：先直两格再拐一格</div>
  </div>
  <div id="overlay">
    <h1>♞ 骑士巡游</h1>
    <p>点击任意格放下骑士<br/>按马走日规则移动，每格只停一次<br/>遍历全部 25 格即完成经典巡游</p>
    <button id="ov-btn">开始巡游</button>
  </div>
  <script>
    (() => {
      const N = 5
      const MOVES = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]]
      const boardEl = document.getElementById('board')
      const stepsEl = document.getElementById('steps')
      const bestEl = document.getElementById('best')
      const msgEl = document.getElementById('msg')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let visited, kr, kc, steps, bestRun, running, over
      let best = Number(localStorage.getItem('knightstour-best') || 0)
      bestEl.textContent = best

      const cellEls = []
      for (let r = 0; r < N; r++)
        for (let c = 0; c < N; c++) {
          const el = document.createElement('div')
          el.className = 'cell'
          el.onclick = () => click(r, c)
          boardEl.appendChild(el)
          cellEls.push(el)
        }

      function start() {
        visited = new Set()
        kr = -1; kc = -1; steps = 0; bestRun = 0
        running = true; over = false
        stepsEl.textContent = 0
        msgEl.textContent = '点击任意格放置骑士'
        overlay.classList.add('hidden')
        render()
      }

      function legal(r, c) {
        return r >= 0 && r < N && c >= 0 && c < N && !visited.has(r + ',' + c)
      }

      function end() {
        running = false; over = true
        if (steps > best) { best = steps; bestEl.textContent = best; localStorage.setItem('knightstour-best', best) }
        const full = steps === 25
        overlay.querySelector('h1').textContent = full ? '♞ 完美巡游！' : '🐴 无路可走'
        overlay.querySelector('p').innerHTML =
          '走过 <b style="color:#ffd23f">' + steps + '</b> / 25 格 · 最佳 ' + best
        ovBtn.textContent = '再来一次'
        overlay.classList.remove('hidden')
      }

      function render() {
        for (let r = 0; r < N; r++)
          for (let c = 0; c < N; c++) {
            const el = cellEls[r * N + c]
            const key = r + ',' + c
            el.className = 'cell'
            el.textContent = ''
            const order = visited.get(key)
            if (order !== undefined) {
              el.classList.add('visited')
              el.textContent = order
            }
            if (running && !over) {
              if (kr === -1 || (Math.abs(r - kr) * Math.abs(c - kc) === 2 && !visited.has(key))) el.classList.add('legal')
            }
            if (r === kr && c === kc) { el.classList.add('knight'); el.textContent = '♞' }
          }
      }

      function click(r, c) {
        if (!running || over) return
        if (kr === -1) {
          kr = r; kc = c; steps = 1
          visited.set(r + ',' + c, 1)
          stepsEl.textContent = 1
          msgEl.textContent = ''
          render()
          return
        }
        if (visited.has(r + ',' + c)) return
        if (Math.abs(r - kr) * Math.abs(c - kc) !== 2) {
          msgEl.textContent = '骑士要走日字（先直两格再拐一格）'
          return
        }
        kr = r; kc = c
        steps++
        visited.set(r + ',' + c, steps)
        stepsEl.textContent = steps
        msgEl.textContent = ''
        render()
        if (steps === 25) end()
        else {
          const any = MOVES.some(([dr, dc]) => legal(kr + dr, kc + dc))
          if (!any) end()
        }
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return steps },
        get over() { return over },
        get started() { return running },
      }

      visited = new Set(); kr = -1; kc = -1; steps = 0
      running = false; over = false
      render()
    })()
  </script>
</body>
</html>
