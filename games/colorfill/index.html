<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>填色拼图</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:min(88vw,400px); display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board { width:min(88vw,400px); aspect-ratio:1; display:grid; gap:2px;
      background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:6px; }
    #board div { border-radius:4px; }
    #palette { display:flex; gap:10px; }
    #palette button {
      width:46px; height:46px; border-radius:10px; border:3px solid #2a2e3d; cursor:pointer;
    }
    #palette button:active { transform:scale(.92); }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>关卡<b id="lv">1/3</b></span>
      <span>剩余步数<b id="left">0</b></span>
      <span>BEST<b id="best">—</b></span>
    </div>
    <div id="board"></div>
    <div id="palette"></div>
  </div>
  <div id="overlay">
    <h1>🎨 填色拼图</h1>
    <p>点击底部色块，染开与左上角相连的区域<br/>把全盘染成同色即过关<br/>三关面积递增，剩余步数越多分越高</p>
    <button id="ov-btn">开始游戏</button>
  </div>
  <script>
    (() => {
      const COLORS = ['#ff4d5e','#f5a623','#ffd23f','#22b573','#2f55e4','#8a5cf6']
      const LEVELS = [10, 12, 14]
      const boardEl = document.getElementById('board')
      const palEl = document.getElementById('palette')
      const lvEl = document.getElementById('lv')
      const leftEl = document.getElementById('left')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const SIZES = [10, 12, 14]

      let n, grid, moves, level, totalScore, running, over
      let best = Number(localStorage.getItem('colorfill-best') || 0)
      if (best) bestEl.textContent = best

      COLORS.forEach((c) => {
        const b = document.createElement('button')
        b.style.background = c
        b.onclick = () => fill(c)
        palEl.appendChild(b)
      })

      function load(nv) {
        level = nv
        n = SIZES[nv]
        moves = LEVELS[nv] + Math.min(6, nv * 2)
        grid = Array.from({ length: n }, () =>
          Array.from({ length: n }, () => COLORS[(Math.random() * 6) | 0]))
        // 保证开局不直接连成大片
        grid[0][0] = COLORS[0]
        lvEl.textContent = (nv + 1) + '/3'
        render()
      }

      function start() {
        totalScore = 0
        running = true; over = false
        overlay.classList.add('hidden')
        load(0)
      }

      function flood(color) {
        const old = grid[0][0]
        if (old === color) return false
        const seen = Array.from({ length: n }, () => Array(n).fill(false))
        const stack = [[0, 0]]
        seen[0][0] = true
        while (stack.length) {
          const [r, c] = stack.pop()
          grid[r][c] = color
          for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
            const nr = r + dr, nc = c + dc
            if (nr < 0 || nr >= n || nc < 0 || nc >= n || seen[nr][nc]) continue
            if (grid[nr][nc] === old) { seen[nr][nc] = true; stack.push([nr, nc]) }
          }
        }
        return true
      }

      function allSame() {
        const v = grid[0][0]
        return grid.every((row) => row.every((c) => c === v))
      }

      function fill(color) {
        if (!running || over) return
        if (!flood(color)) return
        moves--
        leftEl.textContent = moves
        render()
        if (allSame()) {
          const gain = moves * 50 + 200
          totalScore += gain
          if (level === SIZES.length - 1) {
            running = false; over = true
            if (totalScore > best) { best = totalScore; bestEl.textContent = best; localStorage.setItem('colorfill-best', best) }
            overlay.querySelector('h1').textContent = '🎨 全部染满'
            overlay.querySelector('p').innerHTML = '总得分 <b style="color:#ffd23f">' + totalScore + '</b> · 最佳 ' + best
            ovBtn.textContent = '再来一局'
            overlay.classList.remove('hidden')
          } else {
            msg('✓ 过关 +' + gain)
            setTimeout(() => load(level + 1), 700)
          }
          return
        }
        if (moves <= 0) {
          running = false; over = true
          overlay.querySelector('h1').textContent = '😵 步数用完'
          overlay.querySelector('p').innerHTML = '差一点点！总得分 ' + totalScore
          ovBtn.textContent = '再来一局'
          overlay.classList.remove('hidden')
        }
      }

      function msg(t) {
        leftEl.parentElement.title = t
        lvEl.textContent = (level + 1) + '/3 · ' + t
        setTimeout(() => { lvEl.textContent = (level + 1) + '/3' }, 650)
      }

      function render() {
        leftEl.textContent = moves
        boardEl.style.gridTemplateColumns = 'repeat(' + n + ',1fr)'
        boardEl.style.gridTemplateRows = 'repeat(' + n + ',1fr)'
        boardEl.innerHTML = ''
        for (let r = 0; r < n; r++)
          for (let c = 0; c < n; c++) {
            const el = document.createElement('div')
            el.style.background = grid[r][c]
            boardEl.appendChild(el)
          }
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return totalScore },
        get over() { return over },
        get started() { return running },
      }

      n = 10; grid = []; moves = 0; level = 0; totalScore = 0; running = false; over = false
    })()
  </script>
</body>
</html>
