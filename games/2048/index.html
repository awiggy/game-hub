<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>数字合合乐 2048</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; overflow: hidden;
    }
    #wrap { width: min(92vw, 440px, calc(100vh - 140px)); position: relative; }
    #bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    #bar h1 { font-size: 22px; letter-spacing: 2px; text-shadow: 3px 3px 0 var(--blue); }
    .scores { display: flex; gap: 8px; }
    .score-box {
      background: #1a1d29; border: 2px solid #2a2e3d; border-radius: 8px;
      padding: 4px 14px; text-align: center; min-width: 74px;
    }
    .score-box span { display: block; font-size: 10px; font-weight: 700; color: #8b93a7; letter-spacing: 1px; }
    .score-box b { font-size: 18px; color: var(--yellow); }
    #new-game {
      font-family: inherit; font-weight: 700; font-size: 13px;
      background: var(--blue); color: #fff; border: 2px solid #fff;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6); border-radius: 8px;
      padding: 8px 16px; cursor: pointer;
    }
    #new-game:active { transform: translate(2px, 2px); box-shadow: none; }
    #board {
      position: relative;
      background: #1a1d29; border: 3px solid #2a2e3d; border-radius: 12px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      padding: 10px; aspect-ratio: 1;
    }
    .cell-bg {
      background: #14161f; border-radius: 8px;
    }
    .tile {
      position: absolute; display: grid; place-items: center;
      border-radius: 8px; font-weight: 900; color: #fff;
      transition: left 0.12s ease, top 0.12s ease;
      user-select: none;
    }
    .tile.pop { animation: pop 0.14s ease; }
    @keyframes pop {
      0% { transform: scale(0.6); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    #overlay {
      position: absolute; inset: 0; border-radius: 12px;
      background: rgba(15, 17, 24, 0.85);
      display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; text-align: center;
    }
    #overlay.hidden { display: none; }
    #overlay h2 { font-size: 26px; letter-spacing: 3px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; }
    #overlay button {
      background: var(--yellow); color: #14161f; font-family: inherit; font-weight: 900;
      border: 2px solid #14161f; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
      font-size: 15px; padding: 9px 28px; border-radius: 8px; cursor: pointer;
    }
    #overlay button:active { transform: translate(2px, 2px); box-shadow: none; }

    /* Crafted pixel edition: the playable pieces, not just the surrounding UI. */
    :root{--ink:#48533d;--accent:#4e854d;--paper:#fff9e7;--edge:#6f9250;--page:#edf2d9}
    body{background:var(--page);color:var(--ink);background-image:radial-gradient(#ffffff70 1px,transparent 1px);background-size:12px 12px;overflow:auto;min-height:100%;height:auto;padding:24px 12px;gap:10px}
    body::before{content:'';position:fixed;inset:0;box-shadow:inset 0 0 100px #ffffff70;pointer-events:none;z-index:-1}
    button{font-family:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #d26c48;outline-offset:3px}
    #wrap{flex-shrink:0;max-width:100%}
    #hud,#bar{position:static;color:var(--ink);letter-spacing:0;font-size:11px;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 4px}
    #hud b,#bar b{color:var(--accent);font-size:17px}canvas{image-rendering:pixelated;border:4px solid var(--edge);border-radius:8px;box-shadow:0 5px 0 color-mix(in srgb,var(--edge),transparent 55%);background:var(--paper);max-width:100%;object-fit:contain}
    #overlay{z-index:20;background:color-mix(in srgb,var(--paper) 96%,transparent);color:var(--ink);border-radius:12px;gap:12px;padding:22px}
    #overlay::before{content:'';width:90px;height:90px;background:var(--mascot) center/contain no-repeat;image-rendering:pixelated}
    #overlay h1,#overlay h2{font-size:25px;letter-spacing:1px;text-shadow:none;color:var(--ink)}
    #overlay p{color:var(--ink);font-size:13px;line-height:1.9;max-width:340px}#overlay p b{color:var(--accent)!important}
    #overlay button,#new-game,#bar button,#pads button,.up,.garden-controls button{background:var(--accent);color:#fffaf0;border:2px solid var(--ink);box-shadow:0 3px 0 #0002;border-radius:7px;font-weight:800;cursor:pointer}
    #overlay button:hover{filter:brightness(1.1)}#overlay.hidden{display:none}
    .pixel-sprite{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
    .scene-title{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:5px}
    .scene-title strong{font-size:23px;letter-spacing:1px;display:block}.scene-title small{display:block;font-size:11px;line-height:1.8;letter-spacing:1px;color:var(--accent)}
    .scene-title svg{width:54px;height:54px;flex-shrink:0}.play-note{font-size:11px;text-align:center;color:var(--ink);line-height:1.7;margin-top:9px}
    .landscape{height:92px;position:relative;overflow:hidden;border-radius:10px 10px 0 0;background:linear-gradient(#a9dfdf 0 63%,#b7d878 63% 71%,#82b65e 71%);border:3px solid var(--edge);border-bottom:0}
    .landscape::before{content:'';position:absolute;left:15%;top:18px;width:40px;height:8px;background:#fffcec;box-shadow:8px -6px #fffcec,170px 5px #fffcec,178px -1px #fffcec}
    .landscape svg{position:absolute;bottom:0;width:76px;height:76px}.landscape svg:nth-child(2){left:2%;width:52px;height:52px}.landscape svg:nth-child(3){right:4%;width:44px;height:44px}.landscape svg:nth-child(4){right:15%;width:32px;height:32px}
    @media(max-width:480px){body{padding:14px 10px}.scene-title strong{font-size:20px}#hud b,#bar b{font-size:15px}.landscape{height:74px}.scene-title svg{width:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--page:#f8e7cd;--ink:#79543e;--accent:#b56c3e;--edge:#aa754c;--paper:#fff6df;--mascot:url("data:image/svg+xml,%3Csvg%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2032%2032%22%20class%3D%22pixel-sprite%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%227%22%20y%3D%229%22%20width%3D%2218%22%20height%3D%2220%22%20fill%3D%22%238e3540%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2212%22%20width%3D%2224%22%20height%3D%2214%22%20fill%3D%22%238e3540%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2210%22%20width%3D%2214%22%20height%3D%2217%22%20fill%3D%22%23d84b4e%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%2213%22%20width%3D%2220%22%20height%3D%2211%22%20fill%3D%22%23d84b4e%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2211%22%20width%3D%2215%22%20height%3D%2211%22%20fill%3D%22%23ff765f%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2213%22%20width%3D%224%22%20height%3D%225%22%20fill%3D%22%23ffbea0%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2211%22%20width%3D%225%22%20height%3D%222%22%20fill%3D%22%23ffbea0%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%226%22%20width%3D%223%22%20height%3D%226%22%20fill%3D%22%2372533e%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%224%22%20width%3D%229%22%20height%3D%224%22%20fill%3D%22%233c7949%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%224%22%20width%3D%226%22%20height%3D%222%22%20fill%3D%22%239bcd55%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2219%22%20width%3D%222%22%20height%3D%223%22%20fill%3D%22%23332f36%22%2F%3E%3Crect%20x%3D%2218%22%20y%3D%2219%22%20width%3D%222%22%20height%3D%223%22%20fill%3D%22%23332f36%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2219%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23fffdf0%22%2F%3E%3Crect%20x%3D%2218%22%20y%3D%2219%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23fffdf0%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2223%22%20width%3D%223%22%20height%3D%222%22%20fill%3D%22%23f4998a%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2223%22%20width%3D%223%22%20height%3D%222%22%20fill%3D%22%23f4998a%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2223%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%238f4d48%22%2F%3E%3C%2Fsvg%3E")}

          for(let i=0;i<6;i++)r(15-i*2,2+i*2,2+i*4,3,'#5c656c');r(6,14,23,17,'#9d4843');r(7,14,20,15,'#df775c');for(let i=9;i<27;i+=4)r(i,15,1,14,'#f59973');r(5,14,25,2,'#ffecbc');r(12,20,11,11,'#ffe8b4');r(14,21,7,10,'#975645');r(17,21,1,10,'#ffdb9e');r(14,23,7,1,'#ffdb9e');r(15,12,6,6,'#ffecbc');r(16,13,4,4,'#6aa7b5');

          round(4,4,24,24,'#986334');round(5,4,22,21,'#e6ac57');r(8,6,16,13,'#f9ce7b');r(9,7,9,2,'#ffe6a3');for(const [x,y] of [[10,11],[21,10],[17,18],[8,21]]){r(x,y,3,3,'#8f5a41');r(x,y,2,1,'#bc8650');}

        return a;
      }
      function sprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pixels(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function paint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pixels(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}

      const boardEl = document.getElementById('board')
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovTitle = document.getElementById('ov-title')
      const ovText = document.getElementById('ov-text')
      const ovBtn = document.getElementById('ov-btn')

      const SIZE = 4
      let grid, score, won, finished = false, celebrating = false
      let best = Number(localStorage.getItem('2048-best') || 0)
      bestEl.textContent = best

      function tileStyle(v) {
        const map={2:['#ffefc7','#79543e'],4:['#ffdc98','#79543e'],8:['#f7b56e','#78432e'],16:['#f28b60','#663a2e'],32:['#dc6751','#fff8da'],64:['#bc4d50','#fff6dc'],128:['#e9c557','#654e2e'],256:['#b7cc60','#425c3d'],512:['#70b685','#254f48'],1024:['#568e9f','#fff8dc'],2048:['#dd9850','#593b2e']};
        return map[v]||['#9b699a','#fff6dc']
      }

      function fontOfSize(v) {
        const len = String(v).length
        return len >= 5 ? '0.85em' : len === 4 ? '1em' : '1.25em'
      }

      function cellRect(r, c) {
        const gap = 10, pad = 10
        const size = (boardEl.clientWidth - pad * 2 - gap * 3) / SIZE
        return {
          x: pad + c * (size + gap),
          y: pad + r * (size + gap),
          size,
        }
      }

      function render(popCells) {
        boardEl.querySelectorAll('.tile').forEach((t) => t.remove())
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const v = grid[r][c]
            if (!v) continue
            const { x, y, size } = cellRect(r, c)
            const el = document.createElement('div')
            el.className = 'tile' + (popCells && popCells.has(r * SIZE + c) ? ' pop' : '')
            const [bg, fg] = tileStyle(v)
            el.style.cssText =
              `grid-column:${c+1};grid-row:${r+1};` +
              `background:${bg};color:${fg};font-size:${fontSizeOf(v)}`
            el.textContent = v
            boardEl.appendChild(el)
          }
        }
      }

      function fontSizeOf(v) {
        const s = cellRect(0, 0).size
        const len = String(v).length
        const ratio = len >= 5 ? 0.38 : len === 4 ? 0.44 : 0.55
        return 'clamp(14px, calc(' + (ratio * 25) + 'cqw - ' + (ratio * 12.5) + 'px), 54px)'
      }

      function addRandomTile() {
        const empties = []
        for (let r = 0; r < SIZE; r++)
          for (let c = 0; c < SIZE; c++)
            if (!grid[r][c]) empties.push([r, c])
        if (!empties.length) return null
        const [r, c] = empties[(Math.random() * empties.length) | 0]
        grid[r][c] = Math.random() < 0.9 ? 2 : 4
        return r * SIZE + c
      }

      // 方向统一化为「左」，旋转网格
      function rotate(g, times) {
        let out = g.map((row) => [...row])
        for (let t = 0; t < times; t++) {
          const n = out.map((row) => [...row])
          for (let r = 0; r < SIZE; r++)
            for (let c = 0; c < SIZE; c++)
              n[r][c] = out[c][SIZE - 1 - r]
          out = n
        }
        return out
      }

      function canMove() {
        for (let r = 0; r < SIZE; r++)
          for (let c = 0; c < SIZE; c++) {
            if (!grid[r][c]) return true
            if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return true
            if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return true
          }
        return false
      }

      // dirs: left=0, up=1, right=2, down=3（旋转次数）
      function move(rot) {
        const original = grid.map((row) => [...row])
        let g = rotate(grid, rot)
        let moved = false
        let gained = 0

        for (let r = 0; r < SIZE; r++) {
          let row = g[r].filter((v) => v)
          for (let i = 0; i + 1 < row.length; i++) {
            if (row[i] === row[i + 1]) {
              row[i] *= 2
              gained += row[i]
              row.splice(i + 1, 1)
            }
          }
          while (row.length < SIZE) row.push(0)
          g[r] = row
        }

        g = rotate(g, (SIZE - rot) % SIZE)

        if (JSON.stringify(g) !== JSON.stringify(original)) {
          grid = g
          moved = true
          if (gained) {
            score += gained
            scoreEl.textContent = score
            if (score > best) {
              best = score
              bestEl.textContent = best
              localStorage.setItem('2048-best', best)
            }
          }
        }
        return { moved, gained }
      }

      function showOverlay(title, text) {
        ovTitle.textContent = title
        ovText.textContent = text
        overlay.classList.remove('hidden')
      }

      function handleMove(rot) {
        if (!overlay.classList.contains('hidden')) return
        const { moved } = move(rot)
        if (!moved) return
        const pop = new Set()
        const newIdx = addRandomTile()
        if (newIdx !== null) pop.add(newIdx)
        render(pop)

        const has2048 = grid.some((row) => row.includes(2048))
        if (has2048 && !won) {
          won = true
          showOverlay('🏆 达成 2048！', '当前得分 ' + score + '，可以继续挑战更高分')
          ovBtn.textContent = '继续游戏'
          celebrating = true
          return
        }
        if (!canMove()) {
          finished = true; ovBtn.textContent = '再来一局'
          showOverlay('游戏结束', '最终得分 ' + score + ' · 最高分 ' + best)
        }
      }

      function reset() {
        grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0))
        score = 0
        won = false; finished = false; celebrating = false
        scoreEl.textContent = 0
        addRandomTile()
        addRandomTile()
        overlay.classList.add('hidden')
        render()
      }

      document.getElementById('new-game').addEventListener('click', reset)
      ovBtn.addEventListener('click', () => {
        if (celebrating) { celebrating = false; overlay.classList.add('hidden'); if (!canMove()) { finished = true; ovBtn.textContent = '再来一局'; showOverlay('游戏结束', '最终得分 ' + score) } }
        else reset()
      })

      const keyRot = {
        ArrowLeft: 0, KeyA: 0,
        ArrowUp: 1, KeyW: 1,
        ArrowRight: 2, KeyD: 2,
        ArrowDown: 3, KeyS: 3,
      }
      window.addEventListener('keydown', (e) => {
        const rot = keyRot[e.code]
        if (rot !== undefined) {
          e.preventDefault()
          handleMove(rot)
        }
      })

      let tx = 0, ty = 0
      window.addEventListener('touchstart', (e) => {
        tx = e.touches[0].clientX; ty = e.touches[0].clientY
      }, { passive: true })
      window.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - tx
        const dy = e.changedTouches[0].clientY - ty
        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return
        let rot
        if (Math.abs(dx) > Math.abs(dy)) rot = dx > 0 ? 2 : 0
        else rot = dy > 0 ? 3 : 1
        handleMove(rot)
      }, { passive: true })

      window.addEventListener('resize', () => render())

      window.__hub = {
        get score() { return score },
        get over() { return finished },
        get started() { return true },
      }

      reset()
    })()
  </script>
