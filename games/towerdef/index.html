<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>像素塔防</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; display:flex; flex-direction:column; gap:8px; align-items:center; }
    #hud { width:min(92vw,480px); display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:70vh; cursor:pointer; }
    #bar { width:min(92vw,480px); display:flex; gap:10px; align-items:center; }
    #next { flex:1; font-family:inherit; font-weight:900; font-size:14px; color:#eef1f6; background:var(--blue);
      border:2px solid #fff; border-radius:10px; padding:10px; cursor:pointer; }
    #next:disabled { opacity:.5; cursor:not-allowed; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.88); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>金币<b id="gold">120</b></span>
      <span>波次<b id="wave">0</b></span>
      <span>命<b id="lives">♥×10</b></span>
      <span>击杀<b id="kills">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="480" height="480"></canvas>
    <div id="bar"><button id="next">⚔ 召唤第 1 波（5s）</button></div>
  </div>
  <div id="overlay">
    <h1>🗼 像素塔防</h1>
    <p>点击路径旁空地建炮塔（50 金币）<br/>击杀得金币，敌人到终点扣命<br/>波与波之间抓紧布防</p>
    <button id="ov-btn">开始守城</button>
  </div>
  <script>
    (() => {
      const CELL = 40
      const COLS = 12, ROWS = 12
      const PATH = [[0,2],[3,2],[3,5],[1,5],[1,9],[6,9],[6,4],[9,4],[9,7],[11,7]]
      const onPath = new Set()
      for (let i = 0; i < PATH.length - 1; i++) {
        let r = PATH[i][0], c = PATH[i][1]
        const er = PATH[i + 1][0], ec = PATH[i + 1][1]
        onPath.add(r + ',' + c)
        while (r !== er || c !== ec) {
          if (r !== er) r += Math.sign(er - r)
          else c += Math.sign(ec - c)
          onPath.add(r + ',' + c)
        }
      }
      const END = PATH[PATH.length - 1]
      const PATH_LEN = PATH.length - 1

      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const goldEl = document.getElementById('gold')
      const waveEl = document.getElementById('wave')
      const livesEl = document.getElementById('lives')
      const killsEl = document.getElementById('kills')
      const bestEl = document.getElementById('best')
      const nextBtn = document.getElementById('next')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let towers, enemies, bullets, gold, wave, lives, kills, running, over, spawnQueue, autoNext, frame
      let best = Number(localStorage.getItem('towerdef-best') || 0)
      bestEl.textContent = best

      function pathPos(t) {
        const i = Math.min(PATH_LEN - 1, t | 0)
        const f = t - i
        const r1 = PATH[i][0], c1 = PATH[i][1], r2 = PATH[i + 1][0], c2 = PATH[i + 1][1]
        return { x: (c1 + (c2 - c1) * f) * CELL + CELL / 2, y: (r1 + (r2 - r1) * f) * CELL + CELL / 2 }
      }

      function start() {
        towers = []; enemies = []; bullets = []
        gold = 120; wave = 0; lives = 10; kills = 0
        spawnQueue = 0; autoNext = 300; frame = 0
        running = true; over = false
        goldEl.textContent = gold; waveEl.textContent = 0
        livesEl.textContent = '♥×10'; killsEl.textContent = 0
        nextBtn.disabled = false
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (kills > best) { best = kills; bestEl.textContent = best; localStorage.setItem('towerdef-best', best) }
        overlay.querySelector('h1').textContent = '💥 城池失守'
        overlay.querySelector('p').innerHTML = '守到第 ' + wave + ' 波 · 击杀 <b style="color:#ffd23f">' + kills + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function nextWave() {
        wave++
        waveEl.textContent = wave
        spawnQueue = 4 + wave * 2
        nextBtn.disabled = true
        nextBtn.textContent = '波次进行中…'
      }

      cv.addEventListener('pointerdown', (e) => {
        if (!running || over) return
        const r = cv.getBoundingClientRect()
        const c = Math.floor((e.clientX - r.left) / r.width * COLS)
        const rw = Math.floor((e.clientY - r.top) / r.height * ROWS)
        if (rw < 0 || rw >= ROWS || c < 0 || c >= COLS) return
        if (onPath.has(rw + ',' + c)) return
        if (towers.some((t) => t.r === rw && t.c === c)) return
        if (gold < 50) return
        gold -= 50
        goldEl.textContent = gold
        towers.push({ r: rw, c, cd: 0 })
      })

      nextBtn.addEventListener('click', () => { if (running && !over && spawnQueue === 0) nextWave() })

      function step() {
        frame++
        if (spawnQueue === 0) {
          if (autoNext === 300) nextBtn.textContent = '⚔ 召唤第 ' + (wave + 1) + ' 波（' + Math.ceil(autoNext / 60) + 's）'
          autoNext--
          if (autoNext <= 0) nextWave()
        } else if (frame % 50 === 0) {
          spawnQueue--
          const hp = 20 + wave * 12
          enemies.push({ t: 0, hp, max: hp, v: 0.006 + wave * 0.0008 })
        }
        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i]
          en.t += en.v
          if (en.t >= PATH_LEN) {
            enemies.splice(i, 1)
            lives--
            livesEl.textContent = '♥×' + Math.max(0, lives)
            if (lives <= 0) return end()
          }
        }
        for (const t of towers) {
          t.cd--
          if (t.cd > 0 || !enemies.length) continue
          const tx = t.c * CELL + CELL / 2, ty = t.r * CELL + CELL / 2
          let target = null, bd = 130
          for (const en of enemies) {
            const p = pathPos(en.t)
            const d = Math.hypot(p.x - tx, p.y - ty)
            if (d < bd) { bd = d; target = en }
          }
          if (target) {
            t.cd = 40
            bullets.push({ x: tx, y: ty, target })
          }
        }
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i]
          if (!enemies.includes(b.target)) { bullets.splice(i, 1); continue }
          const p = pathPos(b.target.t)
          const dx = p.x - b.x, dy = p.y - b.y
          const d = Math.hypot(dx, dy)
          if (d < 9) {
            b.target.hp -= 12
            bullets.splice(i, 1)
            if (b.target.hp <= 0) {
              enemies.splice(enemies.indexOf(b.target), 1)
              kills++
              gold += 5
              killsEl.textContent = kills
              goldEl.textContent = gold
            }
            continue
          }
          b.x += dx / d * 8
          b.y += dy / d * 8
        }
        if (spawnQueue === 0 && !enemies.length && nextBtn.disabled) {
          autoNext = 300
          nextBtn.disabled = false
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, cv.width, cv.height)
        ctx.fillStyle = '#1a1d29'
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2)
        ctx.strokeStyle = '#3a4152'
        ctx.lineWidth = CELL - 10
        ctx.lineJoin = 'round'
        ctx.beginPath()
        PATH.forEach((pt, i) => {
          const x = pt[1] * CELL + CELL / 2, y = pt[0] * CELL + CELL / 2
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
        })
        ctx.stroke()
        ctx.font = '22px sans-serif'
        ctx.fillText('🏰', END[1] * CELL + 6, END[0] * CELL + 30)
        for (const t of towers) {
          ctx.font = '20px sans-serif'
          ctx.fillText('🔫', t.c * CELL + 8, t.r * CELL + 28)
        }
        for (const en of enemies) {
          const p = pathPos(en.t)
          ctx.font = '18px sans-serif'
          ctx.fillText('👹', p.x - 9, p.y + 6)
          ctx.fillStyle = '#3a1d24'
          ctx.fillRect(p.x - 12, p.y - 18, 24, 4)
          ctx.fillStyle = '#ff4d5e'
          ctx.fillRect(p.x - 12, p.y - 18, 24 * en.hp / en.max, 4)
        }
        ctx.fillStyle = '#ffd23f'
        for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4)
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return kills },
        get over() { return over },
        get started() { return running },
      }

      towers = []; enemies = []; bullets = []
      gold = 120; wave = 0; lives = 10; kills = 0
      spawnQueue = 0; autoNext = 300; frame = 0; running = false; over = false
      loop()
    })()
  </script>
</body>
</html>
