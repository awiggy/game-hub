="4" height="4" fill="#55705c"/><rect x="32" y="40" width="4" height="4" fill="#fff6dc"/><rect x="36" y="40" width="4" height="4" fill="#fff6dc"/><rect x="40" y="40" width="4" height="4" fill="#55705c"/><rect x="44" y="40" width="4" height="4" fill="#34534f"/><rect x="48" y="40" width="4" height="4" fill="#34534f"/><rect x="52" y="40" width="4" height="4" fill="#55705c"/><rect x="56" y="40" width="4" height="4" fill="#fff6dc"/><rect x="60" y="40" width="4" height="4" fill="#fff6dc"/><rect x="64" y="40" width="4" height="4" fill="#fff6dc"/><rect x="68" y="40" width="4" height="4" fill="#55705c"/><rect x="28" y="44" width="4" height="4" fill="#55705c"/><rect x="32" y="44" width="4" height="4" fill="#55705c"/><rect x="36" y="44" width="4" height="4" fill="#55705c"/><rect x="40" y="44" width="4" height="4" fill="#55705c"/><rect x="44" y="44" width="4" height="4" fill="#55705c"/><rect x="48" y="44" width="4" height="4" fill="#55705c"/><rect x="52" y="44" width="4" height="4" fill="#55705c"/><rect x="56" y="44" width="4" height="4" fill="#55705c"/><rect x="60" y="44" width="4" height="4" fill="#55705c"/><rect x="64" y="44" width="4" height="4" fill="#55705c"/><rect x="68" y="44" width="4" height="4" fill="#55705c"/><path d="M12 64h76v5H12z" fill="#c2d9a5"/></svg>
    <h1>像素塔防</h1>
    <p>点击路径旁空地建炮塔（50 金币）<br/>击杀得金币，敌人到终点扣命<br/>每波结束后自由布防，再手动召唤</p>
    <button id="ov-btn">开始守城</button>
  </section></div><script>
    (() => {
      const CELL = 40
      const COLS = 12, ROWS = 12
      const PATH = [[0,2],[3,2],[3,5],[1,5],[1,9],[6,9],[6,4],[9,4],[9,7],[11,7]]
      const onPath = new Set()
      for (let i = 0; i < PATH.length - 1; i++) {
        let r = PATH[i][0], c = PATH[i][1]
        const er = PATH[i + 1][0], ec = PATH[i + 1][1]
        onPath.add(r + ',' + c)
        while (r !== er || c !== ec) {
          if (r !== er) r += Math.sign(er - r)
          else c += Math.sign(ec - c)
          onPath.add(r + ',' + c)
        }
      }
      const END = PATH[PATH.length - 1]
      const PATH_LEN = PATH.length - 1

      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const goldEl = document.getElementById('gold')
      const waveEl = document.getElementById('wave')
      const livesEl = document.getElementById('lives')
      const killsEl = document.getElementById('kills')
      const bestEl = document.getElementById('best')
      const nextBtn = document.getElementById('next')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let towers, enemies, bullets, gold, wave, lives, kills, running, over, spawnQueue, autoNext, frame
      let best=0;try{best=Number(localStorage.getItem('towerdef-best'))||0}catch{}
      bestEl.textContent = best

      function pathPos(t) {
        const i = Math.min(PATH_LEN - 1, t | 0)
        const f = t - i
        const r1 = PATH[i][0], c1 = PATH[i][1], r2 = PATH[i + 1][0], c2 = PATH[i + 1][1]
        return { x: (c1 + (c2 - c1) * f) * CELL + CELL / 2, y: (r1 + (r2 - r1) * f) * CELL + CELL / 2 }
      }

      function start() {
        towers = []; enemies = []; bullets = []
        gold = 120; wave = 0; lives = 10; kills = 0
        spawnQueue = 0; autoNext = 300; frame = 0
        running = true; over = false
        goldEl.textContent = gold; waveEl.textContent = 0
        livesEl.textContent = '♥×10'; killsEl.textContent = 0
        nextBtn.disabled = false;nextBtn.textContent='召唤第 '+(wave+1)+' 波'
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (kills > best) { best = kills; bestEl.textContent = best; (()=>{try{localStorage.setItem('towerdef-best',best)}catch{}})() }
        overlay.querySelector('h1').textContent = '💥 城池失守'
        overlay.querySelector('p').innerHTML = '守到第 ' + wave + ' 波 · 击杀 <b >' + kills + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function nextWave() {
        if(!running||over||spawnQueue>0||enemies.length)return
        wave++
        waveEl.textContent = wave
        spawnQueue = 4 + wave * 2
        nextBtn.disabled = true
        nextBtn.textContent = '波次进行中…'
      }

      cv.addEventListener('pointerdown', (e) => {
        if (!running || over) return
        const r = cv.getBoundingClientRect()
        const c = Math.floor((e.clientX - r.left) / r.width * COLS)
        const rw = Math.floor((e.clientY - r.top) / r.height * ROWS)
        if (rw < 0 || rw >= ROWS || c < 0 || c >= COLS) return
        if (onPath.has(rw + ',' + c)) { document.getElementById('build-msg').textContent='道路留给小怪，请选旁边的草地'; return }
        if (towers.some((t) => t.r === rw && t.c === c)) return
        if (gold < 50) { document.getElementById('build-msg').textContent='还差一些金币，击败小怪就能获得'; return }
        gold -= 50
        goldEl.textContent = gold
        towers.push({ r: rw, c, cd: 0 });document.getElementById('build-msg').textContent='炮塔就位！可继续建塔或召唤下一波'
      })

      nextBtn.addEventListener('click', () => { if (running && !over && spawnQueue === 0) nextWave() })

      function step() {
        frame++
        if (spawnQueue > 0 && frame % 50 === 0) {
          spawnQueue--
          const hp = 20 + wave * 12
          enemies.push({ t: 0, hp, max: hp, v: 0.006 + wave * 0.0008 })
        }
        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i]
          en.t += en.v
          if (en.t >= PATH_LEN) {
            enemies.splice(i, 1)
            lives--
            livesEl.textContent = '♥×' + Math.max(0, lives)
            if (lives <= 0) return end()
          }
        }
        for (const t of towers) {
          t.cd--
          if (t.cd > 0 || !enemies.length) continue
          const tx = t.c * CELL + CELL / 2, ty = t.r * CELL + CELL / 2
          let target = null, bd = 130
          for (const en of enemies) {
            const p = pathPos(en.t)
            const d = Math.hypot(p.x - tx, p.y - ty)
            if (d < bd) { bd = d; target = en }
          }
          if (target) {
            t.cd = 40
            bullets.push({ x: tx, y: ty, target })
          }
        }
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i]
          if (!enemies.includes(b.target)) { bullets.splice(i, 1); continue }
          const p = pathPos(b.target.t)
          const dx = p.x - b.x, dy = p.y - b.y
          const d = Math.hypot(dx, dy)
          if (d < 9) {
            b.target.hp -= 12
            bullets.splice(i, 1)
            if (b.target.hp <= 0) {
              enemies.splice(enemies.indexOf(b.target), 1)
              kills++
              gold += 5
              killsEl.textContent = kills
              goldEl.textContent = gold
            }
            continue
          }
          b.x += dx / d * 8
          b.y += dy / d * 8
        }
        if (spawnQueue === 0 && !enemies.length && nextBtn.disabled) {
          autoNext = 300
          nextBtn.disabled = false;nextBtn.textContent='召唤第 '+(wave+1)+' 波'
        }
      }


      function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
      function cloud(x,y){box(x+8,y,32,8,'#fffbed');box(x,y+8,56,12,'#fffbed')}
      function sky(){box(0,0,cv.width,cv.height,'#b0dce4');cloud(28,55);cloud(cv.width-90,110);for(let i=0;i<8;i++){box(i*80,cv.height-90,65,90,'#c2d9a5');box(i*80+15,cv.height-106,35,16,'#c2d9a5')}box(0,cv.height-20,cv.width,20,'#8db685')}
      function disc(x,y,r,c){for(let yy=-r;yy<r;yy+=3){const xx=Math.floor(Math.sqrt(Math.max(0,r*r-yy*yy))/3)*3;box(x-xx,y+yy,xx*2,3,c)}}
      function kid(x,y){box(x+6,y,20,6,'#6b9162');box(x+4,y+6,24,18,'#ffdfaa');box(x+10,y+12,4,4,'#3d5647');box(x+20,y+12,4,4,'#3d5647');box(x+4,y+24,24,20,'#e88c5f');box(x+4,y+44,8,8,'#526f59');box(x+20,y+44,8,8,'#526f59')}
      function pine(x,y){box(x-4,y+12,8,16,'#95744b');box(x-12,y-22,24,10,'#86bda5');box(x-20,y-12,40,10,'#6ca08c');box(x-26,y-2,52,15,'#538574');box(x-10,y-22,16,5,'#f0fbef');box(x-18,y-12,26,5,'#f0fbef');box(x-24,y-2,34,5,'#f0fbef')}

      function draw(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=c*CELL,y=r*CELL;box(x,y,CELL,CELL,(r+c)%2?'#b4ce92':'#bdd79c');if(onPath.has(r+','+c)){box(x,y,CELL,CELL,'#e6ce9b');box(x+4,y+12,12,4,'#d6b981');box(x+22,y+28,10,4,'#d6b981')}else{box(x+8,y+8,3,7,'#a1bf7d');box(x+5,y+11,9,3,'#a1bf7d')}}const ex=END[1]*CELL,ey=END[0]*CELL;box(ex+4,ey+6,32,32,'#f5e2b3');box(ex+2,ey+3,8,12,'#da9c7c');box(ex+16,ey+3,8,12,'#da9c7c');box(ex+30,ey+3,8,12,'#da9c7c');box(ex+15,ey+24,11,14,'#8c7956');for(const t of towers){const x=t.c*CELL,y=t.r*CELL;box(x+5,y+26,30,9,'#8b7958');box(x+9,y+12,22,18,'#6d9b88');box(x+12,y+14,16,5,'#a7cbb0');box(x+17,y+2,7,18,'#4a786a')}for(const en of enemies){const p=pathPos(en.t);box(p.x-12,p.y-8,24,21,'#db9976');box(p.x-8,p.y-13,16,6,'#e9b18a');box(p.x-8,p.y-3,5,5,'#fff0d3');box(p.x+3,p.y-3,5,5,'#fff0d3');box(p.x-6,p.y-2,2,3,'#495c4e');box(p.x+5,p.y-2,2,3,'#495c4e');box(p.x-12,p.y-20,24,4,'#bba27b');box(p.x-12,p.y-20,24*en.hp/en.max,4,'#689970')}for(const b of bullets){box(b.x-3,b.y-3,6,6,'#fff4c4');box(b.x-1,b.y-1,3,3,'#d69a58')}}

      let lastTick=null,lag=0
      function loop(t){requestAnimationFrame(loop);if(lastTick===null)lastTick=t;lag+=Math.min(100,Math.max(0,t-lastTick));lastTick=t;while(lag>=1000/60){if(running&&!over)step();lag-=1000/60}draw()}

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return kills },
        get over() { return over },
        get started() { return running || over },
      }

      towers = []; enemies = []; bullets = []
      gold = 120; wave = 0; lives = 10; kills = 0
      spawnQueue = 0; autoNext = 300; frame = 0; running = false; over = false
      requestAnimationFrame(loop)
    })()
  </script></body></html>
