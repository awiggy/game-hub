// Reference: wanghao221/moyu @ 15e88e245ddfbb4c7f0a9064202b5f50674296fb
// Adapted to a self-contained page with round locking, restart, keyboard input and __hub state.
'use strict';
const config = {"id": "diceduel", "dice": true, "target": 5, "labels": ["玩家一", "玩家二"], "recordLabel": "累计完成场次", "ready": "准备好，一起掷骰！"};
const $ = (id) => document.getElementById(id);
const buttons = [...document.querySelectorAll('[data-play]')];
const faces = config.dice ? ['⚀','⚁','⚂','⚃','⚄','⚅'] : ['✊','✋','✌️'];
const names = ['石头','布','剪刀'];
const storageKey = 'hub-' + config.id + '-record';
let points = [0,0], rounds = 0, started = false, over = false, busy = false, timer = null, record = 0;
try { const value = Number(localStorage.getItem(storageKey)); if (Number.isSafeInteger(value) && value >= 0) record = value; } catch {}
$('name0').textContent = config.labels[0];
$('name1').textContent = config.labels[1];
function render() {
  $('score0').textContent = points[0]; $('score1').textContent = points[1];
  $('round').textContent = started ? '第 ' + rounds + ' 回合 · 先得 ' + config.target + ' 分获胜' : '准备开始';
  $('record').textContent = config.recordLabel + ' ' + record;
  buttons.forEach((button) => { button.disabled = !started || over || busy; });
  document.querySelector('.players').classList.toggle('rolling', busy);
}
function reset() {
  clearTimeout(timer); timer = null;
  points = [0,0]; rounds = 0; started = true; over = false; busy = false;
  $('overlay').hidden = true;
  $('symbol0').innerHTML=config.dice?pxDice(1):pxHand(0); $('symbol1').innerHTML=config.dice?pxDice(1):pxHand(2);
  $('status').textContent = config.ready;
  $('history').replaceChildren();
  render(); buttons[0].focus({ preventScroll:true });
}
function randomFace() { return Math.floor(Math.random() * faces.length); }
function play(choice) {
  if (!started || over || busy) return;
  busy = true;
  // Freeze both choices before the reveal; further clicks cannot change this round.
  const first = config.dice ? randomFace() : choice;
  const second = randomFace();
  $('symbol0').innerHTML=config.dice?pxDice(1):pxHand(first);
  $('symbol1').innerHTML=config.dice?pxDice(1):pxSprite('mole');
  $('status').textContent = config.dice ? '骰子转动中…' : '电脑正在出拳…';
  render();
  timer = setTimeout(() => {
    timer = null; busy = false; rounds++;
    $('symbol0').innerHTML=config.dice?pxDice(first+1):pxHand(first); $('symbol1').innerHTML=config.dice?pxDice(second+1):pxHand(second);
    const winner = first === second ? -1 : config.dice ? (first > second ? 0 : 1) : ((first - second + 3) % 3 === 1 ? 0 : 1);
    if (winner >= 0) points[winner]++;
    const message = winner < 0 ? '平局，双方不加分' : config.labels[winner] + ' +1 分';
    $('status').textContent = message;
    const item = document.createElement('li');
    const detail = document.createElement('span'); const outcome = document.createElement('b');
    detail.textContent = '#' + rounds + '  ' + (config.dice ? (first + 1) + ' : ' + (second + 1) : names[first] + ' / ' + names[second]);
    outcome.textContent = winner < 0 ? '平局' : config.labels[winner] + '胜';
    item.append(detail, outcome); $('history').prepend(item);
    while ($('history').children.length > 4) $('history').lastElementChild.remove();
    if (points.some((score) => score >= config.target)) {
      over = true;
      const champion = points[0] >= config.target ? 0 : 1;
      if (config.dice || champion === 0) {
        record++;
        try { localStorage.setItem(storageKey, String(record)); } catch {}
      }
      $('result').textContent = config.labels[champion] + '赢下整场！';
      $('resultDetail').textContent = points[0] + ' : ' + points[1] + ' · 共 ' + rounds + ' 回合。再来一场吧。';
      $('start').textContent = '再来一场'; $('overlay').hidden = false;
      $('start').focus({ preventScroll:true });

}
$('start').addEventListener('click', reset);
$('reset').addEventListener('click', reset);
buttons.forEach((button) => button.addEventListener('click', () => play(Number(button.dataset.play))));
document.addEventListener('keydown', (event) => {
  if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (key === 'r') { event.preventDefault(); reset(); }
  else if (event.code === 'Space') {
    event.preventDefault();
    if (!started || over) reset(); else if (config.dice) play(0);
  } else if (!config.dice && ['1','2','3'].includes(key)) {
    event.preventDefault(); play(Number(key) - 1);
