<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>火眼金睛</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,480px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #grid { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .side { display:grid; gap:3px; background:#1a1d29; border:2px solid #2a2e3d; border-radius:12px; padding:6px; }
    .side p { grid-column:1 / -1; margin:0; text-align:center; font-size:10px; font-weight:900; color:#5c6474; letter-spacing:2px; }
    .cell {
      aspect-ratio:1; display:grid; place-items:center; font-size:min(5vw,22px);
      background:#14161f; border-radius:6px; cursor:pointer; user-select:none;
    }
    .cell:hover { background:#1e2233; }
    .cell.right { background:#22b573; }
    .cell.wrong { background:#ff4d5e; }
    #timer { width:100%; height:10px; background:#14161f; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; }
    #tfill { height:100%; width:100%; background:var(--yellow); transition:width .2s linear; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>得分<b id="score">0</b></span>
      <span>第<b id="round">1</b>轮</span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="timer"><div id="tfill"></div></div>
    <div id="grid">
      <div class="side" id="left"></div>
      <div class="side" id="right"></div>
    </div>
  </div>
  <div id="overlay">
    <h1>👀 火眼金睛</h1>
    <p>左右两块阵只有一个格子不同<br/>限时点击左阵中异样的那格<br/>答对 +100 加时，答错 -1 命</p>
    <button id="ov-btn">开始挑战</button>
  </div>
  <script>
    (() => {
      const EMO = ['🍎','🍋','🍇','🍉','🍓','🫐','🍑','🥝','🌵','🌻','🍄','🐈','🐟','🦊','🎁','⚡']
      const leftEl = document.getElementById('left')
      const rightEl = document.getElementById('right')
      const tfill = document.getElementById('tfill')
      const scoreEl = document.getElementById('score')
      const roundEl = document.getElementById('round')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let pattern, diffIdx, diffEmoji, size, round, score, lives, timeLeft, running, over, lock
      let best = Number(localStorage.getItem('blinkblink-best') || 0)
      bestEl.textContent = best

      function newRound() {
        size = Math.min(6, 4 + ((round / 4) | 0))
        pattern = Array.from({ length: size * size }, () => EMO[(Math.random() * EMO.length) | 0])
        diffIdx = (Math.random() * size * size) | 0
        let alt = EMO[(Math.random() * EMO.length) | 0]
        while (alt === pattern[diffIdx]) alt = EMO[(Math.random() * EMO.length) | 0]
        diffEmoji = alt
        timeLeft = Math.max(6, 12 - round / 3)
        lock = false
        roundEl.textContent = round + 1
        render()
      }

      function render() {
        leftEl.innerHTML = '<p>FIND</p>'
        rightEl.innerHTML = '<p>ORIG</p>'
        const mk = (v, clickable, i) => {
          const el = document.createElement('div')
          el.className = 'cell'
          el.textContent = v
          if (clickable) el.onclick = () => pick(i, el)
          return el
        }
        for (let i = 0; i < size * size; i++) {
          leftEl.appendChild(mk(i === diffIdx ? diffEmoji : pattern[i], true, i))
          rightEl.appendChild(mk(pattern[i], false, i))
        }
        leftEl.style.gridTemplateColumns = 'repeat(' + size + ',1fr)'
        rightEl.style.gridTemplateColumns = 'repeat(' + size + ',1fr)'
      }

      function start() {
        round = 0; score = 0; lives = 3
        running = true; over = false
        scoreEl.textContent = 0; livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
        nextRound()
      }

      function nextRound() {
        round++
        newRound()
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('blinkblink-best', best) }
        overlay.querySelector('h1').textContent = '🏁 挑战结束'
        overlay.querySelector('p').innerHTML = '找到 <b style="color:#ffd23f">' + (round - 1) + '</b> 处不同 · 得分 ' + score + ' · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function pick(i, el) {
        if (!running || over || lock) return
        lock = true
        if (i === diffIdx) {
          el.classList.add('right')
          score += 100
          scoreEl.textContent = score
          setTimeout(nextRound, 350)
        } else {
          el.classList.add('wrong')
          lives--
          livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
          setTimeout(() => {
            el.classList.remove('wrong')
            lock = false
            if (lives <= 0) end()
          }, 500)
        }
      }

      let lastT = 0
      function loop(t) {
        requestAnimationFrame(loop)
        if (!lastT) lastT = t
        const dt = Math.min(60, t - lastT)
        lastT = t
        if (running && !over && !lock) {
          timeLeft -= dt / 1000
          tfill.style.width = Math.max(0, timeLeft / 12 * 100) + '%'
          if (timeLeft <= 0) {
            lives--
            livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
            if (lives <= 0) end()
            else nextRound()
          }
        }
      }

      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      pattern = []; diffIdx = 0; diffEmoji = ''; size = 4
      round = 0; score = 0; lives = 3; timeLeft = 12; running = false; over = false; lock = false
    })()
  </script>
</body>
</html>
