    .car { position:absolute; font-size:20px; transition:all .18s linear; }

    .light.green { background:#22b573; }
    #pads { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:100%; }
    #pads button {
      font-family:inherit; font-weight:900; font-size:14px; padding:10px 0;
      color:#eef1f6; background:#1a1d29; border:2px solid #2a2e3d; border-radius:10px; cursor:pointer;
    }
    #pads button.on { background:#22b573; border-color:#fff; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

        if(kind==='sushi'){round(3,10,27,19,'#737b61');round(4,11,25,15,'#fff2d2');r(8,23,17,3,'#e2d1ae');r(3,6,25,8,'#ae7566');r(4,7,23,5,'#f3a184');r(7,7,2,5,'#ffcfac');r(15,7,2,5,'#ffcfac');r(23,7,2,5,'#ffcfac');r(13,12,6,15,'#688a71');}
        if(kind==='shrimp'){r(7,7,17,6,'#ba7964');r(4,13,17,10,'#ba7964');r(7,23,12,5,'#ba7964');r(5,14,13,8,'#f6bd93');r(9,8,14,4,'#f6bd93');r(9,22,9,3,'#f6bd93');r(9,12,3,11,'#df997e');r(17,7,3,7,'#df997e');r(19,24,9,5,'#db937a');r(23,21,5,4,'#f5b38a');}
        if(kind==='avocado'){round(9,2,14,10,'#5f875d');round(4,10,24,19,'#5f875d');round(6,10,20,16,'#c1d87d');r(11,4,10,10,'#c1d87d');round(10,15,12,12,'#ab7958');r(12,16,6,4,'#d2a574');}
        if(kind==='parcel'){r(3,6,26,24,'#a37957');r(4,7,24,21,'#d2a777');r(5,8,21,5,'#f4d5a0');r(14,7,4,21,'#fff0bd');r(4,16,24,3,'#fff0bd');r(20,21,5,4,'#b58662');}
        if(kind==='car'){r(7,1,18,30,'#667a7c');r(9,2,14,27,'#eaa578');r(6,7,2,6,'#575f67');r(24,7,2,6,'#575f67');r(6,22,2,6,'#575f67');r(24,22,2,6,'#575f67');r(10,6,12,7,'#d1ede2');r(11,15,10,8,'#f6c78b');r(10,25,12,3,'#8eb7b2');r(9,3,4,2,'#fff4be');r(20,3,3,2,'#fff4be');}
        return a;
      }
      function pxSprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pxRects(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}



      let pxLast=0,pxAcc=0;
      function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
      function line(x,y,xx,yy,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}
      function disc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.fill()}
      function label(t,x,y,size=14,c='#566e65',align='left'){ctx.fillStyle=c;ctx.font='700 '+size+'px system-ui';ctx.textAlign=align;ctx.fillText(t,x,y);ctx.textAlign='left'}
      function panel(x,y,w,h,c='#e4c396',edge='#a58262'){box(x,y+4,w,h,edge);box(x,y,w,h,c);box(x+3,y+3,w-6,3,'#fff5d788');box(x+3,y+h-5,w-6,3,'#00000015')}
      function wood(x,y,w,h,c='#e8c799'){panel(x,y,w,h,c);for(let k=12;k<w;k+=27){box(x+k,y+6,1,h-12,'#cda57566');box(x+k+5,y+(k*7%Math.max(1,h-18))+6,9,2,'#d3b08466')}}
      function lawn(x,y,w,h){box(x,y,w,h,'#9bc58b');for(let r=0;r<h;r+=28)for(let c=0;c<w;c+=28)if((r+c)%56===0)box(x+c,y+r,28,28,'#a6cf97');for(let k=0;k<22;k++){let xx=x+(k*67)%Math.max(1,w-8),yy=y+(k*97)%Math.max(1,h-8);box(xx,yy,2,5,'#78aa76');box(xx+3,yy+2,2,3,'#78aa76')}}
      function bgSky(ground=H*.75){box(0,0,W,H,'#c1e4e0');for(let i=0;i<4;i++){let x=25+i*125,y=38+(i%2)*38;box(x,y,64,14,'#fff6dc');box(x+13,y-11,35,12,'#fff6dc')}for(let i=0;i<7;i++){box(i*82-20,ground-55-(i%3)*12,90,70,'#a9cdc0');box(i*82,ground-70-(i%3)*12,45,22,'#a9cdc0')}lawn(0,ground,W,H-ground);for(let i=0;i<6;i++){pxPaint('tree',i*93-20,ground-76,80)}for(let i=0;i<W;i+=26){box(i,ground-20,4,21,'#dac6a0')}box(0,ground-14,W,3,'#ead6b0');}
      function cosmos(){box(0,0,W,H,'#526a93');for(let i=0;i<65;i++){const x=(i*137+19)%W,y=(i*79+23)%H;box(x,y,i%5===0?3:2,i%5===0?3:2,i%3?'#b3c6d6':'#f9df9c')}disc(W-70,75,30,'#d3b8c4');box(W-84,57,12,8,'#b29eaf');box(W-66,81,16,8,'#b29eaf')}
      function targetArt(x,y,r){disc(x+2,y+4,r+3,'#9e876a');disc(x,y,r,'#fff1cf');disc(x,y,r*.72,'#df8f7d');disc(x,y,r*.43,'#fff1cf');disc(x,y,r*.18,'#a8ba81')}
      function marble(x,y,r,c='#79b4ba'){disc(x+1,y+2,r,'#719493');disc(x,y,r-1,c);disc(x-r*.3,y-r*.35,r*.27,'#fff9d8')}
      function meter(v,y=H-44){panel(24,y,W-48,14,'#ead7b4');box(27,y+3,(W-54)*Math.max(0,Math.min(1,v)),8,'#e8b66f')}
      function pointerKeys(entries){for(const[button,key]of entries){const b=document.getElementById(button);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);keys[key]=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[key]=false)}window.addEventListener('blur',()=>{keys={}})}

      const cross = document.getElementById('cross')
      const scoreEl = document.getElementById('score')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const padsEl = document.getElementById('pads')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')
      const padBtns = [...padsEl.querySelectorAll('button')]

      // 方向 0北(从下往上) 1东(从左往右) 2南(从上往下) 3西(从右往左)
      const EXIT = [
        { x: 50, y: -10 }, { x: 110, y: 50 }, { x: 50, y: 110 }, { x: -10, y: 50 },
      ]

      let queues, green, score, lives, running, over, frame
      let best = Number(localStorage.getItem('trafficrush-best') || 0)
      bestEl.textContent = best

      function carXY(d, slot) {
        // slot: 排队位置，0 最靠近路口
        const off = 34 - slot * 5.5
        if (d === 0) return { x: 44, y: 100 - off, rot: 0 }
        if (d === 1) return { x: off, y: 44, rot: 90 }
        if (d === 2) return { x: 56, y: off, rot: 180 }
        return { x: 100 - off, y: 56, rot: 270 }
      }

      function makeCarEl() {
        const el = document.createElement('div')
        el.className = 'car'
        el.innerHTML=pxSprite('car')
        cross.appendChild(el)
        return el
      }

      function start() {
        pxLast=0;pxAcc=0;
        queues = [[], [], [], []]
        green = 0
        score = 0; lives = 5; frame = 0
        running = true; over = false
        scoreEl.textContent = 0; livesEl.textContent = '♥♥♥♥♥'
        // 清除旧车 DOM
        cross.querySelectorAll('.car,.light').forEach((e) => e.remove())
        // 信号灯
        for (let d = 0; d < 4; d++) {
          const l = document.createElement('div')
          l.className = 'light'
          l.dataset.d = d
          cross.appendChild(l)
        }
        setGreen(0)
        overlay.classList.add('hidden')
      }

      function setGreen(d) {
        green = d
        padBtns.forEach((b, i) => b.classList.toggle('on', i === d))
        cross.querySelectorAll('.light').forEach((l) => {
          const dd = Number(l.dataset.d)
          l.classList.toggle('green', dd === d)
          if (dd === 0) { l.style.left = 'calc(50% - 9px)'; l.style.top = '8px' }
          if (dd === 1) { l.style.right = '8px'; l.style.top = 'calc(50% - 9px)' }
          if (dd === 2) { l.style.left = 'calc(50% - 9px)'; l.style.bottom = '8px' }
          if (dd === 3) { l.style.left = '8px'; l.style.top = 'calc(50% - 9px)' }
        })
      }

      padBtns.forEach((b) => b.addEventListener('click', () => {
        if (running && !over) setGreen(Number(b.dataset.d))
      }))
      window.addEventListener('keydown', (e) => {
        if(e.repeat)return;
        const idx = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code)
        if (idx >= 0 && running && !over) setGreen(idx)
      })

      function step() {
        frame++
        // 来车
        const rate = Math.max(40, 110 - score * 2)
        if (frame % rate === 0) {
          const d = (Math.random() * 4) | 0
          if (queues[d].length < 6) {
            const car = { wait: 0, el: makeCarEl(), d, slot: queues[d].length }
            queues[d].push(car)
          }
        }
        // 绿灯放行：路口一辆车通过动画
        const q = queues[green]
        if (q.length) {
          const car = q[0]
          if (!car.leaving) {
            car.leaving = true
            const p = EXIT[green]
            car.el.style.left = p.x + '%'
            car.el.style.top = p.y + '%'
            car.el.style.opacity = '0'
            setTimeout(() => {
              if (car.el.parentNode) car.el.remove()
            }, 400)
            q.shift()
            score++
            scoreEl.textContent = score
            for (let i = 0; i < q.length; i++) q[i].slot = i
          }
        }
        // 等待计时
        for (let d = 0; d < 4; d++) {
          for (const car of [...queues[d]]) {
            car.wait += 1 / 60
            if (car.wait > 14) {
              car.el.remove()
              queues[d].splice(queues[d].indexOf(car), 1)
              for (let i = 0; i < queues[d].length; i++) queues[d][i].slot = i
              lives--
              livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
              if (lives <= 0) {
                running = false; over = true
                if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('trafficrush-best', best) }
                overlay.querySelector('h1').textContent = '🚗💥 司机们暴走了'
                overlay.querySelector('p').innerHTML = '放行 <b style="color:#ffd23f">' + score + '</b> 辆 · 最佳 ' + best
                ovBtn.textContent = '再来一班'
                overlay.classList.remove('hidden')
                return
              }
            }
          }
        }
        // 渲染车辆位置
        for (let d = 0; d < 4; d++) {
          for (const car of queues[d]) {
            const p = carXY(d, car.slot)
            car.el.style.left = p.x + '%'
            car.el.style.top = p.y + '%'
            car.el.style.transform = 'rotate(' + p.rot + 'deg)'
            if (car.wait > 10) car.el.style.opacity = String(0.4 + 0.6 * Math.abs(Math.sin(car.wait * 6)))
            else car.el.style.opacity = '1'
          }
        }
      }

      function loop(t){requestAnimationFrame(loop);const now=Number.isFinite(t)?t:performance.now();if(!pxLast)pxLast=now;pxAcc+=Math.min(80,now-pxLast);pxLast=now;while(pxAcc>=1000/60){pxAcc-=1000/60;if(running&&!over)step()}}

      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      queues = [[], [], [], []]; green = 0; score = 0; lives = 5; frame = 0
      running = false; over = false
    })()
  </script>
</body>
</html>
