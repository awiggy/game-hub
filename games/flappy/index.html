<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>像素小鸟</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; overflow: hidden;
    }
    #wrap { position: relative; }
    #hud {
      position: absolute; top: -34px; left: 4px; right: 4px;
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: #8b93a7; letter-spacing: 1px;
    }
    #hud b { color: var(--yellow); font-size: 16px; margin-left: 4px; }
    canvas {
      display: block; border: 3px solid #2a2e3d; border-radius: 10px;
      background: #14161f; max-width: 92vw; max-height: 74vh;
    }
    #overlay {
      position: absolute; inset: 0; border-radius: 10px;
      background: rgba(15, 17, 24, 0.88);
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; line-height: 1.9; }
    #overlay button {
      background: var(--blue); color: #fff; font-family: inherit;
      border: 2px solid #fff; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      font-size: 16px; font-weight: 700; padding: 10px 32px; border-radius: 8px; cursor: pointer;
    }

    /* Crafted pixel edition: the playable pieces, not just the surrounding UI. */
    :root{--ink:#48533d;--accent:#4e854d;--paper:#fff9e7;--edge:#6f9250;--page:#edf2d9}
    body{background:var(--page);color:var(--ink);background-image:radial-gradient(#ffffff70 1px,transparent 1px);background-size:12px 12px;overflow:auto;min-height:100%;height:auto;padding:24px 12px;gap:10px}
    body::before{content:'';position:fixed;inset:0;box-shadow:inset 0 0 100px #ffffff70;pointer-events:none;z-index:-1}
    button{font-family:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #d26c48;outline-offset:3px}
    #wrap{flex-shrink:0;max-width:100%}
    #hud,#bar{position:static;color:var(--ink);letter-spacing:0;font-size:11px;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 4px}
    #hud b,#bar b{color:var(--accent);font-size:17px}canvas{image-rendering:pixelated;border:4px solid var(--edge);border-radius:8px;box-shadow:0 5px 0 color-mix(in srgb,var(--edge),transparent 55%);background:var(--paper);max-width:100%;object-fit:contain}
    #overlay{z-index:20;background:color-mix(in srgb,var(--paper) 96%,transparent);color:var(--ink);border-radius:12px;gap:12px;padding:22px}
    #overlay::before{content:'';width:90px;height:90px;background:var(--mascot) center/contain no-repeat;image-rendering:pixelated}
    #overlay h1,#overlay h2{font-size:25px;letter-spacing:1px;text-shadow:none;color:var(--ink)}
    #overlay p{color:var(--ink);font-size:13px;line-height:1.9;max-width:340px}#overlay p b{color:var(--accent)!important}
    #overlay button,#new-game,#bar button,#pads button,.up,.garden-controls button{background:var(--accent);color:#fffaf0;border:2px solid var(--ink);box-shadow:0 3px 0 #0002;border-radius:7px;font-weight:800;cursor:pointer}
    #overlay button:hover{filter:brightness(1.1)}#overlay.hidden{display:none}
    .pixel-sprite{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
    .scene-title{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:5px}
    .scene-title strong{font-size:23px;letter-spacing:1px;display:block}.scene-title small{display:block;font-size:11px;line-height:1.8;letter-spacing:1px;color:var(--accent)}
    .scene-title svg{width:54px;height:54px;flex-shrink:0}.play-note{font-size:11px;text-align:center;color:var(--ink);line-height:1.7;margin-top:9px}
    .landscape{height:92px;position:relative;overflow:hidden;border-radius:10px 10px 0 0;background:linear-gradient(#a9dfdf 0 63%,#b7d878 63% 71%,#82b65e 71%);border:3px solid var(--edge);border-bottom:0}
    .landscape::before{content:'';position:absolute;left:15%;top:18px;width:40px;height:8px;background:#fffcec;box-shadow:8px -6px #fffcec,170px 5px #fffcec,178px -1px #fffcec}
    .landscape svg{position:absolute;bottom:0;width:76px;height:76px}.landscape svg:nth-child(2){left:2%;width:52px;height:52px}.landscape svg:nth-child(3){right:4%;width:44px;height:44px}.landscape svg:nth-child(4){right:15%;width:32px;height:32px}
    @media(max-width:480px){body{padding:14px 10px}.scene-title strong{font-size:20px}#hud b,#bar b{font-size:15px}.landscape{height:74px}.scene-title svg{width:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--page:#e4f4ee;--ink:#3d6370;--accent:#428d85;--edge:#599483;--paper:#fffbea;--mascot:url("data:image/svg+xml,%3Csvg%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2032%2032%22%20class%3D%22pixel-sprite%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%224%22%20y%3D%2213%22%20width%3D%226%22%20height%3D%229%22%20fill%3D%22%239a6129%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%228%22%20width%3D%2218%22%20height%3D%2218%22%20fill%3D%22%239a6129%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%225%22%20width%3D%2212%22%20height%3D%224%22%20fill%3D%22%239a6129%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2210%22%20width%3D%2217%22%20height%3D%2214%22%20fill%3D%22%23ffca42%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%227%22%20width%3D%2212%22%20height%3D%2214%22%20fill%3D%22%23ffe777%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%228%22%20width%3D%229%22%20height%3D%226%22%20fill%3D%22%23fff2ac%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%2216%22%20width%3D%2210%22%20height%3D%227%22%20fill%3D%22%23f2a32d%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%2216%22%20width%3D%228%22%20height%3D%223%22%20fill%3D%22%23ffda5b%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2210%22%20width%3D%226%22%20height%3D%228%22%20fill%3D%22%23fffbed%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2212%22%20width%3D%223%22%20height%3D%225%22%20fill%3D%22%233f3831%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2225%22%20y%3D%2217%22%20width%3D%226%22%20height%3D%223%22%20fill%3D%22%23b9582c%22%2F%3E%3Crect%20x%3D%2225%22%20y%3D%2217%22%20width%3D%225%22%20height%3D%221%22%20fill%3D%22%23ffad3b%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2220%22%20width%3D%224%22%20height%3D%222%22%20fill%3D%22%23f99059%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2226%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%23c87c33%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%2225%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%23c87c33%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%223%22%20width%3D%223%22%20height%3D%224%22%20fill%3D%22%23c89c38%22%2F%3E%3C%2Fsvg%3E")}
#wrap{width:min(360px,94vw)}canvas{width:100%;height:auto;max-height:none}#overlay{position:fixed;inset:0}body{flex-direction:column}.play-note{margin:0} @media(max-height:760px){#wrap{width:min(330px,calc((100dvh - 156px)*.6))}.scene-title strong{font-size:17px}.scene-title svg{width:40px;height:40px}}

/* Compact landscape retains readable boards beside their controls. */
@media(min-width:600px) and (max-height:550px){body{padding:12px;gap:8px}.play-note{margin:0}#wrap{width:min(660px,96vw);display:grid;grid-template-columns:190px auto;column-gap:24px;align-items:center;justify-content:center}.scene-title{grid-column:1;align-self:end}.scene-title strong{font-size:21px}#hud{grid-column:1;align-self:start;justify-content:flex-start}canvas{grid-column:2;grid-row:1/4;height:calc(100dvh - 76px);width:auto;max-width:none}.scene-title svg{width:44px;height:44px}}
@media(max-width:480px){body{padding:12px 10px}.play-note{margin-top:3px;font-size:10px}.scene-title{margin-bottom:0}.scene-title small{letter-spacing:.5px}}
  </style>
</head>
<body>
  <div id="wrap">
<header class="scene-title"><div><small>MEADOW AIRMAIL · 像素小鸟</small><strong>小鸟的晴天旅行</strong></div><svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="4" y="13" width="6" height="9" fill="#9a6129"/><rect x="7" y="8" width="18" height="18" fill="#9a6129"/><rect x="11" y="5" width="12" height="4" fill="#9a6129"/><rect x="8" y="10" width="17" height="14" fill="#ffca42"/><rect x="11" y="7" width="12" height="14" fill="#ffe777"/><rect x="12" y="8" width="9" height="6" fill="#fff2ac"/><rect x="6" y="16" width="10" height="7" fill="#f2a32d"/><rect x="6" y="16" width="8" height="3" fill="#ffda5b"/><rect x="19" y="10" width="6" height="8" fill="#fffbed"/><rect x="22" y="12" width="3" height="5" fill="#3f3831"/><rect x="22" y="12" width="1" height="1" fill="#fff"/><rect x="25" y="17" width="6" height="3" fill="#b9582c"/><rect x="25" y="17" width="5" height="1" fill="#ffad3b"/><rect x="19" y="20" width="4" height="2" fill="#f99059"/><rect x="11" y="26" width="3" height="3" fill="#c87c33"/><rect x="20" y="25" width="3" height="3" fill="#c87c33"/><rect x="11" y="3" width="3" height="4" fill="#c89c38"/></svg></header>
    <div id="hud">
      <span>SCORE<b id="score">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="360" height="600"></canvas>
    <div id="overlay">
      <h1>像素小鸟</h1>
      <p>空格 / 点击 / 触屏点按扇翅上飞<br />穿过管道缝隙 +1 分，别撞别落地</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>

  <p class="play-note">轻点屏幕或按空格扇翅 · 让小鸟从两根水管之间飞过</p>
  <script>
    (() => {

      function pixels(kind) {
        const a=[]; const r=(x,y,w,h,c)=>a.push([x,y,w,h,c]);
        const face=(x,y)=>{r(x,y,2,3,'#332f36');r(x+8,y,2,3,'#332f36');r(x,y,1,1,'#fffdf0');r(x+8,y,1,1,'#fffdf0');r(x-2,y+4,3,2,'#f4998a');r(x+9,y+4,3,2,'#f4998a');r(x+4,y+4,2,1,'#8f4d48');};
        const round=(x,y,w,h,c)=>{r(x+3,y,w-6,h,c);r(x,y+3,w,h-6,c)};
        if(kind==='apple'||kind==='orange'||kind==='berry') {
          const p=kind==='apple'?['#8e3540','#d84b4e','#ff765f','#ffbea0']:kind==='orange'?['#ae5c2c','#ef9c34','#ffc650','#ffed9a']:['#48447d','#6f6fc1','#9d9ce3','#d2d1ff'];
          round(4,9,24,20,p[0]);round(6,10,20,17,p[1]);r(8,11,15,11,p[2]);r(8,13,4,5,p[3]);r(10,11,5,2,p[3]);r(13,6,3,6,'#72533e');r(16,4,9,4,'#3c7949');r(17,4,6,2,'#9bcd55');face(10,19);
        } else if(kind==='carrot'||kind==='sprout') {
          r(14,6,3,11,'#37774b');r(7,5,8,4,'#387d43');r(9,3,6,4,'#84bd50');r(17,4,8,4,'#3c8e46');r(18,2,6,3,'#b0d767');
          if(kind==='carrot'){r(9,13,15,5,'#ad552b');r(10,18,12,5,'#ad552b');r(12,23,8,4,'#ad552b');r(14,27,4,3,'#ad552b');r(10,14,12,4,'#ffb04b');r(11,18,9,5,'#f88132');r(13,23,5,4,'#f88132');r(11,15,3,5,'#ffda75');r(18,19,3,1,'#ba5c32');r(13,24,3,1,'#ba5c32');}
          else {r(5,23,22,4,'#654830');r(8,21,16,3,'#9d6c42');r(14,14,3,8,'#3c8747');}
        } else if(kind==='flower') {
          r(15,13,3,17,'#3c8b58');r(8,20,8,4,'#82be5f');r(18,23,8,4,'#58a657');
          round(10,2,12,20,'#e5bc88');round(5,7,22,10,'#e5bc88');round(11,2,10,18,'#fffbea');round(5,8,22,8,'#fffbea');r(12,8,9,8,'#e9a82d');r(13,8,6,5,'#ffd95c');r(14,9,3,2,'#fff5ac');
        } else if(kind==='mushroom') {
          r(11,16,11,13,'#af784d');r(12,16,9,11,'#ffe6b2');r(12,18,3,6,'#fff6da');r(6,8,21,11,'#9c3d43');r(10,4,13,5,'#9c3d43');r(4,13,25,7,'#9c3d43');r(7,9,19,8,'#e97564');r(10,5,13,9,'#f69b7e');r(5,14,23,3,'#e97564');r(10,8,4,4,'#fff0cf');r(20,12,5,4,'#fff0cf');face(12,22);
        } else if(kind==='mole'||kind==='goldmole'||kind==='bunny') {
          const bunny=kind==='bunny',gold=kind==='goldmole'; const dark=bunny?'#8c7974':gold?'#9c6327':'#704c46'; const base=bunny?'#f9eacb':gold?'#efb648':'#b38360';const light=bunny?'#fffbed':gold?'#ffe08a':'#dbac7a';
          if(bunny){r(8,1,6,12,dark);r(19,0,6,13,dark);r(9,2,4,11,light);r(20,1,4,12,light);r(10,4,2,7,'#e7a09b');r(21,3,2,8,'#e7a09b');}
          else{round(4,5,8,9,dark);round(21,5,8,9,dark);r(6,7,4,5,'#e7a09b');r(23,7,4,5,'#e7a09b');}
          round(4,11,25,20,dark);round(6,11,21,18,base);r(9,10,15,7,light);r(7,14,4,7,light);round(9,21,16,8,bunny?'#fffdf2':'#f8ddb0');face(11,16);r(14,24,6,2,'#8a534b');r(16,24,2,3,'#fff8e4');r(3,26,5,4,light);r(26,26,4,4,light);
        } else if(kind==='chick') {
          r(4,13,6,9,'#9a6129');r(7,8,18,18,'#9a6129');r(11,5,12,4,'#9a6129');r(8,10,17,14,'#ffca42');r(11,7,12,14,'#ffe777');r(12,8,9,6,'#fff2ac');r(6,16,10,7,'#f2a32d');r(6,16,8,3,'#ffda5b');r(19,10,6,8,'#fffbed');r(22,12,3,5,'#3f3831');r(22,12,1,1,'#fff');r(25,17,6,3,'#b9582c');r(25,17,5,1,'#ffad3b');r(19,20,4,2,'#f99059');r(11,26,3,3,'#c87c33');r(20,25,3,3,'#c87c33');r(11,3,3,4,'#c89c38');
        } else if(kind==='grape') {
          r(15,3,3,6,'#72513d');r(18,3,9,4,'#599657');
          for(const [x,y] of [[7,8],[17,8],[5,15],[14,15],[22,15],[10,22],[18,22]]){round(x,y,8,8,'#624274');round(x+1,y,6,6,'#a27bd0');r(x+2,y+1,2,2,'#e4bcf4');}
        } else if(kind==='melon') {
          r(4,9,24,13,'#326d52');r(7,22,18,4,'#326d52');r(11,26,10,3,'#326d52');r(5,9,22,12,'#a6d46c');r(8,21,16,3,'#a6d46c');r(6,9,20,9,'#f9807c');r(9,18,14,3,'#f9807c');r(12,21,8,2,'#f9807c');r(7,10,18,2,'#ffb0a0');for(const [x,y] of [[10,14],[16,12],[21,15],[15,18]])r(x,y,1,2,'#673f48');
        } else if(kind==='flag') {
          r(10,3,3,25,'#695447');r(13,4,14,10,'#9e4b4c');r(13,4,11,7,'#f47768');r(14,5,7,2,'#ffbea2');r(7,27,13,2,'#486a4a');
        } else if(kind==='mine') {
          r(14,2,4,28,'#47606b');r(2,14,28,4,'#47606b');r(6,6,20,20,'#47606b');round(7,7,18,18,'#6e8e97');r(10,9,6,4,'#c1d9cf');face(11,16);
        } else if(kind==='crate') {
          r(2,4,28,26,'#865637');r(4,5,24,22,'#d29b58');r(6,8,20,17,'#b77b46');r(7,9,18,3,'#e8b56b');r(7,16,18,2,'#e8b56b');r(4,5,3,22,'#f3c986');r(25,5,3,22,'#ad713f');r(5,5,22,3,'#ffe0a0');r(5,24,22,3,'#e4b06a');r(6,6,2,2,'#805b3d');r(24,25,2,2,'#805b3d');r(14,13,6,5,'#f1a13f');r(15,18,3,3,'#f1a13f');r(15,10,2,4,'#5f974f');r(17,10,4,2,'#9dc968');
        } else if(kind==='hedge') {
          r(1,5,30,27,'#376e4c');r(2,3,28,25,'#4b9550');r(5,1,22,26,'#75b44f');r(8,2,12,5,'#b9d663');r(4,8,8,5,'#a3ce5a');r(18,5,10,5,'#92c250');r(7,16,12,6,'#8fc352');r(21,16,8,6,'#447e45');r(4,24,11,4,'#467d43');r(21,11,3,3,'#d0e478');r(13,10,3,3,'#c0db69');r(15,25,8,3,'#64a34a');
        } else if(kind==='barn') {
          for(let i=0;i<6;i++)r(15-i*2,2+i*2,2+i*4,3,'#5c656c');r(6,14,23,17,'#9d4843');r(7,14,20,15,'#df775c');for(let i=9;i<27;i+=4)r(i,15,1,14,'#f59973');r(5,14,25,2,'#ffecbc');r(12,20,11,11,'#ffe8b4');r(14,21,7,10,'#975645');r(17,21,1,10,'#ffdb9e');r(14,23,7,1,'#ffdb9e');r(15,12,6,6,'#ffecbc');r(16,13,4,4,'#6aa7b5');
        } else if(kind==='cookie') {
          round(4,4,24,24,'#986334');round(5,4,22,21,'#e6ac57');r(8,6,16,13,'#f9ce7b');r(9,7,9,2,'#ffe6a3');for(const [x,y] of [[10,11],[21,10],[17,18],[8,21]]){r(x,y,3,3,'#8f5a41');r(x,y,2,1,'#bc8650');}
        }
        return a;
      }
      function sprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pixels(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function paint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pixels(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}

      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const GROUND = H - 70
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const BX = 92, BR = 13, PW = 62, GAP = 152
      let bird, pipes, score, speed, running, over, frame
      let best = Number(localStorage.getItem('flappy-best') || 0)
      bestEl.textContent = best

      function flap() {
        if (!running || over) return
        bird.vy = -7.4
      }

      function startGame() {
        bird = { y: H * 0.42, vy: 0 }
        pipes = []
        score = 0; speed = 2.6; running = true; over = false; frame = 0
        scoreEl.textContent = 0
        overlay.classList.add('hidden')
      }

      function gameOver() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('flappy-best', best) }
        overlay.querySelector('h1').textContent = '游戏结束'
        overlay.querySelector('p').innerHTML =
          '本局 <b style="color:#ffd23f">' + score + '</b> 分 · 最高分 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        frame++
        bird.vy += 0.45
        bird.y += bird.vy
        if (bird.y < BR) { bird.y = BR; bird.vy = 0 }

        speed = 2.6 + Math.min(1.6, score * 0.03)
        if (!pipes.length || pipes[pipes.length - 1].x < W - 96) {
          pipes.push({ x: W + PW, top: 60 + Math.random() * (GROUND - GAP - 130), passed: false })
        }

        for (const p of pipes) {
          p.x -= speed
          if (!p.passed && p.x + PW < BX - BR) {
            p.passed = true
            score++
            scoreEl.textContent = score
          }
          const inX = BX + BR > p.x && BX - BR < p.x + PW
          if (inX && (bird.y - BR < p.top || bird.y + BR > p.top + GAP)) return gameOver()
        }
        pipes = pipes.filter((p) => p.x + PW > 0)

        if (bird.y + BR >= GROUND) return gameOver()
      }

      function draw() {
        ctx.fillStyle='#78cce9';ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#a3e2e9';ctx.fillRect(0,200,W,GROUND-200);
        ctx.fillStyle='#fff4bf';ctx.fillRect(268,36,36,36);ctx.fillRect(262,42,48,24);
        const cloud=(x,y)=>{ctx.fillStyle='#d4eef1';ctx.fillRect(x,y+9,64,14);ctx.fillStyle='#fffced';ctx.fillRect(x+10,y,37,20);ctx.fillRect(x,y+10,64,8);ctx.fillRect(x+19,y-5,21,5)};
        cloud(30,70);cloud(210,138);cloud(75,233);
        for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#80beb0':'#94c9b7';ctx.fillRect(i*64-18,GROUND-70-i%3*20,78,100);ctx.fillRect(i*64-4,GROUND-90-i%3*20,48,30)}
        for(let i=0;i<9;i++)paint('hedge',i*46-12,GROUND-44,60);
        for(const p of pipes){
          const pipe=(y,h,cap)=>{const x=Math.round(p.x);ctx.fillStyle='#377353';ctx.fillRect(x,y,PW,h);ctx.fillStyle='#7dbd50';ctx.fillRect(x+3,y,PW-6,h);ctx.fillStyle='#b2dc6c';ctx.fillRect(x+8,y,9,h);ctx.fillStyle='#5a9d49';ctx.fillRect(x+PW-13,y,10,h);ctx.fillStyle='#38754f';ctx.fillRect(x,cap,PW,14);ctx.fillStyle='#8bc953';ctx.fillRect(x+3,cap+3,PW-6,8);ctx.fillStyle='#d2ec8a';ctx.fillRect(x+7,cap+3,11,7)};
          pipe(0,p.top,p.top-14);pipe(p.top+GAP,GROUND-p.top-GAP,p.top+GAP);
        }
        ctx.fillStyle='#bc885b';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#e5c187';ctx.fillRect(0,GROUND+13,W,8);ctx.fillStyle='#7ab749';ctx.fillRect(0,GROUND,W,13);ctx.fillStyle='#b7dc69';ctx.fillRect(0,GROUND,W,4);
        for(let x=0;x<W;x+=22){ctx.fillStyle='#a87551';ctx.fillRect(x+7,GROUND+32+(x%3)*5,7,3);ctx.fillStyle='#f1ce8e';ctx.fillRect(x,GROUND+27,9,3)}
        for(let x=12;x<W;x+=82)paint('flower',x,GROUND-18,24);
        ctx.save();ctx.translate(BX,bird.y);ctx.rotate(Math.max(-.35,Math.min(.65,bird.vy/16)));paint('chick',-19,-19,38);
        if(running&&bird.vy<0){ctx.fillStyle='#fff0a1';ctx.fillRect(-10,-3,9,4);ctx.fillRect(-12,-7,7,4)}ctx.restore();
      }

      let flightLast = 0, flightAcc = 0
      function loop(t = 0) {
        requestAnimationFrame(loop)
        flightAcc += Math.min(50, t - flightLast); flightLast = t
        while (flightAcc >= 1000 / 60) { if (running && !over) step(); flightAcc -= 1000 / 60 }
        draw()
      }

      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); flap() })
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault()
          if (e.repeat) return
          if (running) flap()
          else if (!overlay.classList.contains('hidden')) startGame()
        }
      })
      ovBtn.addEventListener('click', startGame)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running || over },
      }

      bird = { y: H * 0.42, vy: 0 }
      pipes = []
      score = 0; speed = 2.6; running = false; over = false; frame = 0
      loop()
    })()
  </script>
</body>
</html>
