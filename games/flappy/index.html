<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>像素小鸟</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; overflow: hidden;
    }
    #wrap { position: relative; }
    #hud {
      position: absolute; top: -34px; left: 4px; right: 4px;
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: #8b93a7; letter-spacing: 1px;
    }
    #hud b { color: var(--yellow); font-size: 16px; margin-left: 4px; }
    canvas {
      display: block; border: 3px solid #2a2e3d; border-radius: 10px;
      background: #14161f; max-width: 92vw; max-height: 74vh;
    }
    #overlay {
      position: absolute; inset: 0; border-radius: 10px;
      background: rgba(15, 17, 24, 0.88);
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; line-height: 1.9; }
    #overlay button {
      background: var(--blue); color: #fff; font-family: inherit;
      border: 2px solid #fff; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      font-size: 16px; font-weight: 700; padding: 10px 32px; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>SCORE<b id="score">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="360" height="600"></canvas>
    <div id="overlay">
      <h1>像素小鸟</h1>
      <p>空格 / 点击 / 触屏点按扇翅上飞<br />穿过管道缝隙 +1 分，别撞别落地</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>

  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const GROUND = H - 70
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const BX = 92, BR = 13, PW = 62, GAP = 152
      let bird, pipes, score, speed, running, over, frame
      let best = Number(localStorage.getItem('flappy-best') || 0)
      bestEl.textContent = best

      function flap() {
        if (!running || over) return
        bird.vy = -7.4
      }

      function startGame() {
        bird = { y: H * 0.42, vy: 0 }
        pipes = []
        score = 0; speed = 2.6; running = true; over = false; frame = 0
        scoreEl.textContent = 0
        overlay.classList.add('hidden')
      }

      function gameOver() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('flappy-best', best) }
        overlay.querySelector('h1').textContent = '游戏结束'
        overlay.querySelector('p').innerHTML =
          '本局 <b style="color:#ffd23f">' + score + '</b> 分 · 最高分 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        frame++
        bird.vy += 0.45
        bird.y += bird.vy
        if (bird.y < BR) { bird.y = BR; bird.vy = 0 }

        speed = 2.6 + Math.min(1.6, score * 0.03)
        if (!pipes.length || pipes[pipes.length - 1].x < W - 96) {
          pipes.push({ x: W + PW, top: 60 + Math.random() * (GROUND - GAP - 130), passed: false })
        }

        for (const p of pipes) {
          p.x -= speed
          if (!p.passed && p.x + PW < BX - BR) {
            p.passed = true
            score++
            scoreEl.textContent = score
          }
          const inX = BX + BR > p.x && BX - BR < p.x + PW
          if (inX && (bird.y - BR < p.top || bird.y + BR > p.top + GAP)) return gameOver()
        }
        pipes = pipes.filter((p) => p.x + PW > 0)

        if (bird.y + BR >= GROUND) return gameOver()
      }

      function draw() {
        // 天空
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        // 远景星星
        ctx.fillStyle = 'rgba(255,255,255,0.25)'
        for (let i = 0; i < 20; i++) {
          const sx = (i * 97) % W, sy = (i * 53) % (GROUND - 60)
          ctx.fillRect(sx, sy, 2, 2)
        }
        // 管道
        for (const p of pipes) {
          ctx.fillStyle = '#22b573'
          ctx.fillRect(p.x, 0, PW, p.top)
          ctx.fillRect(p.x, p.top + GAP, PW, GROUND - p.top - GAP)
          ctx.fillStyle = '#0f7a4a'
          ctx.fillRect(p.x, p.top - 12, PW, 12)
          ctx.fillRect(p.x, p.top + GAP, PW, 12)
        }
        // 地面
        ctx.fillStyle = '#1a1d29'
        ctx.fillRect(0, GROUND, W, H - GROUND)
        ctx.fillStyle = '#2a2e3d'
        for (let i = 0; i < W / 24; i++) ctx.fillRect(i * 24, GROUND, 12, 6)
        // 小鸟
        ctx.save()
        ctx.translate(BX, bird.y)
        ctx.rotate(Math.max(-0.5, Math.min(1, bird.vy / 10)))
        ctx.fillStyle = '#ffd23f'
        ctx.beginPath()
        ctx.arc(0, 0, BR, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = '#f5b800'
        ctx.beginPath()
        ctx.ellipse(-4, 3, 7, 5, 0.6, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = '#14161f'
        ctx.beginPath()
        ctx.arc(5, -4, 2.4, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = '#ff8a3d'
        ctx.beginPath()
        ctx.moveTo(BR - 2, -1)
        ctx.lineTo(BR + 6, 2)
        ctx.lineTo(BR - 2, 5)
        ctx.fill()
        ctx.restore()
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); flap() })
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault()
          if (running) flap()
          else if (!overlay.classList.contains('hidden')) startGame()
        }
      })
      ovBtn.addEventListener('click', startGame)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      bird = { y: H * 0.42, vy: 0 }
      pipes = []
      score = 0; speed = 2.6; running = false; over = false; frame = 0
      loop()
    })()
  </script>
</body>
</html>
