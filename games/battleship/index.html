<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>海战棋</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,460px); position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board { width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(8,1fr);
      grid-template-rows:repeat(8,1fr); gap:3px; background:#12203c; border:3px solid #2a2e3d; border-radius:12px; padding:6px; }
    .cell { border-radius:5px; background:#1a2f52; cursor:pointer; display:grid; place-items:center; font-size:15px; }
    .cell:hover { background:#24406e; }
    .cell.miss { background:#14161f; cursor:default; }
    .cell.hit { background:#7a2430; cursor:default; }
    .cell.sunk { background:#ff4d5e; cursor:default; }
    #msg { font-size:14px; font-weight:900; min-height:20px; }
    #fleet { font-size:11px; font-weight:700; color:#8b93a7; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

/* Hand-authored pixel workshop edition. */
:root{--ink:#4e7d84;--edge:#80b3b4;--paper:#fff6df;--blue:#4e7d84;--yellow:#4e7d84}body{height:auto;min-height:100dvh;padding:14px 10px;overflow:auto;background:#dceee8;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:12px 12px;color:var(--ink);flex-direction:column;gap:8px;touch-action:manipulation}#wrap{position:relative;width:min(460px,94vw);display:flex;flex-direction:column;align-items:stretch;gap:10px;flex-shrink:0}.scene-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.scene-head small{font-size:9px;letter-spacing:2px;opacity:.7}.scene-head h2{font-size:22px;line-height:1.4;margin:3px 0;letter-spacing:.5px}.scene-head>.pixel-sprite{width:58px;height:58px;flex:none}#hud,#bar{position:static;width:100%;padding:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;color:var(--ink);font-size:11px}#hud b,#bar b{font-size:16px;color:var(--ink)}#board,#grid,canvas{width:min(100%,calc(100dvh - 225px));max-width:100%;max-height:none;align-self:center;height:auto;border:4px solid var(--edge);border-radius:9px;box-shadow:0 5px #0002;background:var(--paper);flex-shrink:0}#msg,#hint,#fleet,#cps{color:var(--ink);font-size:12px;text-align:center;line-height:1.7;min-height:0}.work-note{font-size:10px;line-height:1.7;text-align:center;opacity:.8}canvas{image-rendering:pixelated;touch-action:none}#overlay{position:fixed;inset:0;z-index:40;border-radius:0;background:color-mix(in srgb,#dceee8 97%,transparent);color:var(--ink);padding:20px;gap:14px}#overlay::before{content:'';display:block;width:100px;height:100px;background:url("data:image/svg+xml,%3Csvg%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2032%2032%22%20class%3D%22pixel-sprite%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%225%22%20y%3D%2220%22%20width%3D%2224%22%20height%3D%225%22%20fill%3D%22%236c7f86%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2225%22%20width%3D%2218%22%20height%3D%224%22%20fill%3D%22%236c7f86%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%2220%22%20width%3D%2222%22%20height%3D%223%22%20fill%3D%22%23f39b75%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2223%22%20width%3D%2216%22%20height%3D%223%22%20fill%3D%22%23f7cb93%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2213%22%20width%3D%2212%22%20height%3D%227%22%20fill%3D%22%23fff2d1%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%228%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%2391bdbb%22%2F%3E%3Crect%20x%3D%2215%22%20y%3D%224%22%20width%3D%222%22%20height%3D%229%22%20fill%3D%22%23827759%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%224%22%20width%3D%228%22%20height%3D%225%22%20fill%3D%22%23e78973%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%2215%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%2378adbd%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2215%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%2378adbd%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2229%22%20width%3D%2223%22%20height%3D%222%22%20fill%3D%22%23a7e2dc%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;image-rendering:pixelated}#overlay h1{font-size:25px;letter-spacing:1px;text-shadow:none}#overlay p{color:var(--ink);max-width:380px;line-height:1.9}#overlay p b{color:var(--ink)!important}#overlay button,#again,#bar button{color:var(--paper);background:var(--ink);border:2px solid var(--edge);box-shadow:0 3px #0002;border-radius:8px;padding:10px 20px}#overlay.hidden{display:none}button{font-family:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #d88050;outline-offset:2px}.pixel-sprite{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}button:disabled{cursor:default;opacity:.45}.tools{display:flex;justify-content:center;gap:8px}.tools button,#pads button{background:var(--paper);border:2px solid var(--edge);color:var(--ink);padding:8px 13px;border-radius:7px;box-shadow:0 3px #0001;font-weight:800}
@media(max-width:480px){.scene-head h2{font-size:19px}.scene-head>.pixel-sprite{width:44px;height:44px}#wrap{gap:8px}#hud b{font-size:14px}#board,#grid,canvas{width:min(100%,calc(100dvh - 205px))}}
@media(min-width:600px) and (max-height:550px){#wrap{width:min(800px,96vw);display:grid;grid-template-columns:220px auto;gap:8px 24px;justify-content:center;align-items:center}#wrap>:where(:not(#board):not(#grid):not(canvas)){grid-column:1}#board,#grid,canvas{grid-column:2;grid-row:1/6;width:calc(100dvh - 58px);max-height:calc(100dvh - 38px)}.scene-head h2{font-size:20px}#overlay{gap:8px}#overlay::before{width:65px;height:65px}#overlay h1{font-size:22px}#overlay p{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

#board{background:#80b3bd;border-color:#76a3ad;padding:8px;gap:4px}.cell{min-width:0;border:1px solid #6caaae;background:#a7d5d1;box-shadow:inset 2px 2px #c7e8df,inset 0 -3px #83b9ba;position:relative;aspect-ratio:1}.cell:not(.hit):not(.sunk):not(.miss):after{content:'⌁';color:#70b0b6;font-size:23px}.cell:hover{background:#c4e6dc}.cell.hit{background:#efc77e}.cell.sunk{background:#f8ddb0;border-color:#d4a574}.cell svg{width:95%;height:95%}.cell.miss{background:#8dbcbf;box-shadow:none}.ripple{display:block;width:45%;height:35%;border:2px solid #c5e6df;border-radius:50%}#fleet{display:flex;justify-content:center;gap:14px}.fleet-ship{width:45px;opacity:.7}.fleet-ship svg{height:34px}.fleet-ship b{font-size:10px}.fleet-ship.found{opacity:1;background:#ffe8ad;border-radius:5px}#msg{font-size:11px;background:#f4f7e6;padding:4px;border-radius:5px}
#board{grid-template-rows:repeat(8,minmax(0,1fr))}.cell{min-height:0;overflow:hidden}
</style>

<body>
  <div id="wrap"><header class="scene-head"><div><small>CORAL FLEET</small><h2>小船长的珊瑚海</h2></div><svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="5" y="20" width="24" height="5" fill="#6c7f86"/><rect x="8" y="25" width="18" height="4" fill="#6c7f86"/><rect x="6" y="20" width="22" height="3" fill="#f39b75"/><rect x="9" y="23" width="16" height="3" fill="#f7cb93"/><rect x="11" y="13" width="12" height="7" fill="#fff2d1"/><rect x="14" y="8" width="6" height="6" fill="#91bdbb"/><rect x="15" y="4" width="2" height="9" fill="#827759"/><rect x="17" y="4" width="8" height="5" fill="#e78973"/><rect x="13" y="15" width="3" height="3" fill="#78adbd"/><rect x="19" y="15" width="3" height="3" fill="#78adbd"/><rect x="4" y="29" width="23" height="2" fill="#a7e2dc"/></svg></header>
    <div id="hud">

    <div id="board"></div>
    <div id="msg">点击格子开炮</div>
    <div id="fleet">舰队长度：4 · 3 · 3 · 2 · 2 格</div>
  </div>
  <div id="overlay">
    <h1>🚢 海战棋</h1>
    <p>8×8 海域藏着 5 艘敌舰<br/>点击开炮，命中可顺势追击<br/>45 发炮弹内全部击沉获胜</p>
    <button id="ov-btn">进入战斗</button>
  </div>

          r(8,3,16,4,'#9b7664');r(8,3,16,2,'#e5c59b');r(6,8,20,21,'#7b9e98');r(7,8,18,19,'#cce5d6');r(9,10,3,13,'#fff7de');r(12,16,9,9,'#e4a17e');r(14,14,6,9,'#f9c690');r(14,16,2,2,'#fff0c2');r(8,27,16,2,'#a7c7b5');
        }

        if(kind==='bee'){round(4,8,9,10,'#aacac5');round(18,6,9,10,'#aacac5');round(5,8,7,7,'#f4fff0');round(19,6,7,8,'#f4fff0');round(6,14,22,14,'#7e5d3c');round(7,14,20,12,'#f8c85a');r(12,14,3,12,'#997146');r(18,14,3,12,'#997146');r(24,16,2,3,'#403d3b');r(23,21,4,2,'#f39170');r(4,19,4,3,'#665841');r(24,11,2,4,'#665841');}
        if(kind==='horse'){r(9,2,5,8,'#765545');r(20,1,5,10,'#765545');round(7,7,20,20,'#765545');round(9,8,17,17,'#dba879');r(12,4,2,6,'#f1c59c');r(20,4,2,6,'#f1c59c');r(7,9,7,14,'#8a6050');r(13,9,10,6,'#f6d4aa');r(19,13,3,4,'#3f3937');round(16,20,13,9,'#b97d60');r(18,21,9,4,'#f4c19a');r(22,23,2,2,'#765545');r(10,25,9,6,'#dba879');}
        if(kind==='mouse'){round(3,3,12,12,'#97817f');round(18,3,12,12,'#97817f');round(5,4,8,8,'#e3a6aa');round(20,4,8,8,'#e3a6aa');round(6,10,22,19,'#97817f');round(7,11,20,16,'#d3c6b4');r(10,11,14,5,'#f1e4cd');face(10,17);r(15,22,3,2,'#9b6e70');r(3,22,7,1,'#97817f');r(24,22,7,1,'#97817f');}
        if(kind==='cheese'){r(4,11,24,18,'#be8737');r(8,7,15,5,'#be8737');r(5,12,22,14,'#f4bc4b');r(7,10,18,3,'#ffe595');r(7,13,18,3,'#ffd674');r(8,19,4,4,'#c88e3f');r(18,17,5,5,'#c88e3f');r(17,25,4,2,'#c88e3f');r(10,8,8,2,'#fff0af');}
        if(kind==='oven'){r(3,5,26,26,'#826856');r(4,6,24,23,'#dccab0');r(5,7,22,4,'#f5ebcf');r(7,8,3,2,'#d68c60');r(22,8,3,2,'#d68c60');r(6,13,20,13,'#846b60');r(8,15,16,9,'#555e62');r(10,19,12,3,'#ecb665');r(9,15,2,6,'#acc5b9');r(9,27,14,2,'#967454');}
        if(kind==='chef'){round(5,1,22,9,'#aaa38a');round(6,1,20,7,'#fff8df');r(9,7,15,5,'#fff8df');round(8,12,18,13,'#dfac84');r(10,12,14,7,'#ffdfb1');face(10,16);r(7,25,20,7,'#8aa78a');r(11,25,12,7,'#ffedc9');r(15,27,3,2,'#c58b63');}

        if(kind==='acorn'){round(8,11,17,19,'#96633e');round(9,12,15,15,'#d4a363');r(11,15,4,9,'#f6cc86');r(8,9,17,7,'#795d42');r(6,13,21,3,'#795d42');r(10,10,13,3,'#ae8550');r(16,5,3,6,'#795d42');r(18,3,6,3,'#85a05b');face(11,20);}

      }
      function pxSprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pxRects(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}



      const N = 8
      const SHIPS = [4, 3, 3, 2, 2]
      const boardEl = document.getElementById('board')
      const shotsEl = document.getElementById('shots')
      const sunkEl = document.getElementById('sunk')
      const bestEl = document.getElementById('best')
      const msgEl = document.getElementById('msg')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let ships, shots, fired, sunkCount, running, over
      let best = Number(localStorage.getItem('battleship-best') || 0)
      bestEl.textContent=best?best+'发':'—'

      function deploy() {
        const occ=new Set(),fleet=[];for(const len of SHIPS){const choices=[];for(const horiz of [true,false])for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(r+(horiz?0:len-1)>=N||c+(horiz?len-1:0)>=N)continue;const cells=Array.from({length:len},(_,k)=>(r+(horiz?0:k))+','+(c+(horiz?k:0)));if(cells.every(key=>!occ.has(key)))choices.push(cells)}if(!choices.length)throw Error('No fleet placement');const cells=choices[Math.floor(Math.random()*choices.length)];cells.forEach(key=>occ.add(key));fleet.push({cells,hits:new Set()})}return fleet;
      }

      function start() {
        ships = deploy()
        shots = 45; sunkCount = 0
        fired = new Set()
        running = true; over = false
        shotsEl.textContent = 45; sunkEl.textContent = '0/5'
        msgEl.textContent = '点击格子开炮'
        overlay.classList.add('hidden')
        render()
      }

      function render() {
        document.getElementById('fleet').innerHTML=ships.map(ship=>'<span class="fleet-ship '+(ship.cells.every(k=>fired.has(k))?'found':'')+'">'+pxSprite('ship')+'<b>'+ship.cells.length+' 格</b></span>').join('')
        boardEl.innerHTML = ''
        for (let r = 0; r < N; r++)
          for (let c = 0; c < N; c++) {
            const el = document.createElement('button')
            el.setAttribute('aria-label',String.fromCharCode(65+r)+(c+1))
            const key = r + ',' + c
            el.className = 'cell'
            if (fired.has(key)) {
              const ship = ships.find((s) => s.cells.includes(key))
              if (ship) {
                const sunk = ship.cells.every((x) => fired.has(x))
                el.classList.add(sunk ? 'sunk' : 'hit')
                el.innerHTML=pxSprite(sunk?'ship':'star')
              } else {
                el.classList.add('miss')
                el.innerHTML='<span class="ripple"></span>'
              }
            }
            el.onclick = () => fire(r, c)
            boardEl.appendChild(el)
          }
      }

      function fire(r, c) {
        if (!running || over) return
        const key = r + ',' + c
        if (fired.has(key)) return
        fired.add(key)
        shots--
        shotsEl.textContent = shots
        const ship = ships.find((s) => s.cells.includes(key))
        if (ship) {
          ship.hits.add(key)
          if (ship.cells.every((x) => fired.has(x))) {
            sunkCount++
            sunkEl.textContent = sunkCount + '/5'
            msgEl.textContent = '🚢 击沉一艘舰！剩余炮弹 ' + shots
          } else msgEl.textContent = '🔥 命中！继续追击'
          if (sunkCount === 5) {
            render();
            running = false; over = true
            if (!best || 45 - shots < best) { best = 45 - shots; bestEl.textContent = best + '发'; localStorage.setItem('battleship-best', best) }
            overlay.querySelector('h1').textContent = '🏆 海域清空'
            overlay.querySelector('p').innerHTML =
              '用掉 <b style="color:#ffd23f">' + (45 - shots) + '</b> 发炮弹（剩余 ' + shots + '）· 最佳 ' + (best || '—') + '发'
            ovBtn.textContent = '再来一战'
            overlay.classList.remove('hidden')
            return
          }
        } else msgEl.textContent = '🌊 浪花一片，没打中'
        render()
        if (shots <= 0) {
          running = false; over = true
          overlay.querySelector('h1').textContent = '💀 炮弹耗尽'
          overlay.querySelector('p').innerHTML = '击沉 ' + sunkCount + '/5 艘 · 最佳战绩 ' + (best || '—') + '发'
          ovBtn.textContent = '再来一战'
          overlay.classList.remove('hidden')
        }
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return sunkCount * 10 },
        get over() { return over },
        get started() { return running },
      }

      ships = []; shots = 45; fired = new Set(); sunkCount = 0
      running = false; over = false
      render()
    })()
  </script>
