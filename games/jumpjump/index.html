<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>跳一跳</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>得分<b id="score">0</b></span>
      <span>连击<b id="combo">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="460" height="600"></canvas>
    <div id="overlay">
      <h1>🐸 跳一跳</h1>
      <p>按住蓄力，松手起跳<br/>落中心 +2 且连击加成，落边缘 +1<br/>没跳上平台就结束</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const comboEl = document.getElementById('combo')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      // 等轴视角：平台为菱形
      let plats, idx, power, charging, combo, score, guy, jumping, running, over
      let best = Number(localStorage.getItem('jumpjump-best') || 0)
      bestEl.textContent = best

      function iso(x, y) { return { x: W / 2 + (x - y) * 0.9, y: 210 + (x + y) * 0.42 } }

      function newPlat(dist) {
        const last = plats[plats.length - 1]
        const dir = Math.random() < 0.5 ? 1 : -1 // 沿 x 或 y 方向延伸
        return { x: last.x + (dir > 0 ? dist : 0), y: last.y + (dir > 0 ? 0 : dist), size: 44 + Math.random() * 16 }
      }

      function start() {
        plats = [{ x: 0, y: 0, size: 60 }]
        for (let i = 0; i < 5; i++) plats.push(newPlat(130 + Math.random() * 90))
        idx = 0; power = 0; charging = false; combo = 0; score = 0
        guy = { x: 0, y: 0, z: 0, vz: 0, air: false, tx: 0, ty: 0 }
        jumping = false
        running = true; over = false
        scoreEl.textContent = 0; comboEl.textContent = 0
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('jumpjump-best', best) }
        overlay.querySelector('h1').textContent = '😵 跳空了'
        overlay.querySelector('p').innerHTML = '得分 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function release() {
        if (!running || over || !charging || jumping) return
        charging = false
        const target = plats[idx + 1]
        const dist = Math.hypot(target.x - guy.x, target.y - guy.y)
        const jumpDist = 60 + power * 2.6
        const p = Math.min(1.15, jumpDist / dist)
        const ux = (target.x - guy.x) / dist, uy = (target.y - guy.y) / dist
        guy.tx = guy.x + ux * dist * p
        guy.ty = guy.y + uy * dist * p
        guy.air = true
        guy.z = 1
        guy.vz = 0.06 + power / 1400
        jumping = true
      }

      function land() {
        jumping = false
        const t = plats[idx + 1]
        const d = Math.hypot(guy.tx - t.x, guy.ty - t.y)
        if (d > t.size) {
          // 检查是否落在更远的平台上
          let landed = false
          for (let i = idx + 2; i < plats.length; i++) {
            if (Math.hypot(guy.tx - plats[i].x, guy.ty - plats[i].y) <= plats[i].size) {
              idx = i - 1
              landed = true
              break
            }
          }
          if (!landed) {
            guy.x = guy.tx; guy.y = guy.ty
            return end()
          }
        } else idx = idx + 1
        guy.x = guy.tx; guy.y = guy.ty
        // 计分
        const center = Math.hypot(guy.x - plats[idx].x, guy.y - plats[idx].y)
        if (center < plats[idx].size * 0.35) {
          combo++
          const gain = 2 + combo
          score += gain
          comboEl.textContent = combo + '（+' + gain + '）'
        } else {
          combo = 0
          score += 1
          comboEl.textContent = 0
        }
        scoreEl.textContent = score
        plats.push(newPlat(130 + Math.random() * 90))
        if (idx > 2) plats.shift(), idx--
      }

      function step() {
        if (charging) power = Math.min(100, power + 1.8)
        if (guy.air) {
          guy.z += guy.vz
          guy.vz -= 0.005
          guy.x += (guy.tx - guy.x) * 0.14
          guy.y += (guy.ty - guy.y) * 0.14
          if (guy.z <= 0) { guy.z = 0; guy.air = false; land() }
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        // 平台
        for (let i = 0; i < plats.length; i++) {
          const p = plats[i]
          const c = iso(p.x, p.y)
          const s = p.size
          ctx.fillStyle = i === idx ? '#2f55e4' : i === idx + 1 ? '#5d84ff' : '#22367a'
          ctx.beginPath()
          ctx.moveTo(c.x, c.y - s * 0.5)
          ctx.lineTo(c.x + s * 0.9, c.y)
          ctx.lineTo(c.x, c.y + s * 0.5)
          ctx.lineTo(c.x - s * 0.9, c.y)
          ctx.closePath()
          ctx.fill()
          // 顶面
          ctx.fillStyle = i === idx ? '#5d84ff' : i === idx + 1 ? '#7fa1ff' : '#2c4394'
          ctx.beginPath()
          ctx.moveTo(c.x, c.y - s * 0.5 - 8)
          ctx.lineTo(c.x + s * 0.9, c.y - 8)
          ctx.lineTo(c.x, c.y + s * 0.5 - 8)
          ctx.lineTo(c.x - s * 0.9, c.y - 8)
          ctx.closePath()
          ctx.fill()
        }
        // 蓄力条
        if (charging) {
          ctx.fillStyle = '#2a2e3d'
          ctx.fillRect(24, H - 40, 120, 12)
          ctx.fillStyle = power > 85 ? '#ff4d5e' : '#ffd23f'
          ctx.fillRect(24, H - 40, 120 * power / 100, 12)
        }
        // 小人
        const g = iso(guy.x, guy.y)
        ctx.font = '26px sans-serif'
        ctx.fillText('🐸', g.x - 12, g.y - 14 - guy.z * 180)
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      function press() {
        if (!running || over || jumping) return
        charging = true; power = 0
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault()
          if (!running && !overlay.classList.contains('hidden')) start()
          else press()
        }
      })
      window.addEventListener('keyup', (e) => { if (e.code === 'Space') release() })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); press() })
      window.addEventListener('pointerup', release)
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      plats = [{ x: 0, y: 0, size: 60 }]
      idx = 0; power = 0; charging = false; combo = 0; score = 0
      guy = { x: 0, y: 0, z: 0, vz: 0, air: false, tx: 0, ty: 0 }
      jumping = false; running = false; over = false
    })()
  </script>
</body>
</html>
