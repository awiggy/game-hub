<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>打地鼠</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; --red: #ff4d5e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; touch-action: manipulation; overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    #bar {
      width: min(92vw, 380px);
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: #8b93a7; letter-spacing: 1px;
    }
    #bar b { color: var(--yellow); font-size: 16px; margin-left: 4px; }
    #grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      width: min(92vw, 380px);
    }
    .hole {
      position: relative; aspect-ratio: 1; border: 2px solid #2a2e3d; border-radius: 16px;
      background: radial-gradient(ellipse 82% 46% at 50% 74%, #05060b 0 60%, #1a1d29 61% 100%);
      cursor: pointer; overflow: hidden; padding: 0; font-family: inherit;
    }
    .hole:active { border-color: #3a405a; }
    .tag {
      position: absolute; top: 6px; left: 9px;
      font-size: 11px; font-weight: 700; color: #3a4054; pointer-events: none;
    }
    .mole {
      position: absolute; left: 0; right: 0; bottom: -6%; height: 78%;
      display: grid; place-items: center;
      font-size: clamp(36px, 11vw, 54px); line-height: 1;
      transform: translateY(100%);
      transition: transform 0.11s ease;
      pointer-events: none;
    }
    .hole.up .mole { transform: translateY(8%); }
    .mole.golden { filter: drop-shadow(0 0 8px rgba(255, 210, 63, 0.9)); }
    #overlay {
      position: fixed; inset: 0; background: rgba(15, 17, 24, 0.88);
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; line-height: 1.9; }
    #overlay button {
      background: var(--blue); color: #fff; font-family: inherit;
      border: 2px solid #fff; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      font-size: 16px; font-weight: 700; padding: 10px 32px; border-radius: 8px; cursor: pointer;
    }
    #overlay button:active { transform: translate(2px, 2px); box-shadow: none; }

    /* Crafted pixel edition: the playable pieces, not just the surrounding UI. */
    :root{--ink:#48533d;--accent:#4e854d;--paper:#fff9e7;--edge:#6f9250;--page:#edf2d9}
    body{background:var(--page);color:var(--ink);background-image:radial-gradient(#ffffff70 1px,transparent 1px);background-size:12px 12px;overflow:auto;min-height:100%;height:auto;padding:24px 12px;gap:10px}
    body::before{content:'';position:fixed;inset:0;box-shadow:inset 0 0 100px #ffffff70;pointer-events:none;z-index:-1}
    button{font-family:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #d26c48;outline-offset:3px}
    #wrap{flex-shrink:0;max-width:100%}
    #hud,#bar{position:static;color:var(--ink);letter-spacing:0;font-size:11px;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 4px}
    #hud b,#bar b{color:var(--accent);font-size:17px}canvas{image-rendering:pixelated;border:4px solid var(--edge);border-radius:8px;box-shadow:0 5px 0 color-mix(in srgb,var(--edge),transparent 55%);background:var(--paper);max-width:100%;object-fit:contain}
    #overlay{z-index:20;background:color-mix(in srgb,var(--paper) 96%,transparent);color:var(--ink);border-radius:12px;gap:12px;padding:22px}
    #overlay::before{content:'';width:90px;height:90px;background:var(--mascot) center/contain no-repeat;image-rendering:pixelated}
    #overlay h1,#overlay h2{font-size:25px;letter-spacing:1px;text-shadow:none;color:var(--ink)}
    #overlay p{color:var(--ink);font-size:13px;line-height:1.9;max-width:340px}#overlay p b{color:var(--accent)!important}
    #overlay button,#new-game,#bar button,#pads button,.up,.garden-controls button{background:var(--accent);color:#fffaf0;border:2px solid var(--ink);box-shadow:0 3px 0 #0002;border-radius:7px;font-weight:800;cursor:pointer}
    #overlay button:hover{filter:brightness(1.1)}#overlay.hidden{display:none}
    .pixel-sprite{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
    .scene-title{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:5px}
    .scene-title strong{font-size:23px;letter-spacing:1px;display:block}.scene-title small{display:block;font-size:11px;line-height:1.8;letter-spacing:1px;color:var(--accent)}
    .scene-title svg{width:54px;height:54px;flex-shrink:0}.play-note{font-size:11px;text-align:center;color:var(--ink);line-height:1.7;margin-top:9px}
    .landscape{height:92px;position:relative;overflow:hidden;border-radius:10px 10px 0 0;background:linear-gradient(#a9dfdf 0 63%,#b7d878 63% 71%,#82b65e 71%);border:3px solid var(--edge);border-bottom:0}
    .landscape::before{content:'';position:absolute;left:15%;top:18px;width:40px;height:8px;background:#fffcec;box-shadow:8px -6px #fffcec,170px 5px #fffcec,178px -1px #fffcec}
    .landscape svg{position:absolute;bottom:0;width:76px;height:76px}.landscape svg:nth-child(2){left:2%;width:52px;height:52px}.landscape svg:nth-child(3){right:4%;width:44px;height:44px}.landscape svg:nth-child(4){right:15%;width:32px;height:32px}
    @media(max-width:480px){body{padding:14px 10px}.scene-title strong{font-size:20px}#hud b,#bar b{font-size:15px}.landscape{height:74px}.scene-title svg{width:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.scene-title,#bar{width:min(440px,94vw)}#grid{width:min(440px,94vw);padding:14px;gap:12px;background:repeating-linear-gradient(0deg,#a8c776 0 55px,#b4d184 55px 58px);border:4px solid #7c9953;border-radius:12px;box-shadow:0 5px #7c995355}.hole{border:0;border-radius:0;background:transparent;overflow:hidden;isolation:isolate;aspect-ratio:1}.hole::before{content:"";position:absolute;left:4%;right:4%;bottom:5%;height:42%;border:4px solid #8b6142;border-top:7px solid #c69660;border-radius:50%;background:#694b3b;box-shadow:0 5px #d5b67b}.hole::after{content:"";position:absolute;left:8%;right:8%;bottom:1%;height:17%;border-radius:0 0 50% 50%;background:repeating-linear-gradient(0deg,#b58a55 0 5px,#c59b67 5px 7px);z-index:3;pointer-events:none}.mole{height:88%;bottom:9%;z-index:2}.mole svg{width:100%;height:100%}.hole.up .mole{transform:translateY(0)}.mole.golden{filter:drop-shadow(0 0 3px #ffe58e)}.tag{color:#5c773e;font-size:11px;top:0;left:1px;z-index:4}.hole.hit .tag{color:#915a30;font-size:22px;left:30%;top:15%;background:#fff1b9;padding:2px 5px;z-index:5;border-radius:4px}.hole:focus-visible{outline-offset:0}.landscape{display:none}

          for(const [x,y] of [[7,8],[17,8],[5,15],[14,15],[22,15],[10,22],[18,22]]){round(x,y,8,8,'#624274');round(x+1,y,6,6,'#a27bd0');r(x+2,y+1,2,2,'#e4bcf4');}
        } else if(kind==='melon') {
          r(4,9,24,13,'#326d52');r(7,22,18,4,'#326d52');r(11,26,10,3,'#326d52');r(5,9,22,12,'#a6d46c');r(8,21,16,3,'#a6d46c');r(6,9,20,9,'#f9807c');r(9,18,14,3,'#f9807c');r(12,21,8,2,'#f9807c');r(7,10,18,2,'#ffb0a0');for(const [x,y] of [[10,14],[16,12],[21,15],[15,18]])r(x,y,1,2,'#673f48');
        } else if(kind==='flag') {
          r(10,3,3,25,'#695447');r(13,4,14,10,'#9e4b4c');r(13,4,11,7,'#f47768');r(14,5,7,2,'#ffbea2');r(7,27,13,2,'#486a4a');
        } else if(kind==='mine') {
          r(14,2,4,28,'#47606b');r(2,14,28,4,'#47606b');r(6,6,20,20,'#47606b');round(7,7,18,18,'#6e8e97');r(10,9,6,4,'#c1d9cf');face(11,16);
        } else if(kind==='crate') {
          r(2,4,28,26,'#865637');r(4,5,24,22,'#d29b58');r(6,8,20,17,'#b77b46');r(7,9,18,3,'#e8b56b');r(7,16,18,2,'#e8b56b');r(4,5,3,22,'#f3c986');r(25,5,3,22,'#ad713f');r(5,5,22,3,'#ffe0a0');r(5,24,22,3,'#e4b06a');r(6,6,2,2,'#805b3d');r(24,25,2,2,'#805b3d');r(14,13,6,5,'#f1a13f');r(15,18,3,3,'#f1a13f');r(15,10,2,4,'#5f974f');r(17,10,4,2,'#9dc968');
        } else if(kind==='hedge') {
          r(1,5,30,27,'#376e4c');r(2,3,28,25,'#4b9550');r(5,1,22,26,'#75b44f');r(8,2,12,5,'#b9d663');r(4,8,8,5,'#a3ce5a');r(18,5,10,5,'#92c250');r(7,16,12,6,'#8fc352');r(21,16,8,6,'#447e45');r(4,24,11,4,'#467d43');r(21,11,3,3,'#d0e478');r(13,10,3,3,'#c0db69');r(15,25,8,3,'#64a34a');
        } else if(kind==='barn') {
          for(let i=0;i<6;i++)r(15-i*2,2+i*2,2+i*4,3,'#5c656c');r(6,14,23,17,'#9d4843');r(7,14,20,15,'#df775c');for(let i=9;i<27;i+=4)r(i,15,1,14,'#f59973');r(5,14,25,2,'#ffecbc');r(12,20,11,11,'#ffe8b4');r(14,21,7,10,'#975645');r(17,21,1,10,'#ffdb9e');r(14,23,7,1,'#ffdb9e');r(15,12,6,6,'#ffecbc');r(16,13,4,4,'#6aa7b5');
        } else if(kind==='cookie') {
          round(4,4,24,24,'#986334');round(5,4,22,21,'#e6ac57');r(8,6,16,13,'#f9ce7b');r(9,7,9,2,'#ffe6a3');for(const [x,y] of [[10,11],[21,10],[17,18],[8,21]]){r(x,y,3,3,'#8f5a41');r(x,y,2,1,'#bc8650');}
        }
        return a;
      }
      function sprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pixels(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function paint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pixels(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}

      const gridEl = document.getElementById('grid')
      const scoreEl = document.getElementById('score')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovTitle = document.getElementById('ov-title')
      const ovText = document.getElementById('ov-text')
      const ovBtn = document.getElementById('ov-btn')

      const holes = []
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement('button')
        btn.className = 'hole'
        const tag = document.createElement('span')
        tag.className = 'tag'
        tag.textContent = String(i + 1)
        const mole = document.createElement('span')
        mole.className = 'mole'
        mole.innerHTML = sprite('mole')
        btn.setAttribute('aria-label', '地鼠洞 ' + (i+1))
        btn.appendChild(tag)
        btn.appendChild(mole)
        btn.addEventListener('pointerdown', () => whack(i))
        gridEl.appendChild(btn)
        holes.push({ el: btn, mole: mole, timer: 0, golden: false })
      }

      let score = 0
      let timeLeft = 30
      let elapsed = 0
      let started = false
      let over = false
      let best = Number(localStorage.getItem('whackmole-best') || 0)
      let tickTimer = 0
      let spawnTimer = 0
      bestEl.textContent = best

      // 停留时长：1100ms → 500ms 随时间缩短；金鼠更短
      function stay(golden) {
        const t = 1100 - 600 * Math.min(1, elapsed / 30)
        return golden ? t * 0.55 : t
      }

      function hide(h) {
        clearTimeout(h.timer)
        h.el.classList.remove('up')
      }

      function pop() {
        if (!started || over) return
        const free = []
        for (const h of holes) if (!h.el.classList.contains('up')) free.push(h)
        if (!free.length) return
        const h = free[(Math.random() * free.length) | 0]
        h.golden = Math.random() < 0.12
        h.mole.innerHTML = sprite(h.golden ? 'goldmole' : 'mole')
        h.el.classList.remove('hit'); h.el.querySelector('.tag').textContent = String(holes.indexOf(h)+1)
        if (h.golden) h.mole.classList.add('golden')
        else h.mole.classList.remove('golden')
        h.el.classList.add('up')
        h.timer = setTimeout(() => hide(h), stay(h.golden))
      }

      function spawnLoop() {
        if (!started || over) return
        pop()
        if (elapsed > 6 && Math.random() < 0.3) pop()
        spawnTimer = setTimeout(spawnLoop, 640 - 300 * Math.min(1, elapsed / 30))
      }

      function whack(i) {
        if (!started || over) return
        const h = holes[i]
        if (!h.el.classList.contains('up')) return
        hide(h)
        h.el.classList.add('hit'); h.el.querySelector('.tag').textContent = h.golden ? '+3' : '+1'
        clearTimeout(h.feedback); h.feedback = setTimeout(() => { h.el.classList.remove('hit'); h.el.querySelector('.tag').textContent = String(i+1) }, 420)
        score += h.golden ? 3 : 1
        scoreEl.textContent = score
      }

      function startGame() {
        score = 0; timeLeft = 30; elapsed = 0
        started = true; over = false
        scoreEl.textContent = 0
        timeEl.textContent = 30
        timeEl.style.color = ''
        for (const h of holes) { clearTimeout(h.timer); clearTimeout(h.feedback); hide(h); h.el.classList.remove('hit'); h.el.querySelector('.tag').textContent = String(holes.indexOf(h)+1) }
        clearInterval(tickTimer)
        clearTimeout(spawnTimer)
        overlay.classList.add('hidden')
        tickTimer = setInterval(() => {
          elapsed++
          timeLeft--
          timeEl.textContent = Math.max(0, timeLeft)
          if (timeLeft <= 5) timeEl.style.color = '#ff4d5e'
          if (timeLeft <= 0) gameOver()
        }, 1000)
        spawnLoop()
      }

      function gameOver() {
        started = false
        over = true
        clearInterval(tickTimer)
        clearTimeout(spawnTimer)
        for (const h of holes) { clearTimeout(h.timer); clearTimeout(h.feedback); hide(h); h.el.classList.remove('hit'); h.el.querySelector('.tag').textContent = String(holes.indexOf(h)+1) }
        if (score > best) {
          best = score
          bestEl.textContent = best
          localStorage.setItem('whackmole-best', best)
        }
        ovTitle.textContent = '⏰ 时间到！'
        ovText.innerHTML = '本局得分 <b style="color:#ffd23f">' + score + '</b> · 最高分 ' + best +
          '<br />越到后面地鼠缩得越快，手速再练练！'
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      ovBtn.addEventListener('click', startGame)

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault()
          if (!started) startGame()
          return
        }
        const n = Number(e.key)
        if (n >= 1 && n <= 9) whack(n - 1)
      })

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return started || over },
      }
    })()
  </script>
</body>
</html>
