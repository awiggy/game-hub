<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>打地鼠</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; --red: #ff4d5e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; touch-action: manipulation; overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    #bar {
      width: min(92vw, 380px);
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: #8b93a7; letter-spacing: 1px;
    }
    #bar b { color: var(--yellow); font-size: 16px; margin-left: 4px; }
    #grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      width: min(92vw, 380px);
    }
    .hole {
      position: relative; aspect-ratio: 1; border: 2px solid #2a2e3d; border-radius: 16px;
      background: radial-gradient(ellipse 82% 46% at 50% 74%, #05060b 0 60%, #1a1d29 61% 100%);
      cursor: pointer; overflow: hidden; padding: 0; font-family: inherit;
    }
    .hole:active { border-color: #3a405a; }
    .tag {
      position: absolute; top: 6px; left: 9px;
      font-size: 11px; font-weight: 700; color: #3a4054; pointer-events: none;
    }
    .mole {
      position: absolute; left: 0; right: 0; bottom: -6%; height: 78%;
      display: grid; place-items: center;
      font-size: clamp(36px, 11vw, 54px); line-height: 1;
      transform: translateY(100%);
      transition: transform 0.11s ease;
      pointer-events: none;
    }
    .hole.up .mole { transform: translateY(8%); }
    .mole.golden { filter: drop-shadow(0 0 8px rgba(255, 210, 63, 0.9)); }
    #overlay {
      position: fixed; inset: 0; background: rgba(15, 17, 24, 0.88);
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; line-height: 1.9; }
    #overlay button {
      background: var(--blue); color: #fff; font-family: inherit;
      border: 2px solid #fff; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      font-size: 16px; font-weight: 700; padding: 10px 32px; border-radius: 8px; cursor: pointer;
    }
    #overlay button:active { transform: translate(2px, 2px); box-shadow: none; }
  </style>
</head>
<body>
  <div id="bar">
    <span>SCORE<b id="score">0</b></span>
    <span>TIME<b id="time">30</b></span>
    <span>BEST<b id="best">0</b></span>
  </div>
  <div id="grid"></div>
  <div id="overlay">
    <h1 id="ov-title">打地鼠</h1>
    <p id="ov-text">30 秒内敲打冒头的地鼠 🐹（+1 分）<br />金鼠 ⭐ 缩得更快 · 一锤 +3 分<br />键盘 1-9 对应九洞 · 空格开始</p>
    <button id="ov-btn">开始游戏</button>
  </div>

  <script>
    (() => {
      const gridEl = document.getElementById('grid')
      const scoreEl = document.getElementById('score')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovTitle = document.getElementById('ov-title')
      const ovText = document.getElementById('ov-text')
      const ovBtn = document.getElementById('ov-btn')

      const holes = []
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement('button')
        btn.className = 'hole'
        const tag = document.createElement('span')
        tag.className = 'tag'
        tag.textContent = String(i + 1)
        const mole = document.createElement('span')
        mole.className = 'mole'
        mole.textContent = '🐹'
        btn.appendChild(tag)
        btn.appendChild(mole)
        btn.addEventListener('pointerdown', () => whack(i))
        gridEl.appendChild(btn)
        holes.push({ el: btn, mole: mole, timer: 0, golden: false })
      }

      let score = 0
      let timeLeft = 30
      let elapsed = 0
      let started = false
      let over = false
      let best = Number(localStorage.getItem('whackmole-best') || 0)
      let tickTimer = 0
      let spawnTimer = 0
      bestEl.textContent = best

      // 停留时长：1100ms → 500ms 随时间缩短；金鼠更短
      function stay(golden) {
        const t = 1100 - 600 * Math.min(1, elapsed / 30)
        return golden ? t * 0.55 : t
      }

      function hide(h) {
        clearTimeout(h.timer)
        h.el.classList.remove('up')
      }

      function pop() {
        if (!started || over) return
        const free = []
        for (const h of holes) if (!h.el.classList.contains('up')) free.push(h)
        if (!free.length) return
        const h = free[(Math.random() * free.length) | 0]
        h.golden = Math.random() < 0.12
        h.mole.textContent = h.golden ? '⭐' : '🐹'
        if (h.golden) h.mole.classList.add('golden')
        else h.mole.classList.remove('golden')
        h.el.classList.add('up')
        h.timer = setTimeout(() => hide(h), stay(h.golden))
      }

      function spawnLoop() {
        if (!started || over) return
        pop()
        if (elapsed > 6 && Math.random() < 0.3) pop()
        spawnTimer = setTimeout(spawnLoop, 640 - 300 * Math.min(1, elapsed / 30))
      }

      function whack(i) {
        if (!started || over) return
        const h = holes[i]
        if (!h.el.classList.contains('up')) return
        hide(h)
        score += h.golden ? 3 : 1
        scoreEl.textContent = score
      }

      function startGame() {
        score = 0; timeLeft = 30; elapsed = 0
        started = true; over = false
        scoreEl.textContent = 0
        timeEl.textContent = 30
        timeEl.style.color = ''
        for (const h of holes) { clearTimeout(h.timer); hide(h) }
        clearInterval(tickTimer)
        clearTimeout(spawnTimer)
        overlay.classList.add('hidden')
        tickTimer = setInterval(() => {
          elapsed++
          timeLeft--
          timeEl.textContent = Math.max(0, timeLeft)
          if (timeLeft <= 5) timeEl.style.color = '#ff4d5e'
          if (timeLeft <= 0) gameOver()
        }, 1000)
        spawnLoop()
      }

      function gameOver() {
        started = false
        over = true
        clearInterval(tickTimer)
        clearTimeout(spawnTimer)
        for (const h of holes) { clearTimeout(h.timer); hide(h) }
        if (score > best) {
          best = score
          bestEl.textContent = best
          localStorage.setItem('whackmole-best', best)
        }
        ovTitle.textContent = '⏰ 时间到！'
        ovText.innerHTML = '本局得分 <b style="color:#ffd23f">' + score + '</b> · 最高分 ' + best +
          '<br />越到后面地鼠缩得越快，手速再练练！'
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      ovBtn.addEventListener('click', startGame)

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault()
          if (!started) startGame()
          return
        }
        const n = Number(e.key)
        if (n >= 1 && n <= 9) whack(n - 1)
      })

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return started },
      }
    })()
  </script>
</body>
</html>
