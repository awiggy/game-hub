<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>连连看</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board { width:100%; aspect-ratio:6/5; display:grid; grid-template-columns:repeat(6,1fr);
      grid-template-rows:repeat(5,1fr); gap:4px; background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:6px; }
    .cell { display:grid; place-items:center; font-size:min(6vw,26px); background:#14161f;
      border-radius:6px; cursor:pointer; user-select:none; border:2px solid transparent; }
    .cell.sel { border-color:var(--yellow); background:#241f10; }
    .cell.gone { visibility:hidden; }
    .cell.hint { border-color:#22b573; }
    #bar { width:100%; display:flex; gap:10px; align-items:center; }
    #timer { flex:1; height:10px; background:#14161f; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; }
    #tfill { height:100%; width:100%; background:var(--yellow); }
    #shuffle { font-family:inherit; font-weight:700; font-size:12px; color:#eef1f6;
      background:#1a1d29; border:2px solid #2a2e3d; border-radius:8px; padding:6px 12px; cursor:pointer; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>剩余<b id="left">0</b>对</span>
      <span>得分<b id="score">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="timer"><div id="tfill"></div></div>
    <div id="board"></div>
    <div id="bar">
      <div id="timer"><div id="tfill"></div></div>
      <button id="shuffle">🔀 重排</button>
    </div>
  </div>
  <div id="overlay">
    <h1>🔗 连连看</h1>
    <p>点击两个相同图案的方块<br/>连线转弯不超过两次即消除<br/>限时清空棋盘，卡住可重排（扣时）</p>
    <button id="ov-btn">开始游戏</button>
  </div>
  <script>
    (() => {
      const R = 5, C = 6
      const EMO = ['🍎', '🍋', '🍇', '🍉', '🍓', '🥝', '🍑', '🍍', '🍒']
      const leftEl = document.getElementById('left')
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const boardEl = document.getElementById('board')
      const tfill = document.getElementById('tfill')
      const shuffleBtn = document.getElementById('shuffle')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      // board 带外圈：尺寸 (R+2)x(C+2)，0 表示空
      let board, sel, score, timeLeft, running, over, pairs
      let best = Number(localStorage.getItem('lianliankan-best') || 0)
      bestEl.textContent = best

      function build() {
        // 18 格 = 9 对
        const pool = []
        for (let i = 0; i < 9; i++) pool.push(i, i)
        pool.sort(() => Math.random() - 0.5)
        board = Array.from({ length: R + 2 }, () => Array(C + 2).fill(0))
        let k = 0
        for (let r = 1; r <= R; r++)
          for (let c = 1; c <= C; c++)
            board[r][c] = pool[k++] + 1 // 1..9
        pairs = 9
      }

      function start() {
        score = 0; timeLeft = 120
        running = true; over = false
        scoreEl.textContent = 0
        build()
        overlay.classList.add('hidden')
        render()
      }

      // 0 转弯直连检测：b1 (r1,c1) -> (r2,c2)，值相同（或目标为空用于中转）
      function clearLine(r1, c1, r2, c2) {
        if (r1 === r2) {
          const lo = Math.min(c1, c2), hi = Math.max(c1, c2)
          for (let c = lo + 1; c < hi; c++) if (board[r1][c]) return false
          return true
        }
        if (c1 === c2) {
          const lo = Math.min(r1, r2), hi = Math.max(r1, r2)
          for (let r = lo + 1; r < hi; r++) if (board[r][c1]) return false
          return true
        }
        return false
      }

      function connected(r1, c1, r2, c2) {
        if (board[r1][c1] !== board[r2][c2] || board[r1][c1] === 0) return null
        // 0 转
        if (clearLine(r1, c1, r2, c2)) return [[r1, c1], [r2, c2]]
        // 1 转：两个拐点
        for (const [cr, cc] of [[r1, c2], [r2, c1]]) {
          if (board[cr][cc] === 0 &&
              clearLine(r1, c1, cr, cc) && clearLine(cr, cc, r2, c2))
            return [[r1, c1], [cr, cc], [r2, c2]]
        }
        // 2 转：扫描中间行/列
        for (let r = 0; r <= R + 1; r++) {
          if ((r === r1 && c1 === c2) || r === r2 && c1 === c2) continue
          if (board[r][c1] === 0 && board[r][c2] === 0 &&
              clearLine(r1, c1, r, c1) && clearLine(r, c1, r, c2) && clearLine(r, c2, r2, c2))
            return [[r1, c1], [r, c1], [r, c2], [r2, c2]]
        }
        for (let c = 0; c <= C + 1; c++) {
          if (board[r1][c] === 0 && board[r2][c] === 0 &&
              clearLine(r1, c1, r1, c) && clearLine(r1, c, r2, c) && clearLine(r2, c, r2, c2))
            return [[r1, c1], [r1, c], [r2, c], [r2, c2]]
        }
        return null
      }

      function render(path) {
        boardEl.innerHTML = ''
        for (let r = 1; r <= R; r++)
          for (let c = 1; c <= C; c++) {
            const el = document.createElement('div')
            const v = board[r][c]
            el.className = 'cell' + (v ? '' : ' gone') + (sel && sel[0] === r && sel[1] === c ? ' sel' : '')
            if (v) el.textContent = EMO[v - 1]
            el.onclick = () => pick(r, c)
            boardEl.appendChild(el)
          }
        leftEl.textContent = pairs
      }

      function pick(r, c) {
        if (!running || over || board[r][c] === 0) return
        if (!sel) { sel = [r, c]; render(); return }
        if (sel[0] === r && sel[1] === c) { sel = null; render(); return }
        const path = connected(sel[0], sel[1], r, c)
        if (path) {
          board[sel[0]][sel[1]] = 0
          board[r][c] = 0
          pairs--
          score += 10
          scoreEl.textContent = score
          sel = null
          timeLeft += 3
          if (pairs === 0) {
            running = false; over = true
            if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('lianliankan-best', best) }
            overlay.querySelector('h1').textContent = '🎉 全部消除'
            overlay.querySelector('p').innerHTML = '得分 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
            ovBtn.textContent = '再来一局'
            overlay.classList.remove('hidden')
            return
          }
          // 死局自动重排
          if (deadBoard()) doShuffle()
          render()
        } else {
          sel = [r, c]
          render()
        }
      }

      function deadBoard() {
        const cellsList = []
        for (let r = 1; r <= R; r++)
          for (let c = 1; c <= C; c++)
            if (board[r][c]) cellsList.push([r, c])
        for (let i = 0; i < cellsList.length; i++)
          for (let j = i + 1; j < cellsList.length; j++)
            if (connected(cellsList[i][0], cellsList[i][1], cellsList[j][0], cellsList[j][1])) return false
        return true
      }

      function doShuffle() {
        const vals = []
        for (let r = 1; r <= R; r++)
          for (let c = 1; c <= C; c++)
            if (board[r][c]) vals.push(board[r][c])
        vals.sort(() => Math.random() - 0.5)
        let k = 0
        for (let r = 1; r <= R; r++)
          for (let c = 1; c <= C; c++)
            if (board[r][c]) board[r][c] = vals[k++]
        if (deadBoard()) doShuffle()
      }

      shuffleBtn.addEventListener('click', () => {
        if (running && !over) { timeLeft = Math.max(1, timeLeft - 10); doShuffle(); render() }
      })

      let lastT = 0
      function loop(t) {
        requestAnimationFrame(loop)
        if (!lastT) lastT = t
        const dt = Math.min(60, t - lastT)
        lastT = t
        if (running && !over) {
          timeLeft -= dt / 1000
          tfill.style.width = Math.max(0, timeLeft / 120 * 100) + '%'
          if (timeLeft <= 0) {
            running = false; over = true
            overlay.querySelector('h1').textContent = '⏰ 时间到'
            overlay.querySelector('p').innerHTML = '剩 ' + pairs + ' 对未消除 · 得分 ' + score + ' · 最佳 ' + best
            ovBtn.textContent = '再来一局'
            overlay.classList.remove('hidden')
          }
        }
      }

      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      board = []; sel = null; score = 0; timeLeft = 120; pairs = 0
      running = false; over = false
    })()
  </script>
</body>
</html>
