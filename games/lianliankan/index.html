<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>连连看</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board { width:100%; aspect-ratio:6/5; display:grid; grid-template-columns:repeat(6,1fr);
      grid-template-rows:repeat(5,1fr); gap:4px; background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:6px; }
    .cell { display:grid; place-items:center; font-size:min(6vw,26px); background:#14161f;
      border-radius:6px; cursor:pointer; user-select:none; border:2px solid transparent; }
    .cell.sel { border-color:var(--yellow); background:#241f10; }
    .cell.gone { visibility:hidden; }
    .cell.hint { border-color:#22b573; }
    #bar { width:100%; display:flex; gap:10px; align-items:center; }
    #timer { flex:1; height:10px; background:#14161f; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; }
    #tfill { height:100%; width:100%; background:var(--yellow); }
    #shuffle { font-family:inherit; font-weight:700; font-size:12px; color:#eef1f6;
      background:#1a1d29; border:2px solid #2a2e3d; border-radius:8px; padding:6px 12px; cursor:pointer; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

/* Storybook pixel edition: authored game pieces and material-rich playfields. */
:root{--paper:#fff5dc;--ink:#795d47;--edge:#b38a63;--accent:#795d47;--blue:#795d47;--yellow:#c48a37}
body{background:#f5e7da;color:var(--ink);background-image:radial-gradient(#fff9 1px,transparent 1px);background-size:14px 14px;height:auto;min-height:100%;overflow:auto;padding:16px 12px;flex-direction:column;gap:8px}
#wrap{width:min(430px,94vw);max-width:100%;display:flex;flex-direction:column;gap:10px;position:relative;align-items:stretch;flex-shrink:0}
.scene-head{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}.scene-head small{font-size:10px;letter-spacing:1.5px;color:var(--edge)}.scene-head h2{font-size:22px;line-height:1.4;letter-spacing:1px;margin:3px 0}.scene-head svg{width:55px;height:55px;flex:none}.pixel-sprite{width:100%;height:100%;display:block;image-rendering:pixelated;pointer-events:none}
#hud{position:static;width:100%;font-size:11px;color:var(--ink);padding:5px;gap:8px;flex-wrap:wrap;align-items:center}#hud b{color:var(--ink);font-size:17px}
#board,canvas{border:4px solid var(--edge);border-radius:9px;box-shadow:0 5px color-mix(in srgb,var(--edge),transparent 55%);background:var(--paper)}#board{width:100%;max-width:100%;flex-shrink:0}
canvas{display:block;image-rendering:pixelated;width:100%;height:auto;max-width:100%;max-height:none;touch-action:none}
#overlay{position:fixed;inset:0;z-index:40;border-radius:0;background:color-mix(in srgb,var(--paper) 97%,transparent);color:var(--ink);gap:13px;padding:20px}#overlay::before{content:'';width:90px;height:90px;image-rendering:pixelated;background:url("data:image/svg+xml,%3Csvg%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2032%2032%22%20class%3D%22pixel-sprite%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%2211%22%20y%3D%2216%22%20width%3D%2211%22%20height%3D%2213%22%20fill%3D%22%23af784d%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2216%22%20width%3D%229%22%20height%3D%2211%22%20fill%3D%22%23ffe6b2%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2218%22%20width%3D%223%22%20height%3D%226%22%20fill%3D%22%23fff6da%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%228%22%20width%3D%2221%22%20height%3D%2211%22%20fill%3D%22%239c3d43%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%224%22%20width%3D%2213%22%20height%3D%225%22%20fill%3D%22%239c3d43%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2213%22%20width%3D%2225%22%20height%3D%227%22%20fill%3D%22%239c3d43%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%229%22%20width%3D%2219%22%20height%3D%228%22%20fill%3D%22%23e97564%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%225%22%20width%3D%2213%22%20height%3D%229%22%20fill%3D%22%23f69b7e%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%2214%22%20width%3D%2223%22%20height%3D%223%22%20fill%3D%22%23e97564%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%228%22%20width%3D%224%22%20height%3D%224%22%20fill%3D%22%23fff0cf%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%2212%22%20width%3D%225%22%20height%3D%224%22%20fill%3D%22%23fff0cf%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2222%22%20width%3D%222%22%20height%3D%223%22%20fill%3D%22%23332f36%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%2222%22%20width%3D%222%22%20height%3D%223%22%20fill%3D%22%23332f36%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2222%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23fffdf0%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%2222%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23fffdf0%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2226%22%20width%3D%223%22%20height%3D%222%22%20fill%3D%22%23f4998a%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%2226%22%20width%3D%223%22%20height%3D%222%22%20fill%3D%22%23f4998a%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2226%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%238f4d48%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}#overlay h1{font-size:25px;text-shadow:none;letter-spacing:1px}#overlay p{font-size:13px;color:var(--ink);line-height:1.9;max-width:360px}#overlay p b{color:var(--ink)!important}#overlay.hidden{display:none}#overlay button,.story-controls button,#shuffle{font:700 13px system-ui;color:var(--paper);background:var(--ink);border:2px solid var(--edge);border-radius:7px;box-shadow:0 3px #0002;padding:10px 18px;cursor:pointer}
button{font-family:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #cb875d;outline-offset:2px}.story-note{font-size:11px;line-height:1.8;text-align:center;width:100%;margin:2px 0;color:var(--ink)}.story-controls{display:flex;gap:8px;justify-content:center}.story-controls button{padding:8px 12px}.story-controls button:disabled{opacity:.5}.scene-strip{position:relative;height:72px;overflow:hidden;border:3px solid var(--edge);border-bottom:0;background:linear-gradient(#b4dfda 0 65%,#abc979 65%);border-radius:8px 8px 0 0;margin-bottom:-10px}.scene-strip svg{position:absolute;bottom:0;width:65px;height:65px}.scene-strip svg:nth-child(1){left:5%}.scene-strip svg:nth-child(2){left:43%}.scene-strip svg:nth-child(3){right:3%}
@media(max-width:480px){body{padding:12px 10px}.scene-head h2{font-size:19px}.scene-head svg{width:44px;height:44px}.scene-head small{letter-spacing:1px}#wrap{gap:8px}#hud b{font-size:15px}.story-note{font-size:10px}.scene-strip{height:56px}}
@media(min-width:600px) and (max-height:550px){#wrap{width:min(750px,96vw);display:grid;grid-template-columns:220px auto;gap:10px 25px;align-items:center;justify-content:center}.scene-head{grid-column:1;align-self:end}#hud{grid-column:1;justify-content:flex-start;align-self:start}.story-note,.story-controls,#bar{grid-column:1}.scene-strip{display:none}#board,canvas{grid-column:2;grid-row:1/6;width:min(370px,calc(100dvh - 42px));height:auto;max-height:calc(100dvh - 42px)}.scene-head h2{font-size:21px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

#board{position:relative;padding:20px;gap:6px;background:repeating-linear-gradient(0deg,#ad8b66 0 38px,#b9946d 38px 41px);border-color:#96775a}.cell{min-width:0;background:#fff2d1;border:2px solid #e8cba0;box-shadow:inset 2px 2px #fffa,0 3px #876746;border-radius:6px;aspect-ratio:1}.cell svg{width:95%;height:95%}.cell.sel{background:#f9d593;border-color:#bd793e}.cell.gone{visibility:hidden}.route-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 1px #fff);z-index:3;animation:fade-route .6s forwards}@keyframes fade-route{0%,65%{opacity:1}100%{opacity:0}}#timer{width:100%;background:#e4d0a8;border-color:#b39c76}#tfill{background:#89ad68}#bar{gap:8px}.scene-strip{background:linear-gradient(#cce1ce 65%,#a9c482 65%)}@media(min-width:600px) and (max-height:550px){#board{width:min(400px,calc((100dvh - 42px)*1.2))}#timer{grid-column:1}}
  </style>

<body>
  <div id="wrap">
    <header class="scene-head"><div><small>WOODLAND PAIRS</small><h2>森林野餐连连看</h2></div><svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="11" y="16" width="11" height="13" fill="#af784d"/><rect x="12" y="16" width="9" height="11" fill="#ffe6b2"/><rect x="12" y="18" width="3" height="6" fill="#fff6da"/><rect x="6" y="8" width="21" height="11" fill="#9c3d43"/><rect x="10" y="4" width="13" height="5" fill="#9c3d43"/><rect x="4" y="13" width="25" height="7" fill="#9c3d43"/><rect x="7" y="9" width="19" height="8" fill="#e97564"/><rect x="10" y="5" width="13" height="9" fill="#f69b7e"/><rect x="5" y="14" width="23" height="3" fill="#e97564"/><rect x="10" y="8" width="4" height="4" fill="#fff0cf"/><rect x="20" y="12" width="5" height="4" fill="#fff0cf"/><rect x="12" y="22" width="2" height="3" fill="#332f36"/><rect x="20" y="22" width="2" height="3" fill="#332f36"/><rect x="12" y="22" width="1" height="1" fill="#fffdf0"/><rect x="20" y="22" width="1" height="1" fill="#fffdf0"/><rect x="10" y="26" width="3" height="2" fill="#f4998a"/><rect x="21" y="26" width="3" height="2" fill="#f4998a"/><rect x="16" y="26" width="2" height="1" fill="#8f4d48"/></svg></header>

1" fill="#fffdf0"/><rect x="9" y="20" width="3" height="2" fill="#f4998a"/><rect x="20" y="20" width="3" height="2" fill="#f4998a"/><rect x="15" y="20" width="2" height="1" fill="#8f4d48"/><rect x="14" y="24" width="6" height="2" fill="#8a534b"/><rect x="16" y="24" width="2" height="3" fill="#fff8e4"/><rect x="3" y="26" width="5" height="4" fill="#fffbed"/><rect x="26" y="26" width="4" height="4" fill="#fffbed"/></svg><svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="11" y="16" width="11" height="13" fill="#af784d"/><rect x="12" y="16" width="9" height="11" fill="#ffe6b2"/><rect x="12" y="18" width="3" height="6" fill="#fff6da"/><rect x="6" y="8" width="21" height="11" fill="#9c3d43"/><rect x="10" y="4" width="13" height="5" fill="#9c3d43"/><rect x="4" y="13" width="25" height="7" fill="#9c3d43"/><rect x="7" y="9" width="19" height="8" fill="#e97564"/><rect x="10" y="5" width="13" height="9" fill="#f69b7e"/><rect x="5" y="14" width="23" height="3" fill="#e97564"/><rect x="10" y="8" width="4" height="4" fill="#fff0cf"/><rect x="20" y="12" width="5" height="4" fill="#fff0cf"/><rect x="12" y="22" width="2" height="3" fill="#332f36"/><rect x="20" y="22" width="2" height="3" fill="#332f36"/><rect x="12" y="22" width="1" height="1" fill="#fffdf0"/><rect x="20" y="22" width="1" height="1" fill="#fffdf0"/><rect x="10" y="26" width="3" height="2" fill="#f4998a"/><rect x="21" y="26" width="3" height="2" fill="#f4998a"/><rect x="16" y="26" width="2" height="1" fill="#8f4d48"/></svg></div>

  <div id="overlay">
    <h1>🔗 连连看</h1>
    <p>点击两个相同图案的方块<br/>连线转弯不超过两次即消除<br/>限时清空棋盘，卡住可重排（扣时）</p>
    <button id="ov-btn">开始游戏</button>

  <script>
    (() => {
      function pxRects(kind) {
        const a=[]; const r=(x,y,w,h,c)=>a.push([x,y,w,h,c]);
        const face=(x,y)=>{r(x,y,2,3,'#332f36');r(x+8,y,2,3,'#332f36');r(x,y,1,1,'#fffdf0');r(x+8,y,1,1,'#fffdf0');r(x-2,y+4,3,2,'#f4998a');r(x+9,y+4,3,2,'#f4998a');r(x+4,y+4,2,1,'#8f4d48');};
        const round=(x,y,w,h,c)=>{r(x+3,y,w-6,h,c);r(x,y+3,w,h-6,c)};
        if(kind==='apple'||kind==='orange'||kind==='berry') {
          const p=kind==='apple'?['#8e3540','#d84b4e','#ff765f','#ffbea0']:kind==='orange'?['#ae5c2c','#ef9c34','#ffc650','#ffed9a']:['#48447d','#6f6fc1','#9d9ce3','#d2d1ff'];
          round(4,9,24,20,p[0]);round(6,10,20,17,p[1]);r(8,11,15,11,p[2]);r(8,13,4,5,p[3]);r(10,11,5,2,p[3]);r(13,6,3,6,'#72533e');r(16,4,9,4,'#3c7949');r(17,4,6,2,'#9bcd55');face(10,19);
        } else if(kind==='carrot'||kind==='sprout') {
          r(14,6,3,11,'#37774b');r(7,5,8,4,'#387d43');r(9,3,6,4,'#84bd50');r(17,4,8,4,'#3c8e46');r(18,2,6,3,'#b0d767');
          if(kind==='carrot'){r(9,13,15,5,'#ad552b');r(10,18,12,5,'#ad552b');r(12,23,8,4,'#ad552b');r(14,27,4,3,'#ad552b');r(10,14,12,4,'#ffb04b');r(11,18,9,5,'#f88132');r(13,23,5,4,'#f88132');r(11,15,3,5,'#ffda75');r(18,19,3,1,'#ba5c32');r(13,24,3,1,'#ba5c32');}
          else {r(5,23,22,4,'#654830');r(8,21,16,3,'#9d6c42');r(14,14,3,8,'#3c8747');}
        } else if(kind==='flower') {
          r(15,13,3,17,'#3c8b58');r(8,20,8,4,'#82be5f');r(18,23,8,4,'#58a657');
          round(10,2,12,20,'#e5bc88');round(5,7,22,10,'#e5bc88');round(11,2,10,18,'#fffbea');round(5,8,22,8,'#fffbea');r(12,8,9,8,'#e9a82d');r(13,8,6,5,'#ffd95c');r(14,9,3,2,'#fff5ac');
        } else if(kind==='mushroom') {
          r(11,16,11,13,'#af784d');r(12,16,9,11,'#ffe6b2');r(12,18,3,6,'#fff6da');r(6,8,21,11,'#9c3d43');r(10,4,13,5,'#9c3d43');r(4,13,25,7,'#9c3d43');r(7,9,19,8,'#e97564');r(10,5,13,9,'#f69b7e');r(5,14,23,3,'#e97564');r(10,8,4,4,'#fff0cf');r(20,12,5,4,'#fff0cf');face(12,22);
        } else if(kind==='mole'||kind==='goldmole'||kind==='bunny') {
          const bunny=kind==='bunny',gold=kind==='goldmole'; const dark=bunny?'#8c7974':gold?'#9c6327':'#704c46'; const base=bunny?'#f9eacb':gold?'#efb648':'#b38360';const light=bunny?'#fffbed':gold?'#ffe08a':'#dbac7a';
          if(bunny){r(8,1,6,12,dark);r(19,0,6,13,dark);r(9,2,4,11,light);r(20,1,4,12,light);r(10,4,2,7,'#e7a09b');r(21,3,2,8,'#e7a09b');}
          else{round(4,5,8,9,dark);round(21,5,8,9,dark);r(6,7,4,5,'#e7a09b');r(23,7,4,5,'#e7a09b');}

        } else if(kind==='crate') {
          r(2,4,28,26,'#865637');r(4,5,24,22,'#d29b58');r(6,8,20,17,'#b77b46');r(7,9,18,3,'#e8b56b');r(7,16,18,2,'#e8b56b');r(4,5,3,22,'#f3c986');r(25,5,3,22,'#ad713f');r(5,5,22,3,'#ffe0a0');r(5,24,22,3,'#e4b06a');r(6,6,2,2,'#805b3d');r(24,25,2,2,'#805b3d');r(14,13,6,5,'#f1a13f');r(15,18,3,3,'#f1a13f');r(15,10,2,4,'#5f974f');r(17,10,4,2,'#9dc968');
        } else if(kind==='hedge') {
          r(1,5,30,27,'#376e4c');r(2,3,28,25,'#4b9550');r(5,1,22,26,'#75b44f');r(8,2,12,5,'#b9d663');r(4,8,8,5,'#a3ce5a');r(18,5,10,5,'#92c250');r(7,16,12,6,'#8fc352');r(21,16,8,6,'#447e45');r(4,24,11,4,'#467d43');r(21,11,3,3,'#d0e478');r(13,10,3,3,'#c0db69');r(15,25,8,3,'#64a34a');
        } else if(kind==='barn') {
          for(let i=0;i<6;i++)r(15-i*2,2+i*2,2+i*4,3,'#5c656c');r(6,14,23,17,'#9d4843');r(7,14,20,15,'#df775c');for(let i=9;i<27;i+=4)r(i,15,1,14,'#f59973');r(5,14,25,2,'#ffecbc');r(12,20,11,11,'#ffe8b4');r(14,21,7,10,'#975645');r(17,21,1,10,'#ffdb9e');r(14,23,7,1,'#ffdb9e');r(15,12,6,6,'#ffecbc');r(16,13,4,4,'#6aa7b5');
        } else if(kind==='cookie') {
          round(4,4,24,24,'#986334');round(5,4,22,21,'#e6ac57');r(8,6,16,13,'#f9ce7b');r(9,7,9,2,'#ffe6a3');for(const [x,y] of [[10,11],[21,10],[17,18],[8,21]]){r(x,y,3,3,'#8f5a41');r(x,y,2,1,'#bc8650');}
        }

        if(kind.startsWith('fish')){
          const p=kind==='fishgold'?['#a16036','#f6bb4e','#ffe690']:kind==='fishpink'?['#975270','#ed92aa','#ffc4bd']:['#426d8d','#74b9cf','#b5e6db'];
          r(1,9,4,14,p[0]);r(5,12,4,8,p[0]);round(8,7,22,19,p[0]);round(9,8,20,16,p[1]);r(13,8,11,5,p[2]);r(17,4,7,4,p[1]);r(15,25,8,3,p[1]);r(2,11,3,10,p[1]);r(12,16,5,7,p[2]);r(23,11,5,7,'#fff9df');r(25,12,3,5,'#394b55');r(25,12,1,1,'#fff');r(25,21,4,2,'#ec8d84');r(29,18,3,2,p[0]);r(18,15,2,3,p[0]);
        }
        if(kind==='lantern'||kind==='lampoff'){
          const on=kind==='lantern';r(11,1,10,2,'#617965');r(9,3,3,6,'#617965');r(20,3,3,6,'#617965');r(7,8,18,3,'#567862');r(5,11,22,15,'#567862');r(7,12,18,12,on?'#f9d67d':'#a3c2ba');r(9,13,3,7,on?'#fff4b9':'#c8ddd1');r(14,15,7,7,on?'#edae45':'#769f91');r(16,13,3,3,on?'#fff9d1':'#c8ddd1');r(7,26,18,3,'#567862');r(8,29,16,2,'#829d71');
        }
        if(kind==='yarn'){
          round(4,7,24,22,'#9e6676');round(5,7,22,20,'#d894a1');for(let k=0;k<5;k++){r(7+k*3,9,2,16,'#efbec0');r(6,10+k*3,20,1,'#c77f90')}r(22,25,2,5,'#9e6676');r(23,28,7,2,'#9e6676');r(11,2,2,9,'#917c60');r(9,2,6,2,'#d4b68b');
        }
        if(kind==='jar'){
          r(8,3,16,4,'#9b7664');r(8,3,16,2,'#e5c59b');r(6,8,20,21,'#7b9e98');r(7,8,18,19,'#cce5d6');r(9,10,3,13,'#fff7de');r(12,16,9,9,'#e4a17e');r(14,14,6,9,'#f9c690');r(14,16,2,2,'#fff0c2');r(8,27,16,2,'#a7c7b5');
        }
        return a;
      }
      function pxSprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pxRects(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}


      const R = 5, C = 6
      const EMO = ['apple','orange','grape','melon','carrot','berry','flower','mushroom','bunny']
      const leftEl = document.getElementById('left')
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const boardEl = document.getElementById('board')
      const tfill = document.getElementById('tfill')
      const shuffleBtn = document.getElementById('shuffle')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      // board 带外圈：尺寸 (R+2)x(C+2)，0 表示空
      let board, sel, score, timeLeft, running, over, pairs
      let best = Number(localStorage.getItem('lianliankan-best') || 0)
      bestEl.textContent = best

      function build() {
        // 30 cells = 15 pairs, every tile has a partner.
        const pool = []
        for (let i = 0; i < R*C/2; i++) pool.push(i%9, i%9)
        pool.sort(() => Math.random() - 0.5)
        board = Array.from({ length: R + 2 }, () => Array(C + 2).fill(0))
        let k = 0
        for (let r = 1; r <= R; r++)
          for (let c = 1; c <= C; c++)
            board[r][c] = pool[k++] + 1 // 1..9
        pairs = R*C/2
        if(deadBoard())doShuffle()
      }

      function start() {
        score = 0; timeLeft = 120; sel=null; lastT=0; tfill.style.width='100%'
        running = true; over = false
        scoreEl.textContent = 0
        build()
        overlay.classList.add('hidden')
        render()
      }

      // 0 转弯直连检测：b1 (r1,c1) -> (r2,c2)，值相同（或目标为空用于中转）
      function clearLine(r1, c1, r2, c2) {
        if (r1 === r2) {
          const lo = Math.min(c1, c2), hi = Math.max(c1, c2)
          for (let c = lo + 1; c < hi; c++) if (board[r1][c]) return false
          return true
        }
        if (c1 === c2) {
          const lo = Math.min(r1, r2), hi = Math.max(r1, r2)
          for (let r = lo + 1; r < hi; r++) if (board[r][c1]) return false
          return true
        }
        return false
      }

      function connected(r1, c1, r2, c2) {
        if (board[r1][c1] !== board[r2][c2] || board[r1][c1] === 0) return null
        // 0 转
        if (clearLine(r1, c1, r2, c2)) return [[r1, c1], [r2, c2]]
        // 1 转：两个拐点
        for (const [cr, cc] of [[r1, c2], [r2, c1]]) {
          if (board[cr][cc] === 0 &&
              clearLine(r1, c1, cr, cc) && clearLine(cr, cc, r2, c2))
            return [[r1, c1], [cr, cc], [r2, c2]]
        }
        // 2 转：扫描中间行/列
        for (let r = 0; r <= R + 1; r++) {
          if ((r === r1 && c1 === c2) || r === r2 && c1 === c2) continue
          if (board[r][c1] === 0 && board[r][c2] === 0 &&
              clearLine(r1, c1, r, c1) && clearLine(r, c1, r, c2) && clearLine(r, c2, r2, c2))
            return [[r1, c1], [r, c1], [r, c2], [r2, c2]]
        }
        for (let c = 0; c <= C + 1; c++) {
          if (board[r1][c] === 0 && board[r2][c] === 0 &&
              clearLine(r1, c1, r1, c) && clearLine(r1, c, r2, c) && clearLine(r2, c, r2, c2))
            return [[r1, c1], [r1, c], [r2, c], [r2, c2]]
        }
        return null
      }

      function render(path) {
        boardEl.innerHTML = ''
        for (let r = 1; r <= R; r++)
          for (let c = 1; c <= C; c++) {
            const el = document.createElement('button')
            el.setAttribute('aria-label','第 '+r+' 行第 '+c+' 列')
            const v = board[r][c]
            el.className = 'cell' + (v ? '' : ' gone') + (sel && sel[0] === r && sel[1] === c ? ' sel' : '')
            if (v) el.innerHTML = pxSprite(EMO[v - 1])
            el.onclick = () => pick(r, c)
            boardEl.appendChild(el)
          }
        leftEl.textContent = pairs
        if(path){const w=boardEl.clientWidth,h=boardEl.clientHeight,pad=20,gap=6,cw=(w-pad*2-gap*(C-1))/C,ch=(h-pad*2-gap*(R-1))/R;
          const points=path.map(([r,c])=>[(c===0?5:c===C+1?w-5:pad+(c-1)*(cw+gap)+cw/2),(r===0?5:r===R+1?h-5:pad+(r-1)*(ch+gap)+ch/2)].join(',')).join(' ');
          const line=document.createElementNS('http://www.w3.org/2000/svg','svg');line.setAttribute('viewBox','0 0 '+w+' '+h);line.setAttribute('class','route-line');line.innerHTML='<polyline points="'+points+'" fill="none" stroke="#f7c557" stroke-width="5" stroke-linejoin="round"/>';boardEl.appendChild(line)
        }
      }

      function pick(r, c) {
        if (!running || over || board[r][c] === 0) return
        if (!sel) { sel = [r, c]; render(); return }
        if (sel[0] === r && sel[1] === c) { sel = null; render(); return }
        const path = connected(sel[0], sel[1], r, c)
        if (path) {
          board[sel[0]][sel[1]] = 0
          board[r][c] = 0
          pairs--
          score += 10
          scoreEl.textContent = score
          sel = null
          timeLeft += 3
          if (pairs === 0) {
            render(path)
            running = false; over = true
            if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('lianliankan-best', best) }
            overlay.querySelector('h1').textContent = '🎉 全部消除'
            overlay.querySelector('p').innerHTML = '得分 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
            ovBtn.textContent = '再来一局'
            overlay.classList.remove('hidden')
            return
          }
          // 死局自动重排
          if (deadBoard()) doShuffle()
          render(path)
        } else {
          sel = [r, c]
          render()
        }
      }

      function deadBoard() {
        const cellsList = []
        for (let r = 1; r <= R; r++)
          for (let c = 1; c <= C; c++)
            if (board[r][c]) cellsList.push([r, c])
        for (let i = 0; i < cellsList.length; i++)
          for (let j = i + 1; j < cellsList.length; j++)
            if (connected(cellsList[i][0], cellsList[i][1], cellsList[j][0], cellsList[j][1])) return false
        return true
      }

      function doShuffle() {
        const cells=[],vals=[];sel=null
        for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)if(board[r][c]){cells.push([r,c]);vals.push(board[r][c])}
        if(!vals.length)return
        for(let attempt=0;attempt<32;attempt++){
          for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}
          cells.forEach(([r,c],i)=>board[r][c]=vals[i]);if(!deadBoard())return
        }
        // The first two remaining cells have a clear zero/one-turn path.
        vals.sort((a,b)=>a-b);cells.forEach(([r,c],i)=>board[r][c]=vals[i])
      }
      shuffleBtn.addEventListener('click', () => {if(running&&!over){timeLeft=Math.max(1,timeLeft-10);doShuffle();render()}})
      let lastT=0

      function loop(t) {
        requestAnimationFrame(loop)
        if (!lastT) lastT = t
        const dt = Math.min(60, t - lastT)
        lastT = t
        if (running && !over) {
          timeLeft -= dt / 1000
          tfill.style.width = Math.min(100, Math.max(0, timeLeft / 120 * 100)) + '%'
          if (timeLeft <= 0) {
            running = false; over = true
            overlay.querySelector('h1').textContent = '⏰ 时间到'
            overlay.querySelector('p').innerHTML = '剩 ' + pairs + ' 对未消除 · 得分 ' + score + ' · 最佳 ' + best
            ovBtn.textContent = '再来一局'
            overlay.classList.remove('hidden')
          }
        }
      }

      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running || over },
      }

      board = []; sel = null; score = 0; timeLeft = 120; pairs = 0
      running = false; over = false
    })()
  </script>
