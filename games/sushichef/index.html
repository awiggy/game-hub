<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>上菜快手</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #order { width:100%; min-height:86px; background:#1a1d29; border:2px solid #2a2e3d; border-radius:12px;
      display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; flex-wrap:wrap; }
    .need { font-size:32px; }
    .need.done { opacity:.25; }
    #timer { width:100%; height:10px; background:#14161f; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; }
    #tfill { height:100%; width:100%; background:var(--yellow); }
    #table { width:100%; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    #table button {
      aspect-ratio:1; font-size:34px; background:#1a1d29; border:2px solid #2a3350;
      border-radius:12px; cursor:pointer;
    }
    #table button:active { background:var(--blue); border-color:#fff; }
    #msg { font-size:15px; font-weight:900; min-height:22px; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>得分<b id="score">0</b></span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="order"></div>
    <div id="timer"><div id="tfill"></div></div>
    <div id="table">
      <button data-i="0">🍚</button>
      <button data-i="1">🐟</button>
      <button data-i="2">🥑</button>
      <button data-i="3">🍤</button>
    </div>
    <div id="msg">按订单顺序点击食材</div>
  </div>
  <div id="overlay">
    <h1>🍣 上菜快手</h1>
    <p>按订单从左到右依次点击食材<br/>出对 +10 加时，超时/出错 -1 命<br/>共 3 命，订单越来越长</p>
    <button id="ov-btn">开门营业</button>
  </div>
  <script>
    (() => {
      const ITEMS = ['🍚', '🐟', '🥑', '🍤']
      const NAMES = ['饭', '鱼', '牛油果', '虾']
      const orderEl = document.getElementById('order')
      const tfill = document.getElementById('tfill')
      const scoreEl = document.getElementById('score')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const msgEl = document.getElementById('msg')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')
      const tableBtns = [...document.querySelectorAll('#table button')]

      let order, pos, score, lives, timeLeft, limit, round, running, over
      let best = Number(localStorage.getItem('sushichef-best') || 0)
      bestEl.textContent = best

      function newOrder() {
        round++
        const len = Math.min(4, 2 + ((round / 3) | 0))
        order = Array.from({ length: len }, () => (Math.random() * 4) | 0)
        pos = 0
        limit = Math.max(3000, 6500 - round * 250)
        timeLeft = limit
        renderOrder()
      }

      function start() {
        score = 0; lives = 3; round = 0
        running = true; over = false
        scoreEl.textContent = 0; livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
        newOrder()
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('sushichef-best', best) }
        overlay.querySelector('h1').textContent = '🏪 打烊了'
        overlay.querySelector('p').innerHTML = '得分 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = '明天再来'
        overlay.classList.remove('hidden')
      }

      function renderOrder() {
        orderEl.innerHTML = ''
        order.forEach((v, i) => {
          const el = document.createElement('span')
          el.className = 'need' + (i < pos ? ' done' : '')
          el.textContent = ITEMS[v]
          orderEl.appendChild(el)
        })
        tfill.style.width = Math.max(0, timeLeft / limit * 100) + '%'
      }

      function pick(i) {
        if (!running || over) return
        if (i === order[pos]) {
          pos++
          msgEl.textContent = '✓ ' + NAMES[i]
          if (pos === order.length) {
            score += 10
            scoreEl.textContent = score
            msgEl.textContent = '🍣 出餐！+10'
            setTimeout(newOrder, 400)
          }
          renderOrder()
        } else {
          lives--
          livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
          msgEl.textContent = '✗ 顺序错了！'
          if (lives <= 0) return end()
          pos = 0
          timeLeft = Math.min(timeLeft, limit * 0.6)
          renderOrder()
        }
      }

      tableBtns.forEach((b) => b.addEventListener('click', () => pick(Number(b.dataset.i))))
      window.addEventListener('keydown', (e) => {
        const k = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code)
        if (k >= 0) pick(k)
      })

      let lastT = 0
      function loop(t) {
        requestAnimationFrame(loop)
        if (!lastT) lastT = t
        const dt = Math.min(60, t - lastT)
        lastT = t
        if (running && !over) {
          timeLeft -= dt
          tfill.style.width = Math.max(0, timeLeft / limit * 100) + '%'
          if (timeLeft <= 0) {
            lives--
            livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
            msgEl.textContent = '⏰ 超时了！'
            if (lives <= 0) return end()
            newOrder()
          }
        }
      }

      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      order = []; pos = 0; score = 0; lives = 3
      timeLeft = 6000; limit = 6000; round = 0; running = false; over = false
    })()
  </script>
</body>
</html>
