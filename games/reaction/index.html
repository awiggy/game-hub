<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>极速反应</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,480px); position:relative; display:flex; flex-direction:column; gap:12px; }
    #hud { display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #pad {
      height:min(58vh,420px); border:3px solid #2a2e3d; border-radius:14px; background:#1a1d29;
      display:flex; flex-direction:column; gap:8px; align-items:center; justify-content:center;
      font-size:30px; font-weight:900; cursor:pointer; user-select:none; transition:background .08s;
    }
    #pad.wait { background:#4d1f26; }
    #pad.go { background:#1d4d2e; }
    #pad small { font-size:13px; color:#8b93a7; font-weight:700; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.88); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>回合<b id="round">0/20</b></span>
      <span>上次<b id="lastms">—</b></span>
      <span>犯规<b id="fouls">0/3</b></span>
      <span>BEST<b id="best">—</b></span>
    </div>
    <div id="pad">
      <span id="pad-main">⚡</span>
      <small id="pad-sub">点击开始</small>
    </div>
  </div>
  <div id="overlay">
    <h1>⚡ 极速反应</h1>
    <p>区域变红后耐心等待<br/>变绿的瞬间点击！<br/>提前点 = 犯规，3 次出局 · 共 20 回合</p>
    <button id="ov-btn">开始测试</button>
  </div>
  <script>
    (() => {
      const pad = document.getElementById('pad')
      const padMain = document.getElementById('pad-main')
      const padSub = document.getElementById('pad-sub')
      const roundEl = document.getElementById('round')
      const lastEl = document.getElementById('lastms')
      const foulsEl = document.getElementById('fouls')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let phase, round, fouls, times, goAt, timer, running, over
      let best = Number(localStorage.getItem('reaction-best') || 0)
      bestEl.textContent = best ? best : '—'

      function setPad(main, sub, cls) {
        padMain.textContent = main
        padSub.textContent = sub
        pad.className = cls || ''
      }

      function start() {
        round = 0; fouls = 0; times = []
        running = true; over = false
        roundEl.textContent = '0/20'; foulsEl.textContent = '0/3'
        overlay.classList.add('hidden')
        nextRound()
      }

      function nextRound() {
        phase = 'wait'
        setPad('✋', '等待绿色出现…', 'wait')
        timer = setTimeout(() => {
          phase = 'go'
          goAt = performance.now()
          setPad('👆', '点！', 'go')
        }, 500 + Math.random() * 2000)
      }

      function finish() {
        running = false; over = true
        const avg = times.reduce((a, b) => a + b, 0) / times.length
        const s = Math.max(0, Math.round(1000 - avg))
        if (s > best) { best = s; bestEl.textContent = best; localStorage.setItem('reaction-best', best) }
        overlay.querySelector('h1').textContent = '🏁 测试完成'
        overlay.querySelector('p').innerHTML =
          '平均反应 <b style="color:#ffd23f">' + Math.round(avg) + ' ms</b> · 得分 ' + s +
          (times.length ? '<br/>最快 ' + Math.min(...times) + ' ms / 最慢 ' + Math.max(...times) + ' ms' : '')
        ovBtn.textContent = '再来一次'
        overlay.classList.remove('hidden')
      }

      pad.addEventListener('pointerdown', () => {
        if (!running || over) return
        if (phase === 'wait') {
          clearTimeout(timer)
          fouls++
          foulsEl.textContent = fouls + '/3'
          phase = 'idle'
          setPad('🚫', '犯规！等待中点击了', '')
          if (fouls >= 3) {
            running = false; over = true
            overlay.querySelector('h1').textContent = '🚫 3 次犯规出局'
            overlay.querySelector('p').innerHTML = '完成 ' + round + ' 回合' + (times.length ? '，平均 ' + Math.round(times.reduce((a, b) => a + b, 0) / times.length) + ' ms' : '')
            ovBtn.textContent = '再来一次'
            overlay.classList.remove('hidden')
          } else {
            setTimeout(() => { if (running && !over) nextRound() }, 900)
          }
          return
        }
        if (phase === 'go') {
          const ms = Math.round(performance.now() - goAt)
          times.push(ms)
          lastEl.textContent = ms + 'ms'
          round++
          roundEl.textContent = round + '/20'
          phase = 'idle'
          setPad(ms + 'ms', round >= 20 ? '完成！' : '下一回合…', '')
          if (round >= 20) return finish()
          setTimeout(() => { if (running && !over && phase === 'idle') nextRound() }, 700)
        }
      })

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return times.length ? Math.max(0, Math.round(1000 - times.reduce((a, b) => a + b, 0) / times.length)) : 0 },
        get over() { return over },
        get started() { return running },
      }

      phase = 'idle'; round = 0; fouls = 0; times = []; running = false; over = false
    })()
  </script>
</body>
</html>
