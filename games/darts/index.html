<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>飞镖高手</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>得分<b id="score">0</b></span>
      <span>剩余<b id="left">8</b>镖</span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="440" height="560"></canvas>
    <div id="overlay">
      <h1>🎯 飞镖高手</h1>
      <p>第一次点击锁定竖直位置<br/>第二次点击锁定水平位置并投出<br/>红心 50 分！共 8 镖</p>
      <button id="ov-btn">开始投镖</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const CX = W / 2, CY = 230, BR = 150
      const scoreEl = document.getElementById('score')
      const leftEl = document.getElementById('left')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let phase, lockY, lockX, xDir, darts, left, score, running, over, msgs
      let best = Number(localStorage.getItem('darts-best') || 0)
      bestEl.textContent = best

      function start() {
        phase = 'aimY'; lockY = CY; lockX = CX; xDir = 1
        darts = []; left = 8; score = 0; msgs = []
        running = true; over = false
        scoreEl.textContent = 0; leftEl.textContent = 8
        overlay.classList.add('hidden')
      }

      function tap() {
        if (!running || over) return
        if (phase === 'aimY') { phase = 'aimX'; return }
        if (phase === 'aimX') {
          const d = Math.hypot(lockX - CX, lockY - CY)
          const pts = d < 16 ? 50 : d < 42 ? 30 : d < 75 ? 20 : d < 110 ? 10 : d < BR ? 5 : 0
          score += pts
          scoreEl.textContent = score
          darts.push({ x: lockX, y: lockY, pts })
          msgs.unshift(pts ? lockY.toFixed(0) + ',' + lockX.toFixed(0) + ' → +' + pts : '脱靶')
          if (msgs.length > 3) msgs.pop()
          left--
          leftEl.textContent = left
          if (left <= 0) {
            running = false; over = true
            if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('darts-best', best) }
            overlay.querySelector('h1').textContent = '🏁 投镖结束'
            overlay.querySelector('p').innerHTML = '总分 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
            ovBtn.textContent = '再来一轮'
            overlay.classList.remove('hidden')
            return
          }
          phase = 'aimY'
        }
      }

      function step() {
        if (phase === 'aimY') lockY = CY + Math.sin(Date.now() / 260) * (BR + 26)
        if (phase === 'aimX') {
          lockX += xDir * 5.2
          if (lockX > CX + BR + 26) { lockX = CX + BR + 26; xDir = -1 }
          if (lockX < CX - BR - 26) { lockX = CX - BR - 26; xDir = 1 }
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        // 靶
        const rings = [['#eef1f6', BR], ['#14161f', 110], ['#5d84ff', 75], ['#eef1f6', 42], ['#ff4d5e', 16]]
        for (const [c, r] of rings) {
          ctx.fillStyle = c
          ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.fill()
        }
        ctx.strokeStyle = 'rgba(0,0,0,0.3)'
        ctx.lineWidth = 1
        for (const r of [16, 42, 75, 110, BR]) {
          ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke()
        }
        ctx.fillStyle = '#eef1f6'
        ctx.font = '700 13px sans-serif'
        ctx.fillText('50', CX - 9, CY + 4)
        // 已插的镖
        ctx.font = '16px sans-serif'
        for (const d of darts) ctx.fillText('📌', d.x - 8, d.y + 6)
        // 瞄准线
        if (running && !over) {
          ctx.strokeStyle = 'rgba(255,210,63,0.7)'
          ctx.lineWidth = 2
          if (phase === 'aimY') {
            ctx.setLineDash([6, 6])
            ctx.beginPath(); ctx.moveTo(30, lockY); ctx.lineTo(W - 30, lockY); ctx.stroke()
            ctx.setLineDash([])
            ctx.fillStyle = '#ffd23f'
            ctx.beginPath(); ctx.arc(CX, lockY, 6, 0, Math.PI * 2); ctx.fill()
          } else {
            ctx.setLineDash([6, 6])
            ctx.beginPath(); ctx.moveTo(lockX, 40); ctx.lineTo(lockX, CY + BR + 30); ctx.stroke()
            ctx.setLineDash([])
            ctx.fillStyle = '#ff4d5e'
            ctx.beginPath(); ctx.arc(lockX, lockY, 8, 0, Math.PI * 2); ctx.fill()
          }
        }
        // 提示与最近成绩
        ctx.fillStyle = '#8b93a7'
        ctx.font = '700 13px sans-serif'
        ctx.fillText(phase === 'aimY' ? '① 点击锁定竖直位置' : '② 点击锁定水平并投出', 14, H - 30)
        msgs.forEach((m, i) => ctx.fillText(m, 14, H - 10 - i * 0))
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault()
          if (!running && !overlay.classList.contains('hidden')) start()
          else tap()
        }
      })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); tap() })
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      phase = 'aimY'; lockY = CY; lockX = CX; xDir = 1
      darts = []; left = 8; score = 0; running = false; over = false; msgs = []
    })()
  </script>
</body>
</html>
