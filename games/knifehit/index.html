<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>飞刀挑战</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>已插<b id="score">0</b></span>
      <span>关卡<b id="level">1</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="400" height="560"></canvas>
    <div id="overlay">
      <h1>🔪 飞刀挑战</h1>
      <p>空格 / 点击 掷出飞刀，插进旋转圆盘<br/>每关插满 6+关卡数 把过关，转速越来越快<br/>与已插的刀相撞即结束，看准空隙再出手！</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const levelEl = document.getElementById('level')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')
      const CX = W / 2, CY = 205, R = 76
      const TAU = Math.PI * 2

      let stuck, rot, dir, omega, flipT, level, need, placed, score, flying, flash, running, over
      let best = Number(localStorage.getItem('knifehit-best') || 0)
      bestEl.textContent = best

      function norm(a) { a %= TAU; if (a < 0) a += TAU; return a }
      function angDiff(a, b) {
        const d = Math.abs(norm(a) - norm(b))
        return Math.min(d, TAU - d)
      }

      function startLevel() {
        stuck = []; placed = 0; flying = null; rot = 0
        dir = Math.random() < 0.5 ? 1 : -1
        omega = 0.042 * Math.pow(1.1, level - 1)
        flipT = 150 + Math.random() * 140
        need = 6 + level
        levelEl.textContent = String(level)
        flash = 50
      }

      function start() {
        level = 1; score = 0
        scoreEl.textContent = '0'
        startLevel()
        running = true; over = false
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('knifehit-best', best) }
        overlay.querySelector('h1').textContent = '💥 游戏结束'
        overlay.querySelector('p').innerHTML = '成功插入 <b style="color:#ffd23f">' + score + '</b> 把飞刀 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function throwKnife() {
        if (!running || over || flying != null) return
        flying = H - 74
      }

      function step() {
        rot += omega * dir
        flipT--
        if (flipT <= 0) { dir *= -1; flipT = 150 + Math.random() * 140 }
        if (flash > 0) flash--
        if (flying != null) {
          flying -= 24
          if (flying - 30 <= CY + R) {
            const a = norm(Math.PI / 2 - rot)
            for (const s of stuck) {
              if (angDiff(a, s) < 0.314) { flying = null; return end() }
            }
            stuck.push(a)
            score++; placed++
            scoreEl.textContent = String(score)
            flying = null
            if (placed >= need) { level++; startLevel() }
          }
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = '#1b1f2b'
        ctx.beginPath(); ctx.arc(CX, CY, R + 14, 0, TAU); ctx.fill()
        ctx.fillStyle = '#2a2f3e'
        ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.fill()
        ctx.save()
        ctx.translate(CX, CY)
        ctx.rotate(rot)
        ctx.strokeStyle = '#3a4156'
        ctx.lineWidth = 3
        for (let i = 0; i < 8; i++) {
          ctx.rotate(TAU / 8)
          ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(R - 8, 0); ctx.stroke()
        }
        ctx.restore()
        ctx.fillStyle = '#ffd23f'
        ctx.beginPath(); ctx.arc(CX, CY, 12, 0, TAU); ctx.fill()

        for (const s of stuck) {
          ctx.save()
          ctx.translate(CX, CY)
          ctx.rotate(s + rot)
          ctx.fillStyle = '#dfe3ec'
          ctx.fillRect(R - 14, -3, 26, 6)
          ctx.fillStyle = '#8a5a2b'
          ctx.fillRect(R + 12, -4.5, 16, 9)
          ctx.restore()
        }

        if (flash > 0) {
          ctx.globalAlpha = Math.min(1, flash / 20)
          ctx.fillStyle = '#ffd23f'
          ctx.font = 'bold 22px sans-serif'
          ctx.textAlign = 'center'
          ctx.fillText('第 ' + level + ' 关', CX, CY + R + 46)
          ctx.globalAlpha = 1
        }

        if (flying != null) {
          ctx.fillStyle = '#dfe3ec'
          ctx.beginPath()
          ctx.moveTo(CX - 3, flying - 18)
          ctx.lineTo(CX, flying - 30)
          ctx.lineTo(CX + 3, flying - 18)
          ctx.closePath()
          ctx.fill()
          ctx.fillRect(CX - 3, flying - 18, 6, 22)
          ctx.fillStyle = '#8a5a2b'
          ctx.fillRect(CX - 4.5, flying + 4, 9, 16)
        }

        ctx.fillStyle = '#2a2e3d'
        ctx.fillRect(CX - 34, H - 44, 68, 8)
        const left = need - placed
        ctx.font = '20px sans-serif'
        ctx.textAlign = 'center'
        for (let i = 0; i < left; i++) {
          ctx.fillText('🔪', CX + (i - (left - 1) / 2) * 24, H - 18)
        }
        ctx.textAlign = 'left'
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => {
        if (!running || over) {
          if ((e.code === 'Space' || e.code === 'Enter') && !overlay.classList.contains('hidden')) start()
          return
        }
        if (e.code === 'Space') { e.preventDefault(); throwKnife() }
      })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); throwKnife() })
      ovBtn.addEventListener('click', start)

      stuck = []; rot = 0; dir = 1; omega = 0.042; flipT = 200
      level = 1; need = 7; placed = 0; score = 0; flying = null; flash = 0
      running = false; over = false

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }
      loop()
    })()
  </script>
</body>
</html>
