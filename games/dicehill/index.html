<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>骰子爬塔</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,420px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #die {
      width:110px; height:110px; border-radius:18px; background:#1a1d29; border:3px solid #2a3350;
      display:grid; place-items:center; font-size:56px; font-weight:900; color:var(--yellow);
    }
    #hill { width:100%; height:130px; background:#1a1d29; border:2px solid #2a2e3d; border-radius:12px;
      position:relative; overflow:hidden; }
    #climb { position:absolute; left:50%; bottom:6px; font-size:30px; transition:bottom .25s; transform:translateX(-50%); }
    #msg { font-size:15px; font-weight:900; min-height:22px; text-align:center; }
    #acts { display:flex; gap:12px; width:100%; }
    .act { flex:1; font-family:inherit; font-weight:900; font-size:15px; padding:14px 0;
      color:#eef1f6; background:var(--blue); border:2px solid #fff; border-radius:10px; cursor:pointer; }
    .act.alt { background:#22b573; }
    .act:disabled { opacity:.4; cursor:not-allowed; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>得分<b id="score">0</b></span>
      <span>剩余骰<b id="rolls">10</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="die">🎲</div>
    <div id="hill"><div id="climb">🧗</div></div>
    <div id="msg">点「掷骰子」开始爬塔</div>
    <div id="acts">
      <button class="act" id="roll">🎲 掷骰子</button>
      <button class="act alt" id="bank" disabled>💰 收手（+层数×10）</button>
    </div>
  </div>
  <div id="overlay">
    <h1>🎲 骰子爬塔</h1>
    <p>掷骰子决定爬几层，越高越值钱<br/>但掷出 1 ⚠ 会摔落清空本层进度<br/>10 次掷骰机会：贪还是收？</p>
    <button id="ov-btn">开始爬塔</button>
  </div>
  <script>
    (() => {
      const dieEl = document.getElementById('die')
      const climbEl = document.getElementById('climb')
      const msgEl = document.getElementById('msg')
      const rollBtn = document.getElementById('roll')
      const bankBtn = document.getElementById('bank')
      const scoreEl = document.getElementById('score')
      const rollsEl = document.getElementById('rolls')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const FACES = ['⚀','⚁','⚂','⚃','⚄','⚅']

      let score, rolls, floor, running, over
      let best = Number(localStorage.getItem('dicehill-best') || 0)
      bestEl.textContent = best

      function start() {
        score = 0; rolls = 10; floor = 0
        running = true; over = false
        scoreEl.textContent = 0; rollsEl.textContent = 10
        dieEl.textContent = '🎲'
        climbEl.style.bottom = '6px'
        bankBtn.disabled = true
        rollBtn.disabled = false
        msgEl.textContent = '点「掷骰子」开始爬塔'
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('dicehill-best', best) }
        overlay.querySelector('h1').textContent = '🏁 爬塔结束'
        overlay.querySelector('p').innerHTML = '总得分 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function roll() {
        if (!running || over || rolls <= 0) return
        rolls--
        rollsEl.textContent = rolls
        rollBtn.disabled = true
        bankBtn.disabled = true
        // 掷骰动画
        let n = 8
        const anim = setInterval(() => {
          dieEl.textContent = FACES[(Math.random() * 6) | 0]
          if (--n <= 0) {
            clearInterval(anim)
            const v = 1 + ((Math.random() * 6) | 0)
            dieEl.textContent = FACES[v - 1]
            if (v === 1) {
              msgEl.textContent = '⚠ 摔落了！本层清零'
              floor = 0
              climbEl.style.bottom = '6px'
              finishRoll()
            } else {
              floor += v
              climbEl.style.bottom = Math.min(94, 6 + floor * 2.2) + 'px'
              msgEl.textContent = '掷出 ' + v + '！当前第 ' + floor + ' 层 · 收手可得 ' + floor * 10 + ' 分'
              finishRoll()
            }
          }
        }, 70)
      }

      function finishRoll() {
        bankBtn.disabled = floor === 0
        if (rolls <= 0) {
          // 最后一次机会强制结算
          if (floor > 0) doBank()
          else end()
          return
        }
        rollBtn.disabled = false
        bankBtn.disabled = floor === 0
      }

      function doBank() {
        if (floor === 0) return
        score += floor * 10
        scoreEl.textContent = score
        msgEl.textContent = '收手 +' + floor * 10 + ' 分'
        floor = 0
        climbEl.style.bottom = '6px'
        bankBtn.disabled = true
        if (rolls <= 0) return end()
        rollBtn.disabled = false
      }

      rollBtn.addEventListener('click', roll)
      bankBtn.addEventListener('click', doBank)
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      score = 0; rolls = 10; floor = 0; running = false; over = false
    })()
  </script>
</body>
</html>
