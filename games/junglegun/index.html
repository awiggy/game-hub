      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}



      let pxLast=0,pxAcc=0;
      function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
      function line(x,y,xx,yy,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}
      function disc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.fill()}
      function label(t,x,y,size=14,c='#566e65',align='left'){ctx.fillStyle=c;ctx.font='700 '+size+'px system-ui';ctx.textAlign=align;ctx.fillText(t,x,y);ctx.textAlign='left'}
      function panel(x,y,w,h,c='#e4c396',edge='#a58262'){box(x,y+4,w,h,edge);box(x,y,w,h,c);box(x+3,y+3,w-6,3,'#fff5d788');box(x+3,y+h-5,w-6,3,'#00000015')}
      function wood(x,y,w,h,c='#e8c799'){panel(x,y,w,h,c);for(let k=12;k<w;k+=27){box(x+k,y+6,1,h-12,'#cda57566');box(x+k+5,y+(k*7%Math.max(1,h-18))+6,9,2,'#d3b08466')}}
      function lawn(x,y,w,h){box(x,y,w,h,'#9bc58b');for(let r=0;r<h;r+=28)for(let c=0;c<w;c+=28)if((r+c)%56===0)box(x+c,y+r,28,28,'#a6cf97');for(let k=0;k<22;k++){let xx=x+(k*67)%Math.max(1,w-8),yy=y+(k*97)%Math.max(1,h-8);box(xx,yy,2,5,'#78aa76');box(xx+3,yy+2,2,3,'#78aa76')}}
      function bgSky(ground=H*.75){box(0,0,W,H,'#c1e4e0');for(let i=0;i<4;i++){let x=25+i*125,y=38+(i%2)*38;box(x,y,64,14,'#fff6dc');box(x+13,y-11,35,12,'#fff6dc')}for(let i=0;i<7;i++){box(i*82-20,ground-55-(i%3)*12,90,70,'#a9cdc0');box(i*82,ground-70-(i%3)*12,45,22,'#a9cdc0')}lawn(0,ground,W,H-ground);for(let i=0;i<6;i++){pxPaint('tree',i*93-20,ground-76,80)}for(let i=0;i<W;i+=26){box(i,ground-20,4,21,'#dac6a0')}box(0,ground-14,W,3,'#ead6b0');}
      function cosmos(){box(0,0,W,H,'#526a93');for(let i=0;i<65;i++){const x=(i*137+19)%W,y=(i*79+23)%H;box(x,y,i%5===0?3:2,i%5===0?3:2,i%3?'#b3c6d6':'#f9df9c')}disc(W-70,75,30,'#d3b8c4');box(W-84,57,12,8,'#b29eaf');box(W-66,81,16,8,'#b29eaf')}
      function targetArt(x,y,r){disc(x+2,y+4,r+3,'#9e876a');disc(x,y,r,'#fff1cf');disc(x,y,r*.72,'#df8f7d');disc(x,y,r*.43,'#fff1cf');disc(x,y,r*.18,'#a8ba81')}
      function marble(x,y,r,c='#79b4ba'){disc(x+1,y+2,r,'#719493');disc(x,y,r-1,c);disc(x-r*.3,y-r*.35,r*.27,'#fff9d8')}
      function meter(v,y=H-44){panel(24,y,W-48,14,'#ead7b4');box(27,y+3,(W-54)*Math.max(0,Math.min(1,v)),8,'#e8b66f')}
      function pointerKeys(entries){for(const[button,key]of entries){const b=document.getElementById(button);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);keys[key]=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[key]=false)}window.addEventListener('blur',()=>{keys={}})}

      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const G = 0.42, JUMP = 10.6
      const scoreEl = document.getElementById('score')
      const livesEl = document.getElementById('lives')
      const lvEl = document.getElementById('lv')
      const killsEl = document.getElementById('kills')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      // 关卡：plats [x,y,w]（厚度 26）；gap 地面段不画；enemies {x, y, type, dir}
      const LEVELS = [
        { width: 2400, flag: 2300,
          plats: [
            [0, 430, 700, 0], [790, 430, 450, 0], [1300, 430, 580, 0], [1940, 430, 460, 0],
            [240, 330, 140], [520, 250, 130], [900, 320, 150], [1180, 250, 140],
            [1520, 330, 140], [1750, 250, 140], [2050, 330, 150],
          ],
          enemies: [
            { x: 400, y: 430, type: 'walk', range: 120 },
            { x: 620, y: 430, type: 'shoot', range: 0 },
            { x: 950, y: 320, type: 'walk', range: 100 },
            { x: 1250, y: 430, type: 'shoot', range: 0 },
            { x: 1450, y: 430, type: 'walk', range: 130 },
            { x: 1820, y: 250, type: 'shoot', range: 0 },
            { x: 1900, y: 430, type: 'walk', range: 140 },
            { x: 2120, y: 330, type: 'walk', range: 110 },
          ] },
        { width: 2800, flag: 2700,
          plats: [
            [0, 430, 600, 0], [680, 430, 420, 0], [1180, 430, 500, 0], [1740, 430, 580, 0], [2400, 430, 400, 0],
            [200, 320, 130], [430, 240, 130], [760, 320, 130], [980, 240, 130],
            [1300, 320, 140], [1560, 240, 130], [1880, 330, 150], [2150, 250, 140], [2380, 330, 130],
          ],
          enemies: [
            { x: 350, y: 430, type: 'walk', range: 130 },
            { x: 560, y: 240, type: 'shoot', range: 0 },
            { x: 800, y: 430, type: 'walk', range: 120 },
            { x: 1040, y: 240, type: 'shoot', range: 0 },
            { x: 1300, y: 430, type: 'walk', range: 140 },
            { x: 1380, y: 320, type: 'walk', range: 110 },
            { x: 1650, y: 240, type: 'shoot', range: 0 },
            { x: 1900, y: 430, type: 'walk', range: 150 },
            { x: 1950, y: 330, type: 'shoot', range: 0 },
            { x: 2220, y: 250, type: 'walk', range: 110 },
            { x: 2500, y: 430, type: 'walk', range: 130 },
          ] },
      ]

      let player, enemies, bullets, ebullets, parts, plats, flagX, level
      let score, lives, kills, cam, running, over, frame, inv, keys, clearT
      let best = Number(localStorage.getItem('junglegun-best') || 0)
      bestEl.textContent = best

      function load(nv) {
        level = nv
        const L = LEVELS[nv]
        plats = L.plats.map((p) => ({ x: p[0], y: p[1], w: p[2], h: p[3] || 26 }))
        flagX = L.flag
        enemies = L.enemies.map((e) => ({
          x: e.x, y: e.y, type: e.type,
          x0: e.x, range: e.range || 0, dir: -1,
          hp: 2, cd: 40 + Math.random() * 60, dead: false,
        }))
        for(const e of enemies){let support=plats.filter(p=>p.y===e.y).sort((a,b)=>Math.abs(e.x-Math.max(a.x+18,Math.min(a.x+a.w-18,e.x)))-Math.abs(e.x-Math.max(b.x+18,Math.min(b.x+b.w-18,e.x))))[0];e.x=Math.max(support.x+18,Math.min(support.x+support.w-18,e.x));e.x0=e.x;e.minX=Math.max(support.x+18,e.x-e.range);e.maxX=Math.min(support.x+support.w-18,e.x+e.range)}
        bullets = []; ebullets = []; parts = []
        player = { x: 40, y: 380, vx: 0, vy: 0, w: 18, h: 30, dir: 1, onGround: false, fireCd: 0 }
        cam = 0
        inv = 80; frame = 0
        lvEl.textContent = (nv + 1) + '/2'
      }

      function start() {
        pxLast=0;pxAcc=0;
        score = 0
        lives = 3
        kills = 0
        running = true; over = false
        scoreEl.textContent = score; livesEl.textContent = '♥'.repeat(lives)
        killsEl.textContent = kills
        keys={};load(0)
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (kills > best) { best = kills; bestEl.textContent = best; localStorage.setItem('junglegun-best', best) }
        overlay.querySelector('h1').textContent = '💥 全军覆没'
        overlay.querySelector('p').innerHTML =
          '击杀 <b style="color:#ffd23f">' + kills + '</b> · 得分 ' + score + ' · 最佳击杀 ' + best
        ovBtn.textContent = '重新突击'
        overlay.classList.remove('hidden')
      }

      function clearLevel() {
        running = false; over = true
        score += 500
        scoreEl.textContent = score
        if (kills > best) { best = kills; bestEl.textContent = best; localStorage.setItem('junglegun-best', best) }
        overlay.querySelector('h1').textContent = '🏆 战役胜利'
        overlay.querySelector('p').innerHTML =
          '两关全部攻占！总击杀 <b style="color:#ffd23f">' + kills + '</b> · 总分 ' + score
        ovBtn.textContent = '再来一场';overlay.classList.remove('hidden')
      }

      function solidAt(x, y, vy) {
        for (const p of plats) {
          if (x > p.x - 6 && x < p.x + p.w + 6 && y >= p.y - 4 && y <= p.y + 14 && vy >= 0) return p
        }
        return null
      }

      function die() {
        lives--
        livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
        if (lives <= 0) return end()
        // 回到关卡起点
        player.x = 40; player.y = 380; player.vx = 0; player.vy = 0
        inv = 90
      }

      function hurt() {
        if (inv > 0) return
        lives--
        livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
        if (lives <= 0) return end()
        inv = 90
      }

      function boom(x, y) {
        for (let i = 0; i < 8; i++)
          parts.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 4 - 1, t: 20 })
      }

      function step() {
        frame++
        if (inv > 0) inv--
        const spd = 3.2
        let vx = 0
        if (keys.left) { vx -= spd; player.dir = -1 }
        if (keys.right) { vx += spd; player.dir = 1 }
        player.vx = vx
        // 跳跃
        if (keys.jump && player.onGround) { player.vy = -JUMP; player.onGround = false }
        player.vy += G
        if (player.vy > 13) player.vy = 13
        // 水平
        player.x += player.vx
        player.x = Math.max(10, Math.min(player.x, LEVELS[level].width - 10))
        // 垂直 + 落台
        const prevY = player.y
        player.y += player.vy
        player.onGround = false
        if (player.vy >= 0) {
          const p = solidAt(player.x, player.y + player.h, player.vy + (player.y - prevY))
          if (p && prevY + player.h <= p.y + 12) {
            player.y = p.y - player.h
            player.vy = 0
            player.onGround = true
          }
        }
        if (player.y > H + 30) {
          boom(player.x, H - 20)
          return die()
        }
        // 射击
        if (player.fireCd > 0) player.fireCd--
        if (keys.fire && player.fireCd <= 0) {
          player.fireCd = 11
          bullets.push({ x: player.x + player.dir * 16, y: player.y + 10, vx: player.dir * 10 })
        }
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i]
          b.x += b.vx
          if (b.x < cam - 20 || b.x > cam + W + 20) { bullets.splice(i, 1); continue }
          for (const e of enemies) {
            if (e.dead) continue
            if (Math.abs(b.x - e.x) < 16 && Math.abs(b.y - (e.y - 16)) < 20) {
              bullets.splice(i, 1)
              e.hp--
              boom(e.x, e.y - 16)
              if (e.hp <= 0) {
                e.dead = true
                kills++
                score += 100
                killsEl.textContent = kills
                scoreEl.textContent = score
                boom(e.x, e.y - 16)
              }
              break
            }
          }
        }
        // 敌人
        for (const e of enemies) {
          if (e.dead) continue
          const dist = player.x - e.x
          // 同屏激活
          if (Math.abs(dist) > W * 0.7) continue
          if (e.type === 'walk') {
            e.x += e.dir * 1.1
            if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1 }
            if (e.x < e.minX) { e.x = e.minX; e.dir = 1 }
          }
          // 开火（朝玩家）
          e.cd--
          if (e.cd <= 0 && Math.abs(dist) < 380 && Math.abs(player.y - e.y) < 120) {
            e.cd = e.type === 'shoot' ? 70 : 110
            const dir = dist > 0 ? 1 : -1
            ebullets.push({ x: e.x + dir * 12, y: e.y - 18, vx: dir * 4.2 })
          }
          // 碰撞玩家
          if (inv <= 0 && Math.abs(dist) < 20 && player.y+player.h>e.y-30 && player.y<e.y) hurt();if(over)return
        }
        for (let i = ebullets.length - 1; i >= 0; i--) {
          const b = ebullets[i]
          b.x += b.vx
          if (b.x < cam - 20 || b.x > cam + W + 20) { ebullets.splice(i, 1); continue }
          if (inv <= 0 && Math.abs(b.x - player.x) < 14 && Math.abs(b.y - (player.y + 14)) < 14) {
            ebullets.splice(i, 1)
            hurt()
          }
        }
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i]
          p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.t--
          if (p.t <= 0) parts.splice(i, 1)
        }
        // 摄像机
        cam = Math.max(0, Math.min(player.x - W / 2, LEVELS[level].width - W))
        // 旗帜
        if (player.x > flagX) {
          if (level === LEVELS.length - 1) return clearLevel()
          const s = score, l = lives, k = kills
          score = s; lives = l; kills = k
          level++
          load(level)
          livesEl.textContent = '♥'.repeat(lives)
          scoreEl.textContent = score
          killsEl.textContent = kills
        }
      }

      function draw(){box(0,0,W,H,'#b7ded6');disc(W-110,65,30,'#fff0b1');for(let i=0;i<8;i++){let x=i*145-(cam*.15%145);box(x,120+(i%3)*20,75,230,'#8fc0ad');box(x+14,100+(i%3)*20,43,30,'#8fc0ad');box(x+30,205,13,220,'#78a79b')}for(let i=0;i<8;i++){let x=i*135-(cam*.35%135);pxPaint('tree',x-15,220+(i%2)*25,160)}box(0,455,W,25,'#6caaa3');for(let i=0;i<25;i++)box((i*43-cam*.6%43),462+(i%3)*6,20,2,'#b1ddd0');for(const p of plats){let x=Math.round(p.x-cam);if(x+p.w<0||x>W)continue;box(x,p.y,p.w,p.y===430?H-p.y:p.h,'#a17c57');box(x+3,p.y+10,p.w-6,8,'#c7a16c');box(x,p.y,p.w,7,'#78a455');box(x+2,p.y,p.w-4,3,'#c4d884');for(let k=8;k<p.w;k+=28){box(x+k,p.y+17,11,3,'#d7b880');if(k%56===8){box(x+k,p.y-4,2,5,'#85ac61');box(x+k+4,p.y-6,2,7,'#85ac61')}}if(p.y<430){box(x+10,p.y+26,3,13,'#77a36d');box(x+14,p.y+30,6,3,'#97bd7e')}else{for(let k=70;k<p.w;k+=190)pxPaint('flower',x+k,p.y-18,20)}}let fx=flagX-cam;wood(fx,340,5,90);box(fx+5,343,47,26,'#efb66e');box(fx+10,348,33,15,'#fff1c8');pxPaint('acorn',fx+19,347,15);for(const e of enemies)if(!e.dead){pxPaint('robot',e.x-cam-17,e.y-33,34);if(e.type==='shoot'){box(e.x-cam+(player.x<e.x?-22:10),e.y-17,12,5,'#8b6e7c')}if(e.hp===1)box(e.x-cam-9,e.y-39,18,3,'#edb06f')}for(const b of bullets){box(b.x-cam-5,b.y-2,10,4,'#936f46');box(b.x-cam-3,b.y-1,7,2,'#ffe3a0')}for(const b of ebullets){disc(b.x-cam,b.y,5,'#ad7180');disc(b.x-cam-1,b.y-1,2,'#ffd1b8')}if(inv<=0||frame%10<7){ctx.save();ctx.translate(player.x-cam,player.y);ctx.scale(player.dir,1);pxPaint('fox',-16,-2,32);box(8,11,14,5,'#826a50');box(10,10,7,2,'#dac08a');if(player.onGround&&player.vx){box(-7,29,6,3,'#77554d');box(4,29+Math.floor(frame/5)%2*2,6,3,'#77554d')}ctx.restore()}for(const p of parts){box(p.x-cam,p.y,4,4,p.t%2?'#f8d986':'#eaa176')}panel(14,14,128,26,'#f9edc8');label('巡游 '+(level+1)+' / 2',24,32,12);box(157,24,110,5,'#90b6a0');box(157,24,110*Math.min(1,player.x/flagX),5,'#fff0ae')}

      function loop(t){requestAnimationFrame(loop);const now=Number.isFinite(t)?t:performance.now();if(!pxLast)pxLast=now;pxAcc+=Math.min(80,Math.max(0,now-pxLast));pxLast=now;while(pxAcc>=1000/60){pxAcc-=1000/60;if(running&&!over){step()}}draw()}

      // ---------- 输入 ----------
      keys = { left: false, right: false, jump: false, fire: false }
      const keyMap = {
        ArrowLeft: 'left', KeyA: 'left',
        ArrowRight: 'right', KeyD: 'right',
        ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
        KeyJ: 'fire',
      }
      window.addEventListener('keydown', (e) => {
        if (keyMap[e.code]) { e.preventDefault(); keys[keyMap[e.code]] = true }
      })
      window.addEventListener('keyup', (e) => { if (keyMap[e.code]) keys[keyMap[e.code]] = false })
      document.querySelectorAll('#pads button').forEach((b) => {
        const k = b.dataset.k
        const set = (v) => (e) => { e.preventDefault(); keys[k] = v }
        b.addEventListener('pointerdown', set(true))
        b.addEventListener('pointerup', set(false))
        b.addEventListener('pointerleave', set(false))
      })
      ovBtn.addEventListener('click', start)

      // 状态初始化（必须先于绘制循环启动）
      player = { x: 40, y: 380, vx: 0, vy: 0, w: 18, h: 30, dir: 1, onGround: false, fireCd: 0 }
      enemies = []; bullets = []; ebullets = []; parts = []
      plats = []; flagX = 2300
      score = 0; lives = 3; kills = 0; level = 0; cam = 0
      inv = 0; frame = 0; keys = { left: false, right: false, jump: false, fire: false }
      running = false; over = false; clearT = 0
      load(0)
      loop()

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }
    document.querySelectorAll('#pads button').forEach(b=>{b.addEventListener('pointerdown',e=>b.setPointerCapture?.(e.pointerId));for(const ev of ['pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[b.dataset.k]=false)});window.addEventListener('blur',()=>keys={});
})()
  </script>
