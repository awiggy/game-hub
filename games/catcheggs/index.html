    (() => {

        px = W / 2; eggs = []; score = 0; lives = 3; frame = 0
        hens = [0, 1, 2].map((i) => ({ x: 60 + i * 140, dir: Math.random() < .5 ? 1 : -1 }))
        running = true; over = false
        scoreEl.textContent = 0; livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; (()=>{try{localStorage.setItem('catcheggs-best',best)}catch{}})() }
        overlay.querySelector('h1').textContent = '🐣 游戏结束'
        overlay.querySelector('p').innerHTML = '接到 <b >' + score + '</b> 个蛋 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        frame++
        const rate = Math.max(22, 60 - frame / 60 | 0)
        if (frame % rate === 0) {
          const hen = hens[(Math.random() * 3) | 0]
          eggs.push({ x: hen.x, y: 60, v: 2.4 + frame / 900, bomb: Math.random() < 0.1 })
        }
        for (const h of hens) {
          h.x += h.dir * 1.1
          if (h.x < 40 || h.x > W - 40) h.dir *= -1
        }
        for (let i = eggs.length - 1; i >= 0; i--) {
          const e = eggs[i]

      function cloud(x,y,s=1){box(x+8*s,y,32*s,8*s,'#fffbed');box(x,y+8*s,56*s,12*s,'#fffbed')}
      function sky(){box(0,0,W,H,'#b0dce4');cloud(28,70,1.1);cloud(W-125,120,.8);cloud(W*.43,28,.6);for(let i=0;i<7;i++){box(i*96-20,H-130,65,130,'#bad5ac');box(i*96,H-150,28,30,'#bad5ac')}box(0,H-40,W,40,'#86b480');box(0,H-40,W,6,'#c4df99')}
      function flower(x,y){box(x+4,y,4,12,'#fffbed');box(x,y+4,12,4,'#fffbed');box(x+4,y+4,4,4,'#e8b951')}
      function kid(x,y,s=2){box(x+3*s,y,10*s,3*s,'#6b9162');box(x+2*s,y+3*s,12*s,9*s,'#ffdfaa');box(x+5*s,y+6*s,2*s,2*s,'#3d5647');box(x+10*s,y+6*s,2*s,2*s,'#3d5647');box(x+2*s,y+12*s,12*s,10*s,'#e88c5f');box(x+2*s,y+22*s,4*s,4*s,'#526f59');box(x+10*s,y+22*s,4*s,4*s,'#526f59')}

      function draw() {
sky();box(0,38,W,9,'#b48557');box(0,40,W,3,'#f3d09b');for(const h of hens)sprite('chicken',h.x-24,3,3);for(const e of eggs)sprite(e.bomb?'bomb':'egg',e.x-16,e.y-16,2);box(px-42,H-62,84,8,'#8c623e');box(px-36,H-54,72,29,'#c99256');for(let i=0;i<6;i++)box(px-32+i*12,H-51,4,23,'#e9be7c');box(px-36,H-39,72,4,'#a97546');flower(14,H-22);flower(W-30,H-23);
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      function toX(clientX) {
        const r = cv.getBoundingClientRect()
        return (clientX - r.left) * (W / r.width)
      }
      cv.addEventListener('pointermove', (e) => { px = Math.max(30, Math.min(W - 30, toX(e.clientX))) })
      window.addEventListener('keydown', (e) => {
        if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()
        if (!running || over) {
          if (e.code === 'Space' && !overlay.classList.contains('hidden')) start()
          return
        }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') px = Math.max(30, px - 34)
        if (e.code === 'ArrowRight' || e.code === 'KeyD') px = Math.min(W - 30, px + 34)
      })
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running || over },
      }

      px = W / 2; eggs = []; score = 0; lives = 3; frame = 0; running = false; over = false
      hens = [0, 1, 2].map((i) => ({ x: 60 + i * 140, dir: 1 }))
      requestAnimationFrame(loop)
    })()
  </script></body></html>
