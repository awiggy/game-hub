<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>雷霆打飞机</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; overflow: hidden;
    }
    #wrap { position: relative; }
    #hud {
      position: absolute; top: -34px; left: 4px; right: 4px;
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: #8b93a7; letter-spacing: 1px;
    }
    #hud b { color: var(--yellow); font-size: 16px; margin-left: 4px; }
    canvas {
      display: block; border: 3px solid #2a2e3d; border-radius: 10px;
      background: #14161f; max-width: 92vw; max-height: 74vh;
    }
    #overlay {
      position: absolute; inset: 0; border-radius: 10px;
      background: rgba(15, 17, 24, 0.88);
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; line-height: 1.9; }
    #overlay button {
      background: var(--blue); color: #fff; font-family: inherit;
      border: 2px solid #fff; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      font-size: 16px; font-weight: 700; padding: 10px 32px; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>SCORE<b id="score">0</b></span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="360" height="600"></canvas>
    <div id="overlay">
      <h1>雷霆打飞机</h1>
      <p>鼠标 / 拖动 / ← → 控制战机<br />火力全自动，小心别被撞上</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>

  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let ship, bullets, enemies, stars, score, lives, inv, running, over
      let frame = 0, targetX = W / 2
      let best = Number(localStorage.getItem('planewar-best') || 0)
      bestEl.textContent = best

      function makeStars() {
        stars = Array.from({ length: 40 }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          s: 0.6 + Math.random() * 1.8,
        }))
      }

      function startGame() {
        ship = { x: W / 2, y: H - 80 }
        bullets = []; enemies = []
        score = 0; lives = 3; inv = 0; running = true; over = false; frame = 0
        scoreEl.textContent = 0; livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
      }

      function gameOver() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('planewar-best', best) }
        overlay.querySelector('h1').textContent = '游戏结束'
        overlay.querySelector('p').innerHTML =
          '击落 <b style="color:#ffd23f">' + (score / 10 | 0) + '</b> 架 · 得分 ' + score + ' · 最高分 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step() {
        frame++
        // 星空滚动
        for (const s of stars) {
          s.y += s.s + 1
          if (s.y > H) { s.y = -2; s.x = Math.random() * W }
        }
        // 战机跟随
        ship.x += (targetX - ship.x) * 0.22
        ship.x = Math.max(24, Math.min(W - 24, ship.x))
        if (inv > 0) inv--

        // 自动开火
        if (frame % 10 === 0) bullets.push({ x: ship.x, y: ship.y - 24 })

        // 敌机生成：越来越密
        const interval = Math.max(28, 64 - ((score / 150) | 0))
        if (frame % interval === 0) {
          enemies.push({
            x: 24 + Math.random() * (W - 48), y: -24,
            v: 2.1 + Math.random() * 1.1 + Math.min(2, score / 2000),
            r: 15 + Math.random() * 4,
          })
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].y -= 9
          if (bullets[i].y < -10) bullets.splice(i, 1)
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i]
          e.y += e.v
          if (e.y > H + 30) { enemies.splice(i, 1); continue }
          // 子弹命中
          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j]
            if (Math.abs(b.x - e.x) < e.r && Math.abs(b.y - e.y) < e.r + 4) {
              bullets.splice(j, 1)
              enemies.splice(i, 1)
              score += 10
              scoreEl.textContent = score
              break
            }
          }
          if (!enemies.includes(e)) continue
          // 撞机
          if (inv <= 0 && Math.abs(e.x - ship.x) < e.r + 12 && Math.abs(e.y - ship.y) < e.r + 14) {
            enemies.splice(i, 1)
            lives--
            inv = 100
            livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
            if (lives <= 0) return gameOver()
          }
        }
      }

      function drawShip() {
        ctx.save()
        ctx.translate(ship.x, ship.y)
        ctx.fillStyle = '#5d84ff'
        ctx.beginPath()
        ctx.moveTo(0, -20)
        ctx.lineTo(15, 14)
        ctx.lineTo(0, 8)
        ctx.lineTo(-15, 14)
        ctx.closePath()
        ctx.fill()
        ctx.fillStyle = '#ffd23f'
        ctx.beginPath()
        ctx.arc(0, -2, 4, 0, Math.PI * 2)
        ctx.fill()
        ctx.restore()
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = 'rgba(255,255,255,0.5)'
        for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s + 2)
        if (running && !over && (inv <= 0 || (frame >> 2) % 2 === 0)) drawShip()
        ctx.fillStyle = '#ffd23f'
        for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 10, 4, 12)
        for (const e of enemies) {
          ctx.fillStyle = '#ff4d5e'
          ctx.beginPath()
          ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2)
          ctx.fill()
          ctx.fillStyle = '#c22739'
          ctx.beginPath()
          ctx.arc(e.x, e.y + 3, e.r * 0.55, 0, Math.PI * 2)
          ctx.fill()
        }
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      function toGameX(clientX) {
        const r = cv.getBoundingClientRect()
        return (clientX - r.left) * (W / r.width)
      }
      cv.addEventListener('pointermove', (e) => { targetX = toGameX(e.clientX) })
      cv.addEventListener('touchmove', (e) => {
        e.preventDefault()
        targetX = toGameX(e.touches[0].clientX)
      }, { passive: false })

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') targetX = Math.max(24, targetX - 44)
        if (e.code === 'ArrowRight' || e.code === 'KeyD') targetX = Math.min(W - 24, targetX + 44)
      })
      ovBtn.addEventListener('click', startGame)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      ship = { x: W / 2, y: H - 80 }
      bullets = []; enemies = []
      score = 0; lives = 3; inv = 0; running = false; over = false
      makeStars()
      loop()
    })()
  </script>
</body>
</html>
