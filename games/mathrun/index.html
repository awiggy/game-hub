<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>算术冲刺</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,420px); position:relative; display:flex; flex-direction:column; gap:14px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #q {
      width:100%; text-align:center; font-size:44px; font-weight:900; letter-spacing:2px;
      background:#1a1d29; border:3px solid #2a2e3d; border-radius:14px; padding:28px 0; font-variant-numeric:tabular-nums;
    }
    #track { width:100%; height:14px; background:#14161f; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; }
    #tfill { height:100%; width:100%; background:var(--yellow); transition:width .1s linear; }
    #opts { width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    #opts button {
      font-family:inherit; font-size:24px; font-weight:900; padding:20px 0;
      color:#eef1f6; background:#1a1d29; border:2px solid #2a3350; border-radius:12px; cursor:pointer;
    }
    #opts button.ok { background:#22b573; border-color:#fff; }
    #opts button.bad { background:#ff4d5e; border-color:#fff; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>连对<b id="score">0</b></span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="q">7 + 5 = ?</div>
    <div id="track"><div id="tfill"></div></div>
    <div id="opts">
      <button data-i="0"></button>
      <button data-i="1"></button>
      <button data-i="2"></button>
    </div>
  </div>
  <div id="overlay">
    <h1>➗ 算术冲刺</h1>
    <p>5 秒内选出正确答案<br/>连对越多难度越高<br/>答错或超时 -1 命，共 3 命</p>
    <button id="ov-btn">开始冲刺</button>
  </div>
  <script>
    (() => {
      const qEl = document.getElementById('q')
      const tfill = document.getElementById('tfill')
      const optBtns = [...document.querySelectorAll('#opts button')]
      const scoreEl = document.getElementById('score')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let answer, opts, score, lives, timeLeft, limit, running, over, lock
      let best = Number(localStorage.getItem('mathrun-best') || 0)
      bestEl.textContent = best

      const rnd = (a, b) => a + ((Math.random() * (b - a + 1)) | 0)

      function makeQuestion(diff) {
        const kind = rnd(0, 2)
        let a, b, op, res
        if (kind === 0) { a = rnd(5, 20 + diff * 4); b = rnd(3, 15 + diff * 3); op = '+'; res = a + b }
        else if (kind === 1) { a = rnd(10, 30 + diff * 5); b = rnd(3, 12 + diff * 3); op = '−'; res = a - b }
        else { a = rnd(2, 6 + diff); b = rnd(2, 6 + diff); op = '×'; res = a * b }
        return { a, b, op, res }
      }

      function newQ() {
        const diff = Math.min(10, score / 4 | 0)
        const q = makeQuestion(diff)
        answer = q.res
        qEl.textContent = q.a + ' ' + q.op + ' ' + q.b + ' = ?'
        opts = [answer]
        while (opts.length < 3) {
          const delta = rnd(1, 6) * (Math.random() < 0.5 ? 1 : -1)
          const v = answer + delta
          if (v !== answer && v >= 0 && !opts.includes(v)) opts.push(v)
        }
        opts.sort(() => Math.random() - 0.5)
        optBtns.forEach((b, i) => { b.textContent = opts[i]; b.className = '' })
        limit = Math.max(2800, 5000 - score * 60)
        timeLeft = limit
        lock = false
      }

      function start() {
        score = 0; lives = 3
        running = true; over = false
        scoreEl.textContent = 0; livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
        newQ()
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('mathrun-best', best) }
        overlay.querySelector('h1').textContent = '🏁 冲刺结束'
        overlay.querySelector('p').innerHTML = '连对 <b style="color:#ffd23f">' + score + '</b> 题 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function wrong() {
        lives--
        livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
        if (lives <= 0) return end()
        newQ()
      }

      optBtns.forEach((b, i) => {
        b.addEventListener('click', () => {
          if (!running || over || lock) return
          lock = true
          if (opts[i] === answer) {
            b.classList.add('ok')
            score++
            scoreEl.textContent = score
            setTimeout(newQ, 350)
          } else {
            b.classList.add('bad')
            optBtns.forEach((x, j) => { if (opts[j] === answer) x.classList.add('ok') })
            setTimeout(wrong, 600)
          }
        })
      })
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !running && !overlay.classList.contains('hidden')) { e.preventDefault(); start() }
        const k = ['Digit1', 'Digit2', 'Digit3'].indexOf(e.code)
        if (k >= 0 && running && !over) optBtns[k].click()
      })

      let lastT = 0
      function loop(t) {
        requestAnimationFrame(loop)
        if (!lastT) lastT = t
        const dt = Math.min(60, t - lastT)
        lastT = t
        if (running && !over && !lock) {
          timeLeft -= dt
          tfill.style.width = Math.max(0, timeLeft / limit * 100) + '%'
          if (timeLeft <= 0) { lock = true; setTimeout(wrong, 200) }
        }
      }

      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      answer = 12; opts = [12, 13, 14]; score = 0; lives = 3
      timeLeft = 5000; limit = 5000; running = false; over = false; lock = false
    })()
  </script>
</body>
</html>
