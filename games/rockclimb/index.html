<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>岩壁攀岩</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>高度<b id="score">0m</b></span>
      <span>BEST<b id="best">0m</b></span>
    </div>
    <canvas id="cv" width="400" height="600"></canvas>
    <div id="overlay">
      <h1>🧗 岩壁攀岩</h1>
      <p>交替按 ← → / 左右半屏向上爬<br/>出现「打滑!」警报 1 秒内快速连按<br/>失败会下滑，高度就是成绩</p>
      <button id="ov-btn">开始攀爬</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let height, lastSide, climb, slip, slipT, running, over, frame, holds
      let best = Number(localStorage.getItem('rockclimb-best') || 0)
      bestEl.textContent = best + 'm'

      function start() {
        height = 0; lastSide = -1; climb = 0; slip = 0; slipT = 0
        frame = 0; holds = []
        running = true; over = false
        scoreEl.textContent = '0m'
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        const m = height | 0
        if (m > best) { best = m; bestEl.textContent = best + 'm'; localStorage.setItem('rockclimb-best', best) }
        overlay.querySelector('h1').textContent = '💪 力竭了'
        overlay.querySelector('p').innerHTML = '攀爬高度 <b style="color:#ffd23f">' + m + 'm</b> · 最佳 ' + best + 'm'
        ovBtn.textContent = '再爬一次'
        overlay.classList.remove('hidden')
      }

      function climbSide(side) {
        if (!running || over) return
        // 必须交替：同侧连按无效（打滑状态时任意按都算稳住）
        if (slip > 0) {
          slip -= 0.34
          if (slip <= 0) slip = 0
          return
        }
        if (side === lastSide) return
        lastSide = side
        climb += 1
        height += 0.35
        scoreEl.textContent = height.toFixed(1) + 'm'
        holds.push({ x: 200 + (side === 0 ? -46 : 46), y: (climb % 30) * 20, life: 999 })
      }

      function step() {
        frame++
        // 自然疲劳下滑
        climb -= 0.06
        // 随机打滑
        if (slip === 0 && frame % 220 === 100 && height > 3) {
          slip = 1
          slipT = 0
        }
        if (slip > 0) {
          slipT += 1 / 60
          climb -= 0.5
          if (slipT > 1) {
            // 没稳住：大滑落
            climb -= 3.5
            slip = 0
          }
        }
        if (climb < 0) climb = 0
        height = Math.max(0, height - 0.03)
        if (climb <= 0 && frame > 60) end()
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        // 岩壁
        ctx.fillStyle = '#1a1d29'
        ctx.fillRect(60, 0, W - 120, H)
        // 支点（相对滚动）
        ctx.fillStyle = '#3a4152'
        for (let i = 0; i < 30; i++) {
          const yy = ((i * 47) - (climb * 20)) % (H + 40) - 20
          const xx = 100 + ((i * 89) % (W - 200))
          ctx.beginPath(); ctx.arc(xx, yy, 5, 0, Math.PI * 2); ctx.fill()
        }
        // 攀岩者
        const py = H - 100 - ((climb * 20) % (H - 160))
        ctx.font = '34px sans-serif'
        ctx.fillText('🧗', W / 2 - 17, py)
        // 打滑警报
        if (slip > 0) {
          ctx.fillStyle = '#ff4d5e'
          ctx.font = '900 30px sans-serif'
          const blink = Math.sin(slipT * 20) > 0
          if (blink) ctx.fillText('⚠ 打滑！快按！', W / 2 - 92, 80)
          ctx.fillStyle = '#2a2e3d'
          ctx.fillRect(W / 2 - 80, 96, 160, 10)
          ctx.fillStyle = '#ffd23f'
          ctx.fillRect(W / 2 - 80, 96, 160 * Math.max(0, 1 - slipT), 10)
        }
        // 高度线
        ctx.fillStyle = '#8b93a7'
        ctx.font = '700 11px sans-serif'
        for (let m = 5; m <= Math.max(20, height + 10); m += 5) {
          const yy = H - 100 - ((m * 57) % (H - 120)) - (climb * 20 % 20)
          ctx.fillText(m + 'm —', 12, yy)
        }
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); climbSide(0) }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); climbSide(1) }
      })
      cv.addEventListener('pointerdown', (e) => {
        const r = cv.getBoundingClientRect()
        climbSide((e.clientX - r.left) < r.width / 2 ? 0 : 1)
      })
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return Math.floor(height) },
        get over() { return over },
        get started() { return running },
      }

      height = 0; lastSide = -1; climb = 0; slip = 0; slipT = 0
      frame = 0; holds = []; running = false; over = false
    })()
  </script>
</body>
</html>
