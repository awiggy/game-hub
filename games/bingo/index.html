    <h1>宾果连</h1>
    <p>系统报号，卡片上相同数字自动划掉<br/>横竖斜先连成五线的获胜<br/>与 AI 同步标记，60 次后按连线数结算</p>
    <button id="ov-btn">开始游戏</button>
  </section></div><script>
    (() => {
      const callEl = document.getElementById('call')
      const cardEl = document.getElementById('card')
      const pEl = document.getElementById('p')
      const aEl = document.getElementById('a')
      const bestEl = document.getElementById('best')
      const rollBtn = document.getElementById('roll')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let card, marks, aiLines, called, calledSet, wins, running, over
      let best=0;try{best=Number(localStorage.getItem('bingo-best'))||0}catch{}
      bestEl.textContent = best

      // 5 列范围：B1-15 I16-30 N31-45 G46-60 O61-75
      function makeCard() {
        const card = []
        for (let c = 0; c < 5; c++) {
          const pool = []
          for (let n = c * 15 + 1; n <= c * 15 + 15; n++) pool.push(n)
          pool.sort(() => Math.random() - 0.5)
          for (let r = 0; r < 5; r++) card.push({ n: pool[r], mark: false, r, c })
        }
        return card
      }

      function lineCount(markSet) {
        let lines = 0
        for (let r = 0; r < 5; r++) if ([0,1,2,3,4].every((c) => markSet.has(r + ',' + c))) lines++
        for (let c = 0; c < 5; c++) if ([0,1,2,3,4].every((r) => markSet.has(r + ',' + c))) lines++
        if ([0,1,2,3,4].every((i) => markSet.has(i + ',' + i))) lines++
        if ([0,1,2,3,4].every((i) => markSet.has(i + ',' + (4 - i)))) lines++
        return lines
      }

      const cellEls = []
      function render() {
        cardEl.innerHTML = ''
        card.forEach((it, i) => {
          const el = document.createElement('div')
          el.className = 'cell' + (it.mark ? ' mark' : '')
          el.dataset.n = it.n;el.style.gridRow=it.r+1;el.style.gridColumn=it.c+1
          el.textContent = it.n
          cardEl.appendChild(el)
          cellEls[i] = el
        })
      }

      function start() {
        card = makeCard()
        marks = new Set()
        aiMarks = new Set()
        aiCard = makeCard()
        called = new Set()
        wins = wins || 0
        running = true; over = false
        pEl.textContent = 0; aEl.textContent = 0
        callEl.textContent = '点「报号」开始'
        rollBtn.disabled = false
        overlay.classList.add('hidden')
        render()
      }

      let aiCard, aiMarks

      function end(playerWin) {
        running = false; over = true
        if (playerWin) {
          wins++
          if (wins > best) { best = wins; bestEl.textContent = best; (()=>{try{localStorage.setItem('bingo-best',best)}catch{}})() }
        }
        overlay.querySelector('h1').textContent = playerWin ? '🏆 BINGO！你赢了' : '🎲 AI 先连成了'
        overlay.querySelector('p').innerHTML = '胜场 <b >' + wins + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function roll() {
        if (!running || over) return
        const remaining=Array.from({length:75},(_,i)=>i+1).filter(n=>!called.has(n))
        if(!remaining.length)return
        const n=remaining[Math.floor(Math.random()*remaining.length)]
        called.add(n)
        callEl.textContent = '本次号码 · ' + n
        // 我的卡片
        const mine = card.find((it) => it.n === n)
        if (mine) {
          mine.mark = true
          marks.add(mine.r + ',' + mine.c)
        }
        // AI 卡片
        const aiHit = aiCard.find((it) => it.n === n)
        if (aiHit) aiMarks.add(aiHit.r + ',' + aiHit.c)
        const myLines = lineCount(marks)
        const aiLines = lineCount(aiMarks)
        pEl.textContent = myLines
        aEl.textContent = aiLines
        render()
        if (myLines >= 5) return end(true)
        if (aiLines >= 5) return end(false)
        if (called.size >= 60) {
          return end(myLines >= aiLines)
        }
      }

      rollBtn.addEventListener('click', roll)
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return wins },
        get over() { return over },
        get started() { return running || over },
      }

      card = makeCard(); marks = new Set(); aiCard = makeCard(); aiMarks = new Set()
      called = new Set(); wins = 0; running = false; over = false
      render()
    })()
  </script></body></html>
