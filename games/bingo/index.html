<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>宾果连</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,420px); position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #call { font-size:26px; font-weight:900; color:var(--yellow); min-height:36px; }
    #card { width:100%; display:grid; grid-template-columns:repeat(5,1fr); gap:4px;
      background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:8px; }
    .cell { aspect-ratio:1; display:grid; place-items:center; font-size:min(5vw,20px); font-weight:900;
      background:#14161f; border-radius:6px; color:#c9d4f5; }
    .cell.mark { background:#22b573; color:#fff; }
    .cell.mark::after { content:'✓'; position:absolute; }
    .cell.mark { position:relative; color:transparent; }
    .cell.mark::before { content:attr(data-n); position:absolute; color:rgba(255,255,255,.4); }
    #airow { font-size:12px; font-weight:700; color:#8b93a7; }
    #roll { font-family:inherit; font-weight:900; font-size:15px; color:#eef1f6; background:var(--blue);
      border:2px solid #fff; border-radius:10px; padding:12px 44px; cursor:pointer; }
    #roll:disabled { opacity:.4; cursor:not-allowed; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>我的连线<b id="p">0</b>/5</span>
      <span>AI 连线<b id="a">0</b>/5</span>
      <span>BEST<b id="best">0</b>胜</span>
    </div>
    <div id="call">点「报号」开始</div>
    <div id="card"></div>
    <div id="airow">AI 的连线数会随报号增长，手快有手慢无！</div>
    <button id="roll">📢 报号</button>
  </div>
  <div id="overlay">
    <h1>🎲 宾果连</h1>
    <p>系统报号，卡片上相同数字自动划掉<br/>横竖斜先连成五线的获胜<br/>与 AI 竞速，看谁先喊 BINGO</p>
    <button id="ov-btn">开始游戏</button>
  </div>
  <script>
    (() => {
      const callEl = document.getElementById('call')
      const cardEl = document.getElementById('card')
      const pEl = document.getElementById('p')
      const aEl = document.getElementById('a')
      const bestEl = document.getElementById('best')
      const rollBtn = document.getElementById('roll')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let card, marks, aiLines, called, calledSet, wins, running, over
      let best = Number(localStorage.getItem('bingo-best') || 0)
      bestEl.textContent = best

      // 5 列范围：B1-15 I16-30 N31-45 G46-60 O61-75
      function makeCard() {
        const card = []
        for (let c = 0; c < 5; c++) {
          const pool = []
          for (let n = c * 15 + 1; n <= c * 15 + 15; n++) pool.push(n)
          pool.sort(() => Math.random() - 0.5)
          for (let r = 0; r < 5; r++) card.push({ n: pool[r], mark: false, r, c })
        }
        return card
      }

      function lineCount(markSet) {
        let lines = 0
        for (let r = 0; r < 5; r++) if ([0,1,2,3,4].every((c) => markSet.has(r + ',' + c))) lines++
        for (let c = 0; c < 5; c++) if ([0,1,2,3,4].every((r) => markSet.has(r + ',' + c))) lines++
        if ([0,1,2,3,4].every((i) => markSet.has(i + ',' + i))) lines++
        if ([0,1,2,3,4].every((i) => markSet.has(i + ',' + (4 - i)))) lines++
        return lines
      }

      const cellEls = []
      function render() {
        cardEl.innerHTML = ''
        card.forEach((it, i) => {
          const el = document.createElement('div')
          el.className = 'cell' + (it.mark ? ' mark' : '')
          el.dataset.n = it.n
          el.textContent = it.n
          cardEl.appendChild(el)
          cellEls[i] = el
        })
      }

      function start() {
        card = makeCard()
        marks = new Set()
        aiMarks = new Set()
        aiCard = makeCard()
        called = new Set()
        wins = wins || 0
        running = true; over = false
        pEl.textContent = 0; aEl.textContent = 0
        callEl.textContent = '点「报号」开始'
        rollBtn.disabled = false
        overlay.classList.add('hidden')
        render()
      }

      let aiCard, aiMarks

      function end(playerWin) {
        running = false; over = true
        if (playerWin) {
          wins++
          if (wins > best) { best = wins; bestEl.textContent = best; localStorage.setItem('bingo-best', best) }
        }
        overlay.querySelector('h1').textContent = playerWin ? '🏆 BINGO！你赢了' : '🎲 AI 先连成了'
        overlay.querySelector('p').innerHTML = '胜场 <b style="color:#ffd23f">' + wins + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function roll() {
        if (!running || over) return
        let n
        do { n = 1 + ((Math.random() * 75) | 0) } while (called.has(n))
        called.add(n)
        callEl.textContent = '📣 ' + n
        // 我的卡片
        const mine = card.find((it) => it.n === n)
        if (mine) {
          mine.mark = true
          marks.add(mine.r + ',' + mine.c)
        }
        // AI 卡片
        const aiHit = aiCard.find((it) => it.n === n)
        if (aiHit) aiMarks.add(aiHit.r + ',' + aiHit.c)
        const myLines = lineCount(marks)
        const aiLines = lineCount(aiMarks)
        pEl.textContent = myLines
        aEl.textContent = aiLines
        render()
        if (myLines >= 5) return end(true)
        if (aiLines >= 5) return end(false)
        if (called.size >= 60) {
          return end(myLines >= aiLines)
        }
      }

      rollBtn.addEventListener('click', roll)
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return wins },
        get over() { return over },
        get started() { return running },
      }

      card = makeCard(); marks = new Set(); aiCard = makeCard(); aiMarks = new Set()
      called = new Set(); wins = 0; running = false; over = false
      render()
    })()
  </script>
</body>
</html>
