<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>摸鱼农场</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body {
      background:#0f1118; color:#eef1f6;
      font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center;
      touch-action:manipulation; overflow:hidden;
    }
    #wrap { width:min(92vw,420px); position:relative; display:flex; flex-direction:column; gap:12px; }
    #hud { display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #farm {
      display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
      background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:10px;
    }
    .plot {
      aspect-ratio:1; border-radius:10px; border:2px solid #2a3350; background:#14161f;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-size:32px; cursor:pointer; user-select:none; gap:2px;
    }
    .plot.empty { color:#5c6474; }
    .plot.ripe { border-color:var(--yellow); background:#241f10; }
    .plot .t { font-size:10px; color:#8b93a7; font-weight:700; }
    #ups { display:flex; gap:8px; }
    .up {
      flex:1; font-family:inherit; font-weight:700; font-size:13px; color:#eef1f6;
      background:#1a1d29; border:2px solid #2a2e3d; border-radius:10px;
      padding:10px 6px; cursor:pointer; line-height:1.5;
    }
    .up:disabled { opacity:.4; cursor:not-allowed; }
    .up:not(:disabled):active { background:var(--blue); }
    #bar-out { height:10px; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; background:#14161f; }
    #bar-in { height:100%; width:0%; background:var(--yellow); transition:width .2s; }
    #bar-txt { text-align:center; font-size:11px; color:#8b93a7; font-weight:700; }
    #overlay {
      position:fixed; inset:0; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px;
    }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button {
      background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700;
      padding:10px 32px; border-radius:8px; cursor:pointer;
    }

    /* Crafted pixel edition: the playable pieces, not just the surrounding UI. */
    :root{--ink:#48533d;--accent:#4e854d;--paper:#fff9e7;--edge:#6f9250;--page:#edf2d9}
    body{background:var(--page);color:var(--ink);background-image:radial-gradient(#ffffff70 1px,transparent 1px);background-size:12px 12px;overflow:auto;min-height:100%;height:auto;padding:24px 12px;gap:10px}
    body::before{content:'';position:fixed;inset:0;box-shadow:inset 0 0 100px #ffffff70;pointer-events:none;z-index:-1}
    button{font-family:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #d26c48;outline-offset:3px}
    #wrap{flex-shrink:0;max-width:100%}
    #hud,#bar{position:static;color:var(--ink);letter-spacing:0;font-size:11px;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 4px}
    #hud b,#bar b{color:var(--accent);font-size:17px}canvas{image-rendering:pixelated;border:4px solid var(--edge);border-radius:8px;box-shadow:0 5px 0 color-mix(in srgb,var(--edge),transparent 55%);background:var(--paper);max-width:100%;object-fit:contain}
    #overlay{z-index:20;background:color-mix(in srgb,var(--paper) 96%,transparent);color:var(--ink);border-radius:12px;gap:12px;padding:22px}
    #overlay::before{content:'';width:90px;height:90px;background:var(--mascot) center/contain no-repeat;image-rendering:pixelated}
    #overlay h1,#overlay h2{font-size:25px;letter-spacing:1px;text-shadow:none;color:var(--ink)}
    #overlay p{color:var(--ink);font-size:13px;line-height:1.9;max-width:340px}#overlay p b{color:var(--accent)!important}
    #overlay button,#new-game,#bar button,#pads button,.up,.garden-controls button{background:var(--accent);color:#fffaf0;border:2px solid var(--ink);box-shadow:0 3px 0 #0002;border-radius:7px;font-weight:800;cursor:pointer}
    #overlay button:hover{filter:brightness(1.1)}#overlay.hidden{display:none}
    .pixel-sprite{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
    .scene-title{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:5px}
    .scene-title strong{font-size:23px;letter-spacing:1px;display:block}.scene-title small{display:block;font-size:11px;line-height:1.8;letter-spacing:1px;color:var(--accent)}
    .scene-title svg{width:54px;height:54px;flex-shrink:0}.play-note{font-size:11px;text-align:center;color:var(--ink);line-height:1.7;margin-top:9px}
    .landscape{height:92px;position:relative;overflow:hidden;border-radius:10px 10px 0 0;background:linear-gradient(#a9dfdf 0 63%,#b7d878 63% 71%,#82b65e 71%);border:3px solid var(--edge);border-bottom:0}
    .landscape::before{content:'';position:absolute;left:15%;top:18px;width:40px;height:8px;background:#fffcec;box-shadow:8px -6px #fffcec,170px 5px #fffcec,178px -1px #fffcec}
    .landscape svg{position:absolute;bottom:0;width:76px;height:76px}.landscape svg:nth-child(2){left:2%;width:52px;height:52px}.landscape svg:nth-child(3){right:4%;width:44px;height:44px}.landscape svg:nth-child(4){right:15%;width:32px;height:32px}
    @media(max-width:480px){body{padding:14px 10px}.scene-title strong{font-size:20px}#hud b,#bar b{font-size:15px}.landscape{height:74px}.scene-title svg{width:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--page:#edf1d5;--ink:#5f6541;--accent:#70914c;--edge:#829a58;--paper:#fff6df;--mascot:url("data:image/svg+xml,%3Csvg%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2032%2032%22%20class%3D%22pixel-sprite%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%2214%22%20y%3D%226%22%20width%3D%223%22%20height%3D%2211%22%20fill%3D%22%2337774b%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%225%22%20width%3D%228%22%20height%3D%224%22%20fill%3D%22%23387d43%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%223%22%20width%3D%226%22%20height%3D%224%22%20fill%3D%22%2384bd50%22%2F%3E%3Crect%20x%3D%2217%22%20y%3D%224%22%20width%3D%228%22%20height%3D%224%22%20fill%3D%22%233c8e46%22%2F%3E%3Crect%20x%3D%2218%22%20y%3D%222%22%20width%3D%226%22%20height%3D%223%22%20fill%3D%22%23b0d767%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2213%22%20width%3D%2215%22%20height%3D%225%22%20fill%3D%22%23ad552b%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2218%22%20width%3D%2212%22%20height%3D%225%22%20fill%3D%22%23ad552b%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2223%22%20width%3D%228%22%20height%3D%224%22%20fill%3D%22%23ad552b%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2227%22%20width%3D%224%22%20height%3D%223%22%20fill%3D%22%23ad552b%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2214%22%20width%3D%2212%22%20height%3D%224%22%20fill%3D%22%23ffb04b%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2218%22%20width%3D%229%22%20height%3D%225%22%20fill%3D%22%23f88132%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%2223%22%20width%3D%225%22%20height%3D%224%22%20fill%3D%22%23f88132%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2215%22%20width%3D%223%22%20height%3D%225%22%20fill%3D%22%23ffda75%22%2F%3E%3Crect%20x%3D%2218%22%20y%3D%2219%22%20width%3D%223%22%20height%3D%221%22%20fill%3D%22%23ba5c32%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%2224%22%20width%3D%223%22%20height%3D%221%22%20fill%3D%22%23ba5c32%22%2F%3E%3C%2Fsvg%3E")}
#wrap{width:min(440px,94vw)}#farm{background:#90b467;border:4px solid #71924e;padding:12px;gap:10px;box-shadow:0 5px #749551;border-radius:0 0 10px 10px;margin-top:-12px}.plot{position:relative;aspect-ratio:1.1;border:3px solid #875d3e;border-top-color:#bc8c5c;border-left-color:#bc8c5c;background:repeating-linear-gradient(0deg,#9a6c46 0 10px,#ad7c50 10px 13px);border-radius:7px;box-shadow:0 3px #638347;overflow:hidden;padding:5px}.plot svg{width:62%;height:68%}.plot .t{font-size:11px;color:#fff3c5;text-shadow:1px 1px #79573d}.plot.empty svg{opacity:.5}.plot.ripe{border-color:#f5d477;background:repeating-linear-gradient(0deg,#a7764a 0 10px,#bd8c58 10px 13px)}.plot.ripe svg{animation:harvest-bob 1.5s ease-in-out infinite}@keyframes harvest-bob{50%{transform:translateY(-3px)}}.up{background:#fff2ce;color:#6b7143;border-color:#a0b27a;padding:9px 5px}.up small{font-size:10px}.up:disabled{opacity:.65}.landscape svg:first-child{left:38%;width:100px;height:100px}.landscape{height:110px;margin-bottom:0}#bar-out{background:#dce4bd;border-color:#a1b477;height:10px}#bar-in{background:#dfac58}.farm-hint{font-size:11px;text-align:center;min-height:18px;color:#70653e}body{flex-direction:column}

/* Compact landscape retains readable boards beside their controls. */
@media(min-width:600px) and (max-height:550px){body{padding:12px;gap:8px}.play-note{margin:0}#wrap{width:min(710px,96vw);display:grid;grid-template-columns:240px 330px;gap:8px 20px;align-items:center;justify-content:center}.scene-title{grid-column:1;grid-row:1}#hud{grid-column:1;grid-row:2}#bar-out{grid-column:1;grid-row:3}#ups{grid-column:1;grid-row:4;flex-direction:column}.landscape{grid-column:2;grid-row:1/3;height:65px;align-self:end}#farm{grid-column:2;grid-row:3/5;margin-top:-8px;padding:10px;gap:8px}.plot{aspect-ratio:1.25}#garden-hint{grid-column:2;grid-row:5;margin:0}.landscape svg:first-child{height:75px;width:75px}.up{padding:6px}.scene-title strong{font-size:20px}}
@media(max-width:480px){body{padding:12px 10px}.play-note{margin-top:3px;font-size:10px}.scene-title{margin-bottom:0}.scene-title small{letter-spacing:.5px}}
@media(max-width:480px){.landscape{height:85px}#wrap{gap:10px}.landscape svg:first-child{height:85px;width:85px}#farm{margin-top:-10px}.plot{aspect-ratio:1.15}#hud{padding:5px 4px}}
  </style>

  <script>
    (() => {

      function pixels(kind) {

          else {r(5,23,22,4,'#654830');r(8,21,16,3,'#9d6c42');r(14,14,3,8,'#3c8747');}
        } else if(kind==='flower') {
          r(15,13,3,17,'#3c8b58');r(8,20,8,4,'#82be5f');r(18,23,8,4,'#58a657');
          round(10,2,12,20,'#e5bc88');round(5,7,22,10,'#e5bc88');round(11,2,10,18,'#fffbea');round(5,8,22,8,'#fffbea');r(12,8,9,8,'#e9a82d');r(13,8,6,5,'#ffd95c');r(14,9,3,2,'#fff5ac');
        } else if(kind==='mushroom') {
          r(11,16,11,13,'#af784d');r(12,16,9,11,'#ffe6b2');r(12,18,3,6,'#fff6da');r(6,8,21,11,'#9c3d43');r(10,4,13,5,'#9c3d43');r(4,13,25,7,'#9c3d43');r(7,9,19,8,'#e97564');r(10,5,13,9,'#f69b7e');r(5,14,23,3,'#e97564');r(10,8,4,4,'#fff0cf');r(20,12,5,4,'#fff0cf');face(12,22);
        } else if(kind==='mole'||kind==='goldmole'||kind==='bunny') {
          const bunny=kind==='bunny',gold=kind==='goldmole'; const dark=bunny?'#8c7974':gold?'#9c6327':'#704c46'; const base=bunny?'#f9eacb':gold?'#efb648':'#b38360';const light=bunny?'#fffbed':gold?'#ffe08a':'#dbac7a';
          if(bunny){r(8,1,6,12,dark);r(19,0,6,13,dark);r(9,2,4,11,light);r(20,1,4,12,light);r(10,4,2,7,'#e7a09b');r(21,3,2,8,'#e7a09b');}
          else{round(4,5,8,9,dark);round(21,5,8,9,dark);r(6,7,4,5,'#e7a09b');r(23,7,4,5,'#e7a09b');}
          round(4,11,25,20,dark);round(6,11,21,18,base);r(9,10,15,7,light);r(7,14,4,7,light);round(9,21,16,8,bunny?'#fffdf2':'#f8ddb0');face(11,16);r(14,24,6,2,'#8a534b');r(16,24,2,3,'#fff8e4');r(3,26,5,4,light);r(26,26,4,4,light);
        } else if(kind==='chick') {
          r(4,13,6,9,'#9a6129');r(7,8,18,18,'#9a6129');r(11,5,12,4,'#9a6129');r(8,10,17,14,'#ffca42');r(11,7,12,14,'#ffe777');r(12,8,9,6,'#fff2ac');r(6,16,10,7,'#f2a32d');r(6,16,8,3,'#ffda5b');r(19,10,6,8,'#fffbed');r(22,12,3,5,'#3f3831');r(22,12,1,1,'#fff');r(25,17,6,3,'#b9582c');r(25,17,5,1,'#ffad3b');r(19,20,4,2,'#f99059');r(11,26,3,3,'#c87c33');r(20,25,3,3,'#c87c33');r(11,3,3,4,'#c89c38');
        } else if(kind==='grape') {
          r(15,3,3,6,'#72513d');r(18,3,9,4,'#599657');
          for(const [x,y] of [[7,8],[17,8],[5,15],[14,15],[22,15],[10,22],[18,22]]){round(x,y,8,8,'#624274');round(x+1,y,6,6,'#a27bd0');r(x+2,y+1,2,2,'#e4bcf4');}
        } else if(kind==='melon') {
          r(4,9,24,13,'#326d52');r(7,22,18,4,'#326d52');r(11,26,10,3,'#326d52');r(5,9,22,12,'#a6d46c');r(8,21,16,3,'#a6d46c');r(6,9,20,9,'#f9807c');r(9,18,14,3,'#f9807c');r(12,21,8,2,'#f9807c');r(7,10,18,2,'#ffb0a0');for(const [x,y] of [[10,14],[16,12],[21,15],[15,18]])r(x,y,1,2,'#673f48');
        } else if(kind==='flag') {
          r(10,3,3,25,'#695447');r(13,4,14,10,'#9e4b4c');r(13,4,11,7,'#f47768');r(14,5,7,2,'#ffbea2');r(7,27,13,2,'#486a4a');
        } else if(kind==='mine') {
          r(14,2,4,28,'#47606b');r(2,14,28,4,'#47606b');r(6,6,20,20,'#47606b');round(7,7,18,18,'#6e8e97');r(10,9,6,4,'#c1d9cf');face(11,16);
        } else if(kind==='crate') {
          r(2,4,28,26,'#865637');r(4,5,24,22,'#d29b58');r(6,8,20,17,'#b77b46');r(7,9,18,3,'#e8b56b');r(7,16,18,2,'#e8b56b');r(4,5,3,22,'#f3c986');r(25,5,3,22,'#ad713f');r(5,5,22,3,'#ffe0a0');r(5,24,22,3,'#e4b06a');r(6,6,2,2,'#805b3d');r(24,25,2,2,'#805b3d');r(14,13,6,5,'#f1a13f');r(15,18,3,3,'#f1a13f');r(15,10,2,4,'#5f974f');r(17,10,4,2,'#9dc968');
        } else if(kind==='hedge') {
          r(1,5,30,27,'#376e4c');r(2,3,28,25,'#4b9550');r(5,1,22,26,'#75b44f');r(8,2,12,5,'#b9d663');r(4,8,8,5,'#a3ce5a');r(18,5,10,5,'#92c250');r(7,16,12,6,'#8fc352');r(21,16,8,6,'#447e45');r(4,24,11,4,'#467d43');r(21,11,3,3,'#d0e478');r(13,10,3,3,'#c0db69');r(15,25,8,3,'#64a34a');
        } else if(kind==='barn') {
          for(let i=0;i<6;i++)r(15-i*2,2+i*2,2+i*4,3,'#5c656c');r(6,14,23,17,'#9d4843');r(7,14,20,15,'#df775c');for(let i=9;i<27;i+=4)r(i,15,1,14,'#f59973');r(5,14,25,2,'#ffecbc');r(12,20,11,11,'#ffe8b4');r(14,21,7,10,'#975645');r(17,21,1,10,'#ffdb9e');r(14,23,7,1,'#ffdb9e');r(15,12,6,6,'#ffecbc');r(16,13,4,4,'#6aa7b5');
        } else if(kind==='cookie') {
          round(4,4,24,24,'#986334');round(5,4,22,21,'#e6ac57');r(8,6,16,13,'#f9ce7b');r(9,7,9,2,'#ffe6a3');for(const [x,y] of [[10,11],[21,10],[17,18],[8,21]]){r(x,y,3,3,'#8f5a41');r(x,y,2,1,'#bc8650');}
        }
        return a;
      }
      function sprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pixels(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function paint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pixels(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}

      const GROW_BASE = 3000
      const SELL_BASE = 3
      const GOAL = 500
      const coinsEl = document.getElementById('coins')
      const earnedEl = document.getElementById('earned')
      const bestEl = document.getElementById('best')
      const barIn = document.getElementById('bar-in')
      const farmEl = document.getElementById('farm')
      const upSpeed = document.getElementById('up-speed')
      const upPrice = document.getElementById('up-price')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let plots, coins, earned, growMs, sellPrice, speedLv, priceLv, running, over
      let best = Number(localStorage.getItem('farmclicker-best') || 0)
      bestEl.textContent = best

      function priceOf(base, lv, step) { return base + lv * step }

      function start() {
        startAt = Date.now()
        document.getElementById('garden-hint').textContent = '种子 1 金币 · 熟了点一下收获 · 空田时自动留 1 金币买种子'
        plots = Array.from({ length: 6 }, () => ({ state: 'empty', t: 0 }))
        coins = 2; earned = 0; speedLv = 0; priceLv = 0
        growMs = GROW_BASE; sellPrice = SELL_BASE
        running = true; over = false
        overlay.classList.add('hidden')
        render()
      }

      function plant(i) {
        if (!running || over) return
        const p = plots[i]
        if (p.state !== 'empty' || coins < 1) return
        coins--
        p.state = 'grow'
        p.t = Date.now()
        render()
      }

      function harvest(i) {
        if (!running || over) return
        const p = plots[i]
        if (p.state !== 'ripe') return
        p.state = 'empty'
        coins += sellPrice
        earned += sellPrice
        document.getElementById('garden-hint').textContent = '收获成功！+' + sellPrice + ' 金币，继续种下一颗吧'
        if (earned >= GOAL) { render(); return win() }
        render()
      }

      function win() {
        running = false; over = true
        saveBest()
        showOverlay('🎉 目标达成', '累计赚取 ' + earned + ' 金币，用时 ' + ((Date.now() - startAt) / 1000 | 0) + ' 秒')
        ovBtn.textContent = '再来一局'
      }

      let startAt = 0
      function saveBest() {
        const s = Math.floor(coins)
        if (s > best) { best = s; bestEl.textContent = best; localStorage.setItem('farmclicker-best', best) }
      }

      function showOverlay(t, p) {
        overlay.querySelector('h1').textContent = t
        overlay.querySelector('p').innerHTML = p
        overlay.classList.remove('hidden')
      }

      function render() {
        coinsEl.textContent = coins
        earnedEl.textContent = earned
        barIn.style.width = Math.min(100, earned / GOAL * 100) + '%'
        const now = Date.now()
        for (const p of plots) if (p.state === 'grow' && now - p.t >= growMs) p.state = 'ripe'
        farmEl.innerHTML = ''
        plots.forEach((p, i) => {
          const el = document.createElement('button')
          if (p.state === 'empty') {
            el.className = 'plot empty'
            el.innerHTML = sprite('sprout') + '<span class="t">种子 −1</span>'
            el.onclick = () => plant(i)
          } else if (p.state === 'grow') {
            const left = Math.max(0, growMs - (now - p.t))

            el.className = 'plot'
            el.innerHTML = sprite('sprout') + '<span class="t">' + (left / 1000).toFixed(1) + 's</span>'
          } else {
            el.className = 'plot ripe'
            el.innerHTML = sprite('carrot') + '<span class="t">+' + sellPrice + ' 收获</span>'
            el.onclick = () => harvest(i)
          }
          el.setAttribute('aria-label', '菜地 ' + (i+1) + (p.state === 'empty' ? '，花 1 金币种菜' : p.state === 'ripe' ? '，点击收获' : '，生长中'))
          farmEl.appendChild(el)
        })
        const sp = priceOf(20, speedLv, 10), pr = priceOf(30, priceLv, 15)
        upSpeed.querySelector('small').textContent = sp + ' 金币（当前 ' + (growMs / 1000).toFixed(1) + 's）'
        upPrice.querySelector('small').textContent = pr + ' 金币（当前 ' + sellPrice + '）'
        const reserve = plots.some(p=>p.state !== 'empty') ? 0 : 1
        upSpeed.disabled = coins < sp + reserve || growMs <= 600 || !running
        upPrice.disabled = coins < pr + reserve || !running
        if (growMs <= 600) upSpeed.querySelector('small').textContent = '已满级 · 0.6 秒成熟'
      }

      upSpeed.onclick = () => {
        const sp = priceOf(20, speedLv, 10)
        if (!running || over || growMs <= 600 || coins < sp + (plots.some(p=>p.state !== 'empty') ? 0 : 1)) return
        coins -= sp; speedLv++
        growMs = Math.max(600, GROW_BASE - speedLv * 300)
        render()
      }
      upPrice.onclick = () => {
        const pr = priceOf(30, priceLv, 15)
        if (!running || over || coins < pr + (plots.some(p=>p.state !== 'empty') ? 0 : 1)) return
        coins -= pr; priceLv++
        sellPrice = SELL_BASE + priceLv
        render()
      }
      ovBtn.addEventListener('click', () => { startAt = Date.now(); start() })

      setInterval(() => { if (running && !over) render() }, 300)

      window.__hub = {
        get score() { return Math.floor(coins) },
        get over() { return over },
        get started() { return running || over },
      }

      plots = Array.from({ length: 6 }, () => ({ state: 'empty', t: 0 }))
      coins = 2; earned = 0; speedLv = 0; priceLv = 0
      growMs = GROW_BASE; sellPrice = SELL_BASE; running = false; over = false
      render()
    })()
  </script>
</body>
</html>
