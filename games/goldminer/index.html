<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>黄金矿工</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>金额<b id="score">0</b></span>
      <span>目标<b id="goal">500</b></span>
      <span>时间<b id="time">60s</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="520" height="560"></canvas>
    <div id="overlay">
      <h1>⛏️ 黄金矿工</h1>
      <p>钩子来回摆动，点击放下抓取<br/>金块贵但重拉得慢，钻石又快又值<br/>60 秒攒够目标金额过关</p>
      <button id="ov-btn">开始挖矿</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const ORIGIN = { x: W / 2, y: 90 }
      const scoreEl = document.getElementById('score')
      const goalEl = document.getElementById('goal')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const ITEMS = [
        { e: '💎', v: 200, w: 0.4, p: 0.1 },
        { e: '🪙', v: 120, w: 0.6, p: 0.2 },
        { e: '🟡', v: 80, w: 1.0, p: 0.25 },
        { e: '🟡', v: 50, w: 1.2, p: 0.25 },
        { e: '🪨', v: 15, w: 2.2, p: 0.2 },
      ]

      let angle, dir, items, hook, money, goal, timeLeft, level, running, over, frame
      let best = Number(localStorage.getItem('goldminer-best') || 0)
      bestEl.textContent = best

      function spawnItems() {
        items = []
        for (let i = 0; i < 9; i++) {
          const roll = Math.random()
          let acc = 0, it = ITEMS[2]
          for (const t of ITEMS) { acc += t.p; if (roll < acc) { it = t; break } }
          items.push({
            x: 40 + Math.random() * (W - 80),
            y: 260 + Math.random() * (H - 320),
            e: it.e, v: it.v, w: it.w,
            gone: false,
          })
        }
      }

      function start() {
        money = 0; level = 1; timeLeft = 60
        goal = 500 + (level - 1) * 250
        goalEl.textContent = goal
        angle = -1.2; dir = 1
        hook = null
        running = true; over = false; frame = 0
        scoreEl.textContent = 0; timeEl.textContent = '60s'
        spawnItems()
        overlay.classList.add('hidden')
      }

      function nextLevel() {
        level++
        goal = 500 + (level - 1) * 250
        goalEl.textContent = goal
        timeLeft = 60
        hook = null
        angle = -1.2; dir = 1
        spawnItems()
        msg('第 ' + level + ' 关开始！目标 ' + goal)
      }

      function end() {
        running = false; over = true
        if (money > best) { best = money; bestEl.textContent = best; localStorage.setItem('goldminer-best', best) }
        const ok = money >= goal
        overlay.querySelector('h1').textContent = ok ? '⛏️ 达标收工' : '😵 差一点'
        overlay.querySelector('p').innerHTML =
          '金额 <b style="color:#ffd23f">' + money + '</b> / ' + goal + ' · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function msg(t) {
        timeEl.textContent = timeLeft.toFixed(0) + 's · ' + t
        setTimeout(() => { if (running && !over) timeEl.textContent = timeLeft.toFixed(0) + 's' }, 700)
      }

      function drop() {
        if (!running || over || hook) return
        hook = { len: 46, dir: angle, state: 'out' }
      }

      function step() {
        frame++
        if (!hook) {
          angle += dir * 0.02
          if (angle > 1.2) { angle = 1.2; dir = -1 }
          if (angle < -1.2) { angle = -1.2; dir = 1 }
        } else {
          if (hook.state === 'out') {
            hook.len += 6
            const hx = ORIGIN.x + Math.sin(hook.dir) * hook.len
            const hy = ORIGIN.y + Math.cos(hook.dir) * hook.len
            for (const it of items) {
              if (it.gone) continue
              if (Math.hypot(it.x - hx, it.y - hy) < 20) {
                it.gone = true
                hook.item = it
                hook.state = 'back'
                break
              }
            }
            if (hx < 0 || hx > W || hy > H) hook.state = 'back'
          } else {
            const w = hook.item ? hook.item.w : 0.3
            hook.len -= 7 / w
            if (hook.len <= 46) {
              hook.len = 46
              if (hook.item) {
                money += hook.item.v
                scoreEl.textContent = money
                if (money >= goal) {
                  timeLeft += 5
                  nextLevel()
                  return
                }
              }
              hook = null
            }
          }
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        // 泥土层
        ctx.fillStyle = '#241a10'
        ctx.fillRect(0, 200, W, H - 200)
        ctx.fillStyle = '#2e2115'
        for (let x = 0; x < W; x += 40)
          for (let y = 200; y < H; y += 40)
            ctx.fillRect(x + 8, y + 8, 12, 12)
        // 矿工
        ctx.font = '34px sans-serif'
        ctx.fillText('🧔', ORIGIN.x - 16, ORIGIN.y + 8)
        // 物品
        ctx.font = '26px sans-serif'
        for (const it of items) {
          if (it.gone) continue
          ctx.fillText(it.e, it.x - 12, it.y + 9)
        }
        // 钩子
        const ang = hook ? hook.dir : angle
        const len = hook ? hook.len : 46
        const hx = ORIGIN.x + Math.sin(ang) * len
        const hy = ORIGIN.y + Math.cos(ang) * len
        ctx.strokeStyle = '#8b93a7'
        ctx.lineWidth = 2
        ctx.beginPath(); ctx.moveTo(ORIGIN.x, ORIGIN.y); ctx.lineTo(hx, hy); ctx.stroke()
        ctx.font = '18px sans-serif'
        if (hook && hook.item) ctx.fillText(hook.item.e, hx - 9, hy + 6)
        else {
          ctx.fillStyle = '#c9d4f5'
          ctx.beginPath(); ctx.arc(hx, hy, 5, 0, Math.PI * 2); ctx.fill()
        }
      }

      function loop() {
        requestAnimationFrame(loop)
        if (!lastT) lastT = performance.now()
        const now = performance.now()
        const dt = Math.min(60, now - lastT)
        lastT = now
        if (running && !over) {
          timeLeft -= dt / 1000
          timeEl.textContent = Math.max(0, timeLeft).toFixed(0) + 's'
          if (timeLeft <= 0) { timeLeft = 0; end() }
          step()
        }
        draw()
      }
      let lastT = 0

      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); drop() })
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); if (!running && !overlay.classList.contains('hidden')) start(); else drop() }
      })
      ovBtn.addEventListener('click', start)

      angle = -1.2; dir = 1; items = []; hook = null
      money = 0; goal = 500; timeLeft = 60; level = 1
      running = false; over = false; frame = 0

      window.__hub = {
        get score() { return money },
        get over() { return over },
        get started() { return running },
      }
      loop()
    })()
  </script>
</body>
</html>
