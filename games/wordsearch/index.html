<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>单词搜索</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(94vw,520px); position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #grid { width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(10,1fr); gap:2px;
      background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:6px; }
    .cell { display:grid; place-items:center; font-size:min(3vw,15px); font-weight:900; color:#c9d4f5;
      background:#14161f; border-radius:4px; cursor:pointer; user-select:none; text-transform:uppercase; }
    .cell.sel { background:var(--yellow); color:#14161f; }
    .cell.found { background:#122a1c; color:#22b573; }
    #words { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
    #words span { font-size:13px; font-weight:900; padding:4px 12px; border:2px solid #2a3350;
      border-radius:999px; background:#14161f; letter-spacing:1px; }
    #words span.done { color:#22b573; text-decoration:line-through; border-color:#0f7a4a; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>已找到<b id="score">0/5</b></span>
      <span>用时<b id="time">0s</b></span>
      <span>BEST<b id="best">—</b></span>
    </div>
    <div id="grid"></div>
    <div id="words"></div>
  </div>
  <div id="overlay">
    <h1>🔎 单词搜索</h1>
    <p>字母矩阵横向或纵向藏着 5 个单词<br/>先点首字母、再点尾字母选中<br/>全部找到即胜利</p>
    <button id="ov-btn">开始搜索</button>
  </div>
  <script>
    (() => {
      const N = 10
      const WORDS = [
        ['STAR', 'STARMOON'], ['GAME', 'GAMEPLAY'], ['PIXEL', 'PIXELART'],
        ['SWORD', 'SWORDFISH'], ['CLOUD', 'CLOUDSKY'], ['TIGER', 'TIGERZOO'],
        ['OCEAN', 'OCEANWAVE'], ['ROBOT', 'ROBOTICS'], ['MAGIC', 'MAGICWAND'], ['FLAME', 'FLAMEFIRE'],
      ]
      const gridEl = document.getElementById('grid')
      const wordsEl = document.getElementById('words')
      const scoreEl = document.getElementById('score')
      const timeEl = document.getElementById('time')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let grid, found, sel, timeLeft, timer, round, solvedCount, running, over
      let best = Number(localStorage.getItem('wordsearch-best') || 0)
      if (best) bestEl.textContent = best + 's'

      function build() {
        // 选 5 个词（首字母不同起始）
        const pool = [...WORDS].sort(() => Math.random() - 0.5).slice(0, 5)
        grid = Array.from({ length: N }, () => Array(N).fill(''))
        const placed = []
        for (const [w] of pool) {
          for (let tries = 0; tries < 200; tries++) {
            const horiz = Math.random() < 0.5
            const r = (Math.random() * (horiz ? N : N - w.length + 1)) | 0
            const c = (Math.random() * (horiz ? N - w.length + 1 : N)) | 0
            let ok = true
            const cells = []
            for (let k = 0; k < w.length; k++) {
              const rr = r + (horiz ? 0 : k), cc = c + (horiz ? k : 0)
              if (grid[rr][cc] && grid[rr][cc] !== w[k]) { ok = false; break }
              cells.push([rr, cc])
            }
            if (!ok) continue
            cells.forEach(([rr, cc], k) => { grid[rr][cc] = w[k] })
            placed.push({ w, cells })
            break
          }
        }
        // 填充随机字母
        for (let r = 0; r < N; r++)
          for (let c = 0; c < N; c++)
            if (!grid[r][c]) grid[r][c] = 'abcdefghijklmnopqrstuvwxyz'[(Math.random() * 26) | 0]
        return placed
      }

      function start() {
        found = []; sel = null; timeLeft = 0; solvedCount = 0
        running = true; over = false
        scoreEl.textContent = '0/5'; timeEl.textContent = '0s'
        overlay.classList.add('hidden')
        placedWords = build()
        wordsEl.innerHTML = ''
        placedWords.forEach(({ w }) => {
          const s = document.createElement('span')
          s.textContent = w
          s.dataset.w = w
          wordsEl.appendChild(s)
        })
        clearInterval(timer)
        timer = setInterval(() => {
          if (running && !over) {
            timeLeft++
            timeEl.textContent = timeLeft + 's'
          }
        }, 1000)
        render()
      }

      let placedWords = []

      function render() {
        gridEl.innerHTML = ''
        for (let r = 0; r < N; r++)
          for (let c = 0; c < N; c++) {
            const el = document.createElement('div')
            el.className = 'cell'
            if (found.some(({ cells }) => cells.some(([rr, cc]) => rr === r && cc === c))) el.classList.add('found')
            else if (sel && sel[0] === r && sel[1] === c) el.classList.add('sel')
            el.textContent = grid[r][c].toUpperCase()
            el.onclick = () => pick(r, c)
            gridEl.appendChild(el)
          }
      }

      function pick(r, c) {
        if (!running || over) return
        if (!sel) {
          // 只允许点一个尚未找到的单词的首字母——不校验首字母，点两个点后判定
          sel = [r, c]
          render()
          return
        }
        // 同行或同列且距离 ≥2
        const [r1, c1] = sel
        if (r1 === r && c1 === c) { sel = null; render(); return }
        if (r1 !== r && c1 !== c) { sel = [r, c]; render(); return }
        const len = Math.abs(r1 - r) + Math.abs(c1 - c) + 1
        const dr = Math.sign(r - r1), dc = Math.sign(c - c1)
        const str = Array.from({ length: len }, (_, k) => grid[r1 + dr * k][c1 + dc * k]).join('').toUpperCase()
        const entry = placedWords.find(({ w }) => w === str && !found.includes(placedWords.find((p) => p.w === w)))
        if (entry) {
          found.push(entry)
          solvedCount = found.length
          scoreEl.textContent = solvedCount + '/5'
          const tag = wordsEl.querySelector(`[data-w="${entry.w}"]`)
          if (tag) tag.classList.add('done')
          sel = null
          render()
          if (found.length === 5) {
            running = false; over = true
            clearInterval(timer)
            if (!best || timeLeft < best) { best = timeLeft; bestEl.textContent = best + 's'; localStorage.setItem('wordsearch-best', best) }
            overlay.querySelector('h1').textContent = '🎉 全部找到'
            overlay.querySelector('p').innerHTML = '用时 <b style="color:#ffd23f">' + timeLeft + '</b> 秒 · 最佳 ' + (best || '—') + 's'
            ovBtn.textContent = '再来一局'
            overlay.classList.remove('hidden')
          }
        } else {
          sel = [r, c]
          render()
        }
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return found.length },
        get over() { return over },
        get started() { return running },
      }

      grid = []; found = []; sel = null; placedWords = []
      timeLeft = 0; round = 0; solvedCount = 0; running = false; over = false
    })()
  </script>
</body>
</html>
