<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>跳高挑战</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>高度<b id="score">0m</b></span>
      <span>机会<b id="tries">♥♥♥</b></span>
      <span>BEST<b id="best">0m</b></span>
    </div>
    <canvas id="cv" width="480" height="600"></canvas>
    <div id="overlay">
      <h1>🦘 跳高挑战</h1>
      <p>第一次点击锁定助跑力度<br/>运动员跑到黄区时再点起跳<br/>杆子逐轮升高，3 次失败结束</p>
      <button id="ov-btn">开始比赛</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const GROUND = H - 60
      const scoreEl = document.getElementById('score')
      const triesEl = document.getElementById('tries')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      // 状态先初始化
      let phase, power, powerDir, barH, runnerX, runnerV, jumpV, runnerY, tries, bestH, running, over, resultMsg, settleT
      let best = Number(localStorage.getItem('highjump-best') || 0)
      bestEl.textContent = best + 'm'

      function start() {
        bestH = 0; tries = 3
        running = true; over = false
        triesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
        newRound()
      }

      function newRound() {
        barH = 0.9 + bestH * 0.35
        phase = 'power'
        power = 0; powerDir = 1
        runnerX = 40; runnerV = 0
        runnerY = GROUND
        jumpV = 0
        resultMsg = '① 点击锁定助跑力度'
        settleT = 0
      }

      function end() {
        running = false; over = true
        if (bestH > best) { best = bestH; bestEl.textContent = best + 'm'; localStorage.setItem('highjump-best', best) }
        overlay.querySelector('h1').textContent = '🏁 比赛结束'
        overlay.querySelector('p').innerHTML = '最终高度 <b style="color:#ffd23f">' + bestH.toFixed(2) + 'm</b> · 最佳 ' + best + 'm'
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function tap() {
        if (!running || over) return
        if (phase === 'power') {
          phase = 'run'
          runnerV = 3 + power / 100 * 3.2
          resultMsg = '② 进入黄区时点击起跳'
          return
        }
        if (phase === 'run') {
          // 起跳：垂直初速与水平力度相关，起跳点越靠近杆越有利
          jumpV = 9 + power / 100 * 5
          phase = 'fly'
        }
      }

      function step() {
        if (phase === 'power') {
          power += powerDir * 2.4
          if (power >= 100) { power = 100; powerDir = -1 }
          if (power <= 0) { power = 0; powerDir = 1 }
        }
        if (phase === 'run') {
          runnerX += runnerV
          if (runnerX > W + 20) {
            // 跑过头没起跳
            tries--
            triesEl.textContent = '♥'.repeat(Math.max(0, tries)) || '—'
            if (tries <= 0) return end()
            newRound()
          }
        }
        if (phase === 'fly') {
          runnerY -= jumpV
          jumpV -= 0.32
          runnerX += runnerV * 0.6
          const barX = W - 90
          // 碰杆判定：经过杆的横坐标区间时高度不足
          if (Math.abs(runnerX - barX) < 16) {
            const jumpH = (GROUND - runnerY) / 100
            if (jumpH < barH && settleT === 0) {
              settleT = 1
              resultMsg = '💥 碰杆！'
            }
          }
          if (runnerY >= GROUND) {
            runnerY = GROUND
            if (settleT === 1) {
              tries--
              triesEl.textContent = '♥'.repeat(Math.max(0, tries)) || '—'
              if (tries <= 0) return end()
              settleT = 0
              newRound()
              return
            }
            // 成功过杆
            bestH += barH / 1
            scoreEl.textContent = bestH.toFixed(2) + 'm'
            resultMsg = '✓ 过杆！高度 ' + barH.toFixed(2) + 'm'
            newRound()
          }
        }
        if (settleT === 1 && phase !== 'fly') {
          settleT = 0
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        // 地面
        ctx.fillStyle = '#1a1d29'
        ctx.fillRect(0, GROUND, W, H - GROUND)
        // 横杆
        const barX = W - 90
        const barY = GROUND - barH * 100
        ctx.strokeStyle = '#ffd23f'
        ctx.lineWidth = 5
        ctx.beginPath(); ctx.moveTo(barX - 40, barY); ctx.lineTo(barX + 40, barY); ctx.stroke()
        ctx.fillStyle = '#3a4152'
        ctx.fillRect(barX - 44, barY, 4, GROUND - barY)
        ctx.fillRect(barX + 40, barY, 4, GROUND - barY)
        // 起跳黄区
        ctx.fillStyle = 'rgba(255,210,63,0.25)'
        ctx.fillRect(barX - 90, GROUND - 6, 70, 6)
        // 运动员
        ctx.font = '32px sans-serif'
        ctx.fillText('🦘', runnerX - 16, runnerY - 4)
        // 力度条
        if (phase === 'power') {
          ctx.fillStyle = '#2a2e3d'
          ctx.fillRect(40, H - 40, W - 80, 14)
          ctx.fillStyle = '#ffd23f'
          ctx.fillRect(40, H - 40, (W - 80) * power / 100, 14)
        }
        ctx.fillStyle = '#8b93a7'
        ctx.font = '700 13px sans-serif'
        ctx.fillText(resultMsg, 14, H - 10)
        // 杆高标示
        ctx.fillText('当前杆高 ' + barH.toFixed(2) + 'm', 14, 24)
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); if (!running && !overlay.classList.contains('hidden')) start(); else tap() }
      })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); tap() })
      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return Math.round(bestH * 100) },
        get over() { return over },
        get started() { return running },
      }

      phase = 'power'; power = 0; powerDir = 1; barH = 1
      runnerX = 40; runnerV = 0; jumpV = 0; runnerY = GROUND
      tries = 3; bestH = 0; running = false; over = false; resultMsg = ''; settleT = 0
    })()
  </script>
</body>
</html>
