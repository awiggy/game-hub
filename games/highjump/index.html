        phase = 'power'
        power = 0; powerDir = 1
        runnerX = 40; runnerV = 0
        runnerY = GROUND
        jumpV = 0
        resultMsg = '① 点击锁定助跑力度'
        settleT = 0
      }

      function end() {
        running = false; over = true
        if (bestH > best) { best = bestH; bestEl.textContent = best + 'm'; localStorage.setItem('highjump-best', best) }
        overlay.querySelector('h1').textContent = '🏁 比赛结束'
        overlay.querySelector('p').innerHTML = '最终高度 <b style="color:#ffd23f">' + bestH.toFixed(2) + 'm</b> · 最佳 ' + best + 'm'
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function tap() {
        if (!running || over) return
        if (phase === 'power') {
          phase = 'run'
          runnerV = 3 + power / 100 * 3.2
          resultMsg = '② 进入黄区时点击起跳'
          return
        }
        if (phase === 'run') {
          // 起跳：垂直初速与水平力度相关，起跳点越靠近杆越有利
          jumpV = 9 + power / 100 * 5
          phase = 'fly'
        }
      }

      function step() {
        if (phase === 'power') {
          power += powerDir * 2.4
          if (power >= 100) { power = 100; powerDir = -1 }
          if (power <= 0) { power = 0; powerDir = 1 }
        }
        if (phase === 'run') {
          runnerX += runnerV
          if (runnerX > W + 20) {
            // 跑过头没起跳
            tries--
            triesEl.textContent = '♥'.repeat(Math.max(0, tries)) || '—'
            if (tries <= 0) return end()
            newRound()
          }
        }
        if (phase === 'fly') {
          const oldX=runnerX;runnerY -= jumpV
          jumpV -= 0.32
          runnerX += runnerV * 0.6
          const barX = W - 90
          // 碰杆判定：经过杆的横坐标区间时高度不足
          if(oldX<barX&&runnerX>=barX){crossed=true;
            const jumpH = (GROUND - runnerY) / 100
            if (jumpH < barH && settleT === 0) {
              settleT = 1
              resultMsg = '💥 碰杆！'
            }
          }
          if (runnerY >= GROUND) {
            runnerY = GROUND
            if (settleT === 1 || !crossed) {
              tries--
              triesEl.textContent = '♥'.repeat(Math.max(0, tries)) || '—'
              if (tries <= 0) return end()
              settleT = 0
              newRound()
              return
            }
            // 成功过杆
            bestH = barH
            scoreEl.textContent = bestH.toFixed(2) + 'm'
            resultMsg = '✓ 过杆！高度 ' + barH.toFixed(2) + 'm'
            newRound()
          }
        }
        if (settleT === 1 && phase !== 'fly') {
          settleT = 0
        }
      }

      function draw(){bgSky(GROUND);box(0,GROUND-10,W,10,'#cda888');box(0,GROUND,W,H-GROUND,'#e9d4ad');const bx=W-90,by=GROUND-barH*100;panel(bx-44,by,5,GROUND-by,'#c29a72');panel(bx+40,by,5,GROUND-by,'#c29a72');panel(bx-40,by,80,6,settleT===1?'#be8b83':'#f2d184');panel(bx-25,GROUND-18,95,18,'#a9c6bf');box(bx-90,GROUND-6,70,6,'#e9c97e');pxPaint('bunny',runnerX-20,runnerY-41,40);if(phase==='power')meter(power/100,H-40);label('杆高 '+barH.toFixed(2)+' m',14,27,14,'#5d7c62');label(resultMsg,W/2,H-10,12,'#8a7358','center')}

      function loop(t){requestAnimationFrame(loop);const now=Number.isFinite(t)?t:performance.now();if(!pxLast)pxLast=now;pxAcc+=Math.min(80,Math.max(0,now-pxLast));pxLast=now;while(pxAcc>=1000/60){pxAcc-=1000/60;if(running&&!over){step()}}draw()}

      window.addEventListener('keydown', (e) => {
        if(e.repeat)return;
        if (e.code === 'Space') { e.preventDefault(); if (!running && !overlay.classList.contains('hidden')) start(); else tap() }
      })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); tap() })
      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return Math.round(bestH * 100) },
        get over() { return over },
        get started() { return running },
      }

      phase = 'power'; power = 0; powerDir = 1; barH = 1
      runnerX = 40; runnerV = 0; jumpV = 0; runnerY = GROUND
      tries = 3; bestH = 0; running = false; over = false; resultMsg = ''; settleT = 0
    })()
  </script>
</body>
</html>
