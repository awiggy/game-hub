<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>登月着陆</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>成功<b id="score">0</b></span>
      <span>燃料<b id="fuel">100%</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="480" height="600"></canvas>
    <div id="overlay">
      <h1>🌕 登月着陆</h1>
      <p>按住空格 / 屏幕点火反推<br/>下降要慢、位置要准，落在发光平台<br/>燃料有限，着陆越稳分越高</p>
      <button id="ov-btn">开始降落</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const G = 0.045
      const THRUST = -0.1
      const scoreEl = document.getElementById('score')
      const fuelEl = document.getElementById('fuel')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let x, y, vx, vy, fuel, padX, padW, terrain, landed, score, running, over, thrusting, stars
      let best = Number(localStorage.getItem('moonlander-best') || 0)
      bestEl.textContent = best

      function makeTerrain() {
        // 月面折线 + 中间一处平台
        terrain = []
        padX = 80 + Math.random() * (W - 220)
        padW = 90
        let hy = H - 80
        for (let x = 0; x <= W; x += 24) {
          if (x >= padX && x <= padX + padW) terrain.push({ x, y: H - 70 })
          else {
            hy += (Math.random() - 0.5) * 26
            hy = Math.max(H - 130, Math.min(H - 40, hy))
            terrain.push({ x, y: hy })
          }
        }
        stars = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.7, s: Math.random() * 1.6 + 0.4 }))
      }

      function start() {
        x = 60; y = 70; vx = 0.35; vy = 0
        fuel = 100
        landed = false
        score = score || 0
        running = true; over = false
        thrusting = false
        makeTerrain()
        fuelEl.textContent = '100%'
        overlay.classList.add('hidden')
      }

      function end(ok, msg) {
        running = false; over = true
        if (ok) {
          score++
          scoreEl.textContent = score
          if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('moonlander-best', best) }
        }
        overlay.querySelector('h1').textContent = ok ? '🌕 着陆成功' : '💥 任务失败'
        overlay.querySelector('p').innerHTML = msg + '<br/>成功次数 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = ok ? '下一次降落' : '再来一次'
        overlay.classList.remove('hidden')
      }

      function step() {
        if (thrusting && fuel > 0) {
          vy += THRUST
          fuel -= 0.35
          fuelEl.textContent = Math.max(0, fuel | 0) + '%'
        }
        vy += G
        vx *= 0.995
        x += vx
        y += vy
        if (x < 10 || x > W - 10) return end(false, '🛰 漂移出了着陆区')
        if (y < 10) { y = 10; vy = 0 }
        // 着地判定
        if (y >= H - 78) {
          const onPad = x > padX + 8 && x < padX + padW - 8
          const soft = vy < 1.1 && Math.abs(vx) < 0.55
          if (onPad && soft) {
            const bonus = (fuel | 0) + Math.max(0, (1.1 - vy) * 100 | 0)
            return end(true, '着陆速度 ' + vy.toFixed(2) + ' · 燃料奖励 +' + (fuel | 0))
          }
          if (onPad) return end(false, '⚖ 下降太快（' + vy.toFixed(2) + '）或横向漂移（' + vx.toFixed(2) + '）')
          return end(false, '⛰ 降落在崎岖月面上')
        }
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = 'rgba(255,255,255,0.5)'
        for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s)
        // 地球
        ctx.fillStyle = '#2a3350'
        ctx.beginPath(); ctx.arc(W - 60, 70, 22, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = '#3a4a7a'
        ctx.beginPath(); ctx.arc(W - 66, 64, 8, 0, Math.PI * 2); ctx.fill()
        // 月面
        ctx.strokeStyle = '#3a4152'
        ctx.lineWidth = 2
        ctx.beginPath()
        terrain.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))
        ctx.stroke()
        // 平台
        ctx.strokeStyle = '#ffd23f'
        ctx.lineWidth = 4
        ctx.beginPath()
        ctx.moveTo(padX, H - 70)
        ctx.lineTo(padX + padW, H - 70)
        ctx.stroke()
        ctx.fillStyle = 'rgba(255,210,63,0.12)'
        ctx.fillRect(padX, H - 70, padW, 18)
        // 着陆器
        ctx.font = '26px sans-serif'
        ctx.fillText('🚀', x - 13, y + 9)
        if (thrusting && fuel > 0 && running && !over) {
          ctx.fillStyle = '#ffd23f'
          ctx.beginPath()
          ctx.moveTo(x - 5, y + 12)
          ctx.lineTo(x + 5, y + 12)
          ctx.lineTo(x, y + 12 + 10 + Math.random() * 8)
          ctx.fill()
        }
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      function press() {
        if (!running && !overlay.classList.contains('hidden')) { start(); return }
        thrusting = true
      }
      function unpress() { thrusting = false }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); press() }
      })
      window.addEventListener('keyup', (e) => { if (e.code === 'Space') unpress() })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); press() })
      window.addEventListener('pointerup', unpress)
      ovBtn.addEventListener('click', start)
      loop()

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      x = 60; y = 70; vx = 0.35; vy = 0; fuel = 100
      padX = 200; padW = 90; terrain = []; stars = []
      landed = false; score = 0; running = false; over = false; thrusting = false
    })()
  </script>
</body>
</html>
