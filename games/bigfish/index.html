          round(4,7,24,22,'#9e6676');round(5,7,22,20,'#d894a1');for(let k=0;k<5;k++){r(7+k*3,9,2,16,'#efbec0');r(6,10+k*3,20,1,'#c77f90')}r(22,25,2,5,'#9e6676');r(23,28,7,2,'#9e6676');r(11,2,2,9,'#917c60');r(9,2,6,2,'#d4b68b');
        }
        if(kind==='jar'){
          r(8,3,16,4,'#9b7664');r(8,3,16,2,'#e5c59b');r(6,8,20,21,'#7b9e98');r(7,8,18,19,'#cce5d6');r(9,10,3,13,'#fff7de');r(12,16,9,9,'#e4a17e');r(14,14,6,9,'#f9c690');r(14,16,2,2,'#fff0c2');r(8,27,16,2,'#a7c7b5');
        }
        return a;
      }
      function pxSprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pxRects(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}


      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const sizeEl = document.getElementById('size')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let px, py, tx, ty, size, fishes, score, lives, inv, frame, running, over
      let best = Number(localStorage.getItem('bigfish-best') || 0)
      bestEl.textContent = best

      const FISH_EMOJI = ['🐟', '🐠', '🐡', '🦐']

      function start() {
        px = W / 2; py = H / 2; tx = px; ty = py
        size = 1; score = 0; lives = 3; inv = 90; frame = 0
        fishes = []
        running = true; over = false
        scoreEl.textContent = 0; sizeEl.textContent = '1.0'; livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('bigfish-best', best) }
        overlay.querySelector('h1').textContent = '🌊 被吃掉了'
        overlay.querySelector('p').innerHTML = '吃掉 <b style="color:#ffd23f">' + score + '</b> 条鱼 · 最终体型 ' + size.toFixed(1) + ' · 最佳 ' + best
        ovBtn.textContent = '再潜一次'
        overlay.classList.remove('hidden')
      }

      function spawnFish() {
        const side = Math.random() < 0.5
        // 相对玩家的体型：约 45% 可吃，35% 中性偏小，20% 危险
        const rel = Math.random()
        let s
        if (rel < 0.5) s = size * (0.45 + Math.random() * 0.35)
        else if (rel < 0.82) s = size * (0.82 + Math.random() * 0.12)
        else s = size * (1.25 + Math.random() * 0.5)
        fishes.push({
          x: side ? -40 : W + 40,
          y: 40 + Math.random() * (H - 80),
          s,
          v: (0.8 + Math.random() * 1.4) * (side ? 1 : -1),
          e: FISH_EMOJI[(Math.random() * FISH_EMOJI.length) | 0],
        })
      }

      function step() {
        frame++
        px += (tx - px) * 0.12
        py += (ty - py) * 0.12
        px = Math.max(20, Math.min(W - 20, px))
        py = Math.max(20, Math.min(H - 20, py))
        if (frame % 34 === 0 && fishes.length < 12) spawnFish()
        for (let i = fishes.length - 1; i >= 0; i--) {
          const f = fishes[i]
          f.x += f.v
          if (f.x < -60 || f.x > W + 60) { fishes.splice(i, 1); continue }
          const d = Math.hypot(f.x - px, f.y - py)
          if (d < (12 * size + 12 * f.s) * 0.75) {
            if (f.s < size * 0.92) {
              fishes.splice(i, 1)
              score++
              size = Math.min(4, size + 0.12)
              scoreEl.textContent = score
              sizeEl.textContent = size.toFixed(1)
            } else if (inv <= 0) {
              fishes.splice(i, 1)
              lives--
              inv = 110
              livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
              if (lives <= 0) return end()
            }
          }
        }
        if (inv > 0) inv--
      }

      function draw() {
        ctx.fillStyle='#8cd7dc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#76c9d0';ctx.fillRect(0,180,W,H-180);ctx.fillStyle='#69bbc7';ctx.fillRect(0,365,W,H-365);
        for(let i=0;i<7;i++){ctx.fillStyle='#d8f2d940';ctx.fillRect(25+i*83,0,20,150+i%3*70);ctx.fillRect(45+i*83,90,12,90)}
        ctx.fillStyle='#ddce9d';ctx.fillRect(0,H-27,W,27);ctx.fillStyle='#f0e3b5';ctx.fillRect(0,H-29,W,8);
        for(let i=0;i<12;i++){const x=i*46;ctx.fillStyle=i%2?'#5d9b85':'#6eaa8a';ctx.fillRect(x,H-58-i%3*10,7,35+i%3*10);ctx.fillRect(x-8,H-55-i%3*10,9,5);ctx.fillRect(x+5,H-40-i%3*10,10,5);if(i%3===0){ctx.fillStyle='#e5a0a3';ctx.fillRect(x+17,H-50,7,25);ctx.fillRect(x+12,H-43,17,5)}}
        for(let i=0;i<18;i++){const x=(i*97)%W,y=H-((i*71+frame*.35)%H);ctx.strokeStyle='#d9f3e6';ctx.lineWidth=2;ctx.strokeRect(x,y,4+i%3*2,4+i%3*2)}
        for(const f of fishes){const edible=f.s<size*.92;ctx.save();ctx.translate(f.x,f.y);if(f.v<0)ctx.scale(-1,1);pxPaint(edible?'fishblue':'fishpink',-16*f.s,-16*f.s,32*f.s);ctx.restore();ctx.fillStyle=edible?'#3e8b64':'#b85f71';ctx.fillRect(f.x-3,f.y-16*f.s-7,6,4);if(!edible){ctx.fillRect(f.x-1,f.y-16*f.s-12,2,4)}}
        if(!over){ctx.save();ctx.translate(px,py);if(tx<px)ctx.scale(-1,1);ctx.globalAlpha=inv>0&&Math.floor(frame/5)%2?.45:1;pxPaint('fishgold',-16*size,-16*size,32*size);ctx.restore()}
      }

      let frameTime=0, frameDebt=0
      function loop(t=0) {
        requestAnimationFrame(loop)
        frameDebt+=Math.min(50,t-frameTime);frameTime=t
        while(frameDebt>=1000/60){if(running&&!over)step();frameDebt-=1000/60}
        draw()
      }

      function toGame(e) {
        const r = cv.getBoundingClientRect()
        return {
          x: (e.clientX - r.left) * (W / r.width),
          y: (e.clientY - r.top) * (H / r.height),
        }
      }
      cv.addEventListener('pointerdown', e=>{const p=toGame(e);tx=p.x;ty=p.y})
      window.addEventListener('keydown', e=>{const dirs={ArrowLeft:[-35,0],ArrowRight:[35,0],ArrowUp:[0,-35],ArrowDown:[0,35]};if(dirs[e.code]){e.preventDefault();tx=Math.max(20,Math.min(W-20,tx+dirs[e.code][0]));ty=Math.max(20,Math.min(H-20,ty+dirs[e.code][1]))}})
      cv.addEventListener('pointermove', (e) => { const p = toGame(e); tx = p.x; ty = p.y })
      cv.addEventListener('touchmove', (e) => { const p = toGame(e.touches[0]); tx = p.x; ty = p.y }, { passive: true })
      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running || over },
      }

      px = W / 2; py = H / 2; tx = px; ty = py; size = 1
      fishes = []; score = 0; lives = 3; inv = 0; frame = 0; running = false; over = false
    })()
  </script>
</body>
</html>
