<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>大鱼吃小鱼</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>吃鱼<b id="score">0</b></span>
      <span>体型<b id="size">1.0</b></span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="520" height="560"></canvas>
    <div id="overlay">
      <h1>🐠 大鱼吃小鱼</h1>
      <p>移动鼠标 / 手指引导小鱼<br/>吃掉比你小的鱼得分成长<br/>碰到大鱼 -1 命，共 3 命</p>
      <button id="ov-btn">潜入海底</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const scoreEl = document.getElementById('score')
      const sizeEl = document.getElementById('size')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let px, py, tx, ty, size, fishes, score, lives, inv, frame, running, over
      let best = Number(localStorage.getItem('bigfish-best') || 0)
      bestEl.textContent = best

      const FISH_EMOJI = ['🐟', '🐠', '🐡', '🦐']

      function start() {
        px = W / 2; py = H / 2; tx = px; ty = py
        size = 1; score = 0; lives = 3; inv = 90; frame = 0
        fishes = []
        running = true; over = false
        scoreEl.textContent = 0; sizeEl.textContent = '1.0'; livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('bigfish-best', best) }
        overlay.querySelector('h1').textContent = '🌊 被吃掉了'
        overlay.querySelector('p').innerHTML = '吃掉 <b style="color:#ffd23f">' + score + '</b> 条鱼 · 最终体型 ' + size.toFixed(1) + ' · 最佳 ' + best
        ovBtn.textContent = '再潜一次'
        overlay.classList.remove('hidden')
      }

      function spawnFish() {
        const side = Math.random() < 0.5
        // 相对玩家的体型：约 45% 可吃，35% 中性偏小，20% 危险
        const rel = Math.random()
        let s
        if (rel < 0.5) s = size * (0.45 + Math.random() * 0.35)
        else if (rel < 0.82) s = size * (0.82 + Math.random() * 0.12)
        else s = size * (1.25 + Math.random() * 0.5)
        fishes.push({
          x: side ? -40 : W + 40,
          y: 40 + Math.random() * (H - 80),
          s,
          v: (0.8 + Math.random() * 1.4) * (side ? 1 : -1),
          e: FISH_EMOJI[(Math.random() * FISH_EMOJI.length) | 0],
        })
      }

      function step() {
        frame++
        px += (tx - px) * 0.12
        py += (ty - py) * 0.12
        px = Math.max(20, Math.min(W - 20, px))
        py = Math.max(20, Math.min(H - 20, py))
        if (frame % 34 === 0 && fishes.length < 12) spawnFish()
        for (let i = fishes.length - 1; i >= 0; i--) {
          const f = fishes[i]
          f.x += f.v
          if (f.x < -60 || f.x > W + 60) { fishes.splice(i, 1); continue }
          const d = Math.hypot(f.x - px, f.y - py)
          if (d < (12 * size + 12 * f.s) * 0.75) {
            if (f.s < size * 0.92) {
              fishes.splice(i, 1)
              score++
              size = Math.min(4, size + 0.12)
              scoreEl.textContent = score
              sizeEl.textContent = size.toFixed(1)
            } else if (inv <= 0) {
              fishes.splice(i, 1)
              lives--
              inv = 110
              livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
              if (lives <= 0) return end()
            }
          }
        }
        if (inv > 0) inv--
      }

      function draw() {
        // 海水渐变
        const g = ctx.createLinearGradient(0, 0, 0, H)
        g.addColorStop(0, '#12203c'); g.addColorStop(1, '#14161f')
        ctx.fillStyle = g
        ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = 'rgba(255,255,255,0.06)'
        for (let i = 0; i < 24; i++) ctx.fillRect((i * 137) % W, (i * 91 + frame * 0.3) % H, 2, 2)
        ctx.font = '18px sans-serif'
        for (const f of fishes) {
          ctx.save()
          ctx.translate(f.x, f.y)
          if (f.v < 0) ctx.scale(-1, 1)
          ctx.fillText(f.e, -10, 6)
          ctx.restore()
        }
        if (running && !over && (inv <= 0 || (frame >> 2) % 2 === 0)) {
          ctx.font = (20 * size) + 'px sans-serif'
          ctx.fillText('🐟', px - 10 * size, py + 7 * size)
        }
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) step()
        draw()
      }

      function toGame(e) {
        const r = cv.getBoundingClientRect()
        return {
          x: (e.clientX - r.left) * (W / r.width),
          y: (e.clientY - r.top) * (H / r.height),
        }
      }
      cv.addEventListener('pointermove', (e) => { const p = toGame(e); tx = p.x; ty = p.y })
      cv.addEventListener('touchmove', (e) => { const p = toGame(e.touches[0]); tx = p.x; ty = p.y }, { passive: true })
      ovBtn.addEventListener('click', start)
      requestAnimationFrame(loop)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running },
      }

      px = W / 2; py = H / 2; tx = px; ty = py; size = 1
      fishes = []; score = 0; lives = 3; inv = 0; frame = 0; running = false; over = false
    })()
  </script>
</body>
</html>
