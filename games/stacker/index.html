<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>叠叠乐</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; }
    #hud { position:absolute; top:-34px; left:4px; right:4px; display:flex; justify-content:space-between;
      font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    canvas { display:block; border:3px solid #2a2e3d; border-radius:10px; background:#14161f; max-width:92vw; max-height:74vh; }
    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>层数<b id="score">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <canvas id="cv" width="380" height="560"></canvas>
    <div id="overlay">
      <h1>📦 叠叠乐</h1>
      <p>点击 / 空格 落下移动中的横条<br/>重叠部分保留，悬空部分切除<br/>完全错位即失败</p>
      <button id="ov-btn">开始游戏</button>
    </div>
  </div>
  <script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const BH = 26
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const COLORS = ['#2f55e4','#5d84ff','#00b8a9','#22b573','#f5a623','#ff7a59','#ff4d5e','#8a5cf6']
      let stack, cur, dir, speed, running, over
      let best = Number(localStorage.getItem('stacker-best') || 0)
      bestEl.textContent = best

      function spawn() {
        const top = stack[stack.length - 1]
        const w = top.w
        cur = { x: dir > 0 ? -w : W - w, w, y: 0 }
        cur.y = Math.max(30, H - 60 - stack.length * BH)
      }

      function start() {
        stack = [{ x: (W - 160) / 2, w: 160 }]
        dir = 1; speed = 3.4
        running = true; over = false
        scoreEl.textContent = 0
        spawn()
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score() > best) { best = score(); bestEl.textContent = best; localStorage.setItem('stacker-best', best) }
        overlay.querySelector('h1').textContent = '💥 塔倒了'
        overlay.querySelector('p').innerHTML = '叠到 <b style="color:#ffd23f">' + score() + '</b> 层 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function score() { return stack.length - 1 }

      function drop() {
        if (!running || over) return
        const top = stack[stack.length - 1]
        const left = Math.max(cur.x, top.x)
        const right = Math.min(cur.x + cur.w, top.x + top.w)
        const w = right - left
        if (w <= 2) return end()
        stack.push({ x: left, w })
        scoreEl.textContent = score()
        if (score() % 5 === 0) speed *= 1.15
        dir = dir > 0 ? -1 : 1
        spawn()
      }

      function loop() {
        requestAnimationFrame(loop)
        if (running && !over) {
          cur.x += dir * speed
          if (cur.x < 0) { cur.x = 0; dir = 1 }
          if (cur.x + cur.w > W) { cur.x = W - cur.w; dir = -1 }
        }
        draw()
      }

      function draw() {
        ctx.fillStyle = '#14161f'
        ctx.fillRect(0, 0, W, H)
        stack.forEach((b, i) => {
          ctx.fillStyle = COLORS[i % COLORS.length]
          ctx.beginPath()
          ctx.roundRect(b.x, H - 50 - i * BH, b.w, BH - 3, 4)
          ctx.fill()
        })
        if (running && !over) {
          ctx.fillStyle = '#ffd23f'
          ctx.beginPath()
          ctx.roundRect(cur.x, cur.y, cur.w, BH - 3, 4)
          ctx.fill()
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault()
          if (!running && !overlay.classList.contains('hidden')) start()
          else drop()
        }
      })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); drop() })
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return stack.length - 1 },
        get over() { return over },
        get started() { return running },
      }

      stack = [{ x: (W - 160) / 2, w: 160 }]
      dir = 1; speed = 3.4; running = false; over = false
      cur = { x: 0, w: 160, y: 60 }
      loop()
    })()
  </script>
</body>
</html>
