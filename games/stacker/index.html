" width="4" height="4" fill="#55705c"/><rect x="28" y="16" width="4" height="4" fill="#55705c"/><rect x="32" y="16" width="4" height="4" fill="#efaa69"/><rect x="36" y="16" width="4" height="4" fill="#efaa69"/><rect x="40" y="16" width="4" height="4" fill="#efaa69"/><rect x="44" y="16" width="4" height="4" fill="#efaa69"/><rect x="48" y="16" width="4" height="4" fill="#efaa69"/><rect x="52" y="16" width="4" height="4" fill="#efaa69"/><rect x="56" y="16" width="4" height="4" fill="#efaa69"/><rect x="60" y="16" width="4" height="4" fill="#efaa69"/><rect x="64" y="16" width="4" height="4" fill="#55705c"/><rect x="28" y="20" width="4" height="4" fill="#55705c"/><rect x="32" y="20" width="4" height="4" fill="#efaa69"/><rect x="36" y="20" width="4" height="4" fill="#efaa69"/><rect x="40" y="20" width="4" height="4" fill="#efaa69"/><rect x="44" y="20" width="4" height="4" fill="#efaa69"/><rect x="48" y="20" width="4" height="4" fill="#efaa69"/><rect x="52" y="20" width="4" height="4" fill="#efaa69"/><rect x="56" y="20" width="4" height="4" fill="#efaa69"/><rect x="60" y="20" width="4" height="4" fill="#efaa69"/><rect x="64" y="20" width="4" height="4" fill="#55705c"/><rect x="28" y="24" width="4" height="4" fill="#55705c"/><rect x="32" y="24" width="4" height="4" fill="#55705c"/><rect x="36" y="24" width="4" height="4" fill="#55705c"/><rect x="40" y="24" width="4" height="4" fill="#55705c"/><rect x="44" y="24" width="4" height="4" fill="#55705c"/><rect x="48" y="24" width="4" height="4" fill="#55705c"/><rect x="52" y="24" width="4" height="4" fill="#55705c"/><rect x="56" y="24" width="4" height="4" fill="#55705c"/><rect x="60" y="24" width="4" height="4" fill="#55705c"/><rect x="64" y="24" width="4" height="4" fill="#55705c"/><rect x="20" y="28" width="4" height="4" fill="#55705c"/><rect x="24" y="28" width="4" height="4" fill="#55705c"/><rect x="28" y="28" width="4" height="4" fill="#55705c"/><rect x="32" y="28" width="4" height="4" fill="#55705c"/><rect x="36" y="28" width="4" height="4" fill="#55705c"/><rect x="40" y="28" width="4" height="4" fill="#55705c"/><rect x="44" y="28" width="4" height="4" fill="#55705c"/><rect x="20" y="32" width="4" height="4" fill="#55705c"/><rect x="24" y="32" width="4" height="4" fill="#fff6dc"/><rect x="28" y="32" width="4" height="4" fill="#fff6dc"/><rect x="32" y="32" width="4" height="4" fill="#fff6dc"/><rect x="36" y="32" width="4" height="4" fill="#fff6dc"/><rect x="40" y="32" width="4" height="4" fill="#fff6dc"/><rect x="44" y="32" width="4" height="4" fill="#55705c"/><rect x="20" y="36" width="4" height="4" fill="#55705c"/><rect x="24" y="36" width="4" height="4" fill="#83c4d4"/><rect x="28" y="36" width="4" height="4" fill="#83c4d4"/><rect x="32" y="36" width="4" height="4" fill="#83c4d4"/><rect x="36" y="36" width="4" height="4" fill="#83c4d4"/><rect x="40" y="36" width="4" height="4" fill="#83c4d4"/><rect x="44" y="36" width="4" height="4" fill="#55705c"/><rect x="20" y="40" width="4" height="4" fill="#55705c"/><rect x="24" y="40" width="4" height="4" fill="#55705c"/><rect x="28" y="40" width="4" height="4" fill="#55705c"/><rect x="32" y="40" width="4" height="4" fill="#55705c"/><rect x="36" y="40" width="4" height="4" fill="#55705c"/><rect x="40" y="40" width="4" height="4" fill="#55705c"/><rect x="44" y="40" width="4" height="4" fill="#55705c"/><path d="M12 64h76v5H12z" fill="#c2d9a5"/></svg>
      <h1>叠叠乐</h1>
      <p>点击 / 空格 落下移动中的横条<br/>重叠部分保留，悬空部分切除<br/>完全错位即失败</p>
      <button id="ov-btn">开始游戏</button>
    </section></div><script>
    (() => {
      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const BH = 26
      const scoreEl = document.getElementById('score')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const COLORS = ['#7bb9bd','#91b58a','#e7b875','#e69b7c','#a7b1cf','#c0c883']
      let stack, cur, dir, speed, running, over
      let best=0;try{best=Number(localStorage.getItem('stacker-best'))||0}catch{}
      bestEl.textContent = best

      function step(){cur.x+=dir*speed;if(cur.x<0){cur.x=0;dir=1}if(cur.x+cur.w>W){cur.x=W-cur.w;dir=-1}}
      function spawn() {
        const top = stack[stack.length - 1]
        const w = top.w
        cur = { x: dir > 0 ? 0 : W - w, w, y: 0 }
        cur.y = H - 60 - stack.length * BH + Math.max(0,(stack.length-12)*BH)
      }

      function start() {
        stack = [{ x: (W - 160) / 2, w: 160 }]
        dir = 1; speed = 3.4
        running = true; over = false
        scoreEl.textContent = 0
        spawn()
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (score() > best) { best = score(); bestEl.textContent = best; (()=>{try{localStorage.setItem('stacker-best',best)}catch{}})() }
        overlay.querySelector('h1').textContent = '💥 塔倒了'
        overlay.querySelector('p').innerHTML = '叠到 <b >' + score() + '</b> 层 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function score() { return stack.length - 1 }

      function drop() {
        if (!running || over) return
        const top = stack[stack.length - 1]
        const left = Math.max(cur.x, top.x)
        const right = Math.min(cur.x + cur.w, top.x + top.w)
        const w = right - left
        if (w <= 2) return end()
        stack.push({ x: left, w })
        scoreEl.textContent = score()
        if (score() % 5 === 0) speed *= 1.15
        dir = dir > 0 ? -1 : 1
        spawn()
      }

      let lastTick=null,lag=0
      function loop(t){requestAnimationFrame(loop);if(lastTick===null)lastTick=t;lag+=Math.min(100,Math.max(0,t-lastTick));lastTick=t;while(lag>=1000/60){if(running&&!over)step();lag-=1000/60}draw()}


      function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
      function cloud(x,y){box(x+8,y,32,8,'#fffbed');box(x,y+8,56,12,'#fffbed')}
      function sky(){box(0,0,cv.width,cv.height,'#b0dce4');cloud(28,55);cloud(cv.width-90,110);for(let i=0;i<8;i++){box(i*80,cv.height-90,65,90,'#c2d9a5');box(i*80+15,cv.height-106,35,16,'#c2d9a5')}box(0,cv.height-20,cv.width,20,'#8db685')}
      function disc(x,y,r,c){for(let yy=-r;yy<r;yy+=3){const xx=Math.floor(Math.sqrt(Math.max(0,r*r-yy*yy))/3)*3;box(x-xx,y+yy,xx*2,3,c)}}
      function kid(x,y){box(x+6,y,20,6,'#6b9162');box(x+4,y+6,24,18,'#ffdfaa');box(x+10,y+12,4,4,'#3d5647');box(x+20,y+12,4,4,'#3d5647');box(x+4,y+24,24,20,'#e88c5f');box(x+4,y+44,8,8,'#526f59');box(x+20,y+44,8,8,'#526f59')}
      function pine(x,y){box(x-4,y+12,8,16,'#95744b');box(x-12,y-22,24,10,'#86bda5');box(x-20,y-12,40,10,'#6ca08c');box(x-26,y-2,52,15,'#538574');box(x-10,y-22,16,5,'#f0fbef');box(x-18,y-12,26,5,'#f0fbef');box(x-24,y-2,34,5,'#f0fbef')}

      function draw(){sky();const scroll=Math.max(0,(stack.length-12)*BH);for(let i=Math.max(0,stack.length-17);i<stack.length;i++){const b=stack[i],y=H-50-i*BH+scroll;box(b.x,y,b.w,BH-3,'#846b4e');box(b.x+2,y+2,Math.max(0,b.w-4),BH-7,COLORS[i%COLORS.length]);box(b.x+4,y+3,Math.max(0,b.w-8),4,'#fff2c5');if(b.w>36){box(b.x+12,y+10,4,4,'#526453');box(b.x+b.w-16,y+10,4,4,'#526453')}}if(running&&!over){const top=stack[stack.length-1];box(top.x,cur.y-10,top.w,3,'#8aa89c');box(cur.x,cur.y,cur.w,BH-3,'#b78042');box(cur.x+2,cur.y+2,Math.max(0,cur.w-4),BH-7,'#f2cc73');box(cur.x+5,cur.y+3,Math.max(0,cur.w-10),4,'#fff1ba')}box(0,H-24,W,24,'#87ad7b');}

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault()
          if(e.repeat)return
          if (!running && !overlay.classList.contains('hidden')) start()
          else drop()
        }
      })
      cv.addEventListener('pointerdown', (e) => { e.preventDefault(); drop() })
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return stack.length - 1 },
        get over() { return over },
        get started() { return running || over },
      }

      stack = [{ x: (W - 160) / 2, w: 160 }]
      dir = 1; speed = 3.4; running = false; over = false
      cur = { x: 0, w: 160, y: 60 }
      requestAnimationFrame(loop)
    })()
  </script></body></html>
