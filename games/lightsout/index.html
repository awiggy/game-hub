      cursor:pointer; transition:background .12s ease, box-shadow .12s ease; user-select:none; }

    #overlay { position:absolute; inset:0; border-radius:10px; background:rgba(15,17,24,.88);
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; z-index:10; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

          r(1,5,30,27,'#376e4c');r(2,3,28,25,'#4b9550');r(5,1,22,26,'#75b44f');r(8,2,12,5,'#b9d663');r(4,8,8,5,'#a3ce5a');r(18,5,10,5,'#92c250');r(7,16,12,6,'#8fc352');r(21,16,8,6,'#447e45');r(4,24,11,4,'#467d43');r(21,11,3,3,'#d0e478');r(13,10,3,3,'#c0db69');r(15,25,8,3,'#64a34a');
        } else if(kind==='barn') {
          for(let i=0;i<6;i++)r(15-i*2,2+i*2,2+i*4,3,'#5c656c');r(6,14,23,17,'#9d4843');r(7,14,20,15,'#df775c');for(let i=9;i<27;i+=4)r(i,15,1,14,'#f59973');r(5,14,25,2,'#ffecbc');r(12,20,11,11,'#ffe8b4');r(14,21,7,10,'#975645');r(17,21,1,10,'#ffdb9e');r(14,23,7,1,'#ffdb9e');r(15,12,6,6,'#ffecbc');r(16,13,4,4,'#6aa7b5');
        } else if(kind==='cookie') {
          round(4,4,24,24,'#986334');round(5,4,22,21,'#e6ac57');r(8,6,16,13,'#f9ce7b');r(9,7,9,2,'#ffe6a3');for(const [x,y] of [[10,11],[21,10],[17,18],[8,21]]){r(x,y,3,3,'#8f5a41');r(x,y,2,1,'#bc8650');}
        }

        if(kind.startsWith('fish')){
          const p=kind==='fishgold'?['#a16036','#f6bb4e','#ffe690']:kind==='fishpink'?['#975270','#ed92aa','#ffc4bd']:['#426d8d','#74b9cf','#b5e6db'];
          r(1,9,4,14,p[0]);r(5,12,4,8,p[0]);round(8,7,22,19,p[0]);round(9,8,20,16,p[1]);r(13,8,11,5,p[2]);r(17,4,7,4,p[1]);r(15,25,8,3,p[1]);r(2,11,3,10,p[1]);r(12,16,5,7,p[2]);r(23,11,5,7,'#fff9df');r(25,12,3,5,'#394b55');r(25,12,1,1,'#fff');r(25,21,4,2,'#ec8d84');r(29,18,3,2,p[0]);r(18,15,2,3,p[0]);
        }
        if(kind==='lantern'||kind==='lampoff'){
          const on=kind==='lantern';r(11,1,10,2,'#617965');r(9,3,3,6,'#617965');r(20,3,3,6,'#617965');r(7,8,18,3,'#567862');r(5,11,22,15,'#567862');r(7,12,18,12,on?'#f9d67d':'#a3c2ba');r(9,13,3,7,on?'#fff4b9':'#c8ddd1');r(14,15,7,7,on?'#edae45':'#769f91');r(16,13,3,3,on?'#fff9d1':'#c8ddd1');r(7,26,18,3,'#567862');r(8,29,16,2,'#829d71');
        }
        if(kind==='yarn'){
          round(4,7,24,22,'#9e6676');round(5,7,22,20,'#d894a1');for(let k=0;k<5;k++){r(7+k*3,9,2,16,'#efbec0');r(6,10+k*3,20,1,'#c77f90')}r(22,25,2,5,'#9e6676');r(23,28,7,2,'#9e6676');r(11,2,2,9,'#917c60');r(9,2,6,2,'#d4b68b');
        }
        if(kind==='jar'){
          r(8,3,16,4,'#9b7664');r(8,3,16,2,'#e5c59b');r(6,8,20,21,'#7b9e98');r(7,8,18,19,'#cce5d6');r(9,10,3,13,'#fff7de');r(12,16,9,9,'#e4a17e');r(14,14,6,9,'#f9c690');r(14,16,2,2,'#fff0c2');r(8,27,16,2,'#a7c7b5');
        }
        return a;
      }
      function pxSprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pxRects(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}


      const board = document.getElementById('board')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')
      const levelEl = document.getElementById('level')
      const movesEl = document.getElementById('moves')
      const bestEl = document.getElementById('best')

      const N = 5
      let cells = []
      let state = []
      let level = 1, moves = 0, done = 0
      let score = 0, running = false, over = false
      let cur = 12
      let best = Number(localStorage.getItem('lightsout-best') || 0)
      if (best) bestEl.textContent = best

      function buildCells() {
        for (let i = 0; i < N * N; i++) {
          const c = document.createElement('button')
          c.className = 'cell'
          c.dataset.i = i
          board.insertBefore(c, overlay)
          cells.push(c)
        }
      }

      function paint() {
        for (let i = 0; i < N * N; i++) {
          cells[i].innerHTML = pxSprite(state[i] ? 'lantern' : 'lampoff')
          cells[i].setAttribute('aria-label','灯 '+(i+1)+(state[i] ? '，亮' : '，灭'))
          cells[i].classList.toggle('lit', !!state[i])
          cells[i].classList.toggle('cur', running && i === cur)
        }
      }

      function toggleCross(i) {
        const r = (i / N) | 0, c = i % N
        const list = [[r, c], [r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]
        for (const [rr, cc] of list) {
          if (rr < 0 || rr >= N || cc < 0 || cc >= N) continue
          state[rr * N + cc] = !state[rr * N + cc]
        }
      }

      function genLevel() {
        state = new Array(N * N).fill(false)
        const pool = []
        for (let i = 0; i < N * N; i++) pool.push(i)
        for (let i = pool.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0
          const t = pool[i]; pool[i] = pool[j]; pool[j] = t
        }
        const k = 6 + level
        for (let n = 0; n < k; n++) toggleCross(pool[n])
        paint()
      }

      function click(i) {
        if (!running || over) return
        cur = i
        toggleCross(i)
        moves++; movesEl.textContent = moves
        paint()
        if (state.every((v) => !v)) levelDone()
      }

      function levelDone() {
        running = false
        done = level
        score = done * 100
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('lightsout-best', best) }
        if (level >= 5) {
          over = true
          overlay.querySelector('h1').textContent = '🎉 全部通关'
          overlay.querySelector('p').innerHTML =
            '5 关全部熄灭！总步数 <b style="color:#ffd23f">' + moves + '</b><br/>' +
            '得分 <b style="color:#ffd23f">' + score + '</b> · 最佳 ' + best
          ovBtn.textContent = '再来一局'
        } else {
          overlay.querySelector('h1').textContent = '✨ 第 ' + level + ' 关通过'
          overlay.querySelector('p').innerHTML =
            '已通过 <b style="color:#ffd23f">' + done + '</b> 关 · 当前得分 <b style="color:#ffd23f">' + score + '</b><br/>下一关灯光更多，加油！'
          ovBtn.textContent = '下一关'
        }
        overlay.classList.remove('hidden')
      }

      function start() {
        if (over || done === 0) { level = 1; moves = 0; done = 0; score = 0; movesEl.textContent = 0 }
        else { level = done + 1 }
        over = false
        levelEl.textContent = level + '/5'
        genLevel()
        cur = 12
        running = true
        paint()
        overlay.classList.add('hidden')
      }

      board.addEventListener('pointerdown', (e) => {
        const c = e.target.closest('.cell')
        if (c) click(Number(c.dataset.i))
      })

      window.addEventListener('keydown', (e) => {
        if (!running || over) {
          if ((e.code === 'Space' || e.code === 'Enter') && !overlay.classList.contains('hidden')) { e.preventDefault(); start() }
          return
        }
        const r = (cur / N) | 0, c = cur % N
        if (e.code === 'ArrowUp' && r > 0) { cur -= N; e.preventDefault() }
        if (e.code === 'ArrowDown' && r < N - 1) { cur += N; e.preventDefault() }
        if (e.code === 'ArrowLeft' && c > 0) { cur -= 1; e.preventDefault() }
        if (e.code === 'ArrowRight' && c < N - 1) { cur += 1; e.preventDefault() }
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); click(cur); return }
        paint()
      })
      ovBtn.addEventListener('click', start)

      buildCells()
      state = new Array(N * N).fill(false)
      paint()

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running || over },
      }
    })()
  </script>
