        }
        if(kind==='jar'){
          r(8,3,16,4,'#9b7664');r(8,3,16,2,'#e5c59b');r(6,8,20,21,'#7b9e98');r(7,8,18,19,'#cce5d6');r(9,10,3,13,'#fff7de');r(12,16,9,9,'#e4a17e');r(14,14,6,9,'#f9c690');r(14,16,2,2,'#fff0c2');r(8,27,16,2,'#a7c7b5');
        }
        return a;
      }
      function pxSprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pxRects(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function pxPaint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pxRects(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}


      const cv = document.getElementById('cv')
      const ctx = cv.getContext('2d')
      const W = cv.width, H = cv.height
      const CELL = 40, COLS = 10
      const scoreEl = document.getElementById('score')
      const lvEl = document.getElementById('lv')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')
      const CARS = ['🚗', '🚙', '🚕', '🚌', '🚚']

      let rows, roadRun, prow, pcol, hopT, maxRow, camY, frame, running, over
      let best = Number(localStorage.getItem('crossy-best') || 0)
      bestEl.textContent = best

      function genRow(r) {
        if (r < 1) return { type: 'grass', trees: [] }
        let road
        if (roadRun > 0) { road = true; roadRun-- }
        else {
          road = Math.random() < Math.min(0.72, 0.42 + r * 0.004)
          if (road) roadRun = (Math.random() * 2) | 0
        }
        if (!road) {
          const trees = []
          if (r > 2 && Math.random() < 0.5) {
            const n = 1 + ((Math.random() * 3) | 0)
            for (let i = 0; i < n; i++) trees.push((Math.random() * COLS) | 0)
          }
          return { type: 'grass', trees: trees }
        }
        const dir = Math.random() < 0.5 ? 1 : -1
        const speed = Math.min(3.4, (1.1 + Math.random() * 1.2) * (1 + r * 0.008))
        const spacing = 150 + Math.random() * 170
        const n = Math.ceil((W + 200) / spacing)
        const w = n * spacing
        const off = Math.random() * spacing
        const cars = []
        for (let i = 0; i < n; i++) {
          cars.push({ x: -100 + off + i * spacing, len: Math.random() < 0.35 ? 78 : 48, e: CARS[(Math.random() * CARS.length) | 0] })
        }
        return { type: 'road', dir: dir, speed: speed, cars: cars, w: w }
      }

      function getRow(r) {
        if (!rows[r]) rows[r] = genRow(r)
        return rows[r]
      }

      function start() {
        rows = []; roadRun = 0
        prow = 0; pcol = 4; hopT = 0; maxRow = 0; camY = 0; frame = 0
        running = true; over = false
        scoreEl.textContent = '0'
        lvEl.textContent = 'Lv1'
        overlay.classList.add('hidden')
      }

      function end() {
        running = false; over = true
        if (maxRow > best) { best = maxRow; bestEl.textContent = best; localStorage.setItem('crossy-best', best) }
        overlay.querySelector('h1').textContent = '💥 游戏结束'
        overlay.querySelector('p').innerHTML = '小鸡前进了 <b style="color:#ffd23f">' + maxRow + '</b> 行 · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function tryMove(dr, dc) {
        if (!running || over) return
        const nr = prow + dr, nc = pcol + dc
        if (nc < 0 || nc >= COLS || nr < 0) return
        if (nr < maxRow - 9) return
        const row = getRow(nr)
        if (row.trees && row.trees.indexOf(nc) >= 0) return
        prow = nr; pcol = nc; hopT = 10
        if (prow > maxRow) {
          maxRow = prow
          scoreEl.textContent = String(maxRow)
          lvEl.textContent = 'Lv' + (1 + ((maxRow / 12) | 0))
        }
      }

      function rowRange() {
        const rLo = Math.ceil((380 - camY - H - CELL) / CELL)
        const rHi = Math.floor((380 - camY + CELL) / CELL)
        return [rLo, rHi]
      }

      function step() {
        frame++
        if (hopT > 0) hopT--
        const target = -prow * CELL
        camY += (target - camY) * 0.12
        const range = rowRange()
        for (let r = range[0]; r <= range[1]; r++) {
          const row = getRow(r)
          if (row.type !== 'road') continue
          for (const c of row.cars) {
            c.x += row.dir * row.speed
            if (c.x > row.w - 100) c.x -= row.w
            if (c.x < -100) c.x += row.w
          }
          if (r === prow && !over) {
            const pxl = pcol * CELL + 6, pxr = pcol * CELL + 34
            for (const c of row.cars) {
              if (c.x + 6 < pxr && c.x + c.len - 6 > pxl) return end()
            }
          }
        }
      }

      function sy(r) { return -r * CELL - camY + 380 }

      function draw() {
        ctx.fillStyle='#a4c27d';ctx.fillRect(0,0,W,H);const range=rowRange();
        for(let r=range[0];r<=range[1];r++){
          const row=getRow(r),y=Math.floor(sy(r));
          if(row.type==='grass'){ctx.fillStyle=r%2?'#a9c981':'#b7d48f';ctx.fillRect(0,y,W,CELL);ctx.fillStyle='#cde5a1';ctx.fillRect(0,y,W,3);for(let x=8;x<W;x+=70){ctx.fillStyle='#8bb36c';ctx.fillRect(x,y+18,3,6);ctx.fillRect(x+4,y+16,2,7)}for(const t of row.trees)pxPaint('hedge',t*CELL,y,40);if(r%3===0)pxPaint('flower',18,y+8,24)}
          else{ctx.fillStyle='#829598';ctx.fillRect(0,y,W,CELL);ctx.fillStyle='#b0bcab';ctx.fillRect(0,y,W,3);ctx.fillStyle='#e6dec0';for(let x=8;x<W;x+=44)ctx.fillRect(x,y+19,20,2);
            for(const car of row.cars){const x=Math.floor(car.x),len=car.len;const color=car.e==='🚕'?'#e5b85b':car.e==='🚙'?'#85b4b0':car.e==='🚌'?'#cd9fb3':'#df9580';ctx.fillStyle='#53605d';ctx.fillRect(x+5,y+7,len-10,28);ctx.fillStyle=color;ctx.fillRect(x+3,y+10,len-6,22);ctx.fillStyle='#fff1ba';ctx.fillRect(row.dir>0?x+len-6:x+3,y+13,3,4);ctx.fillRect(row.dir>0?x+len-6:x+3,y+25,3,4);ctx.fillStyle='#d5e5dc';ctx.fillRect(x+len*.3,y+12,len*.35,16);ctx.fillStyle='#6c9fa7';ctx.fillRect(x+len*.34,y+14,len*.27,12);ctx.fillStyle='#4f6666';ctx.fillRect(x+8,y+7,8,3);ctx.fillRect(x+len-17,y+7,8,3);ctx.fillRect(x+8,y+32,8,3);ctx.fillRect(x+len-17,y+32,8,3)}
          }
        }
        const x=pcol*CELL+20,y=sy(prow),hop=hopT>0?Math.sin((10-hopT)/10*Math.PI)*6:0;ctx.fillStyle='#6c8c5c55';ctx.fillRect(x-12,y+28,24,6);pxPaint('chick',x-19,y+1-hop,38);
      }

      function pos(e) {
        const r = cv.getBoundingClientRect()
        return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }
      }
      let sx0, syP, swiping
      cv.addEventListener('pointerdown', (e) => {
        if (!running || over) return
        cv.setPointerCapture(e.pointerId)
        const p = pos(e)
        sx0 = p.x; syP = p.y; swiping = true
      })
      cv.addEventListener('pointerup', (e) => {
        if (!swiping) return
        swiping = false
        const p = pos(e)
        const dx = p.x - sx0, dy = p.y - syP
        if (Math.abs(dx) < 14 && Math.abs(dy) < 14) { tryMove(1, 0); return }
        if (Math.abs(dy) > Math.abs(dx)) {
          if (dy < 0) tryMove(1, 0); else tryMove(-1, 0)
        } else {
          if (dx < 0) tryMove(0, -1); else tryMove(0, 1)
        }
      })
      window.addEventListener('keydown', (e) => {
        if (!running || over) {
          if ((e.code === 'Space' || e.code === 'Enter') && !overlay.classList.contains('hidden')) start()
          return
        }
        if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); tryMove(1, 0) }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); tryMove(-1, 0) }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') {e.preventDefault();tryMove(0, -1)}
        if (e.code === 'ArrowRight' || e.code === 'KeyD') {e.preventDefault();tryMove(0, 1)}
      })
      ovBtn.addEventListener('click', start)

      let frameTime=0, frameDebt=0
      function loop(t=0) {
        requestAnimationFrame(loop)
        frameDebt+=Math.min(50,t-frameTime);frameTime=t
        while(frameDebt>=1000/60){if(running&&!over)step();frameDebt-=1000/60}
        draw()
      }

      rows = []; roadRun = 0
      prow = 0; pcol = 4; hopT = 0; maxRow = 0; camY = 0; frame = 0
      running = false; over = false

      window.__hub = {
        get score() { return maxRow },
        get over() { return over },
        get started() { return running || over },
      }
      loop()
    })()
  </script>
</body>
