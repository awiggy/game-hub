<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国旗问答</title><style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #flag { font-size:86px; line-height:1.2; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.4)); }
    #timer { width:100%; height:10px; background:#14161f; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; }
    #tfill { height:100%; width:100%; background:var(--yellow); }
    #opts { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    #opts button {
      font-family:inherit; font-size:16px; font-weight:900; padding:16px 8px;
      color:#eef1f6; background:#1a1d29; border:2px solid #2a3350; border-radius:10px; cursor:pointer;
    }
    #opts button.ok { background:#22b573; border-color:#fff; }
    #opts button.bad { background:#ff4d5e; border-color:#fff; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }

:root{color-scheme:light;--blue:#5a9678;--yellow:#d88544;--ink:#345647;--muted:#7a8b6c;--paper:#fffbed;--edge:#598367;--floor:#edf2da}
*{box-sizing:border-box}html,body{height:auto;min-height:100%}body{margin:0;min-height:100svh;overflow:auto;display:grid;place-items:center;background:radial-gradient(ellipse at 12% 10%,#fff4d6,transparent 70%),var(--floor);color:var(--ink);font-family:system-ui,-apple-system,'PingFang SC',sans-serif;touch-action:manipulation}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #e98458;outline-offset:2px}.shell{width:min(850px,calc(100% - 28px));padding:12px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.top small,.side small{font:9px ui-monospace,monospace;letter-spacing:2px;color:var(--muted)}.top h1{font-size:22px;letter-spacing:2px;margin:3px 0 0}.tag{font-size:10px;padding:7px 10px;border:1px solid #c6d5b4;background:var(--paper);white-space:nowrap}.layout{display:flex;align-items:center;justify-content:center;gap:26px}#wrap{position:relative;width:min(440px,calc(100% - 196px));max-width:none;gap:10px;flex:none}#hud{position:static;width:100%;display:flex;gap:5px;justify-content:space-between;font-size:10px;color:var(--muted);margin:0 0 9px}#hud>span{flex:1;white-space:nowrap;padding:6px;background:var(--paper);border:1px solid #c6d5b4;box-shadow:0 2px 0 #d7dfbc}#hud b{font:700 16px ui-monospace,monospace;color:#b76c40;margin-left:4px}canvas{display:block;width:100%;height:auto;max-width:100%;max-height:none;image-rendering:pixelated;border:4px solid var(--edge);border-radius:0;background:#aadae1;box-shadow:0 5px 0 #365a43;touch-action:none}.side{width:170px;flex:none}.side svg{width:100%;height:110px;image-rendering:pixelated}.side h2{font-size:24px;line-height:1.5;margin:10px 0}.side p{font-size:12px;line-height:1.9;color:var(--muted);margin:8px 0}.side .tips{padding-top:12px;margin-top:18px;border-top:1px solid #cad6b7;font-size:11px}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:9px;color:var(--muted)}#msg{color:#69816b;font-size:12px;font-weight:500;text-align:center}#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:#eaf1d6dc;border-radius:0;gap:0}#overlay.hidden{display:none}.intro-card{width:min(360px,100%);padding:20px;text-align:center;border:3px solid var(--edge);background:var(--paper);box-shadow:6px 6px 0 #31523e30}.intro-card svg{display:block;width:140px;height:86px;margin:0 auto 6px;image-rendering:pixelated}#overlay h1{font-size:24px;letter-spacing:2px;text-shadow:none;margin:8px 0}#overlay p{font-size:12px;line-height:1.9;color:#778467;margin:0 0 17px}#overlay b{color:#ce7646}#overlay button{background:#e98255;color:#fffbed;border:2px solid #a55d3c;border-radius:0;box-shadow:0 4px 0 #a65c3b;font-weight:800;font-size:15px;padding:10px 24px}.act,#opts button,#nums button,#keys button{border-radius:0;box-shadow:0 3px 0 #b5bd94}.act:active,#opts button:active,#nums button:active,#keys button:active{transform:translateY(2px)}
@media(max-width:620px){.shell{width:calc(100% - 24px);padding:10px 0}.top{margin-bottom:9px}.top h1{font-size:18px}.top small{font-size:8px;letter-spacing:1px}.tag{font-size:9px;padding:5px 7px}.layout{display:block}.side{display:none}#wrap{margin:auto;width:min(100%,400px)}#hud{gap:4px}#hud>span{padding:5px 4px}#hud b{font-size:14px;margin-left:3px}.foot{font-size:8px;gap:8px;margin-top:12px}.foot span:last-child{display:none}#overlay h1{font-size:21px}.intro-card{padding:14px}.intro-card svg{height:66px}#overlay p{font-size:11px}}
@media(max-height:480px){.side svg{height:55px}.side h2{font-size:20px}.side .tips{display:none}.intro-card{padding:12px 16px}.intro-card svg{height:48px}#overlay h1{font-size:21px;margin:6px 0}#overlay p{font-size:11px;margin-bottom:12px}#overlay button{padding:8px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#wrap{padding:14px;background:#fffbed;border:2px solid #a3bca0}#flag{width:100%;font-size:74px;text-align:center;background:linear-gradient(transparent 76%,#a9c897 76%),#c6e5e7;border:3px solid #91b5a3;padding:10px;filter:none;position:relative}#timer{background:#dde6c9;border:2px solid #a8b896;border-radius:0}#tfill{background:#edbf67}#opts{gap:8px}#opts button{padding:12px 5px;border:2px solid #b9bf98;background:#eeedca;color:#5e7456;font-size:14px}#opts button:nth-child(2n){background:#e2efcf}#opts button.ok{background:#7fb190;color:#fffbed;border-color:#577b58}#opts button.bad{background:#edb49a;color:#815241;border-color:#be8d6a}@media(max-height:480px){#flag{font-size:55px;padding:6px}#opts button{padding:10px 4px;font-size:12px}#wrap{padding:10px;gap:9px}}body{grid-template-columns:100%;justify-content:stretch}
@media(max-height:480px){.side p.tips{display:none}.side svg{height:48px}.side h2{font-size:18px}}
@media(max-height:430px){.shell{padding:8px 0}.top{margin-bottom:8px}.top h1{font-size:18px}.foot{margin-top:8px;font-size:8px}.side .tips{display:none}}</style></head><body><main class="shell"><header class="top"><div><small>POSTCARD TRIP</small><h1>国旗问答</h1></div><span class="tag">国旗旅行社</span></header><div class="layout">
  <div id="wrap">
    <div id="hud">
      <span>得分<b id="score">0</b></span>
      <span>第<b id="round">1/10</b>题</span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="flag">🌍</div>
    <div id="timer"><div id="tfill"></div></div>
    <div id="opts"></div>
  </div>

  <aside class="side"><svg viewBox="0 0 120 80" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 65h120v15H0z" fill="#91b967"/><path d="M0 65h120v4H0z" fill="#cbe49c"/><path d="M36 10v55" stroke="#91724e" stroke-width="5"/><path d="M39 14h49v30H39z" fill="#fff0c7"/><path d="M39 14h49v10H39z" fill="#ee9773"/><path d="M39 34h49v10H39z" fill="#81bba1"/><path d="M60 26h7v7h-7z" fill="#e9bd53"/><path d="M10 56h4v12h-4zM6 60h12v4H6zM105 54h4v12h-4zM101 58h12v4h-12z" fill="#fffbed"/><path d="M10 60h4v4h-4zM105 58h4v4h-4z" fill="#efc55b"/></svg><small>A LITTLE PIXEL BREAK.</small><h2>国旗旅行社</h2><p>认一面国旗，去一个新地方。</p><p class="tips">四选一 · 每题 6 秒，共 10 题</p></aside></div><footer class="foot"><span>四选一 · 每题 6 秒，共 10 题</span><span>慢慢玩，也很好。</span></footer></main><div id="overlay"><section class="intro-card"><svg viewBox="0 0 120 80" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 65h120v15H0z" fill="#91b967"/><path d="M0 65h120v4H0z" fill="#cbe49c"/><path d="M36 10v55" stroke="#91724e" stroke-width="5"/><path d="M39 14h49v30H39z" fill="#fff0c7"/><path d="M39 14h49v10H39z" fill="#ee9773"/><path d="M39 34h49v10H39z" fill="#81bba1"/><path d="M60 26h7v7h-7z" fill="#e9bd53"/><path d="M10 56h4v12h-4zM6 60h12v4H6zM105 54h4v12h-4zM101 58h12v4h-12z" fill="#fffbed"/><path d="M10 60h4v4h-4zM105 58h4v4h-4z" fill="#efc55b"/></svg>
    <h1>国旗问答</h1>
    <p>看国旗从四个选项中猜国家<br/>答得越快分越高，答错显示答案后继续<br/>共 10 题</p>
    <button id="ov-btn">开始挑战</button>
  </section></div><script>
    (() => {
      const FLAGS = [
        ['🇨🇳', '中国'], ['🇯🇵', '日本'], ['🇰🇷', '韩国'], ['🇺🇸', '美国'], ['🇬🇧', '英国'],
        ['🇫🇷', '法国'], ['🇩🇪', '德国'], ['🇮🇹', '意大利'], ['🇧🇷', '巴西'], ['🇦🇷', '阿根廷'],
        ['🇨🇦', '加拿大'], ['🇦🇺', '澳大利亚'], ['🇮🇳', '印度'], ['🇷🇺', '俄罗斯'], ['🇪🇸', '西班牙'],
        ['🇳🇱', '荷兰'], ['🇸🇪', '瑞典'], ['🇨🇭', '瑞士'], ['🇲🇽', '墨西哥'], ['🇪🇬', '埃及'],
        ['🇿🇦', '南非'], ['🇹🇭', '泰国'], ['🇻🇳', '越南'], ['🇸🇬', '新加坡'], ['🇳🇿', '新西兰'],
      ]
      const flagEl = document.getElementById('flag')
      const tfill = document.getElementById('tfill')
      const optsEl = document.getElementById('opts')
      const scoreEl = document.getElementById('score')
      const roundEl = document.getElementById('round')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let quiz, round, score, timeLeft, limit, running, over, lock, timer
      let best=0;try{best=Number(localStorage.getItem('flagquiz-best'))||0}catch{}
      bestEl.textContent = best

      function newRound() {
        round++
        roundEl.textContent = round + '/10'
        // 出题：1 正确 + 3 干扰
        const pool = [...FLAGS].sort(() => Math.random() - 0.5)
        const answer = pool[0]
        const opts = [answer[1]]
        for (const [, name] of pool.slice(1)) {
          if (opts.length >= 4) break
          if (!opts.includes(name)) opts.push(name)
        }
        opts.sort(() => Math.random() - 0.5)
        limit = 6000; timeLeft = limit; tfill.style.width='100%'
        lock = false
        flagEl.textContent = answer[0]
        optsEl.innerHTML = ''
        opts.forEach((name) => {
          const b = document.createElement('button')
          b.textContent = name
          b.onclick = () => pick(name, b, answer[1])
          optsEl.appendChild(b)
        })
      }

      function start() {
        score = 0; round = 0
        running = true; over = false
        scoreEl.textContent = 0
        overlay.classList.add('hidden')
        clearInterval(timer)
        timer = setInterval(() => {
          if (!running || over || lock) return
          timeLeft -= 100
          tfill.style.width = Math.max(0, timeLeft / limit * 100) + '%'
          if (timeLeft <= 0) {
            lock = true
            setTimeout(() => {
              if (round >= 10) end()
              else { newRound() }
            }, 500)
          }
        }, 100)
        newRound()
      }

      function end() {
        running = false; over = true
        clearInterval(timer)
        if (score > best) { best = score; bestEl.textContent = best; (()=>{try{localStorage.setItem('flagquiz-best',best)}catch{}})() }
        overlay.querySelector('h1').textContent = '🌏 挑战结束'
        overlay.querySelector('p').innerHTML = '得分 <b >' + score + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function pick(name, b, correct) {
        if (!running || over || lock) return
        lock = true
        if (name === correct) {
          b.classList.add('ok')
          const gain = 50 + Math.round(timeLeft / limit * 50)
          score += gain
          scoreEl.textContent = score
        } else {
          b.classList.add('bad')
          timeLeft = Math.max(500, timeLeft - 3000)
          optsEl.querySelectorAll('button').forEach((x) => {
            if (x.textContent === correct) x.classList.add('ok')
          })
        }
        setTimeout(() => {
          if (round >= 10) end()
          else newRound()
        }, name === correct ? 500 : 1100)
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return score },
        get over() { return over },
        get started() { return running || over },
      }

      quiz = []; round = 0; score = 0; timeLeft = 6000; limit = 6000
      running = false; over = false; lock = false
    })()
  </script></body></html>
