<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>经典扫雷</title>
  <style>
    :root { --blue: #2f55e4; --yellow: #ffd23f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1118; color: #eef1f6;
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; touch-action: manipulation; overflow: hidden;
    }
    #bar {
      width: min(92vw, 342px);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 700; color: #8b93a7; letter-spacing: 1px;
    }
    #bar b { color: var(--yellow); font-size: 16px; margin-left: 4px; }
    #bar .btns { display: flex; gap: 6px; }
    #bar button {
      font-family: inherit; font-size: 12px; font-weight: 700;
      color: #eef1f6; background: #1a1d29; border: 2px solid #2a2e3d;
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
    #bar button.on { background: var(--blue); border-color: #fff; }
    #board {
      display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px;
      width: min(92vw, 342px); aspect-ratio: 1;
      background: #1a1d29; border: 3px solid #2a2e3d; border-radius: 12px; padding: 8px;
    }
    .cell {
      display: grid; place-items: center;
      background: #2a3350; border: 0; border-radius: 6px;
      font-family: inherit; font-size: 15px; font-weight: 900; cursor: pointer;
    }
    .cell:active { background: #3a4a7a; }
    .cell.revealed { background: #14161f; cursor: default; }
    .cell.flagged { background: #2a3350; }
    .cell.mine { background: #ff4d5e; }
    #overlay {
      position: fixed; inset: 0; background: rgba(15, 17, 24, 0.88);
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 26px; letter-spacing: 4px; text-shadow: 3px 3px 0 var(--blue); }
    #overlay p { color: #8b93a7; font-size: 13px; line-height: 1.9; }
    #overlay button {
      background: var(--blue); color: #fff; font-family: inherit;
      border: 2px solid #fff; box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      font-size: 16px; font-weight: 700; padding: 10px 32px; border-radius: 8px; cursor: pointer;
    }

    /* Crafted pixel edition: the playable pieces, not just the surrounding UI. */
    :root{--ink:#48533d;--accent:#4e854d;--paper:#fff9e7;--edge:#6f9250;--page:#edf2d9}
    body{background:var(--page);color:var(--ink);background-image:radial-gradient(#ffffff70 1px,transparent 1px);background-size:12px 12px;overflow:auto;min-height:100%;height:auto;padding:24px 12px;gap:10px}
    body::before{content:'';position:fixed;inset:0;box-shadow:inset 0 0 100px #ffffff70;pointer-events:none;z-index:-1}
    button{font-family:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid #d26c48;outline-offset:3px}
    #wrap{flex-shrink:0;max-width:100%}
    #hud,#bar{position:static;color:var(--ink);letter-spacing:0;font-size:11px;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 4px}
    #hud b,#bar b{color:var(--accent);font-size:17px}canvas{image-rendering:pixelated;border:4px solid var(--edge);border-radius:8px;box-shadow:0 5px 0 color-mix(in srgb,var(--edge),transparent 55%);background:var(--paper);max-width:100%;object-fit:contain}
    #overlay{z-index:20;background:color-mix(in srgb,var(--paper) 96%,transparent);color:var(--ink);border-radius:12px;gap:12px;padding:22px}
    #overlay::before{content:'';width:90px;height:90px;background:var(--mascot) center/contain no-repeat;image-rendering:pixelated}
    #overlay h1,#overlay h2{font-size:25px;letter-spacing:1px;text-shadow:none;color:var(--ink)}
    #overlay p{color:var(--ink);font-size:13px;line-height:1.9;max-width:340px}#overlay p b{color:var(--accent)!important}
    #overlay button,#new-game,#bar button,#pads button,.up,.garden-controls button{background:var(--accent);color:#fffaf0;border:2px solid var(--ink);box-shadow:0 3px 0 #0002;border-radius:7px;font-weight:800;cursor:pointer}
    #overlay button:hover{filter:brightness(1.1)}#overlay.hidden{display:none}
    .pixel-sprite{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
    .scene-title{width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:5px}
    .scene-title strong{font-size:23px;letter-spacing:1px;display:block}.scene-title small{display:block;font-size:11px;line-height:1.8;letter-spacing:1px;color:var(--accent)}
    .scene-title svg{width:54px;height:54px;flex-shrink:0}.play-note{font-size:11px;text-align:center;color:var(--ink);line-height:1.7;margin-top:9px}
    .landscape{height:92px;position:relative;overflow:hidden;border-radius:10px 10px 0 0;background:linear-gradient(#a9dfdf 0 63%,#b7d878 63% 71%,#82b65e 71%);border:3px solid var(--edge);border-bottom:0}
    .landscape::before{content:'';position:absolute;left:15%;top:18px;width:40px;height:8px;background:#fffcec;box-shadow:8px -6px #fffcec,170px 5px #fffcec,178px -1px #fffcec}
    .landscape svg{position:absolute;bottom:0;width:76px;height:76px}.landscape svg:nth-child(2){left:2%;width:52px;height:52px}.landscape svg:nth-child(3){right:4%;width:44px;height:44px}.landscape svg:nth-child(4){right:15%;width:32px;height:32px}
    @media(max-width:480px){body{padding:14px 10px}.scene-title strong{font-size:20px}#hud b,#bar b{font-size:15px}.landscape{height:74px}.scene-title svg{width:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--page:#edf1cf;--ink:#536748;--accent:#659b52;--edge:#769858;--paper:#fff9df;--mascot:url("data:image/svg+xml,%3Csvg%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2032%2032%22%20class%3D%22pixel-sprite%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%2215%22%20y%3D%2213%22%20width%3D%223%22%20height%3D%2217%22%20fill%3D%22%233c8b58%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2220%22%20width%3D%228%22%20height%3D%224%22%20fill%3D%22%2382be5f%22%2F%3E%3Crect%20x%3D%2218%22%20y%3D%2223%22%20width%3D%228%22%20height%3D%224%22%20fill%3D%22%2358a657%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%222%22%20width%3D%226%22%20height%3D%2220%22%20fill%3D%22%23e5bc88%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%225%22%20width%3D%2212%22%20height%3D%2214%22%20fill%3D%22%23e5bc88%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%227%22%20width%3D%2216%22%20height%3D%2210%22%20fill%3D%22%23e5bc88%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%2210%22%20width%3D%2222%22%20height%3D%224%22%20fill%3D%22%23e5bc88%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%222%22%20width%3D%224%22%20height%3D%2218%22%20fill%3D%22%23fffbea%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%225%22%20width%3D%2210%22%20height%3D%2212%22%20fill%3D%22%23fffbea%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%228%22%20width%3D%2216%22%20height%3D%228%22%20fill%3D%22%23fffbea%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%2211%22%20width%3D%2222%22%20height%3D%222%22%20fill%3D%22%23fffbea%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%228%22%20width%3D%229%22%20height%3D%228%22%20fill%3D%22%23e9a82d%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%228%22%20width%3D%226%22%20height%3D%225%22%20fill%3D%22%23ffd95c%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%229%22%20width%3D%223%22%20height%3D%222%22%20fill%3D%22%23fff5ac%22%2F%3E%3C%2Fsvg%3E")}
.scene-title,#bar{width:min(420px,94vw)}#board{width:min(420px,94vw);padding:11px;gap:3px;border:4px solid #77934f;background:#acb279;border-radius:8px;box-shadow:0 5px #819053}.cell{position:relative;min-width:0;aspect-ratio:1;border-radius:3px;background:#9bc865;box-shadow:inset 2px 2px #c5df85,inset -2px -3px #759b4c;font-size:clamp(15px,4vw,20px);text-shadow:1px 1px #fffa}.cell:not(.revealed):not(.flagged)::after{content:"";position:absolute;width:3px;height:3px;left:8px;top:8px;background:#d1e393;box-shadow:3px 3px #80b45c}.cell.revealed{background:#f2e5b9;box-shadow:inset 1px 1px #c7b78a}.cell.flagged{background:#b6d47c}.cell.mine{background:#efb9a0}.cell svg{width:90%;height:90%}#bar button{background:#fff6dc;color:#596f45;border-color:#9cba77}#bar button.on{background:#cc7855;border-color:#955c43;color:#fff9df}

/* Compact landscape retains readable boards beside their controls. */
@media(min-width:600px) and (max-height:550px){body{padding:12px;gap:8px}.play-note{margin:0}body{display:grid;grid-template-columns:210px auto;grid-template-rows:1fr auto 1fr;gap:8px 24px;align-items:center;justify-content:center;height:100dvh;padding:14px}.scene-title{grid-column:1;align-self:end;width:210px}#bar{grid-column:1;width:210px;justify-content:flex-start;gap:14px}#board{grid-column:2;grid-row:1/4;width:min(360px,calc(100dvh - 32px));height:auto}.play-note{grid-column:1;align-self:start;width:210px}}
@media(max-width:480px){body{padding:12px 10px}.play-note{margin-top:3px;font-size:10px}.scene-title{margin-bottom:0}.scene-title small{letter-spacing:.5px}}
  </style>
</head>
<body>
  <header class="scene-title"><div><small>CLOVER FIELD · 经典扫雷</small><strong>四叶草探险</strong></div><svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="15" y="13" width="3" height="17" fill="#3c8b58"/><rect x="8" y="20" width="8" height="4" fill="#82be5f"/><rect x="18" y="23" width="8" height="4" fill="#58a657"/><rect x="13" y="2" width="6" height="20" fill="#e5bc88"/><rect x="10" y="5" width="12" height="14" fill="#e5bc88"/><rect x="8" y="7" width="16" height="10" fill="#e5bc88"/><rect x="5" y="10" width="22" height="4" fill="#e5bc88"/><rect x="14" y="2" width="4" height="18" fill="#fffbea"/><rect x="11" y="5" width="10" height="12" fill="#fffbea"/><rect x="8" y="8" width="16" height="8" fill="#fffbea"/><rect x="5" y="11" width="22" height="2" fill="#fffbea"/><rect x="12" y="8" width="9" height="8" fill="#e9a82d"/><rect x="13" y="8" width="6" height="5" fill="#ffd95c"/><rect x="14" y="9" width="3" height="2" fill="#fff5ac"/></svg></header>
  <div id="bar">
    <span>💣<b id="mines">10</b></span>
    <span>TIME<b id="time">0s</b></span>
    <span class="btns">
      <button id="flag-btn">🚩 旗标</button>
      <button id="new-btn">重开</button>
    </span>
  </div>
  <div id="board"></div>
  <div id="overlay">
    <h1>经典扫雷</h1>
    <p>9×9 雷区 · 10 颗雷 · 首次点击必安全<br />左键翻开 · 右键/旗标模式插旗</p>
    <button id="ov-btn">开始游戏</button>
  </div>

  <p class="play-note">数字表示周围八格的地雷数 · 右键插旗，手机先点「旗标」再点格子</p>
  <script>
    (() => {

      function pixels(kind) {
        const a=[]; const r=(x,y,w,h,c)=>a.push([x,y,w,h,c]);
        const face=(x,y)=>{r(x,y,2,3,'#332f36');r(x+8,y,2,3,'#332f36');r(x,y,1,1,'#fffdf0');r(x+8,y,1,1,'#fffdf0');r(x-2,y+4,3,2,'#f4998a');r(x+9,y+4,3,2,'#f4998a');r(x+4,y+4,2,1,'#8f4d48');};
        const round=(x,y,w,h,c)=>{r(x+3,y,w-6,h,c);r(x,y+3,w,h-6,c)};
        if(kind==='apple'||kind==='orange'||kind==='berry') {
          const p=kind==='apple'?['#8e3540','#d84b4e','#ff765f','#ffbea0']:kind==='orange'?['#ae5c2c','#ef9c34','#ffc650','#ffed9a']:['#48447d','#6f6fc1','#9d9ce3','#d2d1ff'];
          round(4,9,24,20,p[0]);round(6,10,20,17,p[1]);r(8,11,15,11,p[2]);r(8,13,4,5,p[3]);r(10,11,5,2,p[3]);r(13,6,3,6,'#72533e');r(16,4,9,4,'#3c7949');r(17,4,6,2,'#9bcd55');face(10,19);
        } else if(kind==='carrot'||kind==='sprout') {
          r(14,6,3,11,'#37774b');r(7,5,8,4,'#387d43');r(9,3,6,4,'#84bd50');r(17,4,8,4,'#3c8e46');r(18,2,6,3,'#b0d767');
          if(kind==='carrot'){r(9,13,15,5,'#ad552b');r(10,18,12,5,'#ad552b');r(12,23,8,4,'#ad552b');r(14,27,4,3,'#ad552b');r(10,14,12,4,'#ffb04b');r(11,18,9,5,'#f88132');r(13,23,5,4,'#f88132');r(11,15,3,5,'#ffda75');r(18,19,3,1,'#ba5c32');r(13,24,3,1,'#ba5c32');}
          else {r(5,23,22,4,'#654830');r(8,21,16,3,'#9d6c42');r(14,14,3,8,'#3c8747');}
        } else if(kind==='flower') {
          r(15,13,3,17,'#3c8b58');r(8,20,8,4,'#82be5f');r(18,23,8,4,'#58a657');
          round(10,2,12,20,'#e5bc88');round(5,7,22,10,'#e5bc88');round(11,2,10,18,'#fffbea');round(5,8,22,8,'#fffbea');r(12,8,9,8,'#e9a82d');r(13,8,6,5,'#ffd95c');r(14,9,3,2,'#fff5ac');
        } else if(kind==='mushroom') {
          r(11,16,11,13,'#af784d');r(12,16,9,11,'#ffe6b2');r(12,18,3,6,'#fff6da');r(6,8,21,11,'#9c3d43');r(10,4,13,5,'#9c3d43');r(4,13,25,7,'#9c3d43');r(7,9,19,8,'#e97564');r(10,5,13,9,'#f69b7e');r(5,14,23,3,'#e97564');r(10,8,4,4,'#fff0cf');r(20,12,5,4,'#fff0cf');face(12,22);
        } else if(kind==='mole'||kind==='goldmole'||kind==='bunny') {
          const bunny=kind==='bunny',gold=kind==='goldmole'; const dark=bunny?'#8c7974':gold?'#9c6327':'#704c46'; const base=bunny?'#f9eacb':gold?'#efb648':'#b38360';const light=bunny?'#fffbed':gold?'#ffe08a':'#dbac7a';
          if(bunny){r(8,1,6,12,dark);r(19,0,6,13,dark);r(9,2,4,11,light);r(20,1,4,12,light);r(10,4,2,7,'#e7a09b');r(21,3,2,8,'#e7a09b');}
          else{round(4,5,8,9,dark);round(21,5,8,9,dark);r(6,7,4,5,'#e7a09b');r(23,7,4,5,'#e7a09b');}
          round(4,11,25,20,dark);round(6,11,21,18,base);r(9,10,15,7,light);r(7,14,4,7,light);round(9,21,16,8,bunny?'#fffdf2':'#f8ddb0');face(11,16);r(14,24,6,2,'#8a534b');r(16,24,2,3,'#fff8e4');r(3,26,5,4,light);r(26,26,4,4,light);
        } else if(kind==='chick') {
          r(4,13,6,9,'#9a6129');r(7,8,18,18,'#9a6129');r(11,5,12,4,'#9a6129');r(8,10,17,14,'#ffca42');r(11,7,12,14,'#ffe777');r(12,8,9,6,'#fff2ac');r(6,16,10,7,'#f2a32d');r(6,16,8,3,'#ffda5b');r(19,10,6,8,'#fffbed');r(22,12,3,5,'#3f3831');r(22,12,1,1,'#fff');r(25,17,6,3,'#b9582c');r(25,17,5,1,'#ffad3b');r(19,20,4,2,'#f99059');r(11,26,3,3,'#c87c33');r(20,25,3,3,'#c87c33');r(11,3,3,4,'#c89c38');
        } else if(kind==='grape') {
          r(15,3,3,6,'#72513d');r(18,3,9,4,'#599657');
          for(const [x,y] of [[7,8],[17,8],[5,15],[14,15],[22,15],[10,22],[18,22]]){round(x,y,8,8,'#624274');round(x+1,y,6,6,'#a27bd0');r(x+2,y+1,2,2,'#e4bcf4');}
        } else if(kind==='melon') {
          r(4,9,24,13,'#326d52');r(7,22,18,4,'#326d52');r(11,26,10,3,'#326d52');r(5,9,22,12,'#a6d46c');r(8,21,16,3,'#a6d46c');r(6,9,20,9,'#f9807c');r(9,18,14,3,'#f9807c');r(12,21,8,2,'#f9807c');r(7,10,18,2,'#ffb0a0');for(const [x,y] of [[10,14],[16,12],[21,15],[15,18]])r(x,y,1,2,'#673f48');
        } else if(kind==='flag') {
          r(10,3,3,25,'#695447');r(13,4,14,10,'#9e4b4c');r(13,4,11,7,'#f47768');r(14,5,7,2,'#ffbea2');r(7,27,13,2,'#486a4a');
        } else if(kind==='mine') {
          r(14,2,4,28,'#47606b');r(2,14,28,4,'#47606b');r(6,6,20,20,'#47606b');round(7,7,18,18,'#6e8e97');r(10,9,6,4,'#c1d9cf');face(11,16);
        } else if(kind==='crate') {
          r(2,4,28,26,'#865637');r(4,5,24,22,'#d29b58');r(6,8,20,17,'#b77b46');r(7,9,18,3,'#e8b56b');r(7,16,18,2,'#e8b56b');r(4,5,3,22,'#f3c986');r(25,5,3,22,'#ad713f');r(5,5,22,3,'#ffe0a0');r(5,24,22,3,'#e4b06a');r(6,6,2,2,'#805b3d');r(24,25,2,2,'#805b3d');r(14,13,6,5,'#f1a13f');r(15,18,3,3,'#f1a13f');r(15,10,2,4,'#5f974f');r(17,10,4,2,'#9dc968');
        } else if(kind==='hedge') {
          r(1,5,30,27,'#376e4c');r(2,3,28,25,'#4b9550');r(5,1,22,26,'#75b44f');r(8,2,12,5,'#b9d663');r(4,8,8,5,'#a3ce5a');r(18,5,10,5,'#92c250');r(7,16,12,6,'#8fc352');r(21,16,8,6,'#447e45');r(4,24,11,4,'#467d43');r(21,11,3,3,'#d0e478');r(13,10,3,3,'#c0db69');r(15,25,8,3,'#64a34a');
        } else if(kind==='barn') {
          for(let i=0;i<6;i++)r(15-i*2,2+i*2,2+i*4,3,'#5c656c');r(6,14,23,17,'#9d4843');r(7,14,20,15,'#df775c');for(let i=9;i<27;i+=4)r(i,15,1,14,'#f59973');r(5,14,25,2,'#ffecbc');r(12,20,11,11,'#ffe8b4');r(14,21,7,10,'#975645');r(17,21,1,10,'#ffdb9e');r(14,23,7,1,'#ffdb9e');r(15,12,6,6,'#ffecbc');r(16,13,4,4,'#6aa7b5');
        } else if(kind==='cookie') {
          round(4,4,24,24,'#986334');round(5,4,22,21,'#e6ac57');r(8,6,16,13,'#f9ce7b');r(9,7,9,2,'#ffe6a3');for(const [x,y] of [[10,11],[21,10],[17,18],[8,21]]){r(x,y,3,3,'#8f5a41');r(x,y,2,1,'#bc8650');}
        }
        return a;
      }
      function sprite(kind) {return '<svg aria-hidden="true" viewBox="0 0 32 32" class="pixel-sprite" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">'+pixels(kind).map(([x,y,w,h,c])=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>').join('')+'</svg>';}
      function paint(kind,x,y,size) {const u=size/32;for(const [a,b,w,h,c] of pixels(kind)){ctx.fillStyle=c;ctx.fillRect(Math.round(x+a*u),Math.round(y+b*u),Math.ceil(w*u),Math.ceil(h*u));}}

      const N = 9, MINES = 10
      const boardEl = document.getElementById('board')
      const minesEl = document.getElementById('mines')
      const timeEl = document.getElementById('time')
      const flagBtn = document.getElementById('flag-btn')
      const newBtn = document.getElementById('new-btn')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const NUM_COLORS = ['#5a6545', '#3f7193', '#447b46', '#b25b4b', '#7b5e96', '#9a633b', '#367c7a', '#524c46', '#665847']

      let mines, revealed, flagged, started, over, flagMode, timer, seconds
      let best = Number(localStorage.getItem('minesweeper-best') || 0)

      const neighbors = (i) => {
        const r = (i / N) | 0, c = i % N, out = []
        for (let dr = -1; dr <= 1; dr++)
          for (let dc = -1; dc <= 1; dc++) {
            if (!dr && !dc) continue
            const nr = r + dr, nc = c + dc
            if (nr >= 0 && nr < N && nc >= 0 && nc < N) out.push(nr * N + nc)
          }
        return out
      }

      function startGame() {
        mines = new Set(); revealed = new Set(); flagged = new Set()
        started = false; over = false; seconds = 0; flagMode = false; hitCell = -1
        flagBtn.classList.remove('on'); flagBtn.setAttribute('aria-pressed', 'false')
        clearInterval(timer)
        timeEl.textContent = '0s'
        minesEl.textContent = MINES
        overlay.classList.add('hidden')
        render()
      }

      function placeMines(safe) {
        const banned = new Set([safe, ...neighbors(safe)])
        const pool = Array.from({length:N*N},(_,i)=>i).filter(i=>!banned.has(i))
        for(let n=0;n<MINES;n++){ const at=Math.floor(Math.random()*pool.length); mines.add(pool.splice(at,1)[0]) }
      }

      function countAdj(i) {
        let n = 0
        for (const j of neighbors(i)) if (mines.has(j)) n++
        return n
      }

      function reveal(i) {
        if (over || flagged.has(i) || revealed.has(i)) return
        if (!started) {
          started = true
          placeMines(i)
          timer = setInterval(() => { seconds++; timeEl.textContent = seconds + 's' }, 1000)
        }
        if (mines.has(i)) return lose(i)
        const stack = [i]
        while (stack.length) {
          const cur = stack.pop()
          if (revealed.has(cur) || flagged.has(cur)) continue
          revealed.add(cur)
          if (countAdj(cur) === 0 && !mines.has(cur))
            for (const j of neighbors(cur)) if (!revealed.has(j)) stack.push(j)
        }
        checkWin()
        render()
      }

      function toggleFlag(i) {
        if (over || revealed.has(i)) return
        if (flagged.has(i)) flagged.delete(i)
        else flagged.add(i)
        minesEl.textContent = MINES - flagged.size
        render()
      }

      function lose(hit) {
        over = true
        clearInterval(timer)
        for (const m of mines) revealed.add(m)
        hitCell = hit
        render()
        showOverlay('💥 踩雷了', '用时 ' + seconds + ' 秒，再接再厉')
      }

      function checkWin() {
        if (revealed.size === N * N - MINES) {
          over = true
          clearInterval(timer)
          if (!best || seconds < best) {
            best = seconds
            localStorage.setItem('minesweeper-best', best)
          }
          showOverlay('🏆 排雷成功', '用时 ' + seconds + ' 秒（最佳 ' + best + ' 秒）')
        }
      }

      function showOverlay(title, text) {
        overlay.querySelector('h1').textContent = title
        overlay.querySelector('p').textContent = text
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      let hitCell = -1

      function render() {
        boardEl.innerHTML = ''
        for (let i = 0; i < N * N; i++) {
          const el = document.createElement('button')
          el.className = 'cell'
          if (revealed.has(i)) {
            el.classList.add('revealed')
            if (mines.has(i)) {
              el.classList.add('mine')
              el.innerHTML = sprite('mine')
            } else {
              const n = countAdj(i)
              if (n) {
                el.textContent = n
                el.style.color = NUM_COLORS[n]
              }
            }
          } else if (flagged.has(i)) {
            el.classList.add('flagged')
            el.innerHTML = sprite('flag')
          }
          el.setAttribute('aria-label', '第 ' + (Math.floor(i/N)+1) + ' 行第 ' + (i%N+1) + ' 列，' + (flagged.has(i) ? '已插旗' : revealed.has(i) ? (mines.has(i) ? '地雷' : countAdj(i) + ' 颗相邻地雷') : '未翻开'))
          el.addEventListener('click', () => (flagMode ? toggleFlag(i) : reveal(i)))
          el.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(i) })
          boardEl.appendChild(el)
        }
      }

      flagBtn.addEventListener('click', () => {
        flagMode = !flagMode
        flagBtn.classList.toggle('on', flagMode)
        flagBtn.setAttribute('aria-pressed', String(flagMode))
      })
      newBtn.addEventListener('click', startGame)
      ovBtn.addEventListener('click', startGame)

      window.__hub = {
        get score() { return seconds },
        get over() { return over },
        get started() { return started },
      }

      startGame()
    })()
  </script>
</body>
</html>
