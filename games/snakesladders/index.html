<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>蛇梯棋</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,460px); position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #board { width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(10,1fr);
      grid-template-rows:repeat(10,1fr); gap:2px; background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:6px; }
    .sq { display:grid; place-items:center; font-size:min(2vw,9px); font-weight:700; position:relative;
      background:#14161f; border-radius:3px; color:#5c6474; }
    .sq.lad { color:#22b573; }
    .sq.sna { color:#ff4d5e; }
    #board .token { position:absolute; font-size:14px; transition:all .2s; z-index:2; }
    #die { font-size:44px; font-weight:900; color:var(--yellow); min-height:56px; }
    #msg { font-size:14px; font-weight:900; min-height:20px; }
    #roll { font-family:inherit; font-weight:900; font-size:15px; color:#eef1f6; background:var(--blue);
      border:2px solid #fff; border-radius:10px; padding:12px 40px; cursor:pointer; }
    #roll:disabled { opacity:.4; cursor:not-allowed; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>你(🔵) <b id="p">0</b></span>
      <span>AI(🔴) <b id="a">0</b></span>
      <span>BEST<b id="best">0</b>胜</span>
    </div>
    <div id="board"></div>
    <div id="die">🎲</div>
    <div id="msg">点「掷骰子」开始</div>
    <button id="roll">🎲 掷骰子</button>
  </div>
  <div id="overlay">
    <h1>🐍 蛇梯棋</h1>
    <p>轮流掷骰前进<br/>爬上梯子直达高处，踩到蛇头滑落<br/>你与 AI 先到 100 格者胜</p>
    <button id="ov-btn">开始对局</button>
  </div>
  <script>
    (() => {
      // 梯子：底→顶；蛇：头→尾
      const LADDERS = { 4: 25, 13: 46, 33: 49, 42: 63, 50: 69, 62: 81, 74: 92 }
      const SNAKES = { 27: 5, 40: 3, 43: 18, 54: 31, 66: 45, 76: 58, 89: 53, 99: 41 }
      const boardEl = document.getElementById('board')
      const dieEl = document.getElementById('die')
      const msgEl = document.getElementById('msg')
      const rollBtn = document.getElementById('roll')
      const pEl = document.getElementById('p')
      const aEl = document.getElementById('a')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      let pPos, aPos, turn, wins, running, over
      let best = Number(localStorage.getItem('snakesladders-best') || 0)
      bestEl.textContent = best

      // 棋盘格坐标：1 在左下，蛇形往上
      function cellXY(n) {
        if (n <= 0) n = 1
        const r = Math.floor((n - 1) / 10) // 0 底
        let c = (n - 1) % 10
        if (r % 2 === 1) c = 9 - c
        const rowFromTop = 9 - r
        return { x: c * 10 + 5, y: rowFromTop * 10 + 5 }
      }

      const sqEls = []
      for (let n = 1; n <= 100; n++) {
        const d = document.createElement('div')
        d.className = 'sq' + (LADDERS[n] ? ' lad' : SNAKES[n] ? ' sna' : '')
        d.innerHTML = '<span>' + n + (LADDERS[n] ? '⬆' : SNAKES[n] ? '🐍' : '') + '</span>'
        boardEl.appendChild(d)
        sqEls[n] = d
      }
      const pTok = document.createElement('div')
      pTok.className = 'token'; pTok.textContent = '🔵'
      const aTok = document.createElement('div')
      aTok.className = 'token'; aTok.textContent = '🔴'
      boardEl.appendChild(pTok); boardEl.appendChild(aTok)

      function moveToken(el, pos, offset) {
        const { x, y } = cellXY(pos)
        el.style.left = 'calc(' + x + '% + ' + (offset || 0) + 'px)'
        el.style.top = 'calc(' + y + '% - 8px)'
      }

      function render() {
        pEl.textContent = pPos
        aEl.textContent = aPos
        moveToken(pTok, pPos, -6)
        moveToken(aTok, aPos, 6)
      }

      function start() {
        pPos = 0; aPos = 0; turn = 1
        wins = wins || 0
        running = true; over = false
        rollBtn.disabled = false
        msgEl.textContent = '你的回合，掷骰子！'
        overlay.classList.add('hidden')
        render()
      }

      function end(win) {
        running = false; over = true
        if (win) {
          wins++
          if (wins > best) { best = wins; bestEl.textContent = best; localStorage.setItem('snakesladders-best', best) }
        }
        overlay.querySelector('h1').textContent = win ? '🏆 你先到终点' : '🤖 AI 先到终点'
        overlay.querySelector('p').innerHTML = '胜场 <b style="color:#ffd23f">' + wins + '</b> · 最佳 ' + best
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function step(pos) {
        if (LADDERS[pos]) return { to: LADDERS[pos], t: '🪜 顺梯而上到 ' + LADDERS[pos] }
        if (SNAKES[pos]) return { to: SNAKES[pos], t: '🐍 被蛇咬滑落到 ' + SNAKES[pos] }
        return null
      }

      async function doRoll(who) {
        const v = 1 + ((Math.random() * 6) | 0)
        dieEl.textContent = '🎲' + v
        let pos = who === 1 ? pPos : aPos
        let np = Math.min(100, pos + v)
        if (who === 1) pPos = np; else aPos = np
        render()
        await new Promise((r) => setTimeout(r, 500))
        const s = step(np)
        if (s) {
          if (who === 1) pPos = s.to; else aPos = s.to
          msgEl.textContent = s.t
          render()
          await new Promise((r) => setTimeout(r, 600))
        }
        if (np >= 100) return true
        return false
      }

      async function roll() {
        if (!running || over) return
        rollBtn.disabled = true
        const win = await doRoll(1)
        if (win) return end(true)
        msgEl.textContent = 'AI 回合…'
        await new Promise((r) => setTimeout(r, 600))
        const aiWin = await doRoll(2)
        if (aiWin) return end(false)
        msgEl.textContent = '你的回合，掷骰子！'
        rollBtn.disabled = false
      }

      rollBtn.addEventListener('click', roll)
      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return wins },
        get over() { return over },
        get started() { return running },
      }

      pPos = 0; aPos = 0; turn = 1; wins = 0; running = false; over = false
      render()
    })()
  </script>
</body>
</html>
