<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>记忆路线</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { position:relative; display:flex; flex-direction:column; gap:12px; align-items:center; }
    #hud { width:min(88vw,400px); display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #grid { width:min(88vw,400px); aspect-ratio:1; display:grid; gap:4px;
      background:#1a1d29; border:3px solid #2a2e3d; border-radius:14px; padding:8px; }
    .cell { border-radius:8px; background:#14161f; border:2px solid #2a3350; cursor:pointer; transition:background .1s; }
    .cell.lit { background:var(--yellow); }
    .cell.next { outline:3px solid var(--blue); }
    .cell.good { background:#22b573; border-color:#0f7a4a; }
    #msg { font-size:14px; font-weight:900; min-height:20px; }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>关卡<b id="lv">1</b></span>
      <span>路线<b id="len">4</b>格</span>
      <span>命<b id="lives">♥♥♥</b></span>
      <span>BEST<b id="best">0</b></span>
    </div>
    <div id="grid"></div>
    <div id="msg">点击开始后记住路线</div>
  </div>
  <div id="overlay">
    <h1>🛤️ 记忆路线</h1>
    <p>路线闪过后凭记忆原路走一遍<br/>从起点（亮起的第一个格）出发<br/>每关路线更长，走错扣命</p>
    <button id="ov-btn">开始测试</button>
  </div>
  <script>
    (() => {
      const gridEl = document.getElementById('grid')
      const lvEl = document.getElementById('lv')
      const lenEl = document.getElementById('len')
      const livesEl = document.getElementById('lives')
      const bestEl = document.getElementById('best')
      const msgEl = document.getElementById('msg')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const SIZES = [4, 5, 5, 6]
      let size, path, cur, level, lives, phase, running, over, timers, cellEls
      let best = Number(localStorage.getItem('memorypath-best') || 0)
      bestEl.textContent = best

      function clearTimers() { (timers || []).forEach(clearTimeout); timers = [] }
      const later = (fn, ms) => timers.push(setTimeout(fn, ms))

      function start() {
        level = 1; lives = 3
        running = true; over = false
        livesEl.textContent = '♥♥♥'
        overlay.classList.add('hidden')
        nextRound()
      }

      function end() {
        running = false; over = true
        clearTimers()
        const score = (level - 1) * 100
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('memorypath-best', best) }
        overlay.querySelector('h1').textContent = '🧠 路线忘了'
        overlay.querySelector('p').innerHTML = '通过 <b style="color:#ffd23f">' + (level - 1) + '</b> 关 · 得分 ' + score + ' · 最佳 ' + best
        ovBtn.textContent = '再来一次'
        overlay.classList.remove('hidden')
      }

      function nextRound() {
        size = SIZES[Math.min(SIZES.length - 1, level - 1)]
        const len = 3 + level
        lenEl.textContent = len
        lvEl.textContent = level
        // 随机生成相连路线
        path = []
        const inB = (r, c) => r >= 0 && r < size && c >= 0 && c < size
        let r = (Math.random() * size) | 0, c = (Math.random() * size) | 0
        path.push([r, c])
        let guard = 0
        while (path.length < len && guard < 500) {
          guard++
          const dirs = [[0,1],[1,0],[0,-1],[-1,0]].sort(() => Math.random() - 0.5)
          let moved = false
          for (const [dr, dc] of dirs) {
            const nr = r + dr, nc = c + dc
            if (inB(nr, nc) && !path.some((p) => p[0] === nr && p[1] === nc)) {
              r = nr; c = nc
              path.push([r, c])
              moved = true
              break
            }
          }
          if (!moved) { // 回退
            const last = path.pop()
            r = path[path.length - 1]?.[0] ?? last[0]
            c = path[path.length - 1]?.[1] ?? last[1]
          }
        }
        cur = 0
        phase = 'show'
        msgEl.textContent = '记住这条路线…'
        build()
        // 依次点亮
        path.forEach((p, i) => {
          later(() => {
            cellEls.forEach((el) => el.classList.remove('lit'))
            const el = cellEls[p[0] * size + p[1]]
            el.classList.add('lit')
          }, 500 + i * 550)
        })
        later(() => {
          cellEls.forEach((el) => el.classList.remove('lit'))
          phase = 'pick'
          msgEl.textContent = '从起点开始走一遍'
          markNext()
        }, 500 + path.length * 550 + 200)
      }

      function build() {
        gridEl.style.gridTemplateColumns = 'repeat(' + size + ',1fr)'
        gridEl.style.gridTemplateRows = 'repeat(' + size + ',1fr)'
        gridEl.innerHTML = ''
        cellEls = []
        for (let r = 0; r < size; r++)
          for (let c = 0; c < size; c++) {
            const el = document.createElement('div')
            el.className = 'cell'
            el.onclick = () => pick(r, c)
            gridEl.appendChild(el)
            cellEls.push(el)
          }
      }

      function markNext() {
        cellEls.forEach((el) => el.classList.remove('next'))
        const p = path[cur]
        cellEls[p[0] * size + p[1]].classList.add('next')
      }

      function pick(r, c) {
        if (!running || over || phase !== 'pick') return
        const want = path[cur]
        const el = cellEls[r * size + c]
        if (want[0] === r && want[1] === c) {
          el.classList.add('good')
          cur++
          if (cur === path.length) {
            phase = 'wait'
            msgEl.textContent = '✓ 正确！下一关…'
            later(nextRound, 800)
          } else markNext()
        } else {
          el.classList.add('bad')
          lives--
          livesEl.textContent = '♥'.repeat(Math.max(0, lives)) || '—'
          if (lives <= 0) return end()
          phase = 'wait'
          msgEl.textContent = '✗ 走错了，重看一遍'
          later(() => { nextRound() }, 900)
        }
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return (level - 1) * 100 },
        get over() { return over },
        get started() { return running },
      }

      size = 4; path = []; cur = 0; level = 1; lives = 3
      phase = 'idle'; running = false; over = false; timers = []; cellEls = []
    })()
  </script>
</body>
</html>
