<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>连数字走格</title>
  <style>
    :root { --blue:#2f55e4; --yellow:#ffd23f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body { background:#0f1118; color:#eef1f6; font-family:system-ui,-apple-system,'PingFang SC',sans-serif;
      display:flex; align-items:center; justify-content:center; touch-action:manipulation; overflow:hidden; }
    #wrap { width:min(92vw,440px); position:relative; display:flex; flex-direction:column; gap:10px; align-items:center; }
    #hud { width:100%; display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#8b93a7; }
    #hud b { color:var(--yellow); font-size:16px; margin-left:4px; }
    #grid { width:100%; aspect-ratio:1; display:grid; gap:3px;
      background:#1a1d29; border:3px solid #2a2e3d; border-radius:12px; padding:6px; }
    .cell { display:grid; place-items:center; border-radius:8px; background:#14161f; cursor:pointer;
      font-size:min(5vw,22px); font-weight:900; color:#c9d4f5; user-select:none; transition:background .1s; }
    .cell.next { outline:2px solid var(--yellow); }
    .cell.done { background:#122a1c; color:#22b573; }
    #timer { width:100%; height:10px; background:#14161f; border:2px solid #2a2e3d; border-radius:999px; overflow:hidden; }
    #tfill { height:100%; width:100%; background:var(--yellow); }
    #overlay { position:fixed; inset:0; background:rgba(15,17,24,.9); z-index:5;
      display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #overlay.hidden { display:none; }
    #overlay h1 { font-size:26px; letter-spacing:4px; text-shadow:3px 3px 0 var(--blue); }
    #overlay p { color:#8b93a7; font-size:13px; line-height:1.9; }
    #overlay button { background:var(--blue); color:#fff; font-family:inherit; border:2px solid #fff;
      box-shadow:4px 4px 0 rgba(0,0,0,.6); font-size:16px; font-weight:700; padding:10px 32px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span>关卡<b id="lv">1/3</b></span>
      <span>下一个<b id="next">1</b></span>
      <span>BEST<b id="best">—</b></span>
    </div>
    <div id="grid"></div>
    <div id="timer"><div id="tfill"></div></div>
  </div>
  <div id="overlay">
    <h1>➡️ 连数字走格</h1>
    <p>从 1 开始按顺序点击数字<br/>每次点击必须与上一个相邻<br/>三关数字递增，限时完成</p>
    <button id="ov-btn">开始挑战</button>
  </div>
  <script>
    (() => {
      const boardEl = document.getElementById('grid')
      const nextEl = document.getElementById('next')
      const lvEl = document.getElementById('lv')
      const tfill = document.getElementById('tfill')
      const bestEl = document.getElementById('best')
      const overlay = document.getElementById('overlay')
      const ovBtn = document.getElementById('ov-btn')

      const LEVELS = [
        { n: 5, count: 10, time: 15 },
        { n: 6, count: 14, time: 20 },
        { n: 7, count: 18, time: 25 },
      ]

      let level, size, nums, cur, timeLeft, limit, running, over, timer
      let best = Number(localStorage.getItem('numchain-best') || 0)
      if (best) bestEl.textContent = best

      function load(nv) {
        level = nv
        const L = LEVELS[nv]
        size = L.n
        // 随机放置不重叠的数字
        const spots = []
        for (let r = 0; r < size; r++)
          for (let c = 0; c < size; c++) spots.push([r, c])
        spots.sort(() => Math.random() - 0.5)
        nums = {}
        for (let i = 0; i < L.count; i++) {
          const [r, c] = spots[i]
          nums[r + ',' + c] = i + 1
        }
        cur = 1
        limit = L.time * 1000
        timeLeft = limit
        lvEl.textContent = (nv + 1) + '/3'
        nextEl.textContent = 1
        render()
      }

      function start() {
        running = true; over = false
        overlay.classList.add('hidden')
        load(0)
        clearInterval(timer)
        timer = setInterval(() => {
          if (!running || over) return
          timeLeft -= 100
          tfill.style.width = Math.max(0, timeLeft / limit * 100) + '%'
          if (timeLeft <= 0) end(false)
        }, 100)
      }

      function end(win) {
        running = false; over = true
        clearInterval(timer)
        if (win) {
          const score = Math.max(100, Math.round(limit / 10) * 3)
          if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('numchain-best', best) }
        }
        overlay.querySelector('h1').textContent = win ? '🎉 全部连完' : '⏰ 时间到'
        overlay.querySelector('p').innerHTML = win
          ? '用时越短分越高，再来刷新纪录！'
          : '差一点点，再试一次'
        ovBtn.textContent = '再来一局'
        overlay.classList.remove('hidden')
      }

      function render() {
        boardEl.style.gridTemplateColumns = 'repeat(' + size + ',1fr)'
        boardEl.style.gridTemplateRows = 'repeat(' + size + ',1fr)'
        boardEl.innerHTML = ''
        for (let r = 0; r < size; r++)
          for (let c = 0; c < size; c++) {
            const key = r + ',' + c
            const v = nums[key]
            const el = document.createElement('div')
            el.className = 'cell'
            if (v === undefined) { /* 空格 */ }
            else {
              el.textContent = v
              if (v < cur) el.classList.add('done')
              else if (v === cur) el.classList.add('next')
            }
            el.onclick = () => pick(r, c, v)
            boardEl.appendChild(el)
          }
        nextEl.textContent = cur <= LEVELS[level].count ? cur : '✓'
      }

      function pick(r, c, v) {
        if (!running || over || v === undefined) return
        if (v !== cur) return
        // 相邻校验（cur=1 时不限）
        if (cur > 1) {
          // 找上一个数字的位置
          let pr = -1, pc = -1
          for (const key in nums) {
            if (nums[key] === cur - 1) {
              const [a, b] = key.split(',').map(Number)
              pr = a; pc = b
            }
          }
          if (Math.abs(pr - r) + Math.abs(pc - c) !== 1) return
        }
        cur++
        if (cur > LEVELS[level].count) {
          if (level === LEVELS.length - 1) return end(true)
          msg('✓ 过关！')
          setTimeout(() => { load(level + 1) }, 600)
          return
        }
        render()
      }

      function msg(t) {
        lvEl.textContent = (level + 1) + '/3 · ' + t
        setTimeout(() => { lvEl.textContent = (level + 1) + '/3' }, 600)
      }

      ovBtn.addEventListener('click', start)

      window.__hub = {
        get score() { return Math.max(100, Math.round(limit / 10) * 3) },
        get over() { return over },
        get started() { return running },
      }

      size = 5; nums = {}; cur = 1; timeLeft = 15000; limit = 15000
      level = 0; running = false; over = false
      render()
    })()
  </script>
</body>
</html>
